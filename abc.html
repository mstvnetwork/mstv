<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Video Player Test</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 640px;
            width: 100%;
        }
        /* Style the canvas like a sleek video player */
        #video-canvas {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000000;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .controls {
            margin-top: 15px;
        }
        button {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 5px;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        .status {
            margin-top: 10px;
            font-size: 14px;
            color: #a0aec0;
        }
    </style>
    <!-- Include the JSMpeg library via CDN -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

<div class="container">
    <h2>Canvas Video Stream Test</h2>
    <p>Mobile browsers (like Samsung Internet) cannot hijack this because there is no video tag.</p>
    
    <!-- This is the rendering layer. No HTML5 video element is used. -->
    <canvas id="video-canvas"></canvas>

    <div class="controls">
        <button id="play-btn">Play</button>
        <button id="pause-btn">Pause</button>
    </div>
    
    <div class="status" id="status-text">Status: Initialising...</div>
</div>

<script>
    // 1. Target the canvas element
    const canvas = document.getElementById('video-canvas');
    const statusText = document.getElementById('status-text');

    // 2. Define your third-party external stream link
    // Note: The file MUST be an MPEG-TS format video (.ts).
    // This is a sample public stream used for testing JSMpeg.
    const thirdPartyStreamUrl = 'https://jsmpeg.org';

    try {
        statusText.innerText = 'Status: Fetching stream into memory...';

        // 3. Initialise the JSMpeg player configuration
        const player = new JSMpeg.Player(thirdPartyStreamUrl, {
            canvas: canvas,
            autoplay: false, // Mobile browsers require user interaction for audio
            loop: true,
            preserveDrawingBuffer: true,
            onSourceEstablished: () => {
                statusText.innerText = 'Status: Connected to third-party stream!';
            },
            onPlay: () => {
                statusText.innerText = 'Status: Playing (Canvas active)';
            },
            onPause: () => {
                statusText.innerText = 'Status: Paused';
            }
        });

        // 4. Hook up your custom UI controls to the JSMpeg instance API
        document.getElementById('play-btn').addEventListener('click', () => {
            player.play();
        });

        document.getElementById('pause-btn').addEventListener('click', () => {
            player.pause();
        });

    } catch (error) {
        statusText.innerText = 'Error loading player: ' + error.message;
        console.error(error);
    }
</script>

</body>
</html>
