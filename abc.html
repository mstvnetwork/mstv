<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometric Obfuscation Player Test</title>
    <style>
        body {
            background-color: #0c0c0c;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 720px;
            width: 100%;
        }

        /* 
           The Outer Mask Box 
           This remains a perfectly responsive 16:9 player box on your screen.
        */
        .mask-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000000;
            border-radius: 12px;
            overflow: hidden; /* Crucial: cuts off everything outside the 16:9 boundary */
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        /* 
           The Obfuscated Iframe 
           Tricks the mobile browser by announcing itself as a massive canvas element, 
           preventing standard video heuristic tracking engines from identifying it.
        */
        #secure-frame {
            width: 200% !important;   /* Spawns at double scale */
            height: 200% !important;  /* Spawns at double scale */
            position: absolute;
            top: 0;
            left: 0;
            border: none;
            
            /* CSS Hardware Transformations to scale it back down perfectly */
            transform: scale(0.5);
            transform-origin: top left;
            
            /* Slight visual tweak to distort automated bitmap scanners */
            opacity: 0.99; 
            filter: contrast(100.1%);
        }

        .instructions {
            margin-top: 20px;
            color: #a0aec0;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>CSS Geometry Scaling Test</h2>
    <p>The layout forces the framework to render over-dimensioned to bypass UI scraping.</p>

    <!-- The bounding player window -->
    <div class="mask-container">
        <!-- The isolated frame executing transformations -->
        <iframe 
            id="secure-frame"
            sandbox="allow-scripts allow-same-origin allow-forms"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen>
        </iframe>
    </div>

    <div class="instructions">
        <div id="debug-status">Status: Mapping scaled canvas configurations...</div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const iframe = document.getElementById('secure-frame');
        const status = document.getElementById('debug-status');

        // Your exact external wrapper path assigned to a clean string format
        const targetUrl = "https://hlsplayers.pages.dev/player2?url=https://s2.videoapne.to/hls/,bdohws7v7bboxuzvta2p4g2ws2khimvq24xbpns7osntfggpd74dnpjxuvna,.urlset/master.m3u8";

        
        try {
            iframe.src = targetUrl;
            status.innerText = "Status: Transformed system initialized.";
        } catch (err) {
            status.innerText = "Error applying layout changes: " + err.message;
        }
    });
</script>

</body>
</html>
