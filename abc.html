<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure HLS Player Test</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container { text-align: center; max-width: 640px; width: 100%; }
        video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000000;
            border-radius: 8px;
        }
        .status { margin-top: 10px; font-size: 14px; color: #a0aec0; }
    </style>
    <!-- Include HLSJS Engine which intercepts stream fragments into Blob RAM -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

<div class="container">
    <h2>Secure HLS Client Test</h2>
    <p>Using HLS.js to isolate streams into non-hijackable local Blob URLs.</p>
    
    <!-- Standard video tag, but restricted to prevent native UI takeovers -->
    <video id="video-player" controls controlslist="nodownload noremoteplayback" playsinline></video>
    
    <div class="status" id="status-text">Status: Initialising Engine...</div>
</div>

<script>
    const video = document.getElementById('video-player');
    const statusText = document.getElementById('status-text');

    // EXCLUSIVELY use the direct .m3u8 stream endpoint.
    // Strip the external "hlsplayers.pages.dev" wrapper so the engine gets raw data.
    const thirdPartyStreamUrl = 'https://hlsplayers.pages.dev/player2?url=https://s2.videoapne.to/hls/,bdohws7v7bboxuzvta2p4g2ws2khimvq24xbpns7osntfggpd74dnpjxuvna,.urlset/master.m3u8';


    if (Hls.isSupported()) {
        const hls = new Hls({
            // Force fragments to process exclusively through JS fetch buffers
            maxBufferLength: 10,
            enableWorker: true
        });

        statusText.innerText = 'Status: Loading manifest...';
        hls.loadSource(rawHlsUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            statusText.innerText = 'Status: Stream ready! Playback secured.';
        });

        hls.on(Hls.Events.ERROR, function(event, data) {
            if (data.details === 'manifestLoadOnError') {
                statusText.innerText = 'Status Error: CORS Blocked by provider server.';
            } else {
                statusText.innerText = 'Playback Error: ' + data.details;
            }
        });
    } 
    // Fallback context for native engine architectures (iOS Safari)
    else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = rawHlsUrl;
        statusText.innerText = 'Status: Relying on Native fallback routing.';
    }
</script>

</body>
</html>
