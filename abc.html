<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Wrapper Sandbox Test</title>
    <style>
        body {
            background-color: #0c0c0c;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .player-container {
            position: relative;
            width: 100%;
            max-width: 720px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        /* Style the iframe to fit perfectly inside the container */
        #secure-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Shield overlay: intercepts direct interactions to stop native touch holds */
        .interaction-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px; /* Shields the top zone where title/share menus spawn */
            z-index: 10;
            background: transparent;
        }
        .instructions {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="player-container">
    <!-- Transparent protective barrier -->
    <div class="interaction-shield"></div>

    <!-- 
      The Sandbox Attribute is critical:
      - allow-scripts: Lets the Cloudflare wrapper player load and run its JavaScript
      - allow-same-origin: Allows the embedded video player to fetch its required manifest tokens
      - NO "allow-top-navigation" or popups: Keeps the browser engine locked to your container UI
    -->
    <iframe 
        id="secure-frame"
        sandbox="allow-scripts allow-same-origin allow-forms"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
    </iframe>
</div>

<div class="instructions">
    <p>Testing Sandboxed External Wrapper Stream</p>
    <div id="debug-status">Status: Preparing secure container...</div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const iframe = document.getElementById('secure-frame');
        const status = document.getElementById('debug-status');

        // Construct the full URL precisely without illegal line breaks
        const targetUrl = "https://hlsplayers.pages.dev/player2?url=https://s2.videoapne.to/hls/,bdohws7v7bboxuzvta2p4g2ws2khimvq24xbpns7osntfggpd74dnpjxuvna,.urlset/master.m3u8";
        
        try {
            // Assign target straight to frame window
            iframe.src = targetUrl;
            status.innerText = "Status: Sandboxed environment initialized successfully.";
        } catch (err) {
            status.innerText = "Execution error: " + err.message;
        }
    });
</script>

</body>
</html>
