<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apna TV 24/7 Linear</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

#not-chrome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: radial-gradient(circle at top, #111, #000);
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    padding: 40px 20px;
}

#not-chrome .nc-icon {
    font-size: 72px;
    margin-bottom: 24px;
    filter: grayscale(0.3);
}

#not-chrome h1 {
    font-size: 1.9rem;
    font-weight: 700;
    color: #ff3b3b;
    margin-bottom: 12px;
}

#not-chrome p {
    font-size: 1rem;
    color: #bbb;
    max-width: 480px;
    line-height: 1.65;
    margin-bottom: 10px;
}

#not-chrome .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 28px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 40px;
    padding: 10px 22px;
    font-size: 0.9rem;
    color: #ddd;
}

#not-chrome .badge svg {

    height: 22px;
    flex-shrink: 0;
}

#not-chrome .download-btn {
    margin-top: 22px;
    display: inline-block;
    padding: 12px 30px;
    background: linear-gradient(90deg, #4285f4, #34a853);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    border-radius: 40px;
    text-decoration: none;
    transition: opacity 0.2s;
}

#not-chrome .download-btn:hover { opacity: 0.85; }

#main-content {
    display: none;
    flex-direction: column;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #111, #000);
    color: #fff;
    min-height: 100vh;
}

body { margin: 0; background: #000; }

header {
    text-align: center;
    margin: 24px 10px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
}

header .brand-name {
    font-size: 2.8rem;
    font-weight: 900;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ff2d55, #ff8c00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 18px rgba(255,45,85,0.45));
    line-height: 1.1;
}

header .brand-sub {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    margin-top: 3px;
}

header .brand-divider {
    margin-top: 10px;
    width: 120px;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, #ff2d55, #ff8c00, transparent);
    opacity: 0.75;
}

.player-wrapper {
    width: 100%;
    max-width: 1200px;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(255,0,0,0.25);
    margin: 15px;
    position: relative;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

/* ── Channel Logo Overlay ── */
#channel-logo {
    position: absolute;
    top: 12px;
    right: 14px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    pointer-events: none;
    user-select: none;
}

#channel-logo .logo-name {
    font-family: 'Segoe UI', sans-serif;
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, #ff2d55, #ff8c00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
    line-height: 1.15;
    /* Legible shadow via filter trick */
    filter: drop-shadow(0 1px 4px rgba(0,0,0,0.9));
}

#channel-logo .logo-sub {
    font-family: 'Segoe UI', sans-serif;
    font-size: 0.6rem;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.75);
    margin-top: 1px;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.9));
}

/* thin accent line under subtitle */
#channel-logo::after {
    content: '';
    display: block;
    height: 2px;
    width: 100%;
    margin-top: 4px;
    background: linear-gradient(90deg, transparent, #ff2d55, #ff8c00);
    border-radius: 2px;
    opacity: 0.7;
}
#ticker {
    position: absolute; 
    bottom: 25px; 
    left: 0;
    width: 100%; 
    overflow: hidden; 
    white-space: nowrap;
    z-index: 10000; 
    padding: 1px 0;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

#ticker .ticker-track {
    display: inline-block;
    white-space: nowrap;
    will-change: transform;
    color: #ff3b3b; 
    font-family: sans-serif; 
    font-size: 14px;
}

#ticker .ticker-track span {
    display: inline-block;
    padding-right: 100px;
}

@keyframes infiniteScrollMarquee {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}






.epg-section {
    width: 100%;
    max-width: 1200px;
    padding: 0 15px 10px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
}

.epg-card {
    flex: 1;
    min-width: 240px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: border-color 0.3s;
}

.epg-card.live {
    border-color: #ff2d55;
    box-shadow: 0 0 14px rgba(255,45,85,0.2);
}

.epg-logo {
    width: 54px;
    height: 54px;
    border-radius: 10px;
    object-fit: cover;
    background: #111;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 13px;
    color: #ff2d55;
    letter-spacing: 0.5px;
    overflow: hidden;
}

.epg-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 10px;
}

.epg-info { flex: 1; min-width: 0; }

.epg-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 20px;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.epg-badge.live {
    background: rgba(255,45,85,0.15);
    color: #ff2d55;
    border: 1px solid rgba(255,45,85,0.3);
}

.epg-badge.next {
    background: rgba(255,255,255,0.08);
    color: #aaa;
    border: 1px solid rgba(255,255,255,0.12);
}

.live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ff2d55;
    animation: blink 1.2s ease-in-out infinite;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
}

.epg-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 3px;
}

.epg-time { font-size: 0.8rem; color: #888; }
.epg-time strong { color: #ddd; font-weight: 600; }

.instructions {
    max-width: 900px;
    text-align:center;
    font-size: 0.9rem;
    color:#aaa;
    margin: 6px 15px 20px;
    line-height:1.5;
}
.instructions span { color:#ff3b3b; font-weight:600; }

footer {
    width: 100%;
    padding: 40px 20px;
    background: #0a0a0a; /* Deep dark background */
    border-top: 1px solid #222;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

.footer-container {
    max-width: 1000px;
    margin: 0 auto;
    text-align: center;
}

.disclaimer-box {
    padding: 20px;
    background: rgba(255, 255, 255, 0.03); /* Subtle lift */
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    margin-bottom: 30px;
}

.disclaimer-box p {
    font-size: 0.85rem;
    color: #888; /* Softer white for readability */
    line-height: 1.6;
    margin: 0;
}

.disclaimer-box strong {
    color: #bbb;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-size: 0.75rem;
}

.disclaimer-box span {
    color: #ddd; /* Highlighted text */
}

.footer-divider {
    border: 0;
    border-top: 1px solid #222;
    margin-bottom: 25px;
    width: 50%;
}

.footer-bottom p {
    font-size: 0.8rem;
    color: #555;
    letter-spacing: 0.3px;
}

.footer-bottom span {
    color: #999;
    font-weight: 600;
}
.social-links {
    margin-bottom: 25px;
    display: flex;
    justify-content: center;
    gap: 20px;
}

.social-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 50%;
    color: #888;
    text-decoration: none;
    font-size: 1.2rem;
    transition: all 0.3s ease;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

/* Hover Effect: Glow and Change Color */
.social-icon:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    transform: translateY(-3px);
    box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
}

/* Specific Hover Colors (Optional) */
.social-icon:hover .fa-facebook-f { color: #1877F2; }
.social-icon:hover .fa-instagram { color: #E4405F; }
.social-icon:hover .fa-youtube { color: #FF0000; }
.social-icon:hover .fa-telegram-plane { color: #0088cc; }


@media(max-width:600px){
    header .brand-name { font-size: 2rem; }
    header .brand-sub  { font-size: 0.62rem; letter-spacing: 3px; }
    .epg-section { gap: 10px; }
    .epg-card { min-width: 100%; }
    #channel-logo .logo-name { font-size: 0.95rem; }
    #channel-logo .logo-sub  { font-size: 0.52rem; }
}
</style>
</head>
<body>


<script>
const CHANNEL_EPOCH = new Date("2024-01-01T00:00:00Z").getTime();
const EPG_URL = "epg3.json";
const RESYNC_DRIFT = 3;

const video = document.getElementById("videoPlayer");
let playlist=[];
let totalDur=0;
let currentIndex=-1;
let hls=null;

function computePos(nowMs){
 const elapsed=((nowMs-CHANNEL_EPOCH)/1000%totalDur+totalDur)%totalDur;
 let acc=0;
 for(let i=0;i<playlist.length;i++){
   if(elapsed<acc+playlist[i].duration){
     return {index:i,offset:elapsed-acc};
   }
   acc+=playlist[i].duration;
 }
 return {index:0,offset:0};
}

function loadItem(index,seek){
 const item=playlist[index];
 currentIndex=index;

 if(hls){hls.destroy();hls=null;}

 if(item.url.includes(".m3u8")){
   if(Hls.isSupported()){
      hls=new Hls();
      hls.loadSource(item.url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED,()=>{
         video.currentTime=seek;
         video.play().catch(()=>{});
      });
   }
 }else{
   video.src=item.url;
   video.onloadedmetadata=()=>{
      video.currentTime=seek;
      video.play().catch(()=>{});
   };
 }

 document.getElementById("titleNow").textContent=item.title;
 document.getElementById("titleNext").textContent=playlist[(index+1)%playlist.length].title;
}

async function init(){
 const data=await fetch(EPG_URL+"?_="+Date.now()).then(r=>r.json());
 playlist=data.schedule;
 totalDur=playlist.reduce((a,b)=>a+b.duration,0);
 document.getElementById("ticker").textContent=data.tickerMessage||"Apna TV";
 const pos=computePos(Date.now());
 loadItem(pos.index,pos.offset);
}

video.addEventListener("seeking",()=>{
 const pos=computePos(Date.now());
 if(Math.abs(video.currentTime-pos.offset)>1){
   video.currentTime=pos.offset;
 }
});

video.addEventListener("contextmenu",e=>e.preventDefault());

setInterval(()=>{
 if(!playlist.length)return;
 const pos=computePos(Date.now());

 if(pos.index!==currentIndex){
   loadItem(pos.index,pos.offset);
   return;
 }

 if(!video.paused){
   const drift=Math.abs(video.currentTime-pos.offset);
   if(drift>RESYNC_DRIFT){
      video.currentTime=pos.offset;
   }
 }
},1000);

init();
</script>
</body>
</html>
