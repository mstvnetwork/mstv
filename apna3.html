<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stream | Premium</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        /* Ambient Background */
        body {
            background: radial-gradient(circle at 15% 50%, rgba(13, 110, 253, 0.15), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(111, 66, 193, 0.15), transparent 25%);
            background-color: #0b0f19;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }
        
        /* Glassmorphism Cards */
        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
        }

        .movie-card {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .movie-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border-color: rgba(13, 110, 253, 0.5);
            background: rgba(30, 41, 59, 0.9);
        }

        .movie-poster-container { position: relative; }
        
        .bookmark-btn {
            position: absolute;
            top: 10px; right: 10px; z-index: 10;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; opacity: 0;
        }

        .movie-card:hover .bookmark-btn { opacity: 1; }
        .bookmark-btn:hover { background: #0d6efd; transform: scale(1.1); }

        .trailer-btn {
            transition: all 0.2s;
            border-color: rgba(255,255,255,0.1);
        }
        .trailer-btn:hover {
            background: rgba(255, 0, 0, 0.8);
            border-color: rgba(255, 0, 0, 0.8);
            color: white !important;
        }

        /* Episode Button Styles */
        .ep-btn {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s ease;
            text-align: left;
        }
        .ep-btn:hover {
            background: rgba(13, 110, 253, 0.15);
            border-color: #0d6efd;
        }
        
        /* High Contrast Fix for Selected Episode Card */
        .ep-btn.active {
            background: #0d6efd !important;
            border-color: #0d6efd !important;
            color: #ffffff !important;
            box-shadow: 0 4px 15px rgba(13, 110, 253, 0.3);
        }
        .ep-btn.active span.text-primary {
            color: #ffffff !important;
            background: rgba(255, 255, 255, 0.2);
            padding: 1px 6px;
            border-radius: 4px;
        }
        .ep-btn.active .text-white {
            color: #ffffff !important;
        }
        .ep-btn.active .text-secondary {
            color: rgba(255, 255, 255, 0.7) !important;
        }

        /* Theater Mode */
        .iframe-wrapper {
            border-radius: 12px; overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid #334155; background: #000;
            width: 100%; max-width: 1200px; margin: 0 auto;
            display: none; position: relative; z-index: 1050;
            transition: all 0.5s ease;
        }

        /* Anti-Popup Engagement Shield Overlay */
        .player-shield {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1055;
            background: transparent;
            cursor: pointer;
            display: none;
        }

        .theater-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.95); z-index: 1040;
            display: none; opacity: 0; transition: opacity 0.5s ease;
        }

        .theater-active .theater-overlay { display: block; opacity: 1; }
        .theater-active .iframe-wrapper { transform: scale(1.05); box-shadow: 0 0 100px rgba(13, 110, 253, 0.2); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #0d6efd; }
        
        .plot-summary {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div class="theater-overlay" id="theater-bg"></div>

    <div class="pt-5 pb-4 px-3 text-center mb-4">
        <h1 class="display-4 fw-bold text-white mb-2" style="letter-spacing: -1px;">
            <i class="bi bi-play-circle-fill text-primary me-2"></i>Stream<span class="text-primary">.</span>
        </h1>
    </div>

    <div class="container mb-4">
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card glass-card h-100 shadow-lg">
                    <div class="card-body p-4">
                        <h4 class="card-title mb-4 fw-light"><i class="bi bi-search me-2 text-primary"></i>What are we watching?</h4>
                        <form method="get" onsubmit="event.preventDefault(); search(); return false;" class="d-flex gap-2">
                            <input type="text" id="q_field" class="form-control form-control-lg bg-dark text-white border-secondary" placeholder="Movies, TV shows, anime...">
                            <button type="submit" class="btn btn-primary btn-lg px-4 shadow"><i class="bi bi-arrow-right"></i></button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card glass-card h-100 shadow-lg">
                    <div class="card-body p-4">
                        <h6 class="card-title mb-3 text-secondary text-uppercase tracking-wide"><i class="bi bi-hash me-1"></i>Direct Link</h6>
                        <form method="get" onsubmit="event.preventDefault(); handleDirectLinkSubmit(); return false;">
                            <input type="text" id="id" class="form-control bg-dark text-white border-secondary mb-2" placeholder="IMDb ID (tt1553656)" required>
                            <div class="input-group mb-3 gap-2">
                                <input type="number" id="season" class="form-control bg-dark text-white border-secondary rounded" placeholder="Season">
                                <input type="number" id="episode" class="form-control bg-dark text-white border-secondary rounded" placeholder="Episode">
                            </div>
                            <button type="submit" class="btn btn-outline-light w-100">Play Media</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container mb-2" id="search-results-header" style="display: none;">
        <div class="d-flex justify-content-between align-items-center border-bottom border-secondary border-opacity-25 pb-2">
            <h5 class="text-secondary mb-0 fw-light"><i class="bi bi-grid-3x3-gap me-2"></i>Search Results</h5>
            <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="collapseSearchResults()">
                <i class="bi bi-eye-slash me-1"></i> Hide Results
            </button>
        </div>
    </div>

    <div class="container mb-4">
        <div id="search-results" class="row row-cols-1 row-cols-sm-2 row-cols-md-4 row-cols-lg-5 g-4" style="display: none;">
            </div>
    </div>

    <div class="container mb-4 shadow-lg" id="tv-guide-wrapper" style="display: none;">
        <div class="card glass-card p-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-3">
                <div>
                    <h4 class="mb-1 text-white fw-bold" id="tv-guide-title">Series Name</h4>
                    <p class="text-secondary small mb-0"><i class="bi bi-collection-play me-1"></i> Select a season and episode to play instantly.</p>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="text-secondary small text-nowrap">Season:</span>
                    <select class="form-select bg-dark text-white border-secondary" id="season-dropdown" style="min-width: 120px;" onchange="handleSeasonChange(this.value)">
                        </select>
                </div>
            </div>
            <hr class="border-secondary opacity-25 mt-0 mb-4">
            <div class="row g-3 row-cols-1 row-cols-md-2 row-cols-lg-3" id="episode-grid">
                </div>
        </div>
    </div>

    <div class="container mb-5 position-relative">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-2 gap-2" id="player-controls" style="display: none !important; max-width: 1200px; margin: 0 auto;">
            <div class="d-flex align-items-center gap-3 flex-wrap">
                <button class="btn btn-sm btn-primary rounded-pill px-3 shadow shadow-primary" id="next-episode-btn" onclick="playNextEpisode()" style="display: none;">
                    Next Episode <i class="bi bi-skip-forward-fill ms-1" style="font-size:0.75rem;"></i>
                </button>
                
                <div class="input-group input-group-sm" style="max-width: 220px;">
                    <label class="input-group-text bg-dark border-secondary text-secondary small" for="server-select"><i class="bi bi-server me-1"></i> Source</label>
                    <select class="form-select bg-dark text-white border-secondary small" id="server-select" onchange="changeServer(this.value)">
                        <option value="multiembed">MultiEmbed (Primary)</option>
                        <option value="vsembed">VSEmbed (Backup)</option>
                    </select>
                </div>
            </div>
            <button class="btn btn-sm btn-outline-light rounded-pill px-3 shadow-sm" onclick="toggleTheaterMode()" style="z-index: 1060; position: relative;">
                <i class="bi bi-lightbulb-fill me-1"></i> Theater Mode
            </button>
        </div>
        <div class="iframe-wrapper position-relative" id="player-container">
            <div class="player-shield" id="player-shield" onclick="neutralizeShield(this)"></div>
            <iframe src="" width="100%" height="650px" style="border:none;" allowfullscreen></iframe>
        </div>
    </div>

    <div class="container mb-5">
        <div class="card glass-card shadow-lg p-2">
            <ul class="nav nav-pills mb-3 p-3 pb-0" id="pills-tab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active rounded-pill px-4" id="history-tab" data-bs-toggle="pill" data-bs-target="#history" type="button"><i class="bi bi-clock-history me-2"></i>History</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link rounded-pill px-4" id="watchlist-tab" data-bs-toggle="pill" data-bs-target="#watchlist" type="button"><i class="bi bi-bookmark-heart me-2"></i>Watchlist</button>
                </li>
            </ul>
            
            <div class="tab-content p-3 pt-0" id="pills-tabContent">
                <div class="tab-pane fade show active" id="history" role="tabpanel">
                    <div class="d-flex justify-content-end mb-2">
                        <button type="button" class="btn btn-sm text-danger border-0" onclick="clear_data('watched');"><i class="bi bi-trash3"></i> Clear History</button>
                    </div>
                    <div class="table-responsive rounded border border-secondary border-opacity-25">
                        <table id="watched-table" class="table table-dark table-hover mb-0 align-middle table-borderless">
                            <thead class="table-active border-bottom border-secondary border-opacity-25">
                                <tr>
                                    <th scope="col" class="py-3 px-4">Title</th>
                                    <th scope="col" class="py-3 text-secondary">IMDb ID</th>
                                    <th scope="col" class="py-3 text-secondary">S / E</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
                
                <div class="tab-pane fade" id="watchlist" role="tabpanel">
                    <div class="d-flex justify-content-end mb-2">
                        <button type="button" class="btn btn-sm text-danger border-0" onclick="clear_data('watchlist');"><i class="bi bi-trash3"></i> Clear Watchlist</button>
                    </div>
                    <div class="table-responsive rounded border border-secondary border-opacity-25">
                        <table id="watchlist-table" class="table table-dark table-hover mb-0 align-middle table-borderless">
                            <thead class="table-active border-bottom border-secondary border-opacity-25">
                                <tr>
                                    <th scope="col" class="py-3 px-4">Title</th>
                                    <th scope="col" class="py-3 text-secondary">Type</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="trailerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content bg-dark border-secondary shadow-lg glass-card">
                <div class="modal-header border-bottom-0 pb-0 d-flex justify-content-between align-items-center">
                    <h5 class="modal-title text-white text-truncate me-3" id="trailerModalLabel">Trailer</h5>
                    <div class="d-flex gap-2 align-items-center">
                        <a id="trailer-fallback-btn" href="#" target="_blank" class="btn btn-sm btn-danger rounded-pill px-3">
                            <i class="bi bi-box-arrow-up-right me-1"></i> Watch on YouTube
                        </a>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                </div>
                <div class="modal-body pt-2 pb-4 px-4">
                    <div class="ratio ratio-16x9 rounded overflow-hidden shadow">
                        <iframe id="trailer-iframe" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 2000">
        <div id="liveToast" class="toast glass-card text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header bg-transparent border-bottom border-secondary text-white">
                <i class="bi bi-info-circle-fill text-primary me-2"></i>
                <strong class="me-auto" id="toast-title">Notification</strong>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toast-message">Message goes here.</div>
        </div>
    </div>

    <script type="text/javascript">
        // ==========================================
        // 🔒 SECURE API KEY STORAGE FOR GITHUB PAGES
        // ==========================================
        let TMDB_API_KEY = localStorage.getItem('user_tmdb_key');
        if (!TMDB_API_KEY) {
            TMDB_API_KEY = prompt("Please enter your TMDB API Key to unlock trailers and metadata:");
            if (TMDB_API_KEY) localStorage.setItem('user_tmdb_key', TMDB_API_KEY);
        }

        // --- GLOBAL RUNTIME STATE CONTROL ---
        let currentShowTvId = null; 
        let currentShowImdbId = null;
        let currentShowTitle = "";
        let activeSeasonNum = 1;
        let activeEpisodeNum = 1;
        let totalSeasonsCount = 0;
        let totalEpisodesInActiveSeason = 0;
        
        // Active streaming server choice persistent tracking
        let activeServer = localStorage.getItem('user_active_server') || 'multiembed';
        
        // Security anti-hijack toggle state
        let secureRedirectLock = false;

        // --- UX / UI Operations ---
        function showToast(title, message) {
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-message').innerText = message;
            const toast = new bootstrap.Toast(document.getElementById('liveToast'));
            toast.show();
        }

        function toggleTheaterMode() {
            document.body.classList.toggle('theater-active');
            const btn = document.querySelector('#player-controls button:last-child');
            if (document.body.classList.contains('theater-active')) {
                btn.innerHTML = '<i class="bi bi-lightbulb-off me-1"></i> Lights On';
                btn.classList.replace('btn-outline-light', 'btn-light');
            } else {
                btn.innerHTML = '<i class="bi bi-lightbulb-fill me-1"></i> Theater Mode';
                btn.classList.replace('btn-light', 'btn-outline-light');
            }
        }
        document.getElementById('theater-bg').addEventListener('click', toggleTheaterMode);

        document.getElementById('trailerModal').addEventListener('hidden.bs.modal', function () {
            document.getElementById('trailer-iframe').src = '';
        });

        function clear_data(key) {
            localStorage.removeItem(key);
            update_tables();
            showToast('Cleared', `${key.charAt(0).toUpperCase() + key.slice(1)} has been wiped.`);
        }

        function collapseSearchResults() {
            document.getElementById('search-results').style.display = 'none';
            document.getElementById('search-results-header').style.display = 'none';
            showToast('Results Hidden', 'Search layout collapsed. Search again to restore views.');
        }

        // Hot-swapping sources without losing active state
        function changeServer(serverName) {
            activeServer = serverName;
            localStorage.setItem('user_active_server', serverName);
            
            const id = document.querySelector('#id').value;
            if (id) {
                const contextTitle = document.title.replace("Playing - ", "");
                loadIframeById(contextTitle);
                showToast('Source Updated', `Switched network connection paths to ${serverName === 'vsembed' ? 'VSEmbed' : 'MultiEmbed'}.`);
            }
        }

        // Neutralizes the first click popup trap
        function neutralizeShield(shieldElement) {
            shieldElement.style.display = 'none';
            showToast('Shield Armed', 'Pop-up trap blocked. Click once more to play safely.');
            
            // Re-arm shield overlay 20 seconds later to capture subsequent timeline manipulation traps
            setTimeout(() => {
                if(activeServer === 'vsembed' && document.getElementById('player-container').style.display === 'block') {
                    shieldElement.style.display = 'block';
                }
            }, 20000);
        }

        // Anti-Hijack Tab Security Trigger Block
        window.addEventListener('beforeunload', function (event) {
            if (secureRedirectLock) {
                event.preventDefault();
                event.returnValue = 'Stream app intercepted an unauthorized third-party tab redirection.';
                return event.returnValue;
            }
        });

        // --- Search Engines ---
        async function search(defaultQuery = null) {
            if (!TMDB_API_KEY) return;

            let query = defaultQuery || document.querySelector("#q_field").value;
            if (!query) return;

            const headerContainer = document.getElementById("search-results-header");
            const resultsContainer = document.querySelector("#search-results");
            
            headerContainer.style.display = 'block';
            resultsContainer.style.display = 'flex';
            resultsContainer.innerHTML = '<div class="col-12 text-center text-secondary py-5"><div class="spinner-border text-primary" role="status"></div></div>';

            try {
                const response = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}&include_adult=false`);
                const data = await response.json();
                resultsContainer.innerHTML = ""; 

                if (data.results.length === 0) {
                    resultsContainer.innerHTML = '<div class="col-12 text-center text-secondary py-5">No matching data found.</div>';
                    return;
                }

                data.results.forEach(item => {
                    if (item.media_type === "movie" || item.media_type === "tv") add_result(item);
                });
            } catch (error) {
                resultsContainer.innerHTML = '<div class="col-12 text-center text-danger py-5">Network connection/API key structural failure.</div>';
            }
        }

        function add_result(item) {
            const results = document.querySelector("#search-results");
            const col = document.createElement("div");
            col.classList.add("col");

            const imageUrl = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : 'https://via.placeholder.com/300x450/1e293b/ffffff?text=No+Poster';
            const title = item.title || item.name;
            const releaseDate = item.release_date || item.first_air_date || 'N/A';
            const year = releaseDate !== 'N/A' ? releaseDate.split('-')[0] : 'N/A';
            const itemType = item.media_type === "movie" ? "Movie" : "TV Show";
            
            const safeItemData = encodeURIComponent(JSON.stringify({
                tmdb_id: item.id, title: title, type: itemType, media_type: item.media_type
            }));

            col.innerHTML = `
                <div class="card h-100 glass-card movie-card text-white">
                    <div class="movie-poster-container">
                        <img src="${imageUrl}" class="card-img-top" style="height: 320px; object-fit: cover;" alt="${title}">
                        <button class="bookmark-btn text-white" title="Add to Watchlist" onclick="save_to_watchlist(event, '${safeItemData}')">
                            <i class="bi bi-bookmark-plus"></i>
                        </button>
                    </div>
                    <div class="card-body d-flex flex-column p-3">
                        <h6 class="card-title fw-bold text-truncate mb-1" title="${title}">${title}</h6>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge ${itemType === 'Movie' ? 'bg-primary' : 'bg-success'} bg-opacity-75">${itemType}</span>
                            <small class="text-secondary fw-bold">${year}</small>
                        </div>
                        <p class="card-text small text-secondary plot-summary mb-3" style="font-size: 0.8rem; flex-grow: 1;">${item.overview || 'No description available.'}</p>
                        <button class="btn btn-sm btn-outline-secondary w-100 mt-auto trailer-btn text-white" onclick="playTrailer(event, ${item.id}, '${item.media_type}', '${title.replace(/'/g, "\\'")}')">
                            <i class="bi bi-play-btn me-1"></i> Watch Trailer
                        </button>
                    </div>
                </div>
            `;

            col.addEventListener("click", async function () {
                if (item.media_type === "movie") {
                    document.getElementById('tv-guide-wrapper').style.display = 'none';
                    document.getElementById('next-episode-btn').style.display = 'none';
                    
                    try {
                        const res = await fetch(`https://api.themoviedb.org/3/movie/${item.id}/external_ids?api_key=${TMDB_API_KEY}`);
                        const ids = await res.json();
                        if(ids.imdb_id) {
                            document.querySelector("#id").value = ids.imdb_id;
                            document.querySelector("#season").value = '';
                            document.querySelector("#episode").value = '';
                            loadIframeById(title);
                        }
                    } catch(e) { showToast('Error', 'Unable to resolve external records.'); }
                } 
                else if (item.media_type === "tv") {
                    setupTvShowDashboard(item.id, title);
                }
            });

            results.appendChild(col);
        }

        // --- Core TV Show Dashboard Engine ---
        async function setupTvShowDashboard(tvId, showName, initialSeason = 1, initialEpisode = null) {
            currentShowTvId = tvId;
            currentShowTitle = showName;
            
            try {
                const [showRes, idRes] = await Promise.all([
                    fetch(`https://api.themoviedb.org/3/tv/${tvId}?api_key=${TMDB_API_KEY}`),
                    fetch(`https://api.themoviedb.org/3/tv/${tvId}/external_ids?api_key=${TMDB_API_KEY}`)
                ]);
                
                const showData = await showRes.json();
                const idData = await idRes.json();
                
                currentShowImdbId = idData.imdb_id;
                document.querySelector("#id").value = idData.imdb_id || '';
                
                if(!currentShowImdbId) {
                    showToast('Data Error', 'This TV Show lacks an attached IMDb metadata handle.');
                    return;
                }

                totalSeasonsCount = showData.number_of_seasons;
                
                const dropdown = document.getElementById('season-dropdown');
                dropdown.innerHTML = "";
                
                showData.seasons.forEach(s => {
                    if(s.season_number > 0) {
                        const opt = document.createElement('option');
                        opt.value = s.season_number;
                        opt.innerText = `Season ${s.season_number} (${s.episode_count} Ep)`;
                        dropdown.appendChild(opt);
                    }
                });

                dropdown.value = initialSeason;
                document.getElementById('tv-guide-title').innerText = showName;
                document.getElementById('tv-guide-wrapper').style.display = 'block';
                
                await handleSeasonChange(initialSeason, initialEpisode);
                
                if (initialEpisode === null) {
                    // Normal behavior: auto-play first episode index on selection
                    const firstEpBtn = document.querySelector('#episode-grid .ep-btn');
                    if(firstEpBtn) firstEpBtn.click();
                } else {
                    // Deep-linked routing: UI highlights without overwriting current iframe thread initialization
                    document.getElementById('player-controls').setAttribute('style', 'display: flex !important; max-width: 1200px; margin: 0 auto;');
                    document.getElementById('next-episode-btn').style.display = 'inline-block';
                    loadIframeById(`${showName} - S${initialSeason}E${initialEpisode}`);
                }
                
                window.scrollTo({ top: document.getElementById('tv-guide-wrapper').offsetTop - 20, behavior: 'smooth' });
            } catch(e) { showToast('Error', 'Failed to retrieve show breakdown metrics.'); }
        }

        async function handleSeasonChange(seasonNum, initialEpisode = null) {
            activeSeasonNum = parseInt(seasonNum);
            const grid = document.getElementById('episode-grid');
            grid.innerHTML = '<div class="col-12 text-center py-4"><div class="spinner-border text-success" role="status"></div></div>';
            
            try {
                const res = await fetch(`https://api.themoviedb.org/3/tv/${currentShowTvId}/season/${seasonNum}?api_key=${TMDB_API_KEY}`);
                const data = await res.json();
                
                grid.innerHTML = "";
                totalEpisodesInActiveSeason = data.episodes.length;

                data.episodes.forEach(ep => {
                    const btn = document.createElement('div');
                    btn.classList.add('col');
                    btn.innerHTML = `
                        <button class="btn ep-btn w-100 h-100 p-3 d-flex flex-column rounded-3 text-white" id="ep-card-${seasonNum}-${ep.episode_number}" onclick="playSpecificEpisode(${ep.episode_number}, '${ep.name.replace(/'/g, "\\'")}')">
                            <div class="d-flex justify-content-between align-items-center w-100 mb-1">
                                <span class="fw-bold text-primary small">Episode ${ep.episode_number}</span>
                                <small class="text-secondary font-monospace" style="font-size:0.7rem;">${ep.air_date || 'N/A'}</small>
                            </div>
                            <span class="text-white fw-semibold text-truncate mb-1 w-100" style="font-size:0.85rem;">${ep.name}</span>
                            <p class="text-secondary small mb-0 text-truncate w-100" style="font-size:0.75rem;">${ep.overview || 'No structural overview.'}</p>
                        </button>
                    `;
                    grid.appendChild(btn);
                });
                
                if (initialEpisode) activeEpisodeNum = parseInt(initialEpisode);
                syncActiveEpisodeHighlight();
            } catch(e) { grid.innerHTML = '<div class="col-12 text-center text-danger py-4">Error loading episode manifests.</div>'; }
        }

        function playSpecificEpisode(epNum, epName) {
            activeEpisodeNum = parseInt(epNum);
            
            document.querySelector("#season").value = activeSeasonNum;
            document.querySelector("#episode").value = activeEpisodeNum;
            
            syncActiveEpisodeHighlight();
            
            const detailedTrackName = `${currentShowTitle} - S${activeSeasonNum}E${activeEpisodeNum}: ${epName}`;
            loadIframeById(detailedTrackName);
            
            document.getElementById('player-controls').setAttribute('style', 'display: flex !important; max-width: 1200px; margin: 0 auto;');
            document.getElementById('next-episode-btn').style.display = 'inline-block';
        }

        function syncActiveEpisodeHighlight() {
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
            const activeCard = document.getElementById(`ep-card-${activeSeasonNum}-${activeEpisodeNum}`);
            if(activeCard) activeCard.classList.add('active');
        }

        // --- Netflix-Style Auto Advance Sequencer ---
        async function playNextEpisode() {
            if(!currentShowTvId) return;

            let targetEpisode = activeEpisodeNum + 1;
            let targetSeason = activeSeasonNum;

            if(targetEpisode > totalEpisodesInActiveSeason) {
                if(targetSeason < totalSeasonsCount) {
                    targetSeason++;
                    targetEpisode = 1;
                    showToast('Advancing Season', `Preparing Season ${targetSeason} pipelines...`);
                    
                    document.getElementById('season-dropdown').value = targetSeason;
                    await handleSeasonChange(targetSeason);
                } else {
                    showToast('Series Finale', 'You have exhausted all indexed runtime parameters for this show.');
                    return;
                }
            }

            activeEpisodeNum = targetEpisode;
            activeSeasonNum = targetSeason;
            
            const epCard = document.getElementById(`ep-card-${activeSeasonNum}-${activeEpisodeNum}`);
            if(epCard) {
                epCard.click();
            } else {
                document.querySelector("#season").value = activeSeasonNum;
                document.querySelector("#episode").value = activeEpisodeNum;
                loadIframeById(`${currentShowTitle} - S${activeSeasonNum}E${activeEpisodeNum}`);
            }
        }

        // --- URL Param / Manual Direct Input Routing Middleware ---
        function handleDirectLinkSubmit() {
            const id = document.querySelector('#id').value;
            const season = document.querySelector('#season').value;
            const episode = document.querySelector('#episode').value;
            
            if (id && season && episode) {
                hydrateTvDashboardFromImdb(id, parseInt(season), parseInt(episode));
            } else {
                document.getElementById('tv-guide-wrapper').style.display = 'none';
                document.getElementById('next-episode-btn').style.display = 'none';
                loadIframeById();
            }
        }

        async function hydrateTvDashboardFromImdb(imdbId, s, e) {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/find/${imdbId}?api_key=${TMDB_API_KEY}&external_source=imdb_id`);
                const data = await res.json();
                if (data.tv_results && data.tv_results.length > 0) {
                    setupTvShowDashboard(data.tv_results[0].id, data.tv_results[0].name, s, e);
                } else {
                    loadIframeById();
                }
            } catch(err) { loadIframeById(); }
        }

        // --- Core Player Deployment Execution Vectors ---
        async function loadIframeById(knownTitle = null) {
            const iframe = document.querySelector('iframe');
            const playerContainer = document.querySelector('#player-container');
            const playerControls = document.querySelector('#player-controls');
            const shield = document.getElementById('player-shield');
            const id = document.querySelector('#id').value;
            const season = document.querySelector('#season').value;
            const episode = document.querySelector('#episode').value;
            
            if(!id) return;

            playerContainer.style.display = 'block';
            playerControls.setAttribute('style', 'display: flex !important; max-width: 1200px; margin: 0 auto;');

            // --- Multi-Server URL Generator Engine with Security Configurations ---
            let src = "";
            if (activeServer === 'vsembed') {
                secureRedirectLock = true; 
                shield.style.display = 'block'; 
                
                if (season && episode) {
                    src = `https://vsembed.ru/embed/tv?imdb=${id}&season=${season}&episode=${episode}`;
                } else {
                    src = `https://vsembed.ru/embed/movie?imdb=${id}`;
                }
            } else {
                secureRedirectLock = false; 
                shield.style.display = 'none';
                
                src = `https://multiembed.mov/?video_id=${id}`;
                if (season && episode) src += `&s=${season}&e=${episode}`;
            }
            
            iframe.src = src;

            let finalTitle = knownTitle;

            if (!finalTitle || finalTitle === "Unknown Title") {
                try {
                    const res = await fetch(`https://api.themoviedb.org/3/find/${id}?api_key=${TMDB_API_KEY}&external_source=imdb_id`);
                    const data = await res.json();
                    
                    if (data.movie_results && data.movie_results.length > 0) {
                        finalTitle = data.movie_results[0].title;
                    } else if (data.tv_results && data.tv_results.length > 0) {
                        finalTitle = data.tv_results[0].name;
                        if(season && episode) finalTitle += ` (S${season}E${episode})`;
                    } else {
                        finalTitle = `ID: ${id}`; 
                    }
                } catch (e) { finalTitle = `ID: ${id}`; }
            }

            var watched = JSON.parse(localStorage.getItem('watched') || '[]');
            var current = { id: id, title: finalTitle, season: season || '-', episode: episode || '-' };

            if(watched.length === 0 || watched[watched.length - 1].id !== id || watched[watched.length - 1].episode !== episode) {
                watched.push(current);
                localStorage.setItem('watched', JSON.stringify(watched));
            }

            update_tables();
            document.querySelector('title').innerHTML = `Playing - ${finalTitle}`;
            
            history.pushState({}, null, `?id=${id}&s=${season}&e=${episode}`);
            playerContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        async function playTrailer(event, tmdbId, mediaType, title) {
            event.stopPropagation(); 
            try {
                const res = await fetch(`https://api.themoviedb.org/3/${mediaType}/${tmdbId}/videos?api_key=${TMDB_API_KEY}`);
                const data = await res.json();
                const trailer = data.results.find(v => v.site === "YouTube" && v.type === "Trailer");
                
                if (trailer) {
                    document.getElementById('trailerModalLabel').innerText = `${title} - Trailer`;
                    document.getElementById('trailer-iframe').src = `https://www.youtube.com/embed/${trailer.key}?autoplay=1&modestbranding=1&rel=0`;
                    document.getElementById('trailer-fallback-btn').href = `https://www.youtube.com/watch?v=${trailer.key}`;
                    const modal = new bootstrap.Modal(document.getElementById('trailerModal'));
                    modal.show();
                } else {
                    showToast('No Trailer', `No YouTube trailer attachments indexed for ${title}.`);
                }
            } catch (e) { showToast('Error', 'Failed to retrieve source video records.'); }
        }

        function save_to_watchlist(event, safeData) {
            event.stopPropagation(); 
            const itemData = JSON.parse(decodeURIComponent(safeData));
            let watchlist = JSON.parse(localStorage.getItem('watchlist') || '[]');
            
            if (!watchlist.find(i => i.tmdb_id === itemData.tmdb_id)) {
                watchlist.push(itemData);
                localStorage.setItem('watchlist', JSON.stringify(watchlist));
                update_tables();
                showToast('Added to Watchlist', `${itemData.title} saved for later!`);
            } else {
                showToast('Already Saved', `${itemData.title} is already in your watchlist.`);
            }
        }

        function update_tables() {
            const watched = JSON.parse(localStorage.getItem('watched') || '[]');
            const historyBody = document.querySelector('#watched-table tbody');
            historyBody.innerHTML = '';

            [...watched].reverse().forEach(item => {
                var row = document.createElement('tr');
                row.style.cursor = 'pointer';
                row.innerHTML = `
                    <td class="fw-bold px-4 text-light"><i class="bi bi-play-fill text-primary me-2"></i>${item.title}</td>
                    <td class="text-secondary small font-monospace">${item.id}</td>
                    <td class="text-secondary"><span class="badge bg-dark border border-secondary">${item.season === '-' ? 'Movie' : `S${item.season} E${item.episode}`}</span></td>
                `;
                row.addEventListener('click', () => {
                    document.querySelector("#id").value = item.id;
                    document.querySelector("#season").value = item.season === '-' ? '' : item.season;
                    document.querySelector("#episode").value = item.episode === '-' ? '' : item.episode;
                    
                    if (item.season !== '-') {
                        hydrateTvDashboardFromImdb(item.id, parseInt(item.season), parseInt(item.episode));
                    } else {
                        document.getElementById('tv-guide-wrapper').style.display = 'none';
                        document.getElementById('next-episode-btn').style.display = 'none';
                        loadIframeById(item.title);
                    }
                });
                historyBody.appendChild(row);
            });

            if(watched.length === 0) historyBody.innerHTML = '<tr><td colspan="3" class="text-center text-secondary py-4">No watch history yet.</td></tr>';

            const watchlist = JSON.parse(localStorage.getItem('watchlist') || '[]');
            const watchlistBody = document.querySelector('#watchlist-table tbody');
            watchlistBody.innerHTML = '';

            [...watchlist].reverse().forEach(item => {
                var row = document.createElement('tr');
                row.style.cursor = 'pointer';
                row.innerHTML = `
                    <td class="fw-bold px-4 text-light"><i class="bi bi-bookmark-fill text-primary me-2"></i>${item.title}</td>
                    <td class="text-secondary"><span class="badge ${item.media_type === 'movie' || item.type === 'Movie' ? 'bg-primary' : 'bg-success'} bg-opacity-75 border border-secondary">${item.type}</span></td>
                `;
                row.addEventListener('click', async () => {
                    if (item.media_type === "movie" || item.type === "Movie") {
                        document.getElementById('tv-guide-wrapper').style.display = 'none';
                        document.getElementById('next-episode-btn').style.display = 'none';
                        try {
                            const res = await fetch(`https://api.themoviedb.org/3/movie/${item.tmdb_id}/external_ids?api_key=${TMDB_API_KEY}`);
                            const ids = await res.json();
                            if(ids.imdb_id) {
                                document.querySelector("#id").value = ids.imdb_id;
                                document.querySelector("#season").value = '';
                                document.querySelector("#episode").value = '';
                                loadIframeById(item.title);
                            }
                        } catch(e) { showToast('Error', 'Unable to resolve external records.'); }
                    } else {
                        setupTvShowDashboard(item.tmdb_id, item.title);
                    }
                });
                watchlistBody.appendChild(row);
            });

            if(watchlist.length === 0) watchlistBody.innerHTML = '<tr><td colspan="2" class="text-center text-secondary py-4">Your watchlist is empty.</td></tr>';
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('server-select').value = activeServer;

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('id')) {
                const imdbId = urlParams.get('id');
                const s = urlParams.get('s');
                const e = urlParams.get('e');
                
                document.querySelector('#id').value = imdbId;
                document.querySelector('#season').value = s || '';
                document.querySelector('#episode').value = e || '';

                if (s && e) {
                    hydrateTvDashboardFromImdb(imdbId, parseInt(s), parseInt(e));
                } else {
                    document.getElementById('tv-guide-wrapper').style.display = 'none';
                    document.getElementById('next-episode-btn').style.display = 'none';
                    loadIframeById();
                }
            } else {
                search('Oppenheimer');
            }
            update_tables();
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
