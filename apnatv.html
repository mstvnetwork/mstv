<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Sync Broadcast Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Media Player Outer Container */
    #player-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Media Layers */
    .media-element {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      object-fit: contain;
      pointer-events: none; /* Disables native interaction, click-through to container */
    }

    iframe.media-element {
      pointer-events: auto; /* Required for interactive embeds, masked by control overlay */
    }

    /* Custom Controls Overlay */
    #controls-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ff3b30;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #ff3b30;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff3b30;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .controls-left, .controls-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
  </style>
  <!-- HLS.js Library for cross-browser HLS support -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <div id="player-container">
    <!-- Active media element dynamically rendered here -->
    <video id="native-player" class="media-element" playsinline webkit-playsinline></video>
    <iframe id="iframe-player" class="media-element" style="display: none;"></iframe>

    <!-- Strictly 3-button bottom controls overlay -->
    <div id="controls-overlay">
      <div class="controls-left">
        <button id="btn-play" class="control-btn">Play</button>
        <button id="btn-mute" class="control-btn">Unmute</button>
        <div class="live-badge">
          <span class="live-dot"></span> LIVE
        </div>
      </div>
      <div class="controls-right">
        <button id="btn-fullscreen" class="control-btn">Fullscreen</button>
      </div>
    </div>
  </div>

  <script>
    // Configuration Settings
    const PLAYLIST_URL = './playlist.json'; 
    const FETCH_INTERVAL_MS = 2000;         // Poll JSON every 2s for instant updates
    const SYNC_CHECK_INTERVAL_MS = 500;     // Force live position lock twice every second
    const MAX_ALLOWED_DRIFT_SEC = 0.5;      // Tight aggressive drift tolerance threshold

    // DOM Elements
    const container = document.getElementById('player-container');
    const videoElem = document.getElementById('native-player');
    const iframeElem = document.getElementById('iframe-player');
    const btnPlay = document.getElementById('btn-play');
    const btnMute = document.getElementById('btn-mute');
    const btnFullscreen = document.getElementById('btn-fullscreen');

    // Internal State
    let playlist = [];
    let hlsInstance = null;
    let currentItem = null;
    let totalPlaylistDuration = 0;

    // --- 1. Aggressive Playlist Fetching & Auto Updates ---
    async function fetchPlaylist() {
  try {
    // Append unique timestamp and use cache control headers to force fresh fetch from GitHub Pages CDN
    const response = await fetch(`${PLAYLIST_URL}?cachebuster=${Date.now()}`, {
      cache: 'no-store',
      headers: {
        'Cache-Control': 'no-cache, no-store, must-revalidate',
        'Pragma': 'no-cache'
      }
    });
    if (!response.ok) return;
    const data = await response.json();
    
    if (JSON.stringify(data) !== JSON.stringify(playlist)) {
      playlist = data;
      totalPlaylistDuration = playlist.reduce((acc, item) => acc + item.duration_seconds, 0);
      syncEngine();
    }
  } catch (e) {
    // Retry automatically on next interval cycle
  }
      }

    // --- 2. Deterministic Global Time Synchronization Engine ---
    function getGlobalTimeState() {
      if (!totalPlaylistDuration || totalPlaylistDuration === 0) return null;
      
      const epochSeconds = Date.now() / 1000;
      const currentLoopTime = epochSeconds % totalPlaylistDuration;

      let accumulatedTime = 0;
      for (let i = 0; i < playlist.length; i++) {
        const item = playlist[i];
        if (currentLoopTime >= accumulatedTime && currentLoopTime < accumulatedTime + item.duration_seconds) {
          return {
            itemIndex: i,
            item: item,
            seekPosition: currentLoopTime - accumulatedTime
          };
        }
        accumulatedTime += item.duration_seconds;
      }
      return null;
    }

    function syncEngine() {
      const state = getGlobalTimeState();
      if (!state) return;

      const { item, seekPosition } = state;

      // Swap media engine dynamically if content item changes
      if (!currentItem || currentItem.url !== item.url) {
        currentItem = item;
        loadMediaSource(item, seekPosition);
        return;
      }

      // Enforce zero-drift sync on HTML5 Video / HLS
      if (item.type === 'mp4' || item.type === 'm3u8') {
        const drift = Math.abs(videoElem.currentTime - seekPosition);
        if (drift > MAX_ALLOWED_DRIFT_SEC) {
          videoElem.currentTime = seekPosition;
        }

        // Prevent browser/user pauses, aggressively enforcing live state
        if (videoElem.paused) {
          videoElem.play().catch(() => {});
        }
      }
    }

    // Tight 500ms continuous lock loop to prevent Safari/Samsung timeline manipulation
    setInterval(syncEngine, SYNC_CHECK_INTERVAL_MS);

    // --- 3. Dynamic Engine Switcher (MP4, HLS, iFrame) ---
    function loadMediaSource(item, initialSeek) {
      // Clear legacy HLS instance
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      if (item.type === 'iframe') {
        // Switch to iFrame view
        videoElem.style.display = 'none';
        videoElem.pause();
        iframeElem.style.display = 'block';
        iframeElem.src = item.url;
      } else {
        // Switch to Native Video Element view
        iframeElem.style.display = 'none';
        iframeElem.src = '';
        videoElem.style.display = 'block';
        videoElem.removeAttribute('controls'); // Ensure standard UI controls remain stripped

        if (item.type === 'm3u8') {
          if (Hls.isSupported()) {
            hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
            hlsInstance.loadSource(item.url);
            hlsInstance.attachMedia(videoElem);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
              videoElem.currentTime = initialSeek;
              videoElem.play().catch(() => {});
            });
          } else if (videoElem.canPlayType('application/vnd.apple.mpegurl')) {
            // Native HLS for iOS Safari
            videoElem.src = item.url;
            videoElem.currentTime = initialSeek;
            videoElem.play().catch(() => {});
          }
        } else if (item.type === 'mp4') {
          videoElem.src = item.url;
          videoElem.currentTime = initialSeek;
          videoElem.play().catch(() => {});
        }
      }
    }

    // --- 4. Custom Controls Interface Implementation ---
    btnPlay.addEventListener('click', () => {
      if (currentItem && (currentItem.type === 'mp4' || currentItem.type === 'm3u8')) {
        if (videoElem.paused) {
          videoElem.play();
          btnPlay.textContent = 'Pause';
        } else {
          videoElem.pause();
          btnPlay.textContent = 'Play';
        }
      }
    });

    btnMute.addEventListener('click', () => {
      videoElem.muted = !videoElem.muted;
      btnMute.textContent = videoElem.muted ? 'Unmute' : 'Mute';
    });

    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(err => {
          alert(`Fullscreen error: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    });

    // --- 5. Anti-Bypass Guarding & Event Hardening ---
    // Prevent iOS Safari and Samsung Internet native full-screen override controls from seeking
    videoElem.addEventListener('seeking', () => {
      const state = getGlobalTimeState();
      if (state) {
        const drift = Math.abs(videoElem.currentTime - state.seekPosition);
        if (drift > MAX_ALLOWED_DRIFT_SEC) {
          videoElem.currentTime = state.seekPosition; // Immediate revert step
        }
      }
    });

    // Handle initial autostart/autoplay policies smoothly
    window.addEventListener('load', () => {
      videoElem.muted = true; // Auto-mute enables reliable zero-click autoplay globally
      btnMute.textContent = 'Unmute';
    });
  </script>
</body>
  </html>
