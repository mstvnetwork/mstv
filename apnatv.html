<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Sync Broadcast Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #player-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .media-element {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      object-fit: contain;
    }

    #debug-status {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.75);
      color: #00ff66;
      font-family: monospace;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 4px;
      z-index: 10000;
      pointer-events: none;
    }

    #controls-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 9999;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      backdrop-filter: blur(8px);
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ff3b30;
      font-size: 13px;
      font-weight: 700;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #ff3b30;
      border-radius: 50%;
    }

    .controls-left, .controls-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <div id="player-container">
    <div id="debug-status">Initializing Live Engine...</div>
    
    <!-- Video Element explicit inline attributes for aggressive autoplay -->
    <video id="native-player" class="media-element" autoplay muted playsinline webkit-playsinline></video>
    <iframe id="iframe-player" class="media-element" style="display: none;"></iframe>

    <div id="controls-overlay">
      <div class="controls-left">
        <button id="btn-play" class="control-btn">Play</button>
        <button id="btn-mute" class="control-btn">Unmute</button>
        <div class="live-badge"><span class="live-dot"></span> LIVE</div>
      </div>
      <div class="controls-right">
        <button id="btn-fullscreen" class="control-btn">Fullscreen</button>
      </div>
    </div>
  </div>

  <script>
    const PLAYLIST_URL = './playlist.json';
    const FETCH_INTERVAL_MS = 2000;
    const SYNC_CHECK_INTERVAL_MS = 500;
    const MAX_ALLOWED_DRIFT_SEC = 0.5;

    const videoElem = document.getElementById('native-player');
    const iframeElem = document.getElementById('iframe-player');
    const debugElem = document.getElementById('debug-status');
    const btnPlay = document.getElementById('btn-play');
    const btnMute = document.getElementById('btn-mute');
    const btnFullscreen = document.getElementById('btn-fullscreen');

    let playlist = [];
    let hlsInstance = null;
    let currentItem = null;
    let totalPlaylistDuration = 0;

    // Force startup properties
    videoElem.muted = true;
    btnMute.textContent = 'Unmute';

    async function fetchPlaylist() {
      try {
        const response = await fetch(`${PLAYLIST_URL}?cachebuster=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) {
          debugElem.textContent = `Error: playlist.json HTTP ${response.status}`;
          return;
        }
        const data = await response.json();
        
        if (!Array.isArray(data) || data.length === 0) {
          debugElem.textContent = 'Error: playlist.json is empty or invalid array';
          return;
        }

        if (JSON.stringify(data) !== JSON.stringify(playlist)) {
          playlist = data;
          totalPlaylistDuration = playlist.reduce((acc, item) => acc + (item.duration_seconds || 0), 0);
          syncEngine();
        }
      } catch (e) {
        debugElem.textContent = `Fetch Error: ${e.message}`;
      }
    }
    setInterval(fetchPlaylist, FETCH_INTERVAL_MS);
    fetchPlaylist();

    function getGlobalTimeState() {
      if (!totalPlaylistDuration || totalPlaylistDuration === 0) return null;
      
      const epochSeconds = Date.now() / 1000;
      const currentLoopTime = epochSeconds % totalPlaylistDuration;

      let accumulatedTime = 0;
      for (let i = 0; i < playlist.length; i++) {
        const item = playlist[i];
        if (currentLoopTime >= accumulatedTime && currentLoopTime < accumulatedTime + item.duration_seconds) {
          return {
            itemIndex: i,
            item: item,
            seekPosition: currentLoopTime - accumulatedTime
          };
        }
        accumulatedTime += item.duration_seconds;
      }
      return null;
    }

    function syncEngine() {
      const state = getGlobalTimeState();
      if (!state) return;

      const { item, seekPosition } = state;

      if (!currentItem || currentItem.url !== item.url) {
        currentItem = item;
        debugElem.textContent = `Syncing [Item ${state.itemIndex + 1}]: ${item.type.toUpperCase()}`;
        loadMediaSource(item, seekPosition);
        return;
      }

      if (item.type === 'mp4' || item.type === 'm3u8') {
        const drift = Math.abs(videoElem.currentTime - seekPosition);
        if (drift > MAX_ALLOWED_DRIFT_SEC) {
          videoElem.currentTime = seekPosition;
        }

        if (videoElem.paused) {
          videoElem.play().catch(err => {
            debugElem.textContent = `Autoplay Blocked: Tap 'Play' button`;
          });
        }
      }
    }

    setInterval(syncEngine, SYNC_CHECK_INTERVAL_MS);

    function loadMediaSource(item, initialSeek) {
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      if (item.type === 'iframe') {
        videoElem.style.display = 'none';
        videoElem.pause();
        iframeElem.style.display = 'block';
        iframeElem.src = item.url;
      } else {
        iframeElem.style.display = 'none';
        iframeElem.src = '';
        videoElem.style.display = 'block';

        if (item.type === 'm3u8') {
          if (Hls.isSupported()) {
            hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
            hlsInstance.loadSource(item.url);
            hlsInstance.attachMedia(videoElem);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
              videoElem.currentTime = initialSeek;
              videoElem.play().catch(() => {});
            });
            hlsInstance.on(Hls.Events.ERROR, (event, data) => {
              if (data.fatal) debugElem.textContent = `HLS Fatal Error: ${data.details}`;
            });
          } else if (videoElem.canPlayType('application/vnd.apple.mpegurl')) {
            videoElem.src = item.url;
            videoElem.currentTime = initialSeek;
            videoElem.play().catch(() => {});
          }
        } else if (item.type === 'mp4') {
          videoElem.src = item.url;
          videoElem.currentTime = initialSeek;
          videoElem.play().catch(() => {});
        }
      }
    }

    btnPlay.addEventListener('click', () => {
      if (videoElem.paused) {
        videoElem.play();
        btnPlay.textContent = 'Pause';
      } else {
        videoElem.pause();
        btnPlay.textContent = 'Play';
      }
    });

    btnMute.addEventListener('click', () => {
      videoElem.muted = !videoElem.muted;
      btnMute.textContent = videoElem.muted ? 'Unmute' : 'Mute';
    });

    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    });

    videoElem.addEventListener('seeking', () => {
      const state = getGlobalTimeState();
      if (state && (state.item.type === 'mp4' || state.item.type === 'm3u8')) {
        const drift = Math.abs(videoElem.currentTime - state.seekPosition);
        if (drift > MAX_ALLOWED_DRIFT_SEC) {
          videoElem.currentTime = state.seekPosition;
        }
      }
    });
  </script>
</body>
</html>
