<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B4U PLAY</title>
  
  <!-- Video.js CSS -->
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Single fit-to-screen layout lock */
    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* Dynamic viewport height fix for mobile browsers */
      overflow: hidden;
      background-color: #0d0e12;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 1. Stylish Text Logo Header */
    header {
      padding: 12px 20px;
      text-align: center;
      background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0) 100%);
      flex-shrink: 0;
    }

    .logo {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #007bff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 20px rgba(79, 172, 254, 0.3);
      display: inline-block;
    }

    /* Main Application Area */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      gap: 12px;
      min-height: 0; /* Allows strict flex scaling */
    }

    /* Controls Bar - Clean Dropdown Only */
    .controls {
      width: 100%;
      max-width: 854px;
      flex-shrink: 0;
    }

    select {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #2a2d3d;
      background-color: #161822;
      color: #e1e4ed;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    select:focus, select:hover {
      border-color: #007bff;
      box-shadow: 0 0 10px rgba(0, 123, 255, 0.2);
    }

    /* 4. Responsive 16:9 Aspect Ratio Media Container */
    .player-wrapper {
      width: 100%;
      max-width: 854px;
      max-height: calc(100% - 60px);
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
    }

    #media-shell {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #media-shell > * {
      width: 100% !important;
      height: 100% !important;
      border: none;
      display: block;
    }

    /* Empty state placeholder before selection */
    .placeholder-text {
      color: #6c757d;
      font-size: 0.95rem;
      text-align: center;
      padding: 20px;
    }

    /* 5. Sleek Professional Footer */
    footer {
      padding: 12px 20px;
      background: #090a0d;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
      font-size: 0.75rem;
      color: #717686;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    footer p.disclaimer {
      color: #4e5260;
      font-size: 0.7rem;
      max-width: 800px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <!-- 1. Header with Logo -->
  <header>
    <div class="logo">B4U PLAY</div>
  </header>

  <!-- Main Player Stage -->
  <main>
    <div class="controls">
      <!-- 3. Dynamic Dropdown with Viewer Guidance -->
      <select id="channelSelect" onchange="playSelectedChannel()">
        <option value="">Please choose a channel from the list to start playback</option>
      </select>
    </div>

    <!-- 4. 16:9 Media Shell -->
    <div class="player-wrapper">
      <div id="media-shell">
        <div class="placeholder-text">Select a channel above to begin streaming</div>
      </div>
    </div>
  </main>

  <!-- 5. Modern Footer -->
  <footer>
    <p>&copy; 2026 B4U PLAY. All rights reserved.</p>
    <p class="disclaimer">Disclaimer: B4U PLAY does not host, store, or stream media directly. All content is fetched dynamically from user-provided network playlists.</p>
  </footer>

  <!-- Core Stream Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/dashjs@latest/dist/dash.all.min.js"></script>
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/videojs-contrib-dash@latest/dist/videojs-contrib-dash.min.js"></script>

  <script>
    const shell = document.getElementById('media-shell');
    let vjsPlayer = null;

    document.addEventListener('DOMContentLoaded', fetchChannels);

    async function fetchChannels() {
      const selectElement = document.getElementById('channelSelect');
      try {
        const response = await fetch('channels2.json');
        if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
        
        const channels = await response.json();
        // 3. Instruction text when no active stream is picked
        selectElement.innerHTML = '<option value="">Please choose a channel from the list to start playback</option>';

        if (Array.isArray(channels)) {
          channels.forEach(ch => {
            const option = document.createElement('option');
            option.value = ch.url || ch.src || ch.link || ch.iframe;
            option.textContent = ch.name || ch.title || ch.label || option.value;
            if (ch.type) option.dataset.type = ch.type;
            selectElement.appendChild(option);
          });
        } else if (typeof channels === 'object') {
          Object.entries(channels).forEach(([name, url]) => {
            const option = document.createElement('option');
            option.value = typeof url === 'string' ? url : (url.url || url.iframe);
            option.textContent = name;
            if (url.type) option.dataset.type = url.type;
            selectElement.appendChild(option);
          });
        }
      } catch (error) {
        console.error('Failed to load channels:', error);
        selectElement.innerHTML = '<option value="">Error loading channels list (channels2.json)</option>';
      }
    }

    function playSelectedChannel() {
      const selectElement = document.getElementById('channelSelect');
      const selectedOption = selectElement.options[selectElement.selectedIndex];
      const selectedUrl = selectedOption.value;
      const explicitType = selectedOption.dataset.type;

      if (selectedUrl) {
        playUrl(selectedUrl, explicitType);
      } else {
        resetContainer();
        shell.innerHTML = '<div class="placeholder-text">Select a channel above to begin streaming</div>';
      }
    }

    function resetContainer() {
      if (vjsPlayer) {
        vjsPlayer.dispose();
        vjsPlayer = null;
      }
      shell.innerHTML = '';
    }

    function playUrl(url, explicitType = '') {
      resetContainer();

      const isIframe = explicitType === 'iframe' || 
                       url.includes('/embed/') || 
                       url.includes('player.vimeo.com') || 
                       url.includes('youtube.com/embed') ||
                       (!url.includes('.m3u8') && !url.includes('.mpd') && !url.includes('.mp4') && url.startsWith('http') && !url.match(/\.(jpg|png|gif)$/i) && !url.match(/manifest/i));

      if (isIframe) {
        const iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
        iframe.setAttribute('allowfullscreen', 'true');
        shell.appendChild(iframe);
      } else {
        const video = document.createElement('video');
        video.className = 'video-js vjs-default-skin vjs-big-play-centered';
        video.controls = true;
        video.preload = 'auto';
        shell.appendChild(video);

        let mimeType = 'video/mp4';
        if (explicitType === 'hls' || url.includes('.m3u8')) {
          mimeType = 'application/x-mpegURL';
        } else if (explicitType === 'dash' || url.includes('.mpd')) {
          mimeType = 'application/dash+xml';
        }

        vjsPlayer = videojs(video, {}, function() {
          this.src({ src: url, type: mimeType });
          this.play().catch(err => console.log('Autoplay blocked:', err));
        });
      }
    }
  </script>
</body>
</html>
