<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unified Media Player</title>
  
  <!-- Video.js CSS -->
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 800px;
      flex-wrap: wrap;
    }
    input[type="text"], select {
      flex: 1;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
      min-width: 200px;
    }
    button {
      padding: 10px 20px;
      background-color: #007bff;
      border: none;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background-color: #0056b3; }
    
    /* Single Unified Shell */
    #media-shell {
      width: 100%;
      max-width: 800px;
      height: 450px;
      background: #000;
      position: relative;
      overflow: hidden;
      border-radius: 4px;
    }

    /* Force child node to fill container strictly */
    #media-shell > * {
      width: 100% !important;
      height: 100% !important;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <h2>Unified Media Player</h2>

  <div class="controls">
    <select id="channelSelect" onchange="playSelectedChannel()">
      <option value="">Loading channels...</option>
    </select>

    <input type="text" id="streamUrl" placeholder="Enter .m3u8, .mpd, .mp4, or iframe embed URL...">
    <button onclick="loadStream()">Play Custom URL</button>
  </div>

  <!-- Single Container Shell -->
  <div id="media-shell"></div>

  <!-- Dash.js Core library -->
  <script src="https://cdn.jsdelivr.net/npm/dashjs@latest/dist/dash.all.min.js"></script>
  <!-- Video.js Script -->
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  <!-- Video.js DASH Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/videojs-contrib-dash@latest/dist/videojs-contrib-dash.min.js"></script>

  <script>
    const shell = document.getElementById('media-shell');
    let vjsPlayer = null;

    document.addEventListener('DOMContentLoaded', fetchChannels);

    async function fetchChannels() {
      const selectElement = document.getElementById('channelSelect');
      try {
        const response = await fetch('channels2.json');
        if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
        
        const channels = await response.json();
        selectElement.innerHTML = '<option value="">-- Select a Channel --</option>';

        if (Array.isArray(channels)) {
          channels.forEach(ch => {
            const option = document.createElement('option');
            option.value = ch.url || ch.src || ch.link || ch.iframe;
            option.textContent = ch.name || ch.title || ch.label || option.value;
            if (ch.type) option.dataset.type = ch.type;
            selectElement.appendChild(option);
          });
        } else if (typeof channels === 'object') {
          Object.entries(channels).forEach(([name, url]) => {
            const option = document.createElement('option');
            option.value = typeof url === 'string' ? url : (url.url || url.iframe);
            option.textContent = name;
            if (url.type) option.dataset.type = url.type;
            selectElement.appendChild(option);
          });
        }
      } catch (error) {
        console.error('Failed to load channels:', error);
        selectElement.innerHTML = '<option value="">Error loading channels2.json</option>';
      }
    }

    function playSelectedChannel() {
      const selectElement = document.getElementById('channelSelect');
      const selectedOption = selectElement.options[selectElement.selectedIndex];
      const selectedUrl = selectedOption.value;
      const explicitType = selectedOption.dataset.type;

      if (selectedUrl) {
        document.getElementById('streamUrl').value = selectedUrl;
        playUrl(selectedUrl, explicitType);
      }
    }

    function loadStream() {
      const url = document.getElementById('streamUrl').value.trim();
      if (!url) {
        alert('Please enter a valid URL.');
        return;
      }
      playUrl(url);
    }

    function resetContainer() {
      // Completely destroy Video.js player instance to free memory and stop streams
      if (vjsPlayer) {
        vjsPlayer.dispose();
        vjsPlayer = null;
      }
      // Wipe the parent shell clean of any residual DOM nodes or audio streams
      shell.innerHTML = '';
    }

    function playUrl(url, explicitType = '') {
      resetContainer();

      const isIframe = explicitType === 'iframe' || 
                       url.includes('/embed/') || 
                       url.includes('player.vimeo.com') || 
                       url.includes('youtube.com/embed') ||
                       (!url.includes('.m3u8') && !url.includes('.mpd') && !url.includes('.mp4') && url.startsWith('http') && !url.match(/\.(jpg|png|gif)$/i) && !url.match(/manifest/i));

      if (isIframe) {
        // Mount native iframe into the single shell
        const iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
        iframe.setAttribute('allowfullscreen', 'true');
        shell.appendChild(iframe);
      } else {
        // Dynamically insert video element and instantiate Video.js
        const video = document.createElement('video');
        video.className = 'video-js vjs-default-skin vjs-big-play-centered';
        video.controls = true;
        video.preload = 'auto';
        shell.appendChild(video);

        let mimeType = 'video/mp4';
        if (explicitType === 'hls' || url.includes('.m3u8')) {
          mimeType = 'application/x-mpegURL';
        } else if (explicitType === 'dash' || url.includes('.mpd')) {
          mimeType = 'application/dash+xml';
        }

        vjsPlayer = videojs(video, {}, function() {
          this.src({ src: url, type: mimeType });
          this.play().catch(err => console.log('Autoplay prevented:', err));
        });
      }
    }
  </script>
</body>
</html>
