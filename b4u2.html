<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sony HD Embedded Stream</title>
    
    <!-- Include Video.js Styles -->
      <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
</head>
<body>

    <div style="max-width: 800px; margin: 20px auto;">
        <!-- The Video Player Element -->
        <video 
            id="sony-hd-player" 
            class="video-js vjs-default-skin vjs-16-9 vjs-big-play-centered" 
            controls 
            preload="auto" 
            data-setup='{}'>
        </video>
    </div>

    <!-- Include Video.js Library -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <script>
        // Initialize the player engine
        var player = videojs('sony-hd-player');

        // Set the video stream configurations without the credentials restriction flag
        player.src({
            src: 'https://xtremplay.com/api/proxy?url=http%3A%2F%2F38.96.178.205%2FSONYHD%2Ftracks-v1a1%2Fmono.m3u8&ref=http%3A%2F%2F38.96.178.205%2FSONYHD%2Findex.m3u8',
            type: 'application/x-mpegURL'
        });

        // Debug log tracker to catch any playback errors
        player.on('error', function() {
            var errorDetails = player.error();
            console.log('Playback Error Code:', errorDetails.code);
            console.log('Playback Error Message:', errorDetails.message);
        });
    </script>

</body>
</html>
