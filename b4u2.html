<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sony HD Embedded Stream</title>
    
    <!-- Include Video.js Styles -->
      <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
</head>
<body>

    <div style="max-width: 800px; margin: 20px auto;">
        <!-- The Video Player Element -->
        <video 
            id="sony-hd-player" 
            class="video-js vjs-default-skin vjs-16-9 vjs-big-play-centered" 
            controls 
            preload="auto" 
            data-setup='{}'>
        </video>
    </div>

    <!-- Include Video.js Library -->
    <script src="https://zencdn.net"></script>

    <script>
        var player = videojs('sony-hd-player');

        // Configure the player to target the stream with cross-origin credential passing
        player.src({
            src: 'https://xtremplay.com/api/proxy?url=http%3A%2F%2F38.96.178.205%2FSONYHD%2Ftracks-v1a1%2Fmono.m3u8&ref=http%3A%2F%2F38.96.178.205%2FSONYHD%2Findex.m3u8',
            type: 'application/x-mpegURL',
            withCredentials: true
        });

        // Optional: Error handling if the proxy source goes offline
        player.on('error', function() {
            console.log('The stream stream failed to load or the proxy expired.');
        });
    </script>

</body>
</html>
