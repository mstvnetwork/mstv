<!DOCTYPE html>
<html lang="en">
<head>

        }
        .player-container { 
            width: 100%; 
            max-width: 800px; 
            padding: 10px; 
        }
        video { 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }

    <!-- Load Hls.js via highly resilient jsDelivr CDN Network -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <div class="player-container">
        <!-- Main HTML5 Video Object Element -->
        <video id="video" controls autoplay playsinline></video>
    </div>

    <script>
        // Use window.onload to guarantee the Hls.js script is completely loaded and defined first
        window.onload = function() {
            var video = document.getElementById('video');
            var streamUrl = 'https://xtremplay.com/api/proxy?url=https://cdn30092.slast430did.com/stream2/i-arch-400/197086d4d00b13651b3225b28401ead8/MJTMsp1RshGTygnMNRUR2N2MSlnWXZEdMNDZzQWe5MDZzMmdZJTO1R2RWVHZDljekhkSsl1VwYnWtx2cihVT21kaBVzTEJFaadlRp5UbRRjTUVFePR1Zx0ERklWWU1EeZpmSr1kMNBTTEdWP:1787676469:155.254.30.178:d42a98f4520c84c7294490ab2906d97552a7c9472c04716c837dc0e22ac002b0:=0EVVFDTqlUMONEN610Q0gnT6dWP/1080/index.m3u8';

            // Double check if Hls asset engine interface safely initialized
            if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                console.log("Hls.js framework loaded successfully. Initializing stream...");
                
                var hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    defaultAudioCodec: 'mp4a.40.2'
                });
                
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(function(e) {
                        console.log("Autoplay blocked by browser. User interaction required.");
                    });
                });

                // Error monitoring recovery rules
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                console.log("Network error caught, retrying source stream context...");
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.log("Media decode error caught, skipping stalled frames...");
                                hls.recoverMediaError();
                                break;
                            default:
                                console.log("Unrecoverable playback exception triggered.");
                                break;
                        }
                    }
                });
            } 
            // Fallback rule processing for native Safari environments (macOS/iOS)
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                console.log("Using native browser engine fallback streaming.");
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            } else {
                console.log("Error: This web browser environment does not support HLS streaming.");
            }
        };
    </script>

</body>
