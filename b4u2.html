<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Stream HLS Live Player</title>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: sans-serif; 
        }
        .player-container { 
            width: 100%; 
            max-width: 800px; 
            padding: 10px; 
        }
        video { 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
    </style>

    <!-- Load Hls.js via jsDelivr CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <div class="player-container">
        <video id="video" controls autoplay playsinline></video>
    </div>

    <script>
        // 1. Map your indices (#1, #2, #3, etc.) to their stream URLs here
        const streams = {
            "1": "https://xtremplay.com/api/proxy?url=http%3A%2F%2F38.96.178.205%2FSONYHD%2Ftracks-v1a1%2Fmono.m3u8&ref=http%3A%2F%2F38.96.178.205%2FSONYHD%2Findex.m3u8",
            "2": "https://mumt04.tangotv.in/m18aqlK4MHONE/tracks-v2a1/mono.m3u8",
            "3": "https://g267.turbosplayer.com/file/fd31ca5c-99ef-494b-b584-5e69366c4865/master.m3u8",
            "4": "https://hlsplayers.pages.dev/player4?url=https://xtremplay.com/api/proxy?url=http%3A%2F%2F103.135.253.32.nip.io%3A8080%2FSTAR-MOVIES-SEL%2Ftracks-v1a1%2Fmono.m3u8&ref=http%3A%2F%2F103.135.253.32.nip.io%3A8080%2FSTAR-MOVIES-SEL%2Findex.m3u8"
            };

        let hlsInstance = null;

        function loadStream() {
            var video = document.getElementById('video');
            
            // Extract the hash value (e.g., "#1" becomes "1"). Default to "1" if missing or invalid.
            var hashKey = window.location.hash.replace('#', '');
            var streamUrl = streams[hashKey] || streams["1"];

            console.log("Playing channel:", hashKey || "1", "URL:", streamUrl);

            // Destroy existing instance before loading a new URL to prevent memory leaks
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            // HLS.js engine execution
            if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    defaultAudioCodec: 'mp4a.40.2'
                });
                
                hlsInstance.loadSource(streamUrl);
                hlsInstance.attachMedia(video);
                
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(function(e) {
                        console.log("Autoplay blocked by browser. User interaction required.");
                    });
                });

                hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hlsInstance.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hlsInstance.recoverMediaError();
                                break;
                            default:
                                break;
                        }
                    }
                });
            } 
            // Native HLS fallback (Safari/iOS)
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }

        // Initialize on window load
        window.onload = loadStream;

        // Switch channels dynamically when the hash changes in the URL (e.g., #1 -> #2)
        window.onhashchange = loadStream;
    </script>

</body>
</html>
