<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sony HD Embedded Stream</title>
    
    <!-- Include Video.js Styles -->
      <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
</head>
<body>

    <div style="max-width: 800px; margin: 20px auto;">
        <!-- The Video Player Element -->
        <video 
            id="sony-hd-player" 
            class="video-js vjs-default-skin vjs-16-9 vjs-big-play-centered" 
            controls 
            preload="auto" 
            data-setup='{}'>
        </video>
    </div>

    <!-- Include Video.js Library -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <script>
        var video = document.getElementById('video');
        var streamUrl = 'https://xtremplay.com/api/proxy?url=http%3A%2F%2F38.96.178.205%2FSONYHD%2Ftracks-v1a1%2Fmono.m3u8&ref=http%3A%2F%2F38.96.178.205%2FSONYHD%2Findex.m3u8';

        if (Hls.isSupported()) {
            var hls = new Hls({
                // Configures the engine to strictly sync video tracks alongside audio
                enableWorker: true,
                lowLatencyMode: true,
                defaultAudioCodec: 'mp4a.40.2'
            });
            
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(function(e) {
                    console.log("Autoplay blocked by browser, user action required to start.");
                });
            });

            hls.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            console.log("Network problem, trying to recover...");
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            console.log("Media stall, trying to skip over broken video frames...");
                            hls.recoverMediaError();
                            break;
                        default:
                            console.log("Unrecoverable playback error.");
                            break;
                    }
                }
            });
        } 
        // Fallback for Safari/iOS devices which decode HLS natively without a library
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>

</body>
</html>

</body>
</html>
