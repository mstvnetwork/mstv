<!DOCTYPE html>
<html>
<head>
    <title>DASH Player Example</title>
    <!-- Include Dash.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dashjs/4.7.4/dash.all.min.js"></script>
</head>
<body>
    <div style="width: 640px;">
        <video id="videoPlayer" controls autoplay style="width: 100%;"></video>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var url = "https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/rhf2dwosdt/out/v1/ee550d2a68d846c797e6ce4de2e8b76d/cenc.mpd";
            var player = dashjs.MediaPlayer().create();
            player.initialize(document.querySelector("#videoPlayer"), url, true);
        });
    </script>
</body>
</html>
