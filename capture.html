<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cropped Player Embed</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 1. Outer Container: Masks/Crops everything outside its dimensions */
    .player-crop-wrapper {
      position: relative;
      width: 100%;
      max-width: 960px; /* Adjust to desired video width */
      height: 540px;    /* Adjust to desired video height (16:9 ratio) */
      overflow: hidden; /* Clips out the header and surrounding website UI */
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    /* 2. Inner Iframe: Positioned to push the header off-screen */
    .player-crop-wrapper iframe {
      position: absolute;
      
      /* Shift upward to hide top header/nav bar (Adjust -60px depending on header height) */
      top: -60px; 
      
      /* Horizontal alignment */
      left: 0;
      
      /* Scaled dimensions to ensure video fills container after top shift */
      width: 100%;
      height: calc(100% + 60px); 
      
      border: 0;
    }
  </style>
</head>
<body>

  <!-- Cropped Player Container -->
  <div class="player-crop-wrapper">
    <iframe 
      src="https://dekhoprime.live/livetv?play=sony-ten-2-hd" 
      allowfullscreen="true" 
      scrolling="no" 
      allow="encrypted-media; autoplay">
    </iframe>
  </div>

</body>
</html>
