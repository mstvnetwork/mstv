let player = null;

function log(msg) {
    document.getElementById('log').innerText = "Status: " + msg;
}

async function initApp() {
    const video = document.getElementById('video');
    shaka.polyfill.installAll();
    
    if (!shaka.Player.isBrowserSupported()) {
        log('Browser not supported for Shaka Player!');
        return;
    }

    player = new shaka.Player(video);
    player.addEventListener('error', (event) => {
        console.error('Shaka Error:', event.detail);
        log('Error Code ' + event.detail.code + ' - ' + event.detail.message);
    });

    renderPlaylist();
    if (channels.length > 0) {
        loadChannel(0);
    }
}

function renderPlaylist() {
    const listDiv = document.getElementById('playlist');
    listDiv.innerHTML = '';
    channels.forEach((ch, index) => {
        const btn = document.createElement('button');
        btn.innerText = ch.name;
        btn.onclick = () => loadChannel(index);
        btn.id = 'btn-' + index;
        listDiv.appendChild(btn);
    });
}

async function loadChannel(index) {
    document.querySelectorAll('.playlist button').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + index).classList.add('active');

    const ch = channels[index];
    log('Loading ' + ch.name + '...');

    // Reset player configuration
    player.configure({
        drm: {
            clearKeys: ch.clearkey ? ch.clearkey : {}
        }
    });

    // Configure headers if present
    player.getNetworkingEngine().clearAllRequestFilters();
    if (ch.headers && Object.keys(ch.headers).length > 0) {
        player.getNetworkingEngine().registerRequestFilter((type, request) => {
            if (type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
                type === shaka.net.NetworkingEngine.RequestType.SEGMENT) {
                for (let [key, value] of Object.entries(ch.headers)) {
                    request.headers[key] = value;
                }
            }
        });
    }

    try {
        await player.load(ch.url);
        log('Playing: ' + ch.name);
    } catch (e) {
        log('Failed to load channel (Code: ' + e.code + ')');
    }
}

document.addEventListener('DOMContentLoaded', initApp);
