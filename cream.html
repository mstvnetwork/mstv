<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaka IPTV Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.4/shaka-player.compiled.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        h1 { text-align: center; font-size: 1.5rem; }
        .container { max-width: 800px; margin: auto; }
        video { width: 100%; max-height: 450px; background: #000; border-radius: 8px; }
        .playlist { margin-top: 15px; display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; }
        button { padding: 12px; background: #1f1f1f; color: #fff; border: 1px solid #333; border-radius: 6px; text-align: left; cursor: pointer; font-size: 1rem; }
        button:hover { background: #333; }
        button.active { background: #e50914; border-color: #e50914; }
        #log { background: #222; color: #00ff00; padding: 10px; margin-top: 10px; font-family: monospace; font-size: 0.8rem; border-radius: 4px; max-height: 100px; overflow-y: auto; }
    </style>
</head>
<body>
<div class="container">
    <h1>Shaka DRM / IPTV Player</h1>
    <video id="video" controls autoplay></video>
    <div id="log">Status: Ready</div>
    <div class="playlist" id="playlist"></div>
</div>

<script>
const channels = [
    {
        "name": "Discovery Hindi",
        "url": "https://d1g8wgjurz8via.cloudfront.net/bpk-tv/Discoverychannel2/default/manifest.mpd",
        "clearkey": {
            "b70a8cf9450c4d6484b4ac4d3c6761c0": "0908be844260409cbac180bf0181da40"
        },
        "headers": {}
    }
];

let player = null;

function log(msg) {
    document.getElementById('log').innerText = "Status: " + msg;
}

async function initApp() {
    const video = document.getElementById('video');
    shaka.polyfill.installAll();
    
    if (!shaka.Player.isBrowserSupported()) {
        log('Browser not supported for Shaka Player!');
        return;
    }

    player = new shaka.Player(video);
    player.addEventListener('error', (event) => {
        console.error('Shaka Error:', event.detail);
        log('Error Code ' + event.detail.code + ' - ' + event.detail.message);
    });

    renderPlaylist();
    if (channels.length > 0) {
        loadChannel(0);
    }
}

function renderPlaylist() {
    const listDiv = document.getElementById('playlist');
    listDiv.innerHTML = '';
    channels.forEach((ch, index) => {
        const btn = document.createElement('button');
        btn.innerText = ch.name;
        btn.onclick = () => loadChannel(index);
        btn.id = 'btn-' + index;
        listDiv.appendChild(btn);
    });
}

async function loadChannel(index) {
    document.querySelectorAll('.playlist button').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + index).classList.add('active');

    const ch = channels[index];
    log('Loading ' + ch.name + '...');

    // Reset player configuration
    player.configure({
        drm: {
            clearKeys: ch.clearkey ? ch.clearkey : {}
        }
    });

    // Configure headers if present
    player.getNetworkingEngine().clearAllRequestFilters();
    if (ch.headers && Object.keys(ch.headers).length > 0) {
        player.getNetworkingEngine().registerRequestFilter((type, request) => {
            if (type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
                type === shaka.net.NetworkingEngine.RequestType.SEGMENT) {
                for (let [key, value] of Object.entries(ch.headers)) {
                    request.headers[key] = value;
                }
            }
        });
    }

    try {
        await player.load(ch.url);
        log('Playing: ' + ch.name);
    } catch (e) {
        log('Failed to load channel (Code: ' + e.code + ')');
    }
}

document.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
