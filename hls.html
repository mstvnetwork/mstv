<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream Player</title>
    <!-- Video.js Styles -->
    <link href="https://zencdn.net" rel="stylesheet" />
    
    <style>
        /* Responsive 16:9 Container */
        .video-container {
            width: 100%;
            max-width: 800px; /* Limits maximum desktop size; change or remove as needed */
            margin: 0 auto;   /* Centers the player on the page */
            aspect-ratio: 16 / 9;
        }

        /* Forces Video.js to fill the 16:9 container perfectly */
        .video-container .video-js {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <!-- 16:9 Wrapper Container -->
    <div class="video-container">
        <video
            id="my-live-stream"
            class="video-js vjs-default-skin vjs-big-play-centered"
            controls
            preload="auto"
            data-setup='{}'>
            <source src="https://fomis.phantemlis.top/premium669/index.m3u8?md5v1=HSIauwObcS-lBFm_63wX7A&md5v2=6azhjKdaG5zvfDB11j9z5g&expires=1782922420">
            <p class="vjs-no-js">
                To view this video please enable JavaScript, and consider upgrading to a web browser that
                <a href="https://videojs.com" target="_blank">supports HTML5 video</a>
            </p>
        </video>
    </div>

    <!-- Video.js JavaScript -->
    <script src="https://zencdn.net"></script>
</body>
</html>
