<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubble IDV Testing Site</title>
    
    <!-- 1. Essential: Include the official Ubble Iframe SDK script -->
    <script src="https://oos.eu-west-2.outscale.com/public-ubble-ai/iframe-sdk-0.0.1.js" type="application/javascript"></script>
</head>
<body>

    <h1>Ubble IDV Integration Test</h1>
    
    <!-- 2. The DOM container where the Ubble element mounts -->
    <div id="iframe"></div>

    <script>
        // 3. Essential: The SDK looks for this exact function name when it finishes loading
        window.onUbbleReady = function() {
            console.log("Ubble SDK successfully loaded and ready.");
            
            const iframeElement = document.getElementById("iframe");

            // Initialize the IDV flow
            const ubbleIDV = new Ubble.IDV(iframeElement, {
                identificationUrl: "https://vidsrcme.su/embed/movie?imdb=tt2109248",
                height: "500",
                width: "600",
                allowCamera: false,
                events: {
                    onComplete: (event) => {
                        console.log("Identification completed successfully.", event);
                        // Recommended: Clean up the SDK instance upon completion
                        if (typeof ubbleIDV.destroy === "function") ubbleIDV.destroy();
                    },
                    onAbort: (event) => {
                        console.log("Identification was aborted by the user.", event);
                        if (typeof ubbleIDV.destroy === "function") ubbleIDV.destroy();
                    }
                }
            });
        };
    </script>
</body>
</html>
