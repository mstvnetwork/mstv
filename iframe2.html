<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubble IDV Testing Site</title>
    <!-- 1. Ensure you import the Ubble library script here if required -->
    <!-- <script src="https://ubble.ai"></script> -->
</head>
<body>

    <h1>Ubble IDV Integration Test</h1>
    
    <!-- 2. The required container element -->
    <div id="iframe"></div>

    <!-- 3. Your fixed execution script -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const iframeElement = document.getElementById("iframe");

            // Initializing the Ubble instance
            const ubbleIDV = new Ubble.IDV(iframeElement, {
                identificationUrl: "https://vidsrcme.su/embed/movie?imdb=tt2109248",
                height: "500",
                width: "600",
                allowCamera: false,
                events: {
                    onComplete: () => {
                        console.log("Identification completed successfully.");
                    },
                    onAbort: () => {
                        console.log("Identification was aborted by the user.");
                    }
                }
            });
        });
    </script>
</body>
</html>
