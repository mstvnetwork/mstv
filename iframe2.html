<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Bhoom TV Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        /* Styling the customized iframe container */
        iframe[is="x-frame-bypass"] {
            width: 100%;
            height: 650px;
            border: 2px solid #ccc;
            border-radius: 4px;
        }
    </style>

    <!-- 1. Include the Custom Elements polyfill for Safari/WebKit compatibility -->
    <script src="https://unpkg.com/@ungap/custom-elements-builtin"></script>
    
    <!-- 2. Include the primary X-Frame-Bypass JS module via UNPKG -->
    <script type="module" src="https://unpkg.com/x-frame-bypass"></script>
</head>
<body>

    <div class="container">
        <h1>Bollywood Colors Live Stream</h1>
        <p>Testing iframe bypass embedding for bhoomtv.org</p>
        
        <!-- 3. The customized iframe utilizing the x-frame-bypass registry -->
        <iframe is="x-frame-bypass" src="https://hlsplayers.pages.dev/iframe?url=https://bhoomtv.org/live/bollywood-colors/">
            <p>Your browser does not support customized iframes.</p>
        </iframe>
    </div>

</body>
</html>
