<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bollywood Colors Live Player</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0d0d13;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .player-card {
            background: #161622;
            border: 1px solid #2a2b3d;
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .live-badge {
            background: #ff0055;
            color: #fff;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
            letter-spacing: 1px;
            animation: pulse 1.5s infinite;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
            color: #fff;
        }
        p {
            color: #8fa0dd;
            font-size: 14px;
            margin: 0 0 30px 0;
            line-height: 1.5;
        }
        .launch-btn {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        .launch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }
        .launch-btn:active {
            transform: translateY(0);
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="live-badge">Live</div>
        <h1>Bollywood Colors</h1>
        <p>Click below to launch the video player directly from the streaming network broadcast source.</p>
        
        <!-- Native execution button triggers a targeted window overlay -->
        <button class="launch-btn" onclick="openLivePlayer()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z"/>
            </svg>
            Watch Stream Now
        </button>
    </div>

    <script>
        function openLivePlayer() {
            // Target streaming source
            const targetStreamUrl = 'https://bhoomtv.org/live/bollywood-colors/';
            
            // Setting parameters to force a pop-out video block frame 
            const windowFeatures = 'width=1024,height=650,resizable=yes,scrollbars=yes,status=no,toolbar=no,menubar=no';
            
            // Safe system call bypasses iframe origin checks entirely
            window.open(targetStreamUrl, 'BhoomTVPlayer', windowFeatures);
        }
    </script>

</body>
</html>
