<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Stream Embed Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #111;
            color: #fff;
            text-align: center;
        }
        .video-box {
            max-width: 900px;
            margin: 20px auto;
            background: #222;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
            height: 600px;
        }
        #stream-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
        .status-msg {
            color: #aaa;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>Bollywood Colors Live Player</h1>
    <p class="status-msg" id="status">Loading stream from source wrapper...</p>

    <div class="video-box">
        <!-- The container frame where bypassed HTML content will load -->
        <iframe id="stream-frame" allowfullscreen></iframe>
    </div>

    <script>
        // 1. Define the restricted video page link
        const targetUrl = 'https://bhoomtv.org/live/bollywood-colors/';
        
        // 2. Use the free AllOrigins proxy service to pull raw page HTML via JSONP
        const proxyUrl = `https://allorigins.win{encodeURIComponent(targetUrl)}`;

        fetch(proxyUrl)
            .then(response => {
                if (response.ok) return response.json();
                throw new Error('Network response proxy failure.');
            })
            .then(data => {
                let htmlContent = data.contents;

                // 3. Inject a HTML <base> tag into the raw code 
                // This forces the video components and styles to load from Bhoom TV instead of your site
                const baseTag = '<head><base href="https://bhoomtv.org/">';
                htmlContent = htmlContent.replace('<head>', baseTag);

                // 4. Inject the modified HTML into your site's iframe
                const iframe = document.getElementById('stream-frame');
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                
                iframeDoc.open();
                iframeDoc.write(htmlContent);
                iframeDoc.close();

                document.getElementById('status').innerText = "Stream payload injected successfully!";
            })
            .catch(error => {
                console.error('Error fetching stream:', error);
                document.getElementById('status').innerText = "Failed to fetch stream. The public proxy might be overloaded.";
            });
    </script>

</body>
</html>
