<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale-1.0">
  <title>Cropped Stream View</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 1. Outer viewport box (determines what is visible on your site) */
    .crop-viewport {
      position: relative;
      width: 100%;
      max-width: 900px;  /* Adjust width to fit your site design */
      height: 506px;     /* Set to a standard 16:9 ratio height */
      overflow: hidden;  /* Cuts off everything outside this box */
      background: #000;
      border-radius: 8px;
    }

    /* 2. Scaled iframe positioned to hide top headers and bottom footers */
    .crop-viewport iframe {
      position: absolute;
      
      /* Shift UP to hide the top navbar/header */
      top: -10px;       
      
      /* Shift LEFT to hide left padding/sidebars if needed */
      left: -10px;        
      
      /* Make iframe larger than container so bottom/right parts get pushed out and hidden */
      width: calc(100% + 20px); 
      height: calc(100% + -25px); 
      
      border: 0;
    }
  </style>
</head>
<body>

  <div class="crop-viewport">
    <iframe 
      src="https://stream-proxy.cabletv.workers.dev/play/06" 
      referrerpolicy="no-referrer"
      scrolling="no" 
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
