<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Iframe Tester</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .player-container {
            width: 100%;
            max-width: 850px;
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        /* Responsive iframe wrapper to maintain 16:9 widescreen aspect ratio */
        .iframe-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            background-color: #000000;
            border-radius: 4px;
            overflow: hidden;
        }

        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .button-container {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .stream-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .stream-btn:hover {
            background-color: #0056b3;
        }

        .stream-btn.active {
            background-color: #28a745;
        }

        .status-text {
            margin-top: 10px;
            font-size: 14px;
            color: #aaaaaa;
        }
    </style>
</head>
<body>

<div class="player-container">
    <h2>Custom Stream Player</h2>
    
    <!-- The persistent video container frame -->
    <div class="iframe-wrapper">
        <iframe 
            id="streamPlayer" 
            src="" 
            allowfullscreen 
            allow="autoplay; encrypted-media">
        </iframe>
    </div>

    <div id="status" class="status-text">Select a channel below to begin streaming</div>

    <!-- Target control buttons -->
    <div class="button-container">
        <!-- REPLACE THE URL PLACEHOLDERS BELOW WITH YOUR SCRAPED IFRAME LINKS -->
        <button class="stream-btn" onclick="switchStream(this, 'https://maamusic.keralive.workers.dev/out/v1/a526e652e4644463bca88e350785bed0/index_1.m3u8?hdntl=exp=1784604623~acl=%2f*~data=hdntl~hmac=8bff7998f8239cb66b8f7468f430eefb0cf2304439c6ed3e09f667a4f5aba9a3')">Colors APAC</button>
        <button class="stream-btn" onclick="switchStream(this, 'https://example.com')">Colors AU</button>
        <button class="stream-btn" onclick="switchStream(this, 'https://example.com')">Colors UK</button>
        <button class="stream-btn" onclick="switchStream(this, 'https://example.com')">Colors USA</button>
    </div>
</div>

<script>
    function switchStream(buttonElement, iframeUrl) {
        const player = document.getElementById('streamPlayer');
        const status = document.getElementById('status');

        // Alert user if placeholders haven't been changed yet
        if (iframeUrl.includes('example.com')) {
            alert('Please open this HTML file in a text editor and replace the placeholder URLs with your actual iframe sources.');
            return;
        }

        // Change the source URL inside the active iframe container
        player.src = iframeUrl;
        
        // Update status text feedback
        status.innerText = "Loading stream: " + buttonElement.innerText;

        // Visual check toggle to highlight the active button
        document.querySelectorAll('.stream-btn').forEach(btn => btn.classList.remove('active'));
        buttonElement.classList.add('active');
    }
</script>

</body>
</html>
