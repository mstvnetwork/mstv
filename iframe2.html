<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isolated Video Player View</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 1. This container acts as a mask, hiding everything outside its borders */
        .player-clipper-box {
            width: 850px;          /* Match the precise width of the source player */
            height: 480px;         /* Match the precise height of the source player */
            overflow: hidden;      /* Chops off the rest of the webpage */
            position: relative;
            border: 3px solid #333;
            border-radius: 8px;
            background: #000;
        }

        /* 2. Position the iframe inside the box and shift it to hide menus */
        .player-clipper-box iframe {
            position: absolute;
            
            /* Adjust these numbers to perfectly align the player in your window */
            top: -220px;          /* Pushes the header/nav menu UP off-screen */
            left: -150px;         /* Pushes the left sidebar/menus out of view */
            
            width: 1200px;        /* Set a large width to give the page room to render */
            height: 1000px;       /* Set a large height so the player isn't cut off */
            
            border: none;
            pointer-events: auto; /* Keeps player play/pause clicks working */
        }
    </style>
</head>
<body>

    <!-- Only the area bounded by this box will be visible to users -->
    <div class="player-clipper-box">
        <iframe src="https://bhoomtv.org/live/bollywood-colors/" scrolling="no"></iframe>
    </div>

</body>
</html>
