<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale-1.0">
  <title>BhoomTV Embedded Stream</title>

  <!-- JW Player Library & License -->
  <script src="https://ssl.p.jwpcdn.com/player/v/8.49.5/jwplayer.js"></script>
  <script>jwplayer.key = "JTL7dlu7ybUI5NZnDdVgb1laM8/Hj3ftIJ5Vqg==";</script>

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; }
    #player-container { width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; }
    #my-player { width: 100% !important; height: 100% !important; }
  </style>
</head>
<body>

  <div id="player-container">
    <div id="my-player"></div>
  </div>

  <script>
    function initJWPlayer() {
      // COMBINED ABSOLUTE URL USING THE WEBSITE YOU PROVIDED
      const videoSource = "https://bhoomtv.me/stream.m3u8?id=1000009246";

      const jwPlayerInstance = jwplayer("my-player").setup({
        file: videoSource,
        width: "100%",
        height: "100%",
        autostart: true,
        mute: false, // Set to true if browser blocks autoplay with sound
        stretching: "exactfit",
        preload: "auto"
      });

      jwPlayerInstance.on("error", function() {
        console.error("Stream failed to load. The site might be blocking cross-origin requests or requires valid session tokens/cookies.");
      });
    }

    initJWPlayer();
  </script>
</body>
</html>
