<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stream Launch Controls</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: #111;
            color: #fff;
        }
        .stream-btn {
            background-color: #e50914;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }
        .stream-btn:hover {
            background-color: #b80710;
        }
    </style>
</head>
<body>

    <h2>Live Media Player</h2>
    <p>Click below to launch the video feed in a clean, distraction-free player window.</p>
    
    <!-- User interaction is mandatory to prevent modern browsers from blocking the pop-up -->
    <button class="stream-btn" id="launchPlayer">Open Stream Window</button>

    <script>
        document.getElementById('launchPlayer').addEventListener('click', function() {
            // Screen dimensions configuration
            const width = 850;
            const height = 550;
            
            // Calculates center screen positioning coordinates
            const left = (screen.width / 2) - (width / 2);
            const top = (screen.height / 2) - (height / 2);
            
            // "toolbar=no,menubar=no,location=no" strips away browser clutter
            const windowFeatures = `width=${width},height=${height},top=${top},left=${left},toolbar=no,menubar=no,location=no,status=no,resizable=yes,scrollbars=yes`;
            
            // Hand over control cleanly to the target stream URL
            const cleanWindow = window.open("https://www.ptcnews.tv/new-ptc-live", "CleanPlayer", windowFeatures);
            
            if (!cleanWindow) {
                alert("Pop-up blocked! Please click the icon in your browser's address bar and select 'Always allow pop-ups' for this website.");
            }
        });
    </script>
</body>
</html>
