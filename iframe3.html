<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pop-up Window Example</title>
</head>
<body>

    <h2>Open External Stream</h2>
    <!-- Clicking this button triggers the script below -->
    <button id="openButton">Open Stream Pop-up</button>

    <script>
        document.getElementById('openButton').addEventListener('click', function() {
            // Configuration for the pop-up window dimensions
            const windowFeatures = "width=800,height=600,resizable=yes,scrollbars=yes";
            
            // Opens the target stream in an isolated window
            const popupWindow = window.open("https://bhoomtv.me", "StreamPopup", windowFeatures);
            
            // Check if the browser blocked the window
            if (!popupWindow) {
                alert("Pop-up blocked! Please allow pop-ups for this website in your browser settings.");
            }
        }); // <-- Fixed: Added the missing closing curly brace and parenthesis
    </script>
</body>
</html>
