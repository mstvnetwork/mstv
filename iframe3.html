<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pop-up Window Example</title>
</head>
<body>

    <h2>Open External Stream</h2>
    <!-- A user click is required to prevent the browser's pop-up blocker -->
    <button id="openButton">Open Stream Pop-up</button>

    <script>
        document.getElementById('openButton').addEventListener('click', function() {
            // Configuration for the pop-up window dimensions
            const windowFeatures = "width=800,height=600,resizable=yes,scrollbars=yes";
            
            // Opens the window. Due to SOP, your script cannot read or alter this window.
            const popupWindow = window.open("https://bhoomtv.me/live/sony-tv-hd/", "StreamPopup", windowFeatures);
            
            if (!popupWindow) {
                alert("Pop-up blocked! Please allow pop-ups for this website.");
            }
        </script>
</body>
</html>
