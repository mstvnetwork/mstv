<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cropped Stream Viewport</title>
    <style>
        /* The container determines the final cropped size on your screen */
        .crop-container {
            width: 640px;          /* Width of the visible video area */
            height: 360px;         /* Height of the visible video area */
            overflow: hidden;      /* Hides everything outside this box */
            position: relative;
            border: 3px solid #333;
        }

        /* Adjust these offsets to isolate just the video player */
        .crop-container iframe {
            position: absolute;
            top: -150px;           /* Pushes the window UP to crop out the top header */
            left: -50px;           /* Pushes the window LEFT to crop out sidebars */
            width: 800px;          /* Full actual width of the target webpage */
            height: 600px;         /* Full actual height of the target webpage */
        }
    </style>
</head>
<body>

    <h2>Embedded Cropped Stream</h2>
    
    <div class="crop-container">
        <!-- The external site is loaded here seamlessly -->
        <iframe src="https://bhoomtv.me/live/sony-tv-hd/" scrolling="no" frameborder="0"></iframe>
    </div>

</body>
</html>
