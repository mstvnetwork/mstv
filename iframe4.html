<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cropped Embed Player</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      
      /* --- CROP SETTINGS (Adjust these to fit your site target) --- */
      --header-crop: 80px;  /* Pixels to cut off top */
      --footer-crop: 60px;  /* Pixels to cut off bottom */
      --left-crop: 0px;     /* Pixels to cut off left side */
      --right-crop: 0px;    /* Pixels to cut off right side */
      
      --player-width: 800px;
      --player-height: 450px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .open-btn {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .open-btn:hover {
      background-color: #2563eb;
    }

    /* Modal Overlay Background */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* 1. THE VIEWPORT WINDOW (Masks everything outside) */
    .crop-viewport {
      position: relative;
      width: var(--player-width);
      height: var(--player-height);
      background: #000;
      border-radius: 12px;
      overflow: hidden; /* Important: Cuts off the overflowing header/footer */
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }

    /* 2. THE EXPANDED & SHIFTED IFRAME */
    .crop-viewport iframe {
      position: absolute;
      
      /* Offsets push the headers/footers outside the visible viewport */
      top: calc(-1 * var(--header-crop));
      left: calc(-1 * var(--left-crop));
      
      /* Frame size expands to account for hidden cropped pixels */
      width: calc(var(--player-width) + var(--left-crop) + var(--right-crop));
      height: calc(var(--player-height) + var(--header-crop) + var(--footer-crop));
      
      border: none;
    }

    /* Floating Close Button */
    .close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      z-index: 10;
    }

    .close-btn:hover {
      background: rgba(255, 0, 0, 0.8);
    }
  </style>
</head>
<body>

  <button 
    class="open-btn" 
    data-url="https://stmify.com/live-tv/bbc-alba/#respond">
    Open Cropped Stream
  </button>

  <div class="modal-overlay" id="playerModal">
    <div class="crop-viewport">
      <button class="close-btn" id="closeBtn">&times;</button>
      <iframe id="modalFrame" src="" allow="autoplay; encrypted-media"></iframe>
    </div>
  </div>

  <script>
    const openBtn = document.querySelector('.open-btn');
    const closeBtn = document.getElementById('closeBtn');
    const modal = document.getElementById('playerModal');
    const iframe = document.getElementById('modalFrame');

    openBtn.addEventListener('click', () => {
      iframe.src = openBtn.getAttribute('data-url');
      modal.classList.add('active');
    });

    const closeModal = () => {
      modal.classList.remove('active');
      iframe.src = '';
    };

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
  </script>
</body>
</html>
