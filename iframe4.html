<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cropped Stream View</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Outer viewport box */
    .crop-viewport {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 506px;
      overflow: hidden;
      background: #000;
      border-radius: 8px;
    }

    /* Scaled iframe */
    .crop-viewport iframe {
      position: absolute;
      top: -150px;       
      left: -10px;        
      width: calc(100% + 20px); 
      height: calc(100% + -25px); 
      border: 0;
      transform-origin: top left;
      transition: top 0.1s, left 0.1s, transform 0.1s;
    }

    /* Draggable Aligner Toolbox (Hidden by default) */
    .aligner-toolbox {
      display: none; /* Controlled by JavaScript private mode detection */
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(20, 20, 20, 0.9);
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 9999;
      color: #fff;
      user-select: none;
      width: 180px;
    }

    .aligner-header {
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #aaa;
      margin-bottom: 10px;
      cursor: move;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 6px;
      border-bottom: 1px solid #333;
    }

    .aligner-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-bottom: 10px;
    }

    .aligner-btn {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      padding: 6px 0;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.2s;
    }

    .aligner-btn:hover {
      background: #444;
    }

    .aligner-btn:active {
      background: #007acc;
    }

    .zoom-controls {
      display: flex;
      gap: 5px;
    }

    .zoom-controls .aligner-btn {
      flex: 1;
    }

    .status-readout {
      font-size: 10px;
      color: #888;
      margin-top: 8px;
      text-align: center;
      font-mono: monospace;
    }
  </style>
</head>
<body>

  <div class="crop-viewport">
    <iframe 
      id="stream-frame"
      src="https://stmify.com/live-tv/bbc-alba/#" 
      referrerpolicy="no-referrer"
      scrolling="no" 
      allowfullscreen>
    </iframe>
  </div>

  <!-- Floating Aligner Toolbox -->
  <div id="toolbox" class="aligner-toolbox">
    <div id="toolbox-header" class="aligner-header">
      <span>Aligner</span>
      <span style="font-size: 10px; color: #00ff88;">🔒 Private</span>
    </div>
    
    <!-- Directional Alignment Buttons -->
    <div class="aligner-grid">
      <div></div>
      <button class="aligner-btn" onclick="adjustPosition(0, -10)">▲</button>
      <div></div>
      <button class="aligner-btn" onclick="adjustPosition(-10, 0)">◄</button>
      <button class="aligner-btn" onclick="resetPosition()">⟲</button>
      <button class="aligner-btn" onclick="adjustPosition(10, 0)">►</button>
      <div></div>
      <button class="aligner-btn" onclick="adjustPosition(0, 10)">▼</button>
      <div></div>
    </div>

    <!-- Zoom Controls -->
    <div class="zoom-controls">
      <button class="aligner-btn" onclick="adjustZoom(-0.05)">Zoom -</button>
      <button class="aligner-btn" onclick="adjustZoom(0.05)">Zoom +</button>
    </div>

    <!-- Live Values Display -->
    <div id="readout" class="status-readout">Top: -150px | Left: -10px | Zoom: 1.00x</div>
  </div>

  <script>
    const iframe = document.getElementById('stream-frame');
    const toolbox = document.getElementById('toolbox');
    const readout = document.getElementById('readout');

    // Current transformation state
    let currentTop = -150;
    let currentLeft = -10;
    let currentZoom = 1.0;

    // Adjust Iframe Alignment Position
    function adjustPosition(x, y) {
      currentLeft += x;
      currentTop += y;
      updateTransform();
    }

    // Adjust Iframe Zoom
    function adjustZoom(delta) {
      currentZoom = Math.max(0.2, currentZoom + delta);
      updateTransform();
    }

    // Reset to defaults
    function resetPosition() {
      currentTop = -150;
      currentLeft = -10;
      currentZoom = 1.0;
      updateTransform();
    }

    function updateTransform() {
      iframe.style.top = `${currentTop}px`;
      iframe.style.left = `${currentLeft}px`;
      iframe.style.transform = `scale(${currentZoom})`;
      readout.textContent = `Top: ${currentTop}px | Left: ${currentLeft}px | Zoom: ${currentZoom.toFixed(2)}x`;
    }

    // Make Toolbox Draggable
    dragElement(toolbox);

    function dragElement(elmnt) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      const header = document.getElementById("toolbox-header");
      
      if (header) {
        header.onmousedown = dragMouseDown;
      } else {
        elmnt.onmousedown = dragMouseDown;
      }

      function dragMouseDown(e) {
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
      }

      function elementDrag(e) {
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
        elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
        elmnt.style.right = 'auto'; // Disable right anchoring once dragged
      }

      function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
      }
    }

    // Private Mode Detection Engine
    async function checkPrivateMode() {
      let isPrivate = false;

      // Safari Private Mode
      try {
        window.openDatabase(null, null, null, null);
      } catch (e) {
        isPrivate = true;
      }

      // Chrome / Firefox / Opera Storage Quota Detection
      if (navigator.storage && navigator.storage.estimate) {
        const { quota } = await navigator.storage.estimate();
        if (quota < 120000000) { // Incognito usually caps storage quota low (~100MB)
          isPrivate = true;
        }
      }

      // Firefox Private Browsing (IndexedDB restriction check)
      try {
        const db = indexedDB.open("test");
        db.onerror = () => { isPrivate = true; };
      } catch (e) {
        isPrivate = true;
      }

      if (isPrivate) {
        toolbox.style.display = "block";
      }
    }

    checkPrivateMode();
  </script>

</body>
</html>
