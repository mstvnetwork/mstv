<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cropped Stream View</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Outer viewport box (clips anything outside) */
    .crop-viewport {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 506px;
      overflow: hidden;
      background: #000;
      border-radius: 8px;
    }

    /* Scaled iframe */
    .crop-viewport iframe {
      position: absolute;
      top: -150px;       
      left: -10px;        
      width: calc(100% + 20px); 
      height: 700px; /* Extended height so sticky footer is pushed out */
      border: 0;
      transform-origin: top left;
      transition: top 0.1s, left 0.1s, transform 0.1s, height 0.1s;
    }

    /* Draggable Aligner Toolbox */
    .aligner-toolbox {
      display: none; /* Controlled by JavaScript private mode detection */
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 9999;
      color: #fff;
      user-select: none;
      width: 210px;
    }

    .aligner-header {
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #aaa;
      margin-bottom: 10px;
      cursor: move;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 6px;
      border-bottom: 1px solid #333;
    }

    .aligner-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-bottom: 10px;
    }

    .aligner-btn {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      padding: 6px 0;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.2s;
    }

    .aligner-btn:hover {
      background: #444;
    }

    .aligner-btn:active {
      background: #007acc;
    }

    .btn-action {
      background: #007acc;
      border-color: #0099ff;
      font-weight: bold;
    }

    .btn-action:hover {
      background: #005999;
    }

    .btn-locked {
      background: #28a745 !important;
      border-color: #34ce57 !important;
    }

    .controls-row {
      display: flex;
      gap: 5px;
      margin-bottom: 8px;
    }

    .controls-row .aligner-btn {
      flex: 1;
    }

    .label-title {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 4px;
      margin-top: 6px;
    }

    .status-readout {
      font-size: 10px;
      color: #888;
      margin-top: 8px;
      text-align: center;
      font-family: monospace;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="crop-viewport">
    <iframe 
      id="stream-frame"
      src="https://stmify.com/live-tv/bbc-alba/#" 
      referrerpolicy="no-referrer"
      scrolling="no" 
      allowfullscreen>
    </iframe>
  </div>

  <!-- Floating Aligner Toolbox -->
  <div id="toolbox" class="aligner-toolbox">
    <div id="toolbox-header" class="aligner-header">
      <span>Aligner</span>
      <span style="font-size: 10px; color: #00ff88;">🔒 Private</span>
    </div>
    
    <!-- Pop Window Launch Button -->
    <div class="controls-row">
      <button class="aligner-btn btn-action" onclick="openPopUp()">Pop Open Stream ↗</button>
    </div>

    <!-- Directional Alignment Controls -->
    <div class="label-title">Position Alignment</div>
    <div class="aligner-grid">
      <div></div>
      <button class="aligner-btn" title="Shift Up" onclick="adjustPosition(0, -10)">▲</button>
      <div></div>
      <button class="aligner-btn" title="Shift Left" onclick="adjustPosition(-10, 0)">◄</button>
      <button class="aligner-btn" title="Reset" onclick="resetPosition()">⟲</button>
      <button class="aligner-btn" title="Shift Right" onclick="adjustPosition(10, 0)">►</button>
      <div></div>
      <button class="aligner-btn" title="Shift Down" onclick="adjustPosition(0, 10)">▼</button>
      <div></div>
    </div>

    <!-- Hide Sticky Footer / Bottom Crop Controls -->
    <div class="label-title">Hide Sticky Footer (Bottom Cut)</div>
    <div class="controls-row">
      <button class="aligner-btn" title="Show More Bottom" onclick="adjustBottomCut(-20)">Cut -</button>
      <button class="aligner-btn" title="Hide Sticky Footer" onclick="adjustBottomCut(20)">Cut +</button>
    </div>

    <!-- Zoom Controls -->
    <div class="label-title">Zoom Controls</div>
    <div class="controls-row">
      <button class="aligner-btn" onclick="adjustZoom(-0.05)">Zoom -</button>
      <button class="aligner-btn" onclick="adjustZoom(0.05)">Zoom +</button>
    </div>

    <!-- Lock & Save Controls -->
    <div class="controls-row" style="margin-top: 10px;">
      <button id="lock-btn" class="aligner-btn btn-action" onclick="toggleLock()">Lock & Save Settings</button>
    </div>

    <!-- Live Values Display -->
    <div id="readout" class="status-readout">Top: -150px | Left: -10px | Height: 700px</div>
  </div>

  <script>
    const TARGET_URL = "https://stmify.com/live-tv/bbc-alba/#";
    const iframe = document.getElementById('stream-frame');
    const toolbox = document.getElementById('toolbox');
    const readout = document.getElementById('readout');
    const lockBtn = document.getElementById('lock-btn');

    let popWindow = null;
    let isLocked = false;

    // Alignment state
    let state = {
      top: -150,
      left: -10,
      height: 700, // Controls bottom crop / pushing sticky footer out
      zoom: 1.0
    };

    // Load saved settings from LocalStorage
    function loadSavedSettings() {
      const saved = localStorage.getItem('aligner_settings');
      if (saved) {
        try {
          state = JSON.parse(saved);
          isLocked = true;
          lockBtn.classList.add('btn-locked');
          lockBtn.textContent = '🔒 Settings Saved';
          updateTransform();
        } catch (e) {
          console.error("Could not load saved settings", e);
        }
      }
    }

    // Toggle Lock & Save state
    function toggleLock() {
      isLocked = !isLocked;
      if (isLocked) {
        localStorage.setItem('aligner_settings', JSON.stringify(state));
        lockBtn.classList.add('btn-locked');
        lockBtn.textContent = '🔒 Settings Saved';
      } else {
        localStorage.removeItem('aligner_settings');
        lockBtn.classList.remove('btn-locked');
        lockBtn.textContent = 'Lock & Save Settings';
      }
    }

    // Open popup window
    function openPopUp() {
      popWindow = window.open(
        TARGET_URL, 
        'StreamPopup', 
        'width=900,height=506,resizable=yes,scrollbars=yes'
      );
    }

    // Adjust position
    function adjustPosition(x, y) {
      state.left += x;
      state.top += y;
      updateTransform();
    }

    // Adjust bottom crop height (pushes sticky footer out of view)
    function adjustBottomCut(delta) {
      state.height = Math.max(300, state.height + delta);
      updateTransform();
    }

    // Adjust Zoom
    function adjustZoom(delta) {
      state.zoom = Math.max(0.2, state.zoom + delta);
      updateTransform();
    }

    // Reset settings
    function resetPosition() {
      state = { top: -150, left: -10, height: 700, zoom: 1.0 };
      if (isLocked) toggleLock();
      updateTransform();
    }

    function updateTransform() {
      iframe.style.top = `${state.top}px`;
      iframe.style.left = `${state.left}px`;
      iframe.style.height = `${state.height}px`;
      iframe.style.transform = `scale(${state.zoom})`;
      
      readout.textContent = `T: ${state.top}px | L: ${state.left}px | H: ${state.height}px | Z: ${state.zoom.toFixed(2)}x`;
      
      if (isLocked) {
        localStorage.setItem('aligner_settings', JSON.stringify(state));
      }
    }

    // Draggable Toolbox Logic
    dragElement(toolbox);

    function dragElement(elmnt) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      const header = document.getElementById("toolbox-header");
      
      if (header) {
        header.onmousedown = dragMouseDown;
      } else {
        elmnt.onmousedown = dragMouseDown;
      }

      function dragMouseDown(e) {
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
      }

      function elementDrag(e) {
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
        elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
        elmnt.style.right = 'auto';
      }

      function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
      }
    }

    // Private Mode Detection Engine
    async function checkPrivateMode() {
      let isPrivate = false;

      // Safari check
      try {
        window.openDatabase(null, null, null, null);
      } catch (e) {
        isPrivate = true;
      }

      // Storage Quota Detection (Chrome / Opera)
      if (navigator.storage && navigator.storage.estimate) {
        const { quota } = await navigator.storage.estimate();
        if (quota < 120000000) {
          isPrivate = true;
        }
      }

      // Firefox IndexedDB check
      try {
        const db = indexedDB.open("test");
        db.onerror = () => { isPrivate = true; };
      } catch (e) {
        isPrivate = true;
      }

      if (isPrivate) {
        toolbox.style.display = "block";
        loadSavedSettings();
      }
    }

    checkPrivateMode();
  </script>

</body>
</html>
