<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="description" content="MSTV Network – Live Streaming Portal" />
  <title>MSTV Network · Live TV</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
  <!-- dash.js -->
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #07070d;
      --surface:  #0f0f1a;
      --card:     #13131f;
      --border:   #1e1e30;
      --accent:   #e5383b;
      --accent2:  #ff6b6b;
      --gold:     #f4a227;
      --text:     #e8e8f0;
      --muted:    #6b6b8a;
      --live:     #22c55e;
      --radius:   12px;
      --hdr:      64px;
      --sidebar:  300px;
      --player-ratio: 56.25%; /* 16:9 */
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    /* ═══════════════════════════════
       HEADER
    ═══════════════════════════════ */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--hdr);
      z-index: 100;
      background: rgba(7,7,13,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
    }

    .logo-mark {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 1px;
      color: #fff;
    }
    .logo-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 3px;
      color: var(--text);
      line-height: 1;
    }
    .logo-text span { color: var(--accent); }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.3);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: var(--live);
      letter-spacing: 1px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .live-dot {
      width: 7px; height: 7px;
      background: var(--live);
      border-radius: 50%;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.4; transform:scale(.7); }
    }

    /* Search */
    .search-wrap {
      flex: 1;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }
    .search-wrap svg {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px;
      color: var(--muted);
      pointer-events: none;
    }
    #searchInput {
      width: 100%;
      height: 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0 16px 0 40px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    #searchInput::placeholder { color: var(--muted); }
    #searchInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(229,56,59,.15);
    }

    .hdr-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .channel-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--muted);
    }
    .channel-count b { color: var(--gold); }

    /* ═══════════════════════════════
       LAYOUT
    ═══════════════════════════════ */
    .app-layout {
      display: flex;
      height: 100vh;
      padding-top: var(--hdr);
    }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-header h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 2px;
      color: var(--muted);
    }

    /* Filter chips */
    .filter-strip {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .filter-strip::-webkit-scrollbar { height: 0; }
    .chip {
      flex-shrink: 0;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
    }
    .chip.active, .chip:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Channel list */
    .channel-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background .15s, transform .1s;
      border: 1px solid transparent;
      position: relative;
    }
    .channel-item:hover {
      background: var(--card);
      border-color: var(--border);
    }
    .channel-item.active {
      background: rgba(229,56,59,.1);
      border-color: rgba(229,56,59,.35);
    }
    .channel-item.active::before {
      content: '';
      position: absolute;
      left: 0; top: 20%; bottom: 20%;
      width: 3px;
      background: var(--accent);
      border-radius: 0 3px 3px 0;
    }

    .ch-logo {
      width: 44px; height: 44px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--card);
      flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .ch-info { flex: 1; min-width: 0; }
    .ch-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .ch-type {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      margin-top: 3px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .ch-playing {
      display: none;
      width: 20px;
      flex-shrink: 0;
    }
    .channel-item.active .ch-playing { display: flex; align-items: center; gap: 2px; }
    .bar {
      width: 3px;
      background: var(--accent);
      border-radius: 2px;
      animation: eq .8s ease-in-out infinite alternate;
    }
    .bar:nth-child(1) { height: 8px; animation-delay: 0s; }
    .bar:nth-child(2) { height: 14px; animation-delay: .2s; }
    .bar:nth-child(3) { height: 10px; animation-delay: .4s; }
    @keyframes eq {
      from { transform: scaleY(0.4); }
      to   { transform: scaleY(1); }
    }

    /* ── Main content ── */
    .main-content {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* Player zone */
    .player-zone {
      background: #000;
      position: relative;
      flex-shrink: 0;
    }
    .player-ratio-box {
      width: 100%;
      padding-top: var(--player-ratio);
      position: relative;
    }
    .player-inner {
      position: absolute;
      inset: 0;
    }

    #videoPlayer {
      width: 100%;
      height: 100%;
      background: #000;
      display: block;
    }
    #iframePlayer {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #000;
    }

    /* Now playing bar */
    .now-playing-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .np-logo {
      width: 40px; height: 40px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--card);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .np-info { flex: 1; min-width: 0; }
    .np-name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .np-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      font-family: 'JetBrains Mono', monospace;
    }
    .np-right { display: flex; align-items: center; gap: 10px; }
    .quality-badge {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--gold);
      border: 1px solid rgba(244,162,39,.35);
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    #errorMsg {
      display: none;
      background: rgba(229,56,59,.12);
      border: 1px solid rgba(229,56,59,.35);
      color: var(--accent2);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
    }

    /* Grid of channels (bottom) */
    .grid-section {
      padding: 24px;
      flex: 1;
    }
    .grid-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .grid-header h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 2px;
    }
    .grid-header .count-pill {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 12px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }

    .grid-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform .2s, border-color .2s, box-shadow .2s;
      position: relative;
    }
    .grid-card:hover {
      transform: translateY(-4px);
      border-color: rgba(229,56,59,.5);
      box-shadow: 0 12px 40px rgba(0,0,0,.5);
    }
    .grid-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(229,56,59,.3);
    }
    .gc-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .gc-thumb img {
      max-width: 70%;
      max-height: 70%;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,.5));
      transition: transform .3s;
    }
    .grid-card:hover .gc-thumb img { transform: scale(1.08); }
    .gc-thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,.7));
      pointer-events: none;
    }
    .gc-play-btn {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .2s;
      z-index: 2;
    }
    .grid-card:hover .gc-play-btn { opacity: 1; }
    .gc-play-btn svg {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 50%;
      padding: 10px;
      color: #fff;
    }
    .gc-info {
      padding: 10px 12px;
      border-top: 1px solid var(--border);
    }
    .gc-name {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .gc-type {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      margin-top: 3px;
      text-transform: uppercase;
    }

    /* empty state */
    .empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 60px 20px;
      color: var(--muted);
      text-align: center;
    }
    .empty-state svg { width: 48px; height: 48px; opacity: .4; }
    .empty-state p { font-size: 14px; }

    /* ── Update toast ── */
    #updateToast {
      position: fixed;
      bottom: 80px;
      right: 24px;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 12px 18px;
      display: none;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text);
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      z-index: 200;
      animation: slideUp .3s ease;
    }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(12px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .toast-dot { width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite; }

    /* ═══════════════════════════════
       FOOTER
    ═══════════════════════════════ */
    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .footer-brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      color: var(--muted);
    }
    .footer-brand span { color: var(--accent); }
    .footer-links {
      display: flex;
      gap: 20px;
    }
    .footer-links a {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      transition: color .2s;
    }
    .footer-links a:hover { color: var(--text); }
    .footer-right {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
    }
    #lastUpdated { color: var(--gold); }

    /* ── Loader overlay ── */
    #initLoader {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity .5s;
    }
    #initLoader .brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      letter-spacing: 8px;
      color: var(--text);
    }
    #initLoader .brand span { color: var(--accent); }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ═══════════════════════════════
       RESPONSIVE
    ═══════════════════════════════ */
    @media (max-width: 900px) {
      :root { --sidebar: 260px; }
    }

    @media (max-width: 680px) {
      :root { --hdr: 56px; }
      .sidebar { display: none; }
      .live-badge { display: none; }
      .logo-text { font-size: 18px; }
      .channels-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
      .grid-section { padding: 16px; }
      .now-playing-bar { padding: 10px 16px; }
      footer { padding: 14px 16px; }
      .footer-links { display: none; }
    }

    @media (max-width: 400px) {
      .channels-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* Sidebar toggle for mobile */
    .sidebar-toggle {
      display: none;
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }
    @media (max-width: 680px) {
      .sidebar-toggle { display: flex; }
      .sidebar.open {
        display: flex;
        position: fixed;
        top: var(--hdr); left: 0; bottom: 0;
        z-index: 90;
        width: min(320px, 90vw);
        box-shadow: 4px 0 40px rgba(0,0,0,.7);
      }
    }

    /* Shimmer loading */
    .shimmer {
      background: linear-gradient(90deg, var(--card) 25%, var(--border) 50%, var(--card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    /* No-results */
    .no-results {
      display: none;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      padding: 40px;
      width: 100%;
    }
  </style>
</head>
<body>

<!-- Init Loader -->
<div id="initLoader">
  <div class="brand">MS<span>TV</span></div>
  <div class="spinner"></div>
</div>

<!-- Update toast -->
<div id="updateToast">
  <div class="toast-dot"></div>
  <span>Channels updated — <b id="newChannelCount">0</b> channels</span>
</div>

<!-- ══ HEADER ══ -->
<header>
  <a class="logo-mark" href="#">
    <div class="logo-icon">MS</div>
    <div class="logo-text">MS<span>TV</span> Network</div>
  </a>
  <div class="live-badge"><div class="live-dot"></div>LIVE</div>

  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="search" id="searchInput" placeholder="Search channels…" autocomplete="off" />
  </div>

  <div class="hdr-right">
    <div class="channel-count">Channels: <b id="totalCount">0</b></div>
    <button class="sidebar-toggle" id="sidebarToggle">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
      Channels
    </button>
  </div>
</header>

<!-- ══ APP LAYOUT ══ -->
<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>ALL CHANNELS</h2>
      <span class="channel-count" id="sideCount">0</span>
    </div>
    <div class="filter-strip" id="filterStrip">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="hls">HLS</button>
      <button class="chip" data-filter="dash">DASH</button>
      <button class="chip" data-filter="iframe">iFrame</button>
    </div>
    <div class="channel-list" id="sidebarList"></div>
  </aside>

  <!-- Main -->
  <div class="main-content" id="mainContent">

    <!-- Player -->
    <div class="player-zone">
      <div class="player-ratio-box">
        <div class="player-inner">
          <video id="videoPlayer" controls playsinline></video>
          <iframe id="iframePlayer" allowfullscreen allow="autoplay; encrypted-media; fullscreen; picture-in-picture" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation"></iframe>
        </div>
      </div>
    </div>

    <!-- Now Playing -->
    <div class="now-playing-bar" id="nowPlayingBar">
      <img class="np-logo" id="npLogo" src="" alt="" />
      <div class="np-info">
        <div class="np-name" id="npName">Select a channel to start watching</div>
        <div class="np-sub" id="npSub">MSTV Network · Live Streaming</div>
      </div>
      <div class="np-right">
        <div id="qualityBadge" class="quality-badge" style="display:none">HD</div>
        <div id="errorMsg">⚠ Stream unavailable</div>
      </div>
    </div>

    <!-- Grid -->
    <div class="grid-section">
      <div class="grid-header">
        <h2>ALL CHANNELS</h2>
        <span class="count-pill" id="gridCount">0</span>
      </div>
      <div class="channels-grid" id="channelsGrid"></div>
      <div class="no-results" id="noResults">No channels found matching your search.</div>
    </div>

    <!-- Footer -->
    <footer>
      <div class="footer-brand">MS<span>TV</span> Network</div>
      <div class="footer-links">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>
      <div class="footer-right">
        Updated: <span id="lastUpdated">–</span>
      </div>
    </footer>

  </div><!-- /main -->
</div><!-- /layout -->

<script>
  /* ══════════════════════════════════════════════════════
     CONFIG
  ══════════════════════════════════════════════════════ */
  const CHANNELS_URL  = './channels2.json';
  const POLL_INTERVAL = 15000; // ms — realtime polling

  /* ══════════════════════════════════════════════════════
     STATE
  ══════════════════════════════════════════════════════ */
  let allChannels     = [];
  let filtered        = [];
  let activeFilter    = 'all';
  let activeIndex     = -1;
  let hlsInstance     = null;
  let dashInstance    = null;
  let lastEtag        = '';
  let lastHash        = '';
  let searchTimer     = null;

  /* ══════════════════════════════════════════════════════
     FETCH + POLL
  ══════════════════════════════════════════════════════ */
  async function fetchChannels(initial = false) {
    try {
      const res = await fetch(CHANNELS_URL + '?_=' + Date.now(), {
        cache: 'no-store',
        headers: { 'Cache-Control': 'no-cache' }
      });
      if (!res.ok) return;

      const etag = res.headers.get('ETag') || '';
      const text = await res.text();
      const hash = simpleHash(text);

      if (!initial && hash === lastHash) return; // no change
      lastHash = hash;
      lastEtag = etag;

      let data;
      try { data = JSON.parse(text); } catch { return; }

      // Accept array or { channels: [] }
      const channels = Array.isArray(data) ? data : (data.channels || []);
      const valid = channels.filter(c => c && c.name && c.url);

      if (!initial && valid.length !== allChannels.length) {
        showUpdateToast(valid.length);
      }
      allChannels = valid;

      // Re-render (preserve active channel by name)
      const activeName = activeIndex >= 0 && allChannels[activeIndex]
        ? allChannels[activeIndex].name : null;

      applyFilter(false);

      // Restore active index if we can
      if (activeName) {
        const idx = allChannels.findIndex(c => c.name === activeName);
        activeIndex = idx >= 0 ? idx : -1;
        renderAll();
      }

      document.getElementById('totalCount').textContent = valid.length;
      document.getElementById('sideCount').textContent  = valid.length;
      document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();

    } catch (e) {
      console.warn('Fetch failed:', e);
    }
  }

  function simpleHash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) {
      h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
    }
    return h;
  }

  function showUpdateToast(count) {
    const t = document.getElementById('updateToast');
    document.getElementById('newChannelCount').textContent = count;
    t.style.display = 'flex';
    setTimeout(() => { t.style.display = 'none'; }, 4000);
  }

  /* ══════════════════════════════════════════════════════
     FILTER + SEARCH
  ══════════════════════════════════════════════════════ */
  function applyFilter(rerender = true) {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    filtered = allChannels.filter(ch => {
      const typeMatch = activeFilter === 'all' || (ch.type || 'hls').toLowerCase() === activeFilter;
      const nameMatch = !q || ch.name.toLowerCase().includes(q);
      return typeMatch && nameMatch;
    });
    if (rerender) renderAll();
  }

  /* ══════════════════════════════════════════════════════
     RENDER
  ══════════════════════════════════════════════════════ */
  function renderAll() {
    renderSidebar();
    renderGrid();
  }

  function renderSidebar() {
    const list = document.getElementById('sidebarList');
    list.innerHTML = '';

    if (!filtered.length) {
      list.innerHTML = '<div class="no-results" style="display:block">No channels found.</div>';
      return;
    }

    filtered.forEach((ch, i) => {
      const globalIdx = allChannels.indexOf(ch);
      const isActive  = globalIdx === activeIndex;
      const type      = (ch.type || 'hls').toUpperCase();
      const div = document.createElement('div');
      div.className = 'channel-item' + (isActive ? ' active' : '');
      div.innerHTML = `
        <img class="ch-logo" src="${ch.logo || ''}" alt="${ch.name}" loading="lazy"
             onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 44 44%22><rect width=%2244%22 height=%2244%22 fill=%22%2313131f%22 rx=%228%22/><text x=%2250%25%22 y=%2255%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%236b6b8a%22 font-size=%2214%22>TV</text></svg>'" />
        <div class="ch-info">
          <div class="ch-name">${ch.name}</div>
          <div class="ch-type">${type}</div>
        </div>
        <div class="ch-playing"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
      `;
      div.addEventListener('click', () => playChannel(globalIdx));
      list.appendChild(div);
    });
  }

  function renderGrid() {
    const grid = document.getElementById('channelsGrid');
    const noRes = document.getElementById('noResults');
    const countPill = document.getElementById('gridCount');
    grid.innerHTML = '';
    countPill.textContent = filtered.length;

    if (!filtered.length) {
      noRes.style.display = 'block';
      return;
    }
    noRes.style.display = 'none';

    filtered.forEach(ch => {
      const globalIdx = allChannels.indexOf(ch);
      const isActive  = globalIdx === activeIndex;
      const type      = (ch.type || 'hls').toUpperCase();
      const card = document.createElement('div');
      card.className = 'grid-card' + (isActive ? ' active' : '');
      card.innerHTML = `
        <div class="gc-thumb">
          <img src="${ch.logo || ''}" alt="${ch.name}" loading="lazy"
               onerror="this.style.display='none'" />
          <div class="gc-play-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          </div>
        </div>
        <div class="gc-info">
          <div class="gc-name">${ch.name}</div>
          <div class="gc-type">${type}</div>
        </div>
      `;
      card.addEventListener('click', () => playChannel(globalIdx));
      grid.appendChild(card);
    });
  }

  /* ══════════════════════════════════════════════════════
     PLAYER
  ══════════════════════════════════════════════════════ */
  const videoEl  = document.getElementById('videoPlayer');
  const iframeEl = document.getElementById('iframePlayer');

  function destroyPlayers() {
    // HLS
    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    // DASH
    if (dashInstance) { dashInstance.reset(); dashInstance = null; }
    // Clean video element
    videoEl.pause();
    videoEl.removeAttribute('src');
    videoEl.load();
    // Clean iframe — set to blank to stop previous stream
    iframeEl.src = 'about:blank';
  }

  function showVideo() {
    videoEl.style.display = 'block';
    iframeEl.style.display = 'none';
  }
  function showIframe() {
    videoEl.style.display = 'none';
    iframeEl.style.display = 'block';
  }

  function playChannel(idx) {
    if (idx < 0 || idx >= allChannels.length) return;
    activeIndex = idx;
    const ch = allChannels[idx];

    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('qualityBadge').style.display = 'none';

    destroyPlayers();
    renderAll();
    updateNowPlaying(ch);

    const type = (ch.type || 'hls').toLowerCase();

    if (type === 'iframe') {
      showIframe();
      iframeEl.src = ch.url;
    } else if (type === 'dash') {
      showVideo();
      loadDash(ch.url);
    } else {
      // hls (default)
      showVideo();
      loadHls(ch.url);
    }

    // Scroll player into view on mobile
    if (window.innerWidth <= 680) {
      document.getElementById('mainContent').scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function loadHls(url) {
    if (Hls.isSupported()) {
      hlsInstance = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        backBufferLength: 90,
      });
      hlsInstance.loadSource(url);
      hlsInstance.attachMedia(videoEl);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
        videoEl.play().catch(() => {});
        document.getElementById('qualityBadge').style.display = 'inline-block';
      });
      hlsInstance.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal) showError();
      });
    } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
      videoEl.src = url;
      videoEl.play().catch(() => {});
    } else {
      showError();
    }
  }

  function loadDash(url) {
    if (typeof dashjs !== 'undefined') {
      dashInstance = dashjs.MediaPlayer().create();
      dashInstance.initialize(videoEl, url, true);
      dashInstance.on(dashjs.MediaPlayer.events.ERROR, () => showError());
      document.getElementById('qualityBadge').style.display = 'inline-block';
    } else {
      showError();
    }
  }

  function showError() {
    document.getElementById('errorMsg').style.display = 'inline-block';
  }

  function updateNowPlaying(ch) {
    const logo = document.getElementById('npLogo');
    const name = document.getElementById('npName');
    const sub  = document.getElementById('npSub');
    logo.src = ch.logo || '';
    logo.alt = ch.name;
    logo.onerror = function() { this.style.visibility = 'hidden'; };
    logo.style.visibility = 'visible';
    name.textContent = ch.name;
    sub.textContent  = (ch.type || 'HLS').toUpperCase() + ' · Live Stream · MSTV Network';
  }

  /* ══════════════════════════════════════════════════════
     SEARCH
  ══════════════════════════════════════════════════════ */
  document.getElementById('searchInput').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => applyFilter(), 200);
  });

  /* ══════════════════════════════════════════════════════
     FILTER CHIPS
  ══════════════════════════════════════════════════════ */
  document.getElementById('filterStrip').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.filter;
    applyFilter();
  });

  /* ══════════════════════════════════════════════════════
     SIDEBAR TOGGLE (mobile)
  ══════════════════════════════════════════════════════ */
  document.getElementById('sidebarToggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
  });
  // Close sidebar when clicking outside on mobile
  document.getElementById('mainContent').addEventListener('click', () => {
    document.getElementById('sidebar').classList.remove('open');
  });

  /* ══════════════════════════════════════════════════════
     INIT
  ══════════════════════════════════════════════════════ */
  async function init() {
    await fetchChannels(true);
    renderAll();

    // Hide loader
    const loader = document.getElementById('initLoader');
    loader.style.opacity = '0';
    setTimeout(() => { loader.style.display = 'none'; }, 500);

    // Handle ?ch= deep-link AFTER channels are loaded
    handleDeepLink();

    // Start polling for real-time updates
    setInterval(() => fetchChannels(false), POLL_INTERVAL);
  }

  init();

  /* ── Deep-link: /?ch=slug auto-plays a channel ────── */
  function handleDeepLink() {
    const params = new URLSearchParams(window.location.search);
    const slug   = params.get('ch');
    if (!slug) return;
    // Find channel whose slug matches
    const getSlug = (text) =>
      text.toLowerCase().trim()
        .replace(/[^\w\s-]/g, '')
        .replace(/[\s_|]+/g, '-')
        .replace(/-{2,}/g, '-')
        .replace(/^-|-$/g, '');
    const idx = allChannels.findIndex(ch => getSlug(ch.name) === slug);
    if (idx >= 0) playChannel(idx);
  }
</script>
</body>
</html>
