<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live TV Sync Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
    
    #player-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .media-element {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
      object-fit: contain;
      display: none;
    }

    /* Custom Controls Overlay */
    #controls-overlay {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      gap: 10px;
    }

    .btn {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.2); }
    .btn svg { width: 20px; height: 20px; fill: #fff; }

    /* Autoplay Unmute Screen Overlay */
    #unmute-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      cursor: pointer;
    }
    #unmute-overlay .play-card {
      background: rgba(255,255,255,0.1);
      padding: 20px 40px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      text-align: center;
    }
  </style>
</head>
<body>

<div id="player-container">
  <!-- Media Elements -->
  <video id="html5-player" class="media-element" playsinline></video>
  <div id="yt-player" class="media-element"></div>
  <iframe id="iframe-player" class="media-element" allow="autoplay; encrypted-media; picture-in-picture"></iframe>

  <!-- Unmute Overlay (Bypasses Autoplay Restrictions) -->
  <div id="unmute-overlay">
    <div class="play-card">
      <h2>Live Broadcast Running</h2>
      <p style="margin-top:8px; color: #ccc;">Click anywhere to enable sound</p>
    </div>
  </div>

  <!-- Custom Toolbar (Fullscreen + Audio only) -->
  <div id="controls-overlay">
    <button id="mute-btn" class="btn" title="Toggle Mute">
      <svg id="icon-muted" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
      <svg id="icon-unmuted" viewBox="0 0 24 24" style="display:none;"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    </button>
    <button id="fullscreen-btn" class="btn" title="Toggle Fullscreen">
      <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>
  </div>
</div>

<script>
  const PLAYLIST_URL = 'playlist.json';
  const FETCH_INTERVAL = 10000; // Poll JSON every 10 seconds for updates

  let playlist = [];
  let isMuted = true;
  let currentEngine = null;
  let hlsInstance = null;
  let ytPlayer = null;
  let ytReady = false;

  const html5Player = document.getElementById('html5-player');
  const iframePlayer = document.getElementById('iframe-player');
  const unmuteOverlay = document.getElementById('unmute-overlay');
  const muteBtn = document.getElementById('mute-btn');
  const iconMuted = document.getElementById('icon-muted');
  const iconUnmuted = document.getElementById('icon-unmuted');

  // YouTube API Ready Callback
  function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('yt-player', {
      playerVars: { 'autoplay': 1, 'controls': 0, 'disablekb': 1, 'modestbranding': 1, 'rel': 0 },
      events: { 'onReady': () => { ytReady = true; } }
    });
  }

  // --- Core Sync Logic ---
  async function fetchPlaylist() {
    try {
      const res = await fetch(PLAYLIST_URL + '?t=' + Date.now());
      playlist = await res.json();
      syncPlayer();
    } catch (e) {
      console.error("Error loading playlist JSON:", e);
    }
  }

  function syncPlayer() {
    if (!playlist.length) return;

    // Calculate total loop duration
    const totalDuration = playlist.reduce((acc, item) => acc + item.duration_seconds, 0);
    const now = Math.floor(Date.now() / 1000);
    const currentLoopTime = now % totalDuration;

    // Determine current active item and offset
    let accumulatedTime = 0;
    let activeItem = null;
    let seekOffset = 0;

    for (let item of playlist) {
      if (currentLoopTime >= accumulatedTime && currentLoopTime < accumulatedTime + item.duration_seconds) {
        activeItem = item;
        seekOffset = currentLoopTime - accumulatedTime;
        break;
      }
      accumulatedTime += item.duration_seconds;
    }

    if (activeItem) playMedia(activeItem, seekOffset);
  }

  function hideAllEngines() {
    html5Player.style.display = 'none';
    iframePlayer.style.display = 'none';
    document.getElementById('yt-player').style.display = 'none';
    
    // Pause inactive engines
    html5Player.pause();
    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    if (ytReady && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
    iframePlayer.src = 'about:blank';
  }

  function playMedia(item, offset) {
    // Avoid re-initializing if same item is playing
    if (currentEngine === item.url) {
      // Correct drift if necessary for MP4/HLS
      if (item.type === 'mp4' || item.type === 'hls') {
        if (Math.abs(html5Player.currentTime - offset) > 2) {
          html5Player.currentTime = offset;
        }
      }
      return;
    }

    currentEngine = item.url;
    hideAllEngines();

    switch (item.type) {
      case 'mp4':
        html5Player.style.display = 'block';
        html5Player.src = item.url;
        html5Player.currentTime = offset;
        html5Player.muted = isMuted;
        html5Player.play().catch(()=>{});
        break;

      case 'hls':
        html5Player.style.display = 'block';
        if (Hls.isSupported()) {
          hlsInstance = new Hls();
          hlsInstance.loadSource(item.url);
          hlsInstance.attachMedia(html5Player);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
            html5Player.currentTime = offset;
            html5Player.muted = isMuted;
            html5Player.play().catch(()=>{});
          });
        } else if (html5Player.canPlayType('application/vnd.apple.mpegurl')) {
          html5Player.src = item.url;
          html5Player.currentTime = offset;
          html5Player.muted = isMuted;
          html5Player.play().catch(()=>{});
        }
        break;

      case 'youtube':
        document.getElementById('yt-player').style.display = 'block';
        if (ytReady) {
          ytPlayer.loadVideoById({ videoId: item.url, startSeconds: offset });
          if (isMuted) ytPlayer.mute(); else ytPlayer.unMute();
        }
        break;

      case 'iframe':
        iframePlayer.style.display = 'block';
        iframePlayer.src = item.url;
        break;
    }
  }

  // --- Audio / Unmute Handler ---
  function setMuteState(mute) {
    isMuted = mute;
    html5Player.muted = isMuted;
    if (ytReady && ytPlayer.mute) {
      isMuted ? ytPlayer.mute() : ytPlayer.unMute();
    }
    iconMuted.style.display = isMuted ? 'block' : 'none';
    iconUnmuted.style.display = isMuted ? 'none' : 'block';
  }

  unmuteOverlay.addEventListener('click', () => {
    setMuteState(false);
    unmuteOverlay.style.display = 'none';
  });

  muteBtn.addEventListener('click', () => setMuteState(!isMuted));

  // --- Fullscreen Handler ---
  document.getElementById('fullscreen-btn').addEventListener('click', () => {
    const container = document.getElementById('player-container');
    if (!document.fullscreenElement) {
      container.requestFullscreen().catch(err => console.error(err));
    } else {
      document.exitFullscreen();
    }
  });

  // --- Initialization & Real-Time Sync Loop ---
  fetchPlaylist();
  setInterval(syncPlayer, 1000); // Check timeline accuracy every second
  setInterval(fetchPlaylist, FETCH_INTERVAL); // Fetch updated JSON in background
</script>
</body>
</html>
