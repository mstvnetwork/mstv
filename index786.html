<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket HD & Live TV Player</title>
  
  <!-- HLS.js Library for HLS (.m3u8) Playback -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- YouTube IFrame Player API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f0f11;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .player-card {
      width: 100%;
      max-width: 960px;
      background-color: #1a1a1e;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .video-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background-color: #000000;
    }
    .video-container video,
    .video-container iframe,
    .video-container #ytApiPlayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      object-fit: contain;
    }
    .yt-shield-full {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      background: transparent;
      cursor: pointer;
    }
    .spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      border-top-color: #3b82f6;
      animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      z-index: 10;
      display: none;
    }
    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
    .ticker {
      background-color: #25252b;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      color: #60a5fa;
      border-bottom: 1px solid #2e2e38;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .controls {
      display: flex;
      gap: 10px;
      padding: 15px 20px;
      background-color: #141417;
      flex-wrap: wrap;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    button.secondary {
      background-color: #374151;
    }
    button.secondary:hover {
      background-color: #4b5563;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="ticker" id="epgTickerText">BROADCASTING: Select a channel or video</div>
    
    <div class="video-container" id="mediaContainer">
      <div class="spinner" id="loadingSpinner"></div>
    </div>

    <div class="controls">
      <button onclick="playSample('hls')">Play HLS Stream (.m3u8)</button>
      <button onclick="playSample('dash')">Play DASH Stream (.mpd)</button>
      <button onclick="playSample('youtube')">Play YouTube Stream</button>
      <button class="secondary" onclick="toggleMute()">Toggle Mute</button>
    </div>
  </div>

  <script>
    // --- GLOBAL PLAYER STATE ---
    let hls = null;
    let dashPlayer = null;
    let ytPlayer = null;
    let ytCheckInterval = null;

    let isMuted = false;
    let isInitialLoading = false;
    let maxWatchedTime = 0;
    let currentIndex = 0;
    let activeCategory = 'live_tv'; // Change to 'vod' if using synchronized playback

    const container = document.getElementById('mediaContainer');
    const spinner = document.getElementById('loadingSpinner');
    const epgTickerText = document.getElementById('epgTickerText');

    // Sample Playlist Data for Testing
    const samplePlaylist = {
      hls: {
        title: "Apna TV Live Stream (HLS)",
        type: "video",
        stream_url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
      },
      dash: {
        title: "Big Buck Bunny (MPEG-DASH)",
        type: "video",
        stream_url: "https://dash.akamaized.net/envivio/EnvivioDash3/manifest.mpd"
      },
      youtube: {
        title: "YouTube Live Broadcast",
        type: "iframe",
        stream_url: "https://www.youtube.com/embed/jfKfPfyJRdk"
      }
    };

    function showSpinner() { spinner.style.display = 'block'; }
    function hideSpinner() { spinner.style.display = 'none'; }

    function toggleMute() {
      isMuted = !isMuted;
      const activeVideo = container.querySelector('video');
      if (activeVideo) activeVideo.muted = isMuted;
      if (ytPlayer && typeof ytPlayer.mute === 'function') {
        if (isMuted) ytPlayer.mute(); else ytPlayer.unMute();
      }
    }

    // --- DYNAMIC DASH LOADER ---
    function loadDashStream(video, url, startTime) {
      function initDash() {
        if (typeof dashjs === 'undefined') {
          console.error('DASH.js failed to load dynamically.');
          hideSpinner();
          return;
        }

        dashPlayer = dashjs.MediaPlayer().create();
        dashPlayer.initialize(video, url, true);

        dashPlayer.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, () => {
          hideSpinner();
          if (startTime > 0) video.currentTime = startTime;
          video.play().catch(() => {});
        });

        dashPlayer.on(dashjs.MediaPlayer.events.ERROR, (e) => {
          console.error('DASH Playback Error:', e);
          hideSpinner();
        });
      }

      // Load dash.all.min.js on-demand if not present
      if (typeof dashjs === 'undefined') {
        const script = document.createElement('script');
        script.src = "https://cdn.jsdelivr.net/npm/dashjs@latest/dist/dash.all.min.js";
        script.onload = initDash;
        script.onerror = () => {
          hideSpinner();
          console.error('Could not fetch DASH library');
        };
        document.head.appendChild(script);
      } else {
        initDash();
      }
    }

    // --- CORE MEDIA ENGINE ---
    function loadMedia(item, startTime = 0) {
      showSpinner();
      isInitialLoading = true; // Lock sync logic during buffer/init phase

      maxWatchedTime = startTime;
      if (ytCheckInterval) clearInterval(ytCheckInterval);

      // 1. Clean up HLS
      if (hls) {
        hls.stopLoad();
        hls.detachMedia();
        hls.destroy();
        hls = null;
      }

      // 2. Clean up DASH (Hard Tear-Down)
      if (dashPlayer) {
        try {
          dashPlayer.reset();
          dashPlayer.destroy();
        } catch (e) {
          console.warn('DASH teardown error:', e);
        }
        dashPlayer = null;
      }

      // 3. Clean up YouTube
      if (ytPlayer && typeof ytPlayer.destroy === 'function') {
        ytPlayer.destroy();
        ytPlayer = null;
      }

      // Clear media container (keep spinner intact)
      const spinnerElem = spinner.cloneNode(true);
      container.innerHTML = '';
      container.appendChild(spinnerElem);

      epgTickerText.textContent = `BROADCASTING: ${item.title}`;

      // --- BRANCH A: IFRAME / YOUTUBE EMBEDS ---
      if (item.type === 'iframe') {
        const videoIdMatch = item.stream_url.match(/(?:embed\/|v=)([^&?]+)/);
        const videoId = videoIdMatch ? videoIdMatch[1] : null;

        if (videoId) {
          const playerDiv = document.createElement('div');
          playerDiv.id = 'ytApiPlayer';
          container.appendChild(playerDiv);

          // Click shield to bypass direct iframe overlay interaction issues
          const shield = document.createElement('div');
          shield.className = 'yt-shield-full';
          shield.onclick = (e) => {
            e.stopPropagation();
            if (ytPlayer && typeof ytPlayer.getPlayerState === 'function') {
              const state = ytPlayer.getPlayerState();
              if (state === YT.PlayerState.PLAYING) {
                ytPlayer.pauseVideo();
              } else {
                ytPlayer.playVideo();
              }
            }
          };
          container.appendChild(shield);

          ytPlayer = new YT.Player('ytApiPlayer', {
            height: '100%',
            width: '100%',
            videoId: videoId,
            playerVars: {
              autoplay: 1,
              controls: 0,
              modestbranding: 1,
              rel: 0,
              enablejsapi: 1,
              origin: window.location.origin, // Resolves postMessage DOMWindow console error
              mute: isMuted ? 1 : 0,
              start: Math.floor(startTime)
            },
            events: {
              onReady: (event) => {
                hideSpinner();
                event.target.playVideo();
                setTimeout(() => { isInitialLoading = false; }, 2000);
              },
              onStateChange: (event) => {
                if (event.data === YT.PlayerState.PLAYING) {
                  hideSpinner();
                  isInitialLoading = false;
                }
              }
            }
          });
        } else {
          const iframe = document.createElement('iframe');
          iframe.src = item.stream_url;
          iframe.allow = "autoplay; encrypted-media; picture-in-picture";
          iframe.onload = () => {
            hideSpinner();
            isInitialLoading = false;
          };
          container.appendChild(iframe);
        }

      // --- BRANCH B: HTML5 VIDEO (HLS / DASH / DIRECT MP4) ---
      } else {
        const video = document.createElement('video');
        video.autoplay = true;
        video.muted = isMuted;
        video.playsInline = true;
        video.preload = 'auto';

        video.addEventListener('playing', () => {
          hideSpinner();
          setTimeout(() => { isInitialLoading = false; }, 1000);
        });

        video.addEventListener('waiting', () => {
          showSpinner();
        });

        container.appendChild(video);

        // Anti-skip enforcement for VOD streams
        video.addEventListener('timeupdate', () => {
          if (activeCategory !== 'live_tv') {
            if (video.currentTime > maxWatchedTime + 2.5) {
              video.currentTime = maxWatchedTime;
            } else {
              maxWatchedTime = Math.max(maxWatchedTime, video.currentTime);
            }
          }
        });

        // 1. DASH MPEG-DASH (.mpd)
        if (item.stream_url.includes('.mpd')) {
          loadDashStream(video, item.stream_url, startTime);

        // 2. HLS (.m3u8)
        } else if (item.stream_url.includes('.m3u8')) {
          if (Hls.isSupported()) {
            hls = new Hls({
              enableWorker: true,
              lowLatencyMode: false,
              maxBufferLength: 30,
              maxMaxBufferLength: 60
            });
            hls.loadSource(item.stream_url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
              if (startTime > 0) video.currentTime = startTime;
              video.play().catch(() => {});
            });
            hls.on(Hls.Events.ERROR, (event, data) => {
              if (data.fatal) {
                switch (data.type) {
                  case Hls.ErrorTypes.NETWORK_ERROR:
                    hls.startLoad();
                    break;
                  case Hls.ErrorTypes.MEDIA_ERROR:
                    hls.recoverMediaError();
                    break;
                  default:
                    hls.destroy();
                    break;
                }
              }
            });
          } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Safari Native HLS Support
            video.src = item.stream_url;
            video.addEventListener('loadedmetadata', () => {
              if (startTime > 0) video.currentTime = startTime;
              video.play().catch(() => {});
            }, { once: true });
          }

        // 3. Direct MP4 / Standard HTML5 Stream
        } else {
          video.src = item.stream_url;
          video.addEventListener('loadedmetadata', () => {
            if (startTime > 0) video.currentTime = startTime;
            video.play().catch(() => {});
          }, { once: true });
        }
      }
    }

    // --- NON-DESTRUCTIVE PLAYBACK SYNCHRONIZER ---
    function getPlaybackPosition() {
      // Mock calculation for synchronized room/broadcast positions
      return { index: currentIndex, time: 0 };
    }

    function syncPlayback() {
      // Never attempt sync operations on live streams or during initial buffering
      if (activeCategory === 'live_tv' || isInitialLoading) return;

      const pos = getPlaybackPosition();
      const activeVideo = container.querySelector('video');

      if (activeVideo && !activeVideo.seeking) {
        // Increased safety threshold from 3s to 5s to eliminate stutter loops
        if (Math.abs(activeVideo.currentTime - pos.time) > 5) {
          activeVideo.currentTime = pos.time;
        }
      } else if (ytPlayer && typeof ytPlayer.getCurrentTime === 'function') {
        const ytTime = ytPlayer.getCurrentTime();
        if (Math.abs(ytTime - pos.time) > 5) {
          ytPlayer.seekTo(pos.time, true);
        }
      }
    }

    // Run sync heartbeat interval every second
    setInterval(syncPlayback, 1000);

    // Quick trigger helpers for controls
    function playSample(type) {
      if (samplePlaylist[type]) {
        loadMedia(samplePlaylist[type], 0);
      }
    }

    // Initial default stream
    window.addEventListener('DOMContentLoaded', () => {
      playSample('hls');
    });
  </script>
</body>
</html>
