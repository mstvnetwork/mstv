<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSTV Live Network</title>
  <style>
    :root {
      --void: #06070b;
      --cyan: #3df2ff;
      --panel: #0f1220;
      --glass-border: rgba(255, 255, 255, 0.1);
      --ink: #f2f4fb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--void);
      color: var(--ink);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--panel);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 24px;
      color: var(--cyan);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    p {
      font-size: 14px;
      color: #a0a5c0;
      margin-bottom: 24px;
    }

    .btn-launch {
      background: var(--cyan);
      color: #000;
      font-weight: 800;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-launch:hover {
      box-shadow: 0 0 15px rgba(61, 242, 255, 0.5);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>MSTV Player Control</h1>
    <p>Click below to launch the live broadcast popup window with dynamic branding and viewport alignment.</p>
    <button class="btn-launch" onclick="launchDemoStream()">▶ Launch Live Stream</button>
  </div>

  <script>
    /* ==========================================================================
       MSTV LIVE NETWORK - STREAM PLAYER & POPUP CONTROLLER
       ========================================================================== */

    let mstvPopupWindow = null;
    const _nativeOpen = window.open.bind(window);

    // Sanitize strings to avoid injection
    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Main Stream Launcher Function
    function openPopUpStream(ch) {
      const topShift = ch.cropTop || '0px';
      const leftShift = ch.cropLeft || '0px';
      const zoomLevel = ch.cropZoom || '100%';
      const title = esc(ch.name);
      const targetUrl = esc(ch.url);
      const tickerText = esc(ch.tickerText || ch.instructions || ch.note || '🔴 MSTV LIVE NETWORK — Thank you for watching!');

      const isPrivate = ch.access === 'private';
      const windowFeatures = 'width=960,height=620,resizable=yes,scrollbars=no,status=no';

      if (mstvPopupWindow && !mstvPopupWindow.closed) {
        mstvPopupWindow.close();
      }

      mstvPopupWindow = _nativeOpen('about:blank', 'MSTVPopUpWindow', windowFeatures);

      if (!mstvPopupWindow) {
        alert('Pop-up was blocked by browser! Please allow pop-ups for this site.');
        return;
      }

      const popupHtml = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${title} - MSTV Stream</title>
  <style>
    :root {
      --void: #06070b;
      --cyan: #3df2ff;
      --panel: #0f1220;
      --glass-border: rgba(255, 255, 255, 0.1);
      --ink: #f2f4fb;
      --green: #00ff88;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body, html {
      margin: 0; padding: 0;
      background: var(--void); color: var(--ink);
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden; width: 100vw; height: 100vh;
      display: flex; flex-direction: column;
    }

    /* HEADER */
    .popup-header {
      height: 38px; background: var(--panel);
      border-bottom: 1px solid var(--glass-border);
      display: flex; align-items: center; padding: 0 12px; gap: 10px; flex-shrink: 0;
      z-index: 10;
    }
    .popup-header .title { font-size: 13px; font-weight: 700; color: #fff; }
    
    .align-btn {
      background: rgba(61, 242, 255, 0.15); color: var(--cyan);
      border: 1px solid rgba(61, 242, 255, 0.4); border-radius: 4px;
      padding: 3px 8px; font-size: 11px; font-weight: 700; cursor: pointer; margin-left: auto;
    }

    /* TICKER BANNER */
    .ticker-wrap {
      height: 24px; background: #000; border-bottom: 1px solid var(--glass-border);
      overflow: hidden; display: flex; align-items: center; flex-shrink: 0;
      z-index: 10;
    }
    .ticker {
      display: inline-block; white-space: nowrap; padding-left: 100%;
      animation: marquee 22s linear infinite; font-size: 11px; font-weight: 600; color: var(--cyan);
    }
    @keyframes marquee { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }

    /* VIEWPORT CONTAINER */
    .crop-viewport-wrapper {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      background: #000;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .crop-viewport {
      position: relative; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background: #000;
      z-index: 2;
    }
    .crop-viewport iframe {
      position: absolute;
      top: ${topShift}; left: ${leftShift};
      width: ${zoomLevel}; height: ${zoomLevel};
      border: 0;
    }

    /* SIDE WATERMARK LOGOS FOR EMPTY SPACE */
    .side-brand {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      pointer-events: none;
      z-index: 1;
      opacity: 0.25;
    }
    .side-brand.left { left: 25px; }
    .side-brand.right { right: 25px; }

    .side-brand .logo-badge {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--cyan);
      text-shadow: 0 0 15px rgba(61, 242, 255, 0.6);
      font-family: 'Arial Black', Impact, sans-serif;
      text-transform: uppercase;
    }
    .side-brand .logo-sub {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #fff;
      margin-top: 4px;
    }

    @media (max-width: 768px) {
      .side-brand { display: none; }
    }

    /* FOOTER BAR */
    .popup-footer {
      height: 36px; background: var(--panel);
      border-top: 1px solid var(--glass-border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px; font-size: 11px; color: #a0a5c0; flex-shrink: 0; z-index: 10;
    }
    .status-badge {
      display: flex; align-items: center; gap: 6px; font-weight: 600; color: #fff;
    }
    .live-dot {
      width: 7px; height: 7px; background: var(--green);
      border-radius: 50%; box-shadow: 0 0 8px var(--green);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .footer-actions {
      display: flex; gap: 8px; align-items: center;
    }
    .footer-btn {
      background: rgba(255, 255, 255, 0.05); color: #fff;
      border: 1px solid var(--glass-border); border-radius: 4px;
      padding: 3px 8px; font-size: 10px; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease;
    }
    .footer-btn:hover {
      background: rgba(61, 242, 255, 0.2); border-color: var(--cyan); color: var(--cyan);
    }
    .brand-text {
      font-weight: 700; color: var(--cyan); letter-spacing: 0.5px;
    }

    /* ALIGNMENT TOOL OVERLAY */
    #alignTool {
      display: none; position: absolute; bottom: 10px; right: 10px; z-index: 9999;
      background: rgba(15, 18, 32, 0.95); border: 1px solid var(--cyan);
      border-radius: 8px; padding: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      font-size: 11px; color: #fff; width: 260px;
    }
    #alignTool.active { display: block; }
    .tool-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .tool-row label { font-weight: bold; color: var(--cyan); }
    .tool-row input { width: 110px; background: #000; color: #fff; border: 1px solid var(--glass-border); border-radius: 4px; padding: 2px 5px; font-size: 11px; }
    .copy-btn {
      width: 100%; padding: 6px; background: var(--cyan); color: #000; font-weight: bold;
      border: none; border-radius: 4px; cursor: pointer; margin-top: 4px;
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header class="popup-header">
    <span class="title">📺 ${title}</span>
    ${isPrivate ? '<button class="align-btn" onclick="toggleAlignTool()">🎯 Adjust Alignment</button>' : ''}
  </header>

  <!-- SCROLLING TICKER -->
  <div class="ticker-wrap">
    <div class="ticker">${tickerText}</div>
  </div>

  <!-- PLAYER VIEWPORT CONTAINER -->
  <div class="crop-viewport-wrapper">
    <!-- LEFT SIDE LOGO -->
    <div class="side-brand left">
      <span class="logo-badge">MSTV</span>
      <span class="logo-sub">LIVE HD</span>
    </div>

    <!-- CENTER IFRAME VIEWPORT -->
    <div class="crop-viewport">
      <iframe id="popFrame" src="${targetUrl}" referrerpolicy="no-referrer" scrolling="no" allowfullscreen></iframe>
    </div>

    <!-- RIGHT SIDE LOGO -->
    <div class="side-brand right">
      <span class="logo-badge">MSTV</span>
      <span class="logo-sub">NETWORK</span>
    </div>

    ${isPrivate ? `
    <!-- ALIGNMENT TUNER PANEL -->
    <div id="alignTool">
      <div class="tool-row">
        <label>Top Shift:</label>
        <input type="text" id="topInput" value="${topShift}">
      </div>
      <div class="tool-row">
        <label>Left Shift:</label>
        <input type="text" id="leftInput" value="${leftShift}">
      </div>
      <div class="tool-row">
        <label>Scale / Zoom:</label>
        <input type="text" id="zoomInput" value="${zoomLevel}">
      </div>
      <button class="copy-btn" onclick="copyConfig()">📋 Copy JSON Config</button>
    </div>` : ''}
  </div>

  <!-- FOOTER BAR -->
  <footer class="popup-footer">
    <div class="status-badge">
      <span class="live-dot"></span>
      <span>LIVE TRANSMISSION</span>
    </div>

    <div class="footer-actions">
      <button class="footer-btn" onclick="reloadStream()">🔄 Reload Stream</button>
      <button class="footer-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
    </div>

    <div class="brand-text">
      MSTV NETWORK
    </div>
  </footer>

  <script>
    const iframe = document.getElementById('popFrame');
    const alignTool = document.getElementById('alignTool');

    function reloadStream() {
      iframe.src = iframe.src;
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert("Fullscreen error: " + err.message));
      } else {
        document.exitFullscreen();
      }
    }

    function toggleAlignTool() {
      if (alignTool) alignTool.classList.toggle('active');
    }

    if (${isPrivate}) {
      const topInput = document.getElementById('topInput');
      const leftInput = document.getElementById('leftInput');
      const zoomInput = document.getElementById('zoomInput');

      function updatePosition() {
        iframe.style.top = topInput.value;
        iframe.style.left = leftInput.value;
        iframe.style.width = zoomInput.value;
        iframe.style.height = zoomInput.value;
      }

      topInput.addEventListener('input', updatePosition);
      leftInput.addEventListener('input', updatePosition);
      zoomInput.addEventListener('input', updatePosition);

      window.copyConfig = function() {
        const configStr = '"cropTop": "' + topInput.value + '", "cropLeft": "' + leftInput.value + '", "cropZoom": "' + zoomInput.value + '"';
        navigator.clipboard.writeText(configStr);
        alert('Copied to clipboard! Update channel in JSON:\\n\\n' + configStr);
      };
    }
  <\/script>
</body>
</html>`;

      mstvPopupWindow.document.open();
      mstvPopupWindow.document.write(popupHtml);
      mstvPopupWindow.document.close();
      mstvPopupWindow.focus();
    }

    // Example execution trigger
    function launchDemoStream() {
      const sampleChannel = {
        name: "Sony TV HD",
        url: "about:blank",
        cropTop: "0px",
        cropLeft: "0px",
        cropZoom: "100%",
        access: "private",
        tickerText: "🔴 Welcome to MSTV Network! Enjoy high definition live streaming."
      };
      openPopUpStream(sampleChannel);
    }
  </script>
</body>
  </html>
