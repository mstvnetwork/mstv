<style>
:root{
  --void:#06070b;--void2:#0a0c14;--panel:#0f1220;--panel2:#151933;
  --glass:rgba(18,22,40,.62);--glass-border:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.06);
  --cyan:#3df2ff;--violet:#8d5cff;--flame:#ff4d6a;
  --live:#33ff9b;--gold:#ffcf5c;
  --ink:#f2f4fb;--dim:#8790ac;--dim2:#535d78;
  --grad-signal:linear-gradient(120deg,var(--cyan),var(--violet));
  --radius-sm:10px;
  --header-h:54px;
  --cat-h:48px;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html, body {
  height: 100%;
  width: 100vw;
  overflow: hidden;
  background: var(--void);
  color: var(--ink);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--panel2);border-radius:3px}
a{color:inherit}
button{font:inherit}

/* ── APP LAYOUT CONTAINER ── */
#appLayout {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 1200px;
  margin: 0 auto;
  overflow: hidden;
}

/* ── HEADER ── */
#header{
  height: var(--header-h);
  flex-shrink: 0;
  background: rgba(6,7,11,.95);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 10px;
}
.logo-mark{display:flex;align-items:center;gap:8px;flex-shrink:0;text-decoration:none}
.logo-icon{
  width:30px;height:30px;border-radius:8px;flex-shrink:0;position:relative;
  background:var(--void2);border:1px solid var(--glass-border);
  display:grid;place-items:center;overflow:hidden;
}
.logo-icon::before{
  content:'';position:absolute;inset:0;background:var(--grad-signal);opacity:.9;
  clip-path:polygon(0 100%,100% 0,100% 100%);
}
.logo-icon svg{position:relative;z-index:1;color:var(--void)}
.logo-text{font-weight:800;font-size:18px;letter-spacing:1px;line-height:1;color:var(--ink)}
.live-badge{
  display:flex;align-items:center;gap:4px;background:rgba(51,255,155,.08);
  border:1px solid rgba(51,255,155,.28);border-radius:12px;padding:3px 8px;
  font-family:var(--font-mono);font-size:9px;font-weight:600;color:var(--live);flex-shrink:0;
}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--live);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.search-wrap{flex:1;max-width:320px;margin:0 auto;position:relative}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}
#searchInput{
  width:100%;height:32px;background:var(--panel);border:1px solid var(--glass-border);
  border-radius:16px;color:var(--ink);font-size:12px;
  padding:0 10px 0 30px;outline:none;
}
#searchInput:focus{border-color:rgba(61,242,255,.5);background:var(--void2)}
#channelCount{font-family:var(--font-mono);font-size:10px;color:var(--dim);flex-shrink:0;white-space:nowrap}

/* ── MAIN CONTENT ── */
#main{
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

/* ── 1. CATEGORY RAIL (PLACED ABOVE MEDIA PLAYER) ── */
#categoryBar{
  height: var(--cat-h);
  flex-shrink: 0;
  background: var(--void2);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 6px;
  overflow-x: auto;
  white-space: nowrap;
  scrollbar-width: none;
}
#categoryBar::-webkit-scrollbar{display:none}
.cat-pill{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:600;padding:5px 11px;border-radius:6px;cursor:pointer;
  border:1px solid var(--glass-border);background:var(--glass);color:var(--dim);
  flex-shrink:0;
}
.cat-pill.active{background:var(--panel2);border-color:var(--cyan);color:var(--ink)}
.cat-pill .cat-n{font-family:var(--font-mono);font-size:9px;opacity:.7}

/* ── 2. MEDIA PLAYER CONTAINER ── */
#playerArea{
  background:#000;
  position:relative;
  width:100%;
  aspect-ratio: 16 / 9;
  max-height: 40vh;
  flex-shrink: 0;
  overflow:hidden;
}

#playerPlaceholder{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:#080a12;z-index:2;
}
.ph-ring{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(61,242,255,.35)}
.ph-title{font-size:14px;font-weight:700;letter-spacing:1px;color:var(--ink)}
.ph-sub{font-size:11px;color:var(--dim)}
#playerPlaceholder.hidden{opacity:0;pointer-events:none}

#httpNotice,#dashNotice{position:absolute;inset:0;z-index:4;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(4,5,9,.95);text-align:center;padding:16px}
#httpNotice.show,#dashNotice.show{display:flex}
.http-title{font-size:15px;color:var(--gold);font-weight:700}
.http-desc{font-size:11px;color:var(--dim);max-width:280px}
.http-btn{display:inline-flex;align-items:center;gap:6px;background:var(--grad-signal);color:var(--void);border:none;border-radius:6px;padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer}

#playerLoader{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(4,5,9,.8);opacity:0;pointer-events:none}
#playerLoader.show{opacity:1;pointer-events:all}
.spinner{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.1);border-top-color:var(--cyan);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#playerError{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(4,5,9,.9);color:var(--dim);font-size:12px}
#playerError.show{display:flex}

#videoEl,#iframeEl{width:100%;height:100%;border:none;display:none;position:absolute;inset:0;z-index:1;background:#000}

/* NOW PLAYING BAR */
#nowPlayingBar{display:none;align-items:center;gap:10px;padding:6px 12px;background:var(--void2);border-bottom:1px solid var(--line);flex-shrink:0}
#nowPlayingBar.visible{display:flex}
.np-logo{width:24px;height:24px;border-radius:4px;object-fit:contain;background:var(--panel)}
.np-name{font-size:12px;font-weight:600;color:var(--ink)}
.np-cat{font-size:10px;color:var(--dim)}

/* ── 3. CHANNEL LIST & SCROLLABLE CONTENT ── */
#listWrap{
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 10px;
}
#listTitle{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;gap:6px}
#listTitle span.count{font-family:var(--font-mono);font-size:10px;color:var(--dim);font-weight:400}

#channelList{display:flex;flex-direction:column;gap:6px}

.channel-row{
  display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--glass-border);
  border-radius:var(--radius-sm);padding:6px 10px;cursor:pointer;
}
.channel-row:hover, .channel-row.active{border-color:var(--cyan);background:var(--void2)}
.row-logo{width:36px;height:36px;border-radius:6px;object-fit:contain;background:var(--panel);flex-shrink:0}
.row-logo-fallback{width:36px;height:36px;border-radius:6px;background:var(--panel);flex-shrink:0;display:grid;place-items:center;font-size:14px;color:var(--dim)}
.row-info{flex:1;min-width:0}
.row-name{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-cat{font-size:10px;color:var(--dim2)}

.empty-state{text-align:center;padding:30px 10px;color:var(--dim);font-size:12px}

/* FOOTER */
#footer{background:var(--void2);border-top:1px solid var(--line);padding:8px 12px;flex-shrink:0;font-size:10px;color:var(--dim);text-align:center}
#updateStatus{display:inline-flex;align-items:center;gap:4px;margin-left:8px}
.update-dot{width:4px;height:4px;border-radius:50%;background:var(--gold)}
</style>
</head>

<div id="appLayout">
  <header id="header">
    <a href="/" class="logo-mark" aria-label="MSTV Network home">
      <div class="logo-icon" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>

    </a>

      <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">

  </main>

  <footer id="footer">
    © 2026 MSTV Live. Sourced from public web. 
    <span id="updateStatus" aria-live="polite">
      <span class="update-dot" aria-hidden="true"></span>
      <span id="updateText">Syncing…</span>
    </span>

</div>

<script>
const JSON_URL        = 'channels2.json';
const POLL_INTERVAL   = 10000;
const SANDBOX_VALUE   = 'allow-scripts allow-same-origin allow-presentation allow-forms';

const CAT_ICONS = {
  'All':'🌐','News':'📰','Entertainment':'🎬','Music':'🎶','Sports':'⚽','Cricket':'🏏',
  'Movies':'🎥','Religious':'🕌','Devotional':'🪔','Punjabi':'🎵','Kids':'🧸',
  'Comedy':'😄','Infotainment':'💡','Regional':'📡'
};
const CAT_ORDER = ['All','News','Entertainment','Movies','Music','Sports','Cricket','Religious','Devotional','Punjabi','Kids','Comedy','Regional','Infotainment'];

let channels          = [];
let filteredChannels  = [];
let currentChannel    = null;
let searchQuery       = '';
let activeCategory    = 'All';
let hlsInstance       = null;
let shakaPlayer       = null;
let shakaReady        = false;
let shakaLoading      = null;
let pollTimer         = null;
let lastJsonHash      = '';
let fetchController   = null;
let initialRenderDone = false;

const $searchInput       = document.getElementById('searchInput');
const $channelList       = document.getElementById('channelList');
const $channelCount      = document.getElementById('channelCount');
const $listCount         = document.getElementById('listCount');
const $listTitleText     = document.getElementById('listTitleText');
const $listTitleIcon     = document.getElementById('listTitleIcon');
const $videoEl           = document.getElementById('videoEl');
const $iframeEl          = document.getElementById('iframeEl');
const $playerPlaceholder = document.getElementById('playerPlaceholder');
const $playerLoader      = document.getElementById('playerLoader');
const $playerError       = document.getElementById('playerError');
const $playerErrorMsg    = document.getElementById('playerErrorMsg');
const $httpNotice        = document.getElementById('httpNotice');
const $httpOpenBtn       = document.getElementById('httpOpenBtn');
const $httpDesc          = document.getElementById('httpDesc');
const $dashNotice        = document.getElementById('dashNotice');
const $dashTitle         = document.getElementById('dashTitle');
const $dashChName        = document.getElementById('dashChName');
const $dashFallbackBlock = document.getElementById('dashFallbackBlock');
const $dashRetryBtn      = document.getElementById('dashRetryBtn');
const $dashCopyBtn       = document.getElementById('dashCopyBtn');
const $dashCopyStatus    = document.getElementById('dashCopyStatus');
const $nowPlayingBar     = document.getElementById('nowPlayingBar');
const $npLogoWrap        = document.getElementById('npLogoWrap');
const $npName            = document.getElementById('npName');
const $npCat             = document.getElementById('npCat');
const $updateText        = document.getElementById('updateText');
const $categoryBar       = document.getElementById('categoryBar');

const chKey  = ch => ch.id || (ch.name + '||' + ch.url);
const toSlug = t  => t.toLowerCase().trim().replace(/[^\w\s-]/g,'').replace(/[\s_|]+/g,'-').replace(/-{2,}/g,'-').replace(/^-|-$/g,'');
const esc    = s  => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const isHttp = u  => /^http:\/\//i.test((u||'').trim());
const catOf  = ch => (ch.category || 'General').trim();

const isIOS = (() => {
  const ua = navigator.userAgent || '';
  return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
})();
const isDashStream = ch => (ch.type||'').toLowerCase() === 'dash' || /\.mpd(\?|$)/i.test(ch.url||'');

function attemptOpenInApp(url, onFail, timeoutMs = 1800) {
  let settled = false;
  const vlcUrl = 'vlc-x-callback://x-callback-url/stream?url=' + encodeURIComponent(url);

  const cleanup = () => {
    document.removeEventListener('visibilitychange', onVis);
    window.removeEventListener('blur', cleanup);
  };
  const onVis = () => { if (document.hidden) { settled = true; cleanup(); } };

  document.addEventListener('visibilitychange', onVis);
  window.addEventListener('blur', cleanup);
  window.location.href = vlcUrl;

  setTimeout(() => { cleanup(); if (!settled) onFail(); }, timeoutMs);
}

function waitForHls() {
  return new Promise(resolve => {
    if (typeof Hls !== 'undefined') { resolve(); return; }
    const check = setInterval(() => { if (typeof Hls !== 'undefined') { clearInterval(check); resolve(); } }, 50);
  });
}
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.crossOrigin = 'anonymous';
    s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}
async function ensureShaka() {
  if (shakaReady) return;
  if (!shakaLoading) {
    shakaLoading = (async () => {
      if (typeof shaka === 'undefined') {
        await loadScript('https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.6/shaka-player.compiled.min.js');
      }
      shaka.polyfill.installAll();
      shakaPlayer = new shaka.Player();
      shakaPlayer.configure({ streaming: { bufferingGoal: 8, rebufferingGoal: 2 } });
      await shakaPlayer.attach($videoEl);
      shakaReady = true;
    })();
  }
  return shakaLoading;
}

async function init() {
  await loadChannels(false);
  startPolling();
  bindEvents();

  const params = new URLSearchParams(window.location.search);
  const chSlug = params.get('ch');
  const qParam = params.get('q');
  const catParam = params.get('cat');

  if (catParam) activeCategory = catParam;
  if (qParam) { $searchInput.value = qParam; searchQuery = qParam; }
  if (qParam || catParam) fullRender();

  if (chSlug && channels.length) {
    const match = channels.find(c => toSlug(c.name) === chSlug);
    if (match) playChannel(match);
  }
}

async function loadChannels(silent) {
  if (fetchController) fetchController.abort();
  fetchController = new AbortController();
  try {
    const res  = await fetch(JSON_URL + '?_=' + Date.now(), { signal: fetchController.signal, cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const hash = simpleHash(text);
    if (hash === lastJsonHash) { updateTimestamp(); return; }
    lastJsonHash = hash;
    let data = JSON.parse(text);
    if (!Array.isArray(data)) data = data.channels || Object.values(data);
    channels = data.filter(c => c && c.name && c.url).map(c => ({ ...c, category: catOf(c) }));
    if (!initialRenderDone) { initialRenderDone = true; fullRender(); }
    else diffRender();
    updateTimestamp();
  } catch (e) {
    if (e.name === 'AbortError') return;
    $updateText.textContent = 'Err';
  }
}
function startPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (!document.hidden) loadChannels(true); }, POLL_INTERVAL);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadChannels(true); });

function updateTimestamp() {
  $updateText.textContent = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
}
function simpleHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (Math.imul(31,h) + str.charCodeAt(i)) | 0;
  return h;
}

function applyFilters() {
  const q = searchQuery.toLowerCase().trim();
  filteredChannels = channels.filter(ch => {
    const nameOk = !q || ch.name.toLowerCase().includes(q);
    const catOk  = activeCategory === 'All' || catOf(ch).toLowerCase() === activeCategory.toLowerCase();
    return nameOk && catOk;
  });
}

function getCategoryCounts() {
  const counts = { All: channels.length };
  channels.forEach(ch => { const c = catOf(ch); counts[c] = (counts[c]||0) + 1; });
  return counts;
}
function getCategoryList() {
  const counts = getCategoryCounts();
  const cats = Object.keys(counts).filter(c => c !== 'All');
  cats.sort((a,b) => {
    const ia = CAT_ORDER.indexOf(a), ib = CAT_ORDER.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
  return ['All', ...cats];
}
function renderCategoryBar() {
  const cats = getCategoryList();
  const counts = getCategoryCounts();
  $categoryBar.innerHTML = cats.map(cat =>
    `<button class="cat-pill${activeCategory===cat?' active':''}" data-cat="${esc(cat)}" role="tab">
      <span>${CAT_ICONS[cat]||'📺'}</span>${esc(cat)}
      <span class="cat-n">${counts[cat]||0}</span>
    </button>`).join('');
  $categoryBar.querySelectorAll('.cat-pill').forEach(btn =>
    btn.addEventListener('click', () => {
      activeCategory = btn.dataset.cat;
      fullRender();
    })
  );
}

function fullRender()  { applyFilters(); renderCategoryBar(); renderList(); updateCounts(); updateTitles(); }
function diffRender() {
  const prevKeys = filteredChannels.map(chKey).join(',');
  applyFilters();
  const nextKeys = filteredChannels.map(chKey).join(',');
  renderCategoryBar();
  if (prevKeys === nextKeys) patchActiveStates();
  else renderList();
  updateCounts(); updateTitles();
}
function patchActiveStates() {
  const activeKey = currentChannel ? chKey(currentChannel) : null;
  document.querySelectorAll('.channel-row').forEach(el => {
    const ch = filteredChannels[+el.dataset.idx];
    el.classList.toggle('active', !!ch && chKey(ch) === activeKey);
  });
}
function updateTitles() {
  $listTitleText.textContent = (activeCategory === 'All' ? 'All Channels' : activeCategory).toUpperCase();
  $listTitleIcon.textContent = CAT_ICONS[activeCategory] || '📺';
}
function renderList() {
  if (!filteredChannels.length) {
    $channelList.innerHTML = `<div class="empty-state"><p>No channels found</p></div>`;
    return;
  }
  const activeKey = currentChannel ? chKey(currentChannel) : null;
  $channelList.innerHTML = filteredChannels.map((ch, i) => {
    const isActive = chKey(ch) === activeKey;
    return `<div class="channel-row${isActive?' active':''}" role="listitem" data-idx="${i}" tabindex="0">
      ${logo(ch, 36, 'row-logo', 'row-logo-fallback')}
      <div class="row-info">
        <div class="row-name">${esc(ch.name)}</div>
        ${activeCategory==='All' ? `<div class="row-cat">${esc(catOf(ch))}</div>` : ''}
      </div>
    </div>`;
  }).join('');
  $channelList.querySelectorAll('.channel-row').forEach(el => {
    const handler = () => playChannel(filteredChannels[+el.dataset.idx]);
    el.addEventListener('click', handler);
    el.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); handler(); } });
  });
}
function updateCounts() {
  const n = filteredChannels.length;
  $channelCount.textContent = n;
  $listCount.textContent    = '(' + n + ')';
}
function logo(ch, size, imgCls, fbCls) {
  const s = `width:${size}px;height:${size}px`;
  return ch.logo
    ? `<img class="${imgCls}" src="${esc(ch.logo)}" alt="${esc(ch.name)}" style="${s}" loading="lazy" decoding="async"
         onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
       <div class="${fbCls}" style="${s};display:none" aria-hidden="true">📺</div>`
    : `<div class="${fbCls}" style="${s}" aria-hidden="true">📺</div>`;
}

async function playChannel(ch) {
  if (!ch) return;
  currentChannel = ch;
  renderList();

  $playerPlaceholder.classList.add('hidden');
  $playerError.classList.remove('show');
  $httpNotice.classList.remove('show');
  $dashNotice.classList.remove('show');
  showLoader(true);

  await teardown();

  const type = (ch.type || '').toLowerCase();

  if (isHttp(ch.url)) {
    showLoader(false);
    $videoEl.style.display  = 'none';
    $iframeEl.style.display = 'none';
    $httpDesc.textContent   = `"${ch.name}" is HTTP. HTTPS pages block direct HTTP.`;
    $httpOpenBtn.onclick = () => window.open(ch.url, '_blank', 'noopener,noreferrer');
    $httpNotice.classList.add('show');
    updateNowPlaying(ch);
    return;
  }

  if (isIOS && isDashStream(ch)) {
    showLoader(false);
    $videoEl.style.display  = 'none';
    $iframeEl.style.display = 'none';
    $dashChName.textContent = ch.name;
    $dashTitle.textContent  = 'Opening Stream App…';
    $dashFallbackBlock.style.display = 'none';
    $dashNotice.classList.add('show');
    updateNowPlaying(ch);

    const revealFallback = () => {
      if (currentChannel !== ch || !$dashNotice.classList.contains('show')) return;
      $dashTitle.textContent = 'App Failed to Launch';
      $dashFallbackBlock.style.display = 'block';
    };

    $dashRetryBtn.onclick = () => attemptOpenInApp(ch.url, revealFallback);
    $dashCopyBtn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(ch.url);
        $dashCopyStatus.textContent = 'Copied Link!';
      } catch {
        $dashCopyStatus.textContent = ch.url;
      }
    };

    attemptOpenInApp(ch.url, revealFallback);
    return;
  }

  if (type === 'iframe') {
    $videoEl.style.display  = 'none';
    $iframeEl.style.display = 'block';
    if (ch.sandboxed !== false) $iframeEl.setAttribute('sandbox', SANDBOX_VALUE);
    else $iframeEl.removeAttribute('sandbox');
    $iframeEl.src     = ch.url;
    $iframeEl.onload  = () => showLoader(false);
    $iframeEl.onerror = () => showError('iFrame Failed.');
  } else if (isDashStream(ch)) {
    $iframeEl.style.display = 'none';
    $videoEl.style.display  = 'block';
    await playDASH(ch.url);
  } else {
    $iframeEl.style.display = 'none';
    $videoEl.style.display  = 'block';
    await playHLS(ch.url);
  }

  updateNowPlaying(ch);
}

async function playHLS(url) {
  await waitForHls();
  if (Hls.isSupported()) {
    hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true, backBufferLength: 15 });
    hlsInstance.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) showError('HLS playback failed.'); });
    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => { showLoader(false); $videoEl.play().catch(()=>{}); });
    hlsInstance.loadSource(url);
    hlsInstance.attachMedia($videoEl);
  } else if ($videoEl.canPlayType('application/vnd.apple.mpegurl')) {
    $videoEl.src = url;
    $videoEl.addEventListener('loadedmetadata', () => { showLoader(false); $videoEl.play().catch(()=>{}); }, { once: true });
    $videoEl.addEventListener('error', () => showError('Stream failed to load.'), { once: true });
  } else {
    showError('HLS not supported on browser.');
  }
}
async function playDASH(url) {
  try {
    await ensureShaka();
    await shakaPlayer.load(url);
    showLoader(false);
    $videoEl.play().catch(()=>{});
  } catch (e) {
    showError('DASH load error.');
  }
}
async function teardown() {
  if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
  if (shakaReady) { try { await shakaPlayer.unload(); } catch {} }
  $videoEl.pause();
  $videoEl.removeAttribute('src');
  $videoEl.load();
  $iframeEl.src = 'about:blank';
  $iframeEl.setAttribute('sandbox', SANDBOX_VALUE);
  $iframeEl.onload  = null;
  $iframeEl.onerror = null;
  $dashNotice.classList.remove('show');
}
function updateNowPlaying(ch) {
  $nowPlayingBar.classList.add('visible');
  $npName.textContent = ch.name;
  $npCat.textContent = catOf(ch);
  $npLogoWrap.innerHTML = ch.logo
    ? `<img class="np-logo" src="${esc(ch.logo)}" alt="${esc(ch.name)}" loading="lazy" decoding="async"
         onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
       <div class="row-logo-fallback" style="display:none;width:24px;height:24px" aria-hidden="true">📺</div>`
    : `<div class="row-logo-fallback" style="width:24px;height:24px" aria-hidden="true">📺</div>`;
}

function showLoader(s) { $playerLoader.classList.toggle('show', s); }
function showError(msg) {
  showLoader(false);
  $playerErrorMsg.textContent = msg || 'Stream failed.';
  $playerError.classList.add('show');
}

function bindEvents() {
  $searchInput.addEventListener('input', e => { searchQuery = e.target.value; fullRender(); });
}

(function() {
  const _open = window.open.bind(window);
  window.open = (url, target, f) => {
    if (target === '_top' || target === '_parent') return null;
    return _open(url, target, f);
  };
})();

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
