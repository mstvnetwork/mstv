<style>
  :root{
    --void:#06070b;--void2:#0a0c14;--panel:#0f1220;--panel2:#151933;
    --glass:rgba(18,22,40,.62);--glass-border:rgba(255,255,255,.08);
    --line:rgba(255,255,255,.06);
    --cyan:#3df2ff;--violet:#8d5cff;--flame:#ff4d6a;
    --live:#33ff9b;--gold:#ffcf5c;
    --ink:#f2f4fb;--dim:#8790ac;--dim2:#535d78;
    --grad-signal:linear-gradient(120deg,var(--cyan),var(--violet));
    --font-sans:'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono:'Courier New', monospace;
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  html, body {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--void);
    color: var(--ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  #app-container {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* ── HEADER ── */
  #header {
    height: 48px;
    min-height: 48px;
    background: rgba(6,7,11,.9);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 10px;
    flex-shrink: 0;
  }
  .logo-mark { display: flex; align-items: center; gap: 8px; text-decoration: none; flex-shrink: 0; }
  .logo-icon {
    width: 28px; height: 28px; border-radius: 6px; background: var(--void2);
    border: 1px solid var(--glass-border); display: grid; place-items: center;
  }
  .logo-text { font-weight: 700; font-size: 16px; letter-spacing: 0.5px; color: var(--ink); }
  .live-badge {
    display: flex; align-items: center; gap: 4px; background: rgba(51,255,155,.08);
    border: 1px solid rgba(51,255,155,.28); border-radius: 12px; padding: 2px 8px;
    font-family: var(--font-mono); font-size: 9px; font-weight: 600; color: var(--live);
  }
  .live-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--live); animation: blink 1.4s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  .search-wrap { flex: 1; max-width: 320px; position: relative; margin-left: auto; }
  #searchInput {
    width: 100%; height: 30px; background: var(--panel); border: 1px solid var(--glass-border);
    border-radius: 15px; color: var(--ink); font-size: 12px; padding: 0 10px 0 28px; outline: none;
  }
  .search-icon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--dim); pointer-events: none; }
  #channelCount { font-family: var(--font-mono); font-size: 10px; color: var(--dim); flex-shrink: 0; }

  /* ── MAIN MIDDLE CONTAINER ── */
  #main-view {
    flex: 1;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    min-height: 0;
    background: #000;
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid var(--line);
  }

  #categoryWrap {
    flex: 0 0 50%;
    width: 50%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--void2);
    border-right: 1px solid var(--line);
    position: relative;
  }

  .scroll-hint-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 4px 12px;
    background: rgba(0,0,0,0.4);
    border-bottom: 1px solid var(--glass-border);
    font-size: 12px;
    font-weight: 700;
    color: var(--cyan);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  #categoryBar {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: auto;
    scrollbar-color: var(--cyan) var(--panel2);
  }

  #categoryBar::-webkit-scrollbar { width: 16px; }
  #categoryBar::-webkit-scrollbar-track { background: var(--panel2); }
  #categoryBar::-webkit-scrollbar-thumb {
    background: var(--cyan); border-radius: 4px; border: 2px solid var(--panel2); box-shadow: 0 0 8px var(--cyan);
  }

  .cat-pill {
    display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700;
    padding: 10px 14px; border-radius: 8px; cursor: pointer; border: 1px solid var(--glass-border);
    background: var(--glass); color: var(--ink); text-align: left; white-space: nowrap; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .cat-pill:hover, .cat-pill.active { background: var(--panel2); border-color: var(--cyan); color: #fff; }
  .cat-pill .cat-n { font-family: var(--font-mono); font-size: 10px; opacity: .8; }

  #playerWrapper {
    flex: 0 0 50%; width: 50%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; position: relative;
  }
  #playerArea { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 100%; background: #000; overflow: hidden; }

  #playerPlaceholder {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; background: radial-gradient(circle, #101426 0%, #06070b 100%); z-index: 2; text-align: center; padding: 10px;
  }
  #playerPlaceholder.hidden { opacity: 0; pointer-events: none; }
  .ph-title { font-weight: 700; font-size: 15px; color: var(--ink); }
  .ph-sub { font-size: 11px; color: var(--dim); margin-top: 4px; }

  #playerLoader { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(0,0,0,.7); opacity: 0; pointer-events: none; }
  #playerLoader.show { opacity: 1; pointer-events: all; }
  .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,.1); border-top-color: var(--cyan); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #playerError { position: absolute; inset: 0; z-index: 6; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,.9); color: var(--dim); font-size: 12px; }
  #playerError.show { display: flex; }

  #videoEl, #iframeEl { width: 100%; height: 100%; border: none; display: none; position: absolute; inset: 0; z-index: 1; background: #000; }

  #nowPlayingBar {
    height: 28px; min-height: 28px; background: var(--void2); border-top: 1px solid var(--line);
    display: none; align-items: center; padding: 0 12px; gap: 8px; font-size: 11px; flex-shrink: 0; width: 100%;
  }
  #nowPlayingBar.visible { display: flex; }
  .np-name { font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-live { margin-left: auto; color: var(--live); font-family: var(--font-mono); font-size: 9px; }

  /* ── BOTTOM CHANNEL RIBBON ── */
  #listWrap { flex-shrink: 0; height: 106px; min-height: 106px; background: var(--void); display: flex; flex-direction: column; width: 100%; overflow: hidden; }
  #channelList { width: 100%; flex: 1; display: flex; flex-direction: row; gap: 8px; overflow-x: auto; overflow-y: hidden; padding: 6px 12px; align-items: center; }

  .channel-row {
    flex: 0 0 150px; height: 68px; background: var(--glass); border: 1px solid var(--glass-border);
    border-radius: 8px; padding: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all .15s;
  }
  .channel-row:hover, .channel-row.active { border-color: var(--cyan); background: var(--panel); transform: translateY(-2px); }
  .row-logo { width: 36px; height: 36px; border-radius: 6px; object-fit: contain; background: var(--panel); flex-shrink: 0; }
  .row-logo-fallback { width: 36px; height: 36px; border-radius: 6px; background: var(--panel); display: grid; place-items: center; font-size: 14px; flex-shrink: 0; }
  .row-info { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .row-name { font-size: 11px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-cat { font-size: 9px; color: var(--dim2); }

  #footer { background: rgba(8,10,15,0.98); border-top: 1px solid var(--line); padding: 8px 16px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; flex-shrink: 0; }
  .footer-top { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; width: 100%; }
  .footer-brand { font-size: 14px; font-weight: 700; letter-spacing: 1.5px; color: var(--cyan); }
  .footer-copy { font-size: 11px; color: var(--dim); }
  .footer-stat { font-family: var(--font-mono); font-size: 10px; color: var(--dim); }
  .footer-disclaimer { font-size: 9.5px; color: var(--dim); line-height: 1.3; text-align: center; max-width: 900px; margin: 0 auto; }

  @media(max-width: 650px) {
    #header { padding: 0 8px; }
    #main-view { flex-direction: column; }
    #categoryWrap { flex: 0 0 38%; width: 100%; height: 38%; border-right: none; border-bottom: 1px solid var(--line); }
    #playerWrapper { flex: 1; width: 100%; height: 62%; }
    .channel-row { flex: 0 0 135px; }
  }
</style>
</head>
<body>

<div id="app-container">
  
  <header id="header">
    <a href="/" class="logo-mark">
      <div class="logo-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="#3df2ff"><path d="M8 5v14l11-7z"/></svg></div>
      <div class="logo-text">MSTV</div>
    </a>
    <div class="live-badge"><span class="live-dot"></span>LIVE</div>
    
    <div class="search-wrap">
      <svg class="search-icon" width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="search" placeholder="Search channels..." autocomplete="off" spellcheck="false">
    </div>
    <span id="channelCount">—</span>
  </header>

  <main id="main-view">
    <div id="categoryWrap">
      <div class="scroll-hint-bar"><span>SCROLL ↕️</span></div>
      <nav id="categoryBar" role="tablist"></nav>
    </div>

    <div id="playerWrapper">
      <div id="playerArea">
        <div id="playerPlaceholder">
          <div class="ph-title">CLICK ON CHANNEL LOGO TO PLAY</div>
          <div class="ph-sub">Choose Category of your choice from top & enjoy!</div>
        </div>

        <div id="playerLoader"><div class="spinner"></div></div>
        <div id="playerError"><p id="playerErrorMsg">Stream error</p></div>

        <video id="videoEl" controls playsinline preload="none"></video>
        <iframe id="iframeEl" allow="autoplay; fullscreen; encrypted-media" allowfullscreen title="Stream player"></iframe>
      </div>
    </div>
  </main>

  <div id="nowPlayingBar">
    <div class="np-name" id="npName">—</div>
    <div class="np-live">● LIVE</div>
  </div>

  <section id="listWrap">
    <div class="scroll-hint-bar"><span>SCROLL ↔️</span></div>
    <div id="channelList"></div>
  </section>

  <footer id="footer">
      <div class="footer-top">
          <span class="footer-brand">MSTV</span>
          <span class="footer-copy">© 2026 MSTV Live Network.</span>
          <div class="footer-stat"><strong id="footerCount">—</strong></div>
      </div>
      <div class="footer-disclaimer">
        <strong>⚠ Disclaimer:</strong> All content displayed on MSTV is sourced exclusively from streams available publicly on the internet.
      </div>
  </footer>
</div>

<script>
const SECRET_KEY = "588da2fe1811a0f130f72f68400d0d3a";
const WORKER_BASE = "https://mstv.ghubtv1.workers.dev";
const JSON_URL = './streamdata2.json';

let channels = [], filteredChannels = [], currentChannel = null;
let searchQuery = '', activeCategory = 'All', hlsInstance = null;

const $searchInput = document.getElementById('searchInput');
const $channelList = document.getElementById('channelList');
const $channelCount = document.getElementById('channelCount');
const $footerCount = document.getElementById('footerCount');
const $categoryBar = document.getElementById('categoryBar');
const $videoEl = document.getElementById('videoEl');
const $iframeEl = document.getElementById('iframeEl');
const $playerPlaceholder = document.getElementById('playerPlaceholder');
const $playerLoader = document.getElementById('playerLoader');
const $playerError = document.getElementById('playerError');
const $playerErrorMsg = document.getElementById('playerErrorMsg');
const $nowPlayingBar = document.getElementById('nowPlayingBar');
const $npName = document.getElementById('npName');

const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// Native browser HMAC generator for security verification
async function createBrowserHmac(message, secret) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey(
    "raw", enc.encode(secret),
    { name: "HMAC", hash: "SHA-256" },
    false, ["sign"]
  );
  const signature = await crypto.subtle.sign("HMAC", key, enc.encode(message));
  return Array.from(new Uint8Array(signature)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function getSignedWorkerUrl(id, isIframe = true) {
  const expires = Date.now() + (10 * 60 * 1000); 
  const verificationString = `${id}|${expires}`;
  const token = await createBrowserHmac(verificationString, SECRET_KEY);
  const route = isIframe ? 'iframe' : 'hls';
  return `${WORKER_BASE}/${route}/${id}?token=${token}&expires=${expires}`;
}

async function init() {
  try {
    const res = await fetch(`${JSON_URL}?nocache=${Date.now()}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    channels = await res.json();
    fullRender();
    bindEvents();
  } catch (e) {
    console.error("Failed to load channel mapping:", e);
  }
}

function fullRender() {
  const q = searchQuery.toLowerCase().trim();
  filteredChannels = channels.filter(ch => {
    const nameOk = !q || ch.name.toLowerCase().includes(q);
    const catOk  = activeCategory === 'All' || (ch.category||'General').toLowerCase() === activeCategory.toLowerCase();
    return nameOk && catOk;
  });

  renderCategoryBar();
  renderList();
  $channelCount.textContent = filteredChannels.length + ' Channels';
  $footerCount.textContent = channels.length + ' Total Channels';
}

function renderCategoryBar() {
  const counts = { All: channels.length };
  channels.forEach(ch => { 
    const c = ch.category || 'General'; 
    counts[c] = (counts[c]||0) + 1; 
  });

  const categories = Object.keys(counts);
  $categoryBar.innerHTML = categories.map(cat => {
    const isActive = activeCategory.toLowerCase() === cat.toLowerCase();
    return `<button class="cat-pill${isActive?' active':''}" data-cat="${esc(cat)}">
      <span>📺 ${esc(cat)}</span> <span class="cat-n">(${counts[cat]})</span>
    </button>`;
  }).join('');

  $categoryBar.querySelectorAll('.cat-pill').forEach(btn => {
    btn.onclick = () => { activeCategory = btn.dataset.cat; fullRender(); };
  });
}

function renderList() {
  if (!filteredChannels.length) {
    $channelList.innerHTML = `<div style="padding:10px; font-size:12px; color:var(--dim)">No channels found</div>`;
    return;
  }

  $channelList.innerHTML = filteredChannels.map((ch, i) => {
    const isActive = currentChannel && currentChannel.id === ch.id;
    return `<div class="channel-row${isActive?' active':''}" data-idx="${i}">
      <img class="row-logo" src="${esc(ch.logo)}" onerror="this.src='https://via.placeholder.com/36'">
      <div class="row-info">
        <div class="row-name">${esc(ch.name)}</div>
        <div class="row-cat">${esc(ch.category||'General')}</div>
      </div>
    </div>`;
  }).join('');

  $channelList.querySelectorAll('.channel-row').forEach(el => {
    el.onclick = () => playChannel(filteredChannels[+el.dataset.idx]);
  });
}

async function playChannel(ch) {
  currentChannel = ch;
  renderList();

  $playerPlaceholder.classList.add('hidden');
  $playerError.classList.remove('show');
  $playerLoader.classList.add('show');

  if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
  $videoEl.pause(); $videoEl.style.display = 'none';
  $iframeEl.src = 'about:blank'; $iframeEl.style.display = 'none';

  const isIframe = ch.type === 'iframe' || !ch.type;
  const targetUrl = await getSignedWorkerUrl(ch.id, isIframe);

  if (isIframe) {
    $iframeEl.style.display = 'block';
    $iframeEl.src = targetUrl;
    $iframeEl.onload = () => $playerLoader.classList.remove('show');
  } else {
    $videoEl.style.display = 'block';
    if (Hls.isSupported()) {
      hlsInstance = new Hls();
      hlsInstance.loadSource(targetUrl);
      hlsInstance.attachMedia($videoEl);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
        $playerLoader.classList.remove('show');
        $videoEl.play();
      });
    } else if ($videoEl.canPlayType('application/vnd.apple.mpegurl')) {
      $videoEl.src = targetUrl;
      $videoEl.play();
      $playerLoader.classList.remove('show');
    }
  }

  $nowPlayingBar.classList.add('visible');
  $npName.textContent = ch.name;
}

function bindEvents() {
  $searchInput.oninput = (e) => { searchQuery = e.target.value; fullRender(); };
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
