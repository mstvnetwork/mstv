<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MSTV Network | Free Live TV Channels</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">

<!-- Include HLS and DASH Libraries -->
<script defer src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script defer src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

<style>
  :root{
    --void:#06070b;--void2:#0a0c14;--panel:#0f1220;--panel2:#151933;
    --glass:rgba(18,22,40,.62);--glass-border:rgba(255,255,255,.08);
    --line:rgba(255,255,255,.06);--cyan:#3df2ff;--violet:#8d5cff;
    --live:#33ff9b;--ink:#f2f4fb;--dim:#8790ac;--dim2:#535d78;
    --font-sans:'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono:'Courier New', monospace;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--void); color: var(--ink); font-family: var(--font-sans); }
  #app-container { display: flex; flex-direction: column; width: 100%; height: 100%; max-width: 1400px; margin: 0 auto; }
  #header { height: 48px; background: rgba(6,7,11,.9); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 12px; gap: 10px; flex-shrink: 0; }
  .logo-mark { display: flex; align-items: center; gap: 8px; text-decoration: none; }
  .logo-icon { width: 28px; height: 28px; border-radius: 6px; background: var(--void2); border: 1px solid var(--glass-border); display: grid; place-items: center; }
  .logo-text { font-weight: 700; font-size: 16px; color: var(--ink); }
  .live-badge { display: flex; align-items: center; gap: 4px; background: rgba(51,255,155,.08); border: 1px solid rgba(51,255,155,.28); border-radius: 12px; padding: 2px 8px; font-family: var(--font-mono); font-size: 9px; color: var(--live); }
  .live-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--live); animation: blink 1.4s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  .search-wrap { flex: 1; max-width: 320px; position: relative; margin-left: auto; }
  #searchInput { width: 100%; height: 30px; background: var(--panel); border: 1px solid var(--glass-border); border-radius: 15px; color: var(--ink); font-size: 12px; padding: 0 10px; outline: none; }
  #channelCount { font-family: var(--font-mono); font-size: 10px; color: var(--dim); }
  #main-view { flex: 1; display: flex; flex-direction: row; min-height: 0; background: #000; position: relative; border-bottom: 1px solid var(--line); }
  #categoryWrap { flex: 0 0 50%; width: 50%; height: 100%; display: flex; flex-direction: column; background: var(--void2); border-right: 1px solid var(--line); }
  .scroll-hint-bar { display: flex; align-items: center; justify-content: center; padding: 4px 12px; background: rgba(0,0,0,0.4); border-bottom: 1px solid var(--glass-border); font-size: 12px; font-weight: 700; color: var(--cyan); }
  #categoryBar { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 12px; overflow-y: auto; }
  .cat-pill { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; padding: 10px 14px; border-radius: 8px; cursor: pointer; border: 1px solid var(--glass-border); background: var(--glass); color: var(--ink); }
  .cat-pill:hover, .cat-pill.active { background: var(--panel2); border-color: var(--cyan); color: #fff; }
  #playerWrapper { flex: 0 0 50%; width: 50%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; position: relative; }
  #playerArea { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 100%; background: #000; overflow: hidden; }
  #playerPlaceholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, #101426 0%, #06070b 100%); z-index: 2; text-align: center; }
  #playerPlaceholder.hidden { opacity: 0; pointer-events: none; }
  #playerLoader { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(0,0,0,.7); opacity: 0; pointer-events: none; }
  #playerLoader.show { opacity: 1; pointer-events: all; }
  .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,.1); border-top-color: var(--cyan); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #videoEl, #iframeEl { width: 100%; height: 100%; border: none; display: none; position: absolute; inset: 0; z-index: 1; background: #000; }
  #nowPlayingBar { height: 28px; background: var(--void2); border-top: 1px solid var(--line); display: none; align-items: center; padding: 0 12px; font-size: 11px; }
  #nowPlayingBar.visible { display: flex; }
  #listWrap { height: 106px; background: var(--void); display: flex; flex-direction: column; width: 100%; }
  #channelList { width: 100%; flex: 1; display: flex; gap: 8px; overflow-x: auto; padding: 6px 12px; align-items: center; }
  .channel-row { flex: 0 0 150px; height: 68px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 8px; padding: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .channel-row:hover, .channel-row.active { border-color: var(--cyan); background: var(--panel); }
  .row-logo { width: 36px; height: 36px; border-radius: 6px; object-fit: contain; background: var(--panel); }
  .row-info { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .row-name { font-size: 11px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-cat { font-size: 9px; color: var(--dim2); }
  #footer { background: rgba(8,10,15,0.98); border-top: 1px solid var(--line); padding: 8px 16px; text-align: center; font-size: 11px; color: var(--dim); }
</style>
</head>
<body>

<div id="app-container">
  <header id="header">
    <a href="/" class="logo-mark">
      <div class="logo-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="#3df2ff"><path d="M8 5v14l11-7z"/></svg></div>
      <div class="logo-text">MSTV</div>
    </a>
    <div class="live-badge"><span class="live-dot"></span>LIVE</div>
    <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="Search channels..." autocomplete="off">
    </div>
    <span id="channelCount">—</span>
  </header>

  <main id="main-view">
    <div id="categoryWrap">
      <div class="scroll-hint-bar"><span>CATEGORIES</span></div>
      <nav id="categoryBar"></nav>
    </div>

    <div id="playerWrapper">
      <div id="playerArea">
        <div id="playerPlaceholder">
          <div style="font-weight:700; font-size:15px; color:var(--ink);">SELECT A CHANNEL</div>
        </div>
        <div id="playerLoader"><div class="spinner"></div></div>
        <video id="videoEl" controls playsinline></video>
        <iframe id="iframeEl" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>
      </div>
    </div>
  </main>

  <div id="nowPlayingBar"><div id="npName">—</div></div>

  <section id="listWrap">
    <div class="scroll-hint-bar"><span>CHANNELS</span></div>
    <div id="channelList"></div>
  </section>

  <footer id="footer">© 2026 MSTV Network</footer>
</div>

<script>
const SECRET_KEY = "588da2fe1811a0f130f72f68400d0d3a";
const WORKER_BASE = "https://mstv.ghubtv1.workers.dev";
const JSON_URL = './streamdata2.json';

// Inline fallback SVG to resolve via.placeholder.com ERR_CONNECTION_CLOSED
const FALLBACK_LOGO = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36' viewBox='0 0 36 36'><rect width='36' height='36' fill='%230f1220'/><text x='50%' y='50%' font-size='12' fill='%238790ac' dominant-baseline='middle' text-anchor='middle'>TV</text></svg>";

let channels = [], filteredChannels = [], currentChannel = null;
let searchQuery = '', activeCategory = 'All', hlsInstance = null, dashInstance = null;

const $searchInput = document.getElementById('searchInput');
const $channelList = document.getElementById('channelList');
const $channelCount = document.getElementById('channelCount');
const $categoryBar = document.getElementById('categoryBar');
const $videoEl = document.getElementById('videoEl');
const $iframeEl = document.getElementById('iframeEl');
const $playerPlaceholder = document.getElementById('playerPlaceholder');
const $playerLoader = document.getElementById('playerLoader');
const $nowPlayingBar = document.getElementById('nowPlayingBar');
const $npName = document.getElementById('npName');

const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

async function createBrowserHmac(message, secret) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(secret), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const signature = await crypto.subtle.sign("HMAC", key, enc.encode(message));
  return Array.from(new Uint8Array(signature)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function getSignedWorkerUrl(id, route = 'iframe') {
  const expires = Date.now() + (10 * 60 * 1000); 
  const verificationString = `${id}|${expires}`;
  const token = await createBrowserHmac(verificationString, SECRET_KEY);
  return `${WORKER_BASE}/${route}/${id}?token=${token}&expires=${expires}`;
}

async function init() {
  try {
    const res = await fetch(`${JSON_URL}?nocache=${Date.now()}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    channels = await res.json();
    fullRender();
    bindEvents();
  } catch (e) {
    console.error("Failed to load channels:", e);
  }
}

function fullRender() {
  const q = searchQuery.toLowerCase().trim();
  filteredChannels = channels.filter(ch => {
    const nameOk = !q || ch.name.toLowerCase().includes(q);
    const catOk  = activeCategory === 'All' || (ch.category||'General').toLowerCase() === activeCategory.toLowerCase();
    return nameOk && catOk;
  });
  renderCategoryBar();
  renderList();
  $channelCount.textContent = filteredChannels.length + ' Channels';
}

function renderCategoryBar() {
  const counts = { All: channels.length };
  channels.forEach(ch => { 
    const c = ch.category || 'General'; 
    counts[c] = (counts[c]||0) + 1; 
  });

  $categoryBar.innerHTML = Object.keys(counts).map(cat => {
    const isActive = activeCategory.toLowerCase() === cat.toLowerCase();
    return `<button class="cat-pill${isActive?' active':''}" data-cat="${esc(cat)}">
      <span>📺 ${esc(cat)}</span> <span>(${counts[cat]})</span>
    </button>`;
  }).join('');

  $categoryBar.querySelectorAll('.cat-pill').forEach(btn => {
    btn.onclick = () => { activeCategory = btn.dataset.cat; fullRender(); };
  });
}

function renderList() {
  if (!filteredChannels.length) {
    $channelList.innerHTML = `<div style="padding:10px; font-size:12px; color:var(--dim)">No channels found</div>`;
    return;
  }

  $channelList.innerHTML = filteredChannels.map((ch, i) => {
    const isActive = currentChannel && currentChannel.id === ch.id;
    return `<div class="channel-row${isActive?' active':''}" data-idx="${i}">
      <img class="row-logo" src="${esc(ch.logo)}" onerror="this.onerror=null; this.src='${FALLBACK_LOGO}';">
      <div class="row-info">
        <div class="row-name">${esc(ch.name)}</div>
        <div class="row-cat">${esc(ch.category||'General')}</div>
      </div>
    </div>`;
  }).join('');

  $channelList.querySelectorAll('.channel-row').forEach(el => {
    el.onclick = () => playChannel(filteredChannels[+el.dataset.idx]);
  });
}

async function playChannel(ch) {
  currentChannel = ch;
  renderList();

  $playerPlaceholder.classList.add('hidden');
  $playerLoader.classList.add('show');

  // Clean up previous video instances
  if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
  if (dashInstance) { dashInstance.reset(); dashInstance = null; }

  $videoEl.pause(); $videoEl.style.display = 'none';
  $iframeEl.src = 'about:blank'; $iframeEl.style.display = 'none';

  const streamType = (ch.type || 'iframe').toLowerCase();

  if (streamType === 'dash') {
    // Play DASH streams inside native video element
    $videoEl.style.display = 'block';
    const targetUrl = await getSignedWorkerUrl(ch.id, 'dash');

    if (window.dashjs) {
      dashInstance = dashjs.MediaPlayer().create();
      dashInstance.initialize($videoEl, targetUrl, true);
      dashInstance.on(dashjs.MediaPlayer.events.CAN_PLAY, () => {
        $playerLoader.classList.remove('show');
      });
    } else {
      console.error("DASH library not loaded");
      $playerLoader.classList.remove('show');
    }
  } else if (streamType === 'hls') {
    // Play HLS streams inside native video element
    $videoEl.style.display = 'block';
    const targetUrl = await getSignedWorkerUrl(ch.id, 'hls');

    if (Hls.isSupported()) {
      hlsInstance = new Hls();
      hlsInstance.loadSource(targetUrl);
      hlsInstance.attachMedia($videoEl);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
        $playerLoader.classList.remove('show');
        $videoEl.play();
      });
    } else if ($videoEl.canPlayType('application/vnd.apple.mpegurl')) {
      $videoEl.src = targetUrl;
      $videoEl.play();
      $playerLoader.classList.remove('show');
    }
  } else {
    // Fallback: Embed external target iframe
    $iframeEl.style.display = 'block';
    const targetUrl = await getSignedWorkerUrl(ch.id, 'iframe');
    $iframeEl.src = targetUrl;
    $iframeEl.onload = () => $playerLoader.classList.remove('show');
  }

  $nowPlayingBar.classList.add('visible');
  $npName.textContent = ch.name;
}

function bindEvents() {
  $searchInput.oninput = (e) => { searchQuery = e.target.value; fullRender(); };
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
