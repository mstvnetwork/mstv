<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto-Detect Stream Player</title>
  
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background: #000; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #player-container { 
      width: 100%; 
      height: 100%; 
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    iframe, video { 
      width: 100%; 
      height: 100%; 
      border: none; 
      background: #000;
    }
    .error-msg {
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    /* 🌟 SLEEK BRIGHT YELLOW LOADING OVERLAY */
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    
    /* Modern minimalist spinner ring */
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 235, 59, 0.1);
      border-radius: 50%;
      border-top-color: #FFEB3B; /* Bright Yellow */
      animation: spin 0.8s linear infinite;
      box-shadow: 0 0 15px rgba(255, 235, 59, 0.2);
    }

    /* Sleek text underneath */
    .loading-text {
      color: #FFEB3B;
      margin-top: 16px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Smooth fade-out utility class */
    .hide-loader {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  
  <!-- Hls.js library for streaming M3U8 links -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
</head>
<body>

  <div id="player-container">
    <!-- The Loader Interface Component -->
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-text">Please Wait.....</div>
    </div>
  </div>

  <script>
    const channels = {
      "1":"https://playztv-apps.pages.dev/willow/index.m3u8",
      "2":"https://playztv-apps.pages.dev/willow/index.m3u8",
      "3":"https://rpn3.bozztv.com/dvrfl07/ushba-t4/playlist.m3u8",
      "4":"https://tvsen5.aynaott.com/willowhd/tracks-v1a1/mono.ts.m3u8?e=1779789794&token=be1654d55ddb19b71dd06cd87fc89658&u=ee5437a7-c16b-4700-b317-a41b77d5cba9",
      "5":"https://tvsen7.aynaott.com/sspts1/tracks-v1a1/mono.ts.m3u8",
      "6":"https://one.superover1.top/hembedplayer/webcrict10/6/850/480",
      "7":"https://pooembed.eu/embed/ipl/2026-05-27/rr-srh",
      "8":"https://prod-runn.cdn.runn.tv/shemaroo/stream/smrfgn/manifest/5.m3u8",
      "9":"https://tvsen7.aynaott.com/sspts1/tracks-v1a1/mono.ts.m3u8",
     "10":"/shaka/index?ch=1"
      
    };

    const urlParams = new URLSearchParams(window.location.search);
    const channelId = urlParams.get('ch');
    const container = document.getElementById('player-container');
    const loader = document.getElementById('loading-overlay');

    // Utility function to seamlessly dismiss the loader
    function hideLoader() {
      loader.classList.add('hide-loader');
    }

    if (channelId && channels[channelId]) {
      const streamUrl = channels[channelId];
      const isM3U8 = streamUrl.split('?')[0].toLowerCase().endsWith('.m3u8') || streamUrl.toLowerCase().includes('.m3u8');

      if (isM3U8) {
        const video = document.createElement('video');
        video.controls = true;
        video.autoplay = true;
        video.muted = true; // Essential to let mobile Chrome play instantly
        video.setAttribute('playsinline', '');
        container.appendChild(video);

        // Hls.js execution architecture
        if (Hls.isSupported()) {
          const hls = new Hls({ lowLatencyMode: true });
          hls.loadSource(streamUrl);
          hls.attachMedia(video);
          
          // Hide loader when the video pipeline actually decodes the first frame
          video.addEventListener('playing', hideLoader);
          
          // Safety fallback: hide loader if metadata loads completely but stream starts paused
          video.addEventListener('loadedmetadata', () => {
            setTimeout(hideLoader, 1000); 
          });

          hls.on(Hls.Events.ERROR, function(event, data) {
            if (data.fatal) {
              hideLoader(); // Make sure error screens aren't hidden by loader
              container.innerHTML = `<div class="error-msg"><h2>Playback Failure</h2></div>`;
            }
          });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = streamUrl;
          video.addEventListener('playing', hideLoader);
        }

      } else {
        // Iframe Execution Architecture
        const iframe = document.createElement('iframe');
        iframe.src = streamUrl;
        iframe.allow = "autoplay; encrypted-media; picture-in-picture";
        iframe.setAttribute('allowfullscreen', '');
        container.appendChild(iframe);

        // Hide loader instantly when the iframe external web document loads
        iframe.addEventListener('load', hideLoader);
      }

    } else {
      hideLoader();
      container.innerHTML = `<div class="error-msg"><h2>Invalid Channel ID</h2><p>Please use a valid ID (e.g., ?ch=1)</p></div>`;
    }
  </script>
</body>
</html>
