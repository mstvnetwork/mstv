<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto-Detect Stream Player</title>
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background: #000; 
      font-family: sans-serif;
    }
    #player-container { 
      width: 100%; 
      height: 100%; 
      display: flex;
      justify-content: center;
      align-items: center;
    }
    iframe, video { 
      width: 100%; 
      height: 100%; 
      border: none; 
      background: #000;
    }
    .error-msg {
      color: #fff;
      text-align: center;
      padding: 20px;
    }
  </style>
  <!-- Using Hls.js library for superior mobile Chrome playback -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
</head>
<body>

  <div id="player-container"></div>

  <script>
    const channels = {
      "1": "https://embedsports.top/embed/admin/admin-willow-cricket/2",
      "2": "https://fomis.phantemlis.top/premium65/index.m3u8?md5v1=guf0iHtpfmYR47edT5sbKQ&md5v2=9A-_kwAKgYUMid5SwlFv_A&expires=1779636566"
    };

    const urlParams = new URLSearchParams(window.location.search);
    const channelId = urlParams.get('ch');
    const container = document.getElementById('player-container');

    if (channelId && channels[channelId]) {
      const streamUrl = channels[channelId];

      // Safe URL string processing to prevent crashes
      const cleanUrl = streamUrl.split('?')[0].toLowerCase();
      const isM3U8 = cleanUrl.endsWith('.m3u8') || streamUrl.toLowerCase().includes('.m3u8');

      if (isM3U8) {
        // Build Native HTML5 Video Element
        const video = document.createElement('video');
        video.controls = true;
        video.autoplay = true;
        video.muted = true; // Auto-play requires muting on mobile Chrome
        video.playsInline = true; 
        container.appendChild(video);

        // Check if browser supports Hls.js (Like Mobile Chrome)
        if (Hls.isSupported()) {
          const hls = new Hls({
            maxPixelRatio: 1,
            lowLatencyMode: true
          });
          hls.loadSource(streamUrl);
          hls.attachMedia(video);
          
          hls.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) {
              console.error("HLS Error:", data);
              if(data.details === "manifestLoadTimeOut" || data.details === "levelLoadError") {
                container.innerHTML = `<div class="error-msg"><h2>Stream blocked by CORS policy or Token Expiry in Chrome</h2></div>`;
              }
            }
          });
        } 
        // Android Safari / Native HLS Fallback
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = streamUrl;
        }

      } else {
        // Fallback to Iframe Player
        const iframe = document.createElement('iframe');
        iframe.src = streamUrl;
        iframe.allow = "autoplay; encrypted-media; picture-in-picture";
        iframe.allowFullscreen = true;
        container.appendChild(iframe);
      }

    } else {
      container.innerHTML = `<div class="error-msg"><h2>Invalid Channel ID</h2><p>Please use a valid ID (e.g., ?ch=1)</p></div>`;
    }
  </script>
</body>
</html>
