<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct HLS Stream Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .player-container {
            width: 80%;
            max-width: 800px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            display: block;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h2>Direct HLS Test Player (No Proxy)</h2>

    <div class="player-container">
        <video id="videoPlayer" controls autoplay muted crossorigin="anonymous"></video>
    </div>

    <div class="status" id="statusMessage">Initializing direct connection...</div>

    <!-- Include Hls.js library via CDN -->
    <script src="https://jsdelivr.net"></script>

    <script>
        // 1. Enter your streaming domain here (include http:// or https://)
        // If this HTML file is hosted on the SAME server as the stream, leave it empty: ""
        const targetDomain = "https://your-stream-domain.com"; 
        const streamPath = "/sliv/stream.m3u8?id=1000009246&e=.m3u8";

        // Combine to form the direct absolute URL
        const streamURL = targetDomain + streamPath;

        const video = document.getElementById('videoPlayer');
        const status = document.getElementById('statusMessage');

        if (Hls.isSupported()) {
            status.textContent = "Connecting directly via Hls.js...";
            const hls = new Hls();
            
            hls.loadSource(streamURL);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                status.textContent = "Stream connected successfully.";
                video.play().catch(() => {
                    status.textContent = "Autoplay prevented. Please press Play.";
                });
            });

            hls.on(Hls.Events.ERROR, function(event, data) {
                if (data.fatal) {
                    status.textContent = `Connection failed: ${data.details}. Open browser console (F12) for details.`;
                    console.error("Fatal HLS Error:", data);
                }
            });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            status.textContent = "Connecting via native browser engine...";
            video.src = streamURL;
            video.addEventListener('loadedmetadata', function() {
                status.textContent = "Playing natively.";
                video.play();
            });
        } 
        else {
            status.textContent = "HLS streaming is not supported by this browser.";
        }
    </script>

</body>
</html>
