<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto-Detect Stream Player</title>
  
  <!-- Video.js styles for M3U8 playback -->
  <link href="https://zencdn.net" rel="stylesheet" />
  
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background: #000; 
      font-family: sans-serif;
    }
    #player-container { 
      width: 100%; 
      height: 100%; 
      display: flex;
      justify-content: center;
      align-items: center;
    }
    iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
    }
    .video-js { 
      width: 100% !important; 
      height: 100% !important; 
    }
    .error-msg {
      color: #fff;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div id="player-container"></div>

  <!-- Video.js Script library -->
  <script src="https://zencdn.net"></script>

  <script>
    // 1. Paste your clean key-value channel pairs here
    const channels = {
      "1": "https://fomis.phantemlis.top/premium65/index.m3u8?md5v1=guf0iHtpfmYR47edT5sbKQ&md5v2=9A-_kwAKgYUMid5SwlFv_A&expires=1779636566",
      "2": "https://embedsports.top/embed/admin/admin-willow-cricket/2",
      "3": ""
    };

    // 2. Read "?ch=" parameter from the URL address
    const urlParams = new URLSearchParams(window.location.search);
    const channelId = urlParams.get('ch');
    const container = document.getElementById('player-container');

    // 3. Auto-detection engine and stream launcher
    if (channelId && channels[channelId]) {
      const streamUrl = channels[channelId];

      // Auto-detect: check if the URL contains ".m3u8" before any query parameters
      const isM3U8 = streamUrl.split('?')[0].toLowerCase().endsWith('.m3u8');

      if (isM3U8) {
        // Launch M3U8 HLS Player
        const video = document.createElement('video');
        video.id = 'vjs-player';
        video.className = 'video-js vjs-default-skin vjs-big-play-centered';
        video.controls = true;
        video.preload = 'auto';

        const source = document.createElement('source');
        source.src = streamUrl;
        source.type = 'application/x-mpegURL';

        video.appendChild(source);
        container.appendChild(video);

        // Initialise HLS engine
        videojs('vjs-player', {
          autoplay: true,
          fluid: false
        });

      } else {
        // Fallback: Launch Iframe Player
        const iframe = document.createElement('iframe');
        iframe.src = streamUrl;
        iframe.allow = "autoplay; encrypted-media; picture-in-picture";
        iframe.allowFullscreen = true;
        container.appendChild(iframe);
      }

    } else {
      // Error handling for missing or wrong IDs
      container.innerHTML = `<div class="error-msg"><h2>Invalid Channel ID</h2><p>Please use a valid ID (e.g., ?ch=1)</p></div>`;
    }
  </script>
</body>
</html>
