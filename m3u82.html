<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TV Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        .container {
            width: 100%;
            max-width: 900px;
            padding: 10px;
        }
        video {
            width: 100%;
            aspect-ratio: 16/9;
            background: #111;
            border-radius: 8px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div class="container">
        <video id="video" controls autoplay muted playsinline></video>
    </div>

    <script>
        const video = document.getElementById('video');
        
        // Your live stream URL from Render
        const streamUrl = 'https://mstv.onrender.com/live/1000009247.m3u8';

        if (Hls.isSupported()) {
            const hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                manifestLoadingTimeOut: 20000,
                manifestLoadingMaxRetry: 5
            });

            hls.loadSource(streamUrl);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(e => {
                    console.log("Autoplay blocked. Tap video screen to un-mute and play.");
                });
            });

            // Automatic error recovery for stream delays
            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            console.log("Network glitch, reconnecting to Render...");
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            console.log("Media error, recovering...");
                            hls.recoverMediaError();
                            break;
                        default:
                            hls.destroy();
                            break;
                    }
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Safari / iOS Fallback
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', () => {
                video.play().catch(e => {});
            });
        }
    </script>
</body>
</html>
