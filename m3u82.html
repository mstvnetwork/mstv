<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream Player</title>

    <!-- 1. DO NOT REMOVE THIS LINE: Loads the HLS Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .player-container {
            width: 100%;
            max-width: 960px;
            padding: 10px;
        }
        video {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Video Element -->
        <video id="video" controls muted playsinline></video>
    </div>

    <!-- 2. THIS IS THE INLINE SCRIPT BLOCK TO UPDATE -->
    <script>
        const video = document.getElementById('video');

        // Target stream link extracted by your scraper
        const rawStream = 'https://playyonogames.in/sliv/stream.php?e=.m3u8&id=1000009247';

        // Your Cloudflare Worker proxy endpoint
        const workerProxy = 'https://ch1.ghubtv1.workers.dev/?url=';

        // Combine into proxied URL
        const proxiedStream = workerProxy + encodeURIComponent(rawStream);

        if (Hls.isSupported()) {
            const hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
            });

            hls.loadSource(proxiedStream);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                // Safely start playback to prevent DOMException race conditions
                const playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.catch(() => {
                        console.log("Autoplay was blocked by browser. Click play on video.");
                    });
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Safari / Native iOS fallback
            video.src = proxiedStream;
            video.addEventListener('loadedmetadata', () => {
                video.play().catch(() => {});
            });
        }
    </script>

</body>
</html>
