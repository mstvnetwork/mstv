<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TV Stream</title>
    <!-- Load HLS.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }
        .player-container {
            width: 100%;
            max-width: 900px;
            padding: 10px;
            box-sizing: border-box;
        }
        video {
            width: 100%;
            height: auto;
            border-radius: 8px;
            background: #000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div class="player-container">
        <video id="video" controls autoplay muted playsinline></video>
    </div>

    <script>
        const video = document.getElementById('video');
        
        // Your live stream URL from Render
        const streamUrl = 'https://mstv.onrender.com/live/1000009247.m3u8';

        if (Hls.isSupported()) {
            const hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
            });

            hls.loadSource(streamUrl);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(() => {
                    console.log("Autoplay blocked. Tap the video to play manually.");
                });
            });

            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal && data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    console.log("Re-connecting to Render relay...");
                    hls.startLoad();
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Safari / iOS Native Fallback
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', () => {
                video.play().catch(() => {});
            });
        }
    </script>

</body>
</html>
