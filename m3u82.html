<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Embed</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .iframe-container { width: 100%; max-width: 900px; aspect-ratio: 16/9; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="iframe-container">
        <!-- Srcdoc isolates the execution context, allowing embed player scripts to run naturally -->
        <iframe 
            srcdoc='
                <!DOCTYPE html>
                <html>
                <head>
                    <meta name="referrer" content="no-referrer">
                    <style>body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;}</style>
                </head>
                <body>
                    <iframe src="https://playyonogames.in/sliv/play.php?c=1000009247" width="100%" height="100%" frameborder="0" allowfullscreen="true" scrolling="no"></iframe>
                </body>
                </html>
            '
            allow="autoplay; encrypted-media; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
