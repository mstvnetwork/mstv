<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        video {
            width: 90%;
            max-width: 900px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <video id="video" controls muted playsinline></video>

    <script>
        const video = document.getElementById('video');
        const rawStream = 'https://playyonogames.in/sliv/stream.php?e=.m3u8&id=1000009247';
        const workerProxy = 'https://ch1.ghubtv1.workers.dev/?url=';

        if (Hls.isSupported()) {
            const hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                xhrSetup: function(xhr, url) {
                    // Make sure EVERY request goes through worker with proper encoding
                    if (!url.startsWith(workerProxy)) {
                        xhr.open('GET', workerProxy + encodeURIComponent(url), true);
                    }
                }
            });

            // Initial manifest request
            hls.loadSource(workerProxy + encodeURIComponent(rawStream));
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(e => console.log("Autoplay blocked, click play button."));
            });

            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal && data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    hls.startLoad();
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = workerProxy + encodeURIComponent(rawStream);
        }
    </script>

</body>
</html>
