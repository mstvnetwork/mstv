<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart IPTV Extractor & Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/dashjs@latest/dist/dash.all.min.js"></script>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #2563eb; --danger: #dc2626; --text: #f8fafc; }
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
        header { padding: 10px 16px; background: var(--panel); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; min-width: 200px; }
        button, label.btn { background: var(--accent); color: white; padding: 10px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
        button.danger { background: var(--danger); }
        input[type="file"] { display: none; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 300px; background: var(--panel); border-right: 1px solid #334155; display: flex; flex-direction: column; }
        .sidebar-header { padding: 12px; border-bottom: 1px solid #334155; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .channel-list { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 0; }
        .channel-item { padding: 10px 12px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; background: #0f172a; margin-bottom: 1px; }
        .channel-item:hover { background: #334155; }
        .channel-info { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
        .channel-tag { font-size: 9px; padding: 2px 5px; border-radius: 4px; background: #334155; margin-left: 6px; }
        .player-container { flex: 1; background: #000; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>

<header>
    <input type="text" id="urlInput" placeholder="Paste stream URL (e.g. http://38.96.178.205/SONYHD/index.m3u8)...">
    <button onclick="loadFromUrl()">Load Source</button>
    <label class="btn"><input type="file" id="fileInput" accept=".m3u,.m3u8" onchange="loadFromFile(event)">Upload M3U</label>
    <button onclick="refreshCurrentSource()">Refresh</button>
</header>

<div class="main-container">
    <div class="sidebar">
        <div class="sidebar-header">
            <span>Channels (<span id="count">0</span>)</span>
            <button class="danger" style="padding: 4px 8px;" onclick="clearPlaylist()">Clear All</button>
        </div>
        <ul class="channel-list" id="channelList"></ul>
    </div>
    
    <div class="player-container">
        <video id="videoPlayer" controls autoplay></video>
    </div>
</div>

<script>
    let playlist = [];
    let currentSource = null;
    let hlsEngine = null;
    let dashEngine = null;
    const videoElement = document.getElementById('videoPlayer');

    // Smart link extractor: Preserves strict query parameters and full folder routes
    function cleanStreamUrl(rawUrl) {
        if (!rawUrl) return '';
        let url = rawUrl.trim();
        // Regex extracts full protocol endpoints including dynamic tokens
        const match = url.match(/(https?:\/\/[^\s"]+)/i);
        return match ? match[1] : url;
    }

    function parseM3U(content) {
        const lines = content.split('\n');
        const channels = [];
        let currentName = "";

        for (let line of lines) {
            line = line.trim();
            if (line.startsWith('#EXTINF:')) {
                const parts = line.split(',');
                currentName = parts.length > 1 ? parts[parts.length - 1].trim() : "Live Stream";
            } else if (line && !line.startsWith('#')) {
                const streamUrl = cleanStreamUrl(line);
                let type = 'HLS';
                if (streamUrl.includes('.mpd')) type = 'DASH';
                else if (streamUrl.endsWith('.mp4') || streamUrl.endsWith('.ts')) type = 'DIRECT';

                channels.push({
                    name: currentName || streamUrl.split('/').pop() || "Channel",
                    url: streamUrl,
                    type: type
                });
                currentName = "";
            }
        }
        return channels;
    }

    // Direct, unproxied HLS/DASH playback core
    function playStream(url, type) {
        if (hlsEngine) { hlsEngine.destroy(); hlsEngine = null; }
        if (dashEngine) { dashEngine.reset(); dashEngine = null; }

        url = cleanStreamUrl(url);
        console.log(`[Engine] Attaching stream: ${url}`);

        if (type === 'HLS' || url.includes('.m3u8')) {
            if (Hls.isSupported()) {
                hlsEngine = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    manifestLoadingTimeOut: 10000
                });
                hlsEngine.loadSource(url);
                hlsEngine.attachMedia(videoElement);
                hlsEngine.on(Hls.Events.MANIFEST_PARSED, () => videoElement.play());
                hlsEngine.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) console.error("[HLS Error]", data);
                });
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                videoElement.src = url;
                videoElement.play();
            }
        } else if (type === 'DASH' || url.includes('.mpd')) {
            dashEngine = dashjs.MediaPlayer().create();
            dashEngine.initialize(videoElement, url, true);
        } else {
            videoElement.src = url;
            videoElement.play();
        }
    }

    function renderPlaylist() {
        const listEl = document.getElementById('channelList');
        document.getElementById('count').innerText = playlist.length;
        listEl.innerHTML = '';

        playlist.forEach((item, index) => {
            const li = document.createElement('li');
            li.className = 'channel-item';
            li.innerHTML = `
                <div class="channel-info" onclick="playStream('${item.url}', '${item.type}')">
                    <span>${item.name}</span>
                    <span class="channel-tag">${item.type}</span>
                </div>
                <button class="danger" style="padding: 2px 6px;" onclick="deleteChannel(${index})">✕</button>
            `;
            listEl.appendChild(li);
        });
    }

    async function loadFromUrl() {
        const input = document.getElementById('urlInput').value.trim();
        if (!input) return alert("Enter a stream or M3U link");

        currentSource = { type: 'url', val: input };
        const cleanUrl = cleanStreamUrl(input);

        // Direct Stream Detection (.m3u8 / .mpd / live ip index streams)
        if (cleanUrl.includes('.m3u8') || cleanUrl.includes('.mpd')) {
            const type = cleanUrl.includes('.mpd') ? 'DASH' : 'HLS';
            playlist = [{ name: cleanUrl.split('/')[3] || "Direct Stream", url: cleanUrl, type: type }];
            renderPlaylist();
            playStream(cleanUrl, type);
            return;
        }

        // Playlist Fetching
        try {
            const response = await fetch(cleanUrl);
            const content = await response.text();
            playlist = parseM3U(content);
            renderPlaylist();
            if (playlist.length > 0) playStream(playlist[0].url, playlist[0].type);
        } catch (err) {
            alert("Could not fetch M3U playlist. Check connection or URL validity.");
        }
    }

    function loadFromFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        currentSource = { type: 'file', val: file };
        const reader = new FileReader();
        reader.onload = function(e) {
            playlist = parseM3U(e.target.result);
            renderPlaylist();
            if (playlist.length > 0) playStream(playlist[0].url, playlist[0].type);
        };
        reader.readAsText(file);
    }

    function deleteChannel(index) {
        playlist.splice(index, 1);
        renderPlaylist();
    }

    function clearPlaylist() {
        playlist = [];
        renderPlaylist();
        videoElement.pause();
        videoElement.src = "";
    }

    function refreshCurrentSource() {
        if (!currentSource) return;
        if (currentSource.type === 'url') loadFromUrl();
    }
</script>
</body>
</html>
