<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart IPTV Extractor & Player</title>
    <!-- Engine Dependencies: Hls.js for M3U8 & Dash.js for MPD -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/dashjs@latest/dist/dash.all.min.js"></script>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #3b82f6; --danger: #ef4444; --text: #f8fafc; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
        header { padding: 10px 20px; background: var(--panel); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        input[type="text"] { flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; min-width: 200px; }
        button, label.btn { background: var(--accent); color: white; padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; }
        button.danger { background: var(--danger); }
        input[type="file"] { display: none; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 320px; background: var(--panel); border-right: 1px solid #334155; display: flex; flex-direction: column; }
        .sidebar-header { padding: 10px 15px; border-bottom: 1px solid #334155; font-size: 14px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .channel-list { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 0; }
        .channel-item { padding: 10px 15px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .channel-item:hover { background: #334155; }
        .channel-info { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px; }
        .channel-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #334155; margin-left: 5px; }
        .player-container { flex: 1; background: #000; display: flex; justify-content: center; align-items: center; position: relative; }
        video { width: 100%; height: 100%; max-height: 100vh; }
        .checkbox-label { font-size: 12px; display: flex; align-items: center; gap: 4px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <input type="text" id="urlInput" placeholder="Enter HTTP/HTTPS M3U URL or stream link...">
    <button onclick="loadFromUrl()">Load URL</button>
    <label class="btn"><input type="file" id="fileInput" accept=".m3u,.m3u8" onchange="loadFromFile(event)">Upload M3U</label>
    <button onclick="refreshCurrentSource()">Refresh</button>
    <label class="checkbox-label">
        <input type="checkbox" id="corsToggle" checked> Use CORS Proxy
    </label>
</header>

<div class="main-container">
    <div class="sidebar">
        <div class="sidebar-header">
            <span>Extracted Channels (<span id="count">0</span>)</span>
            <button class="danger" style="padding: 4px 8px; font-size: 12px;" onclick="clearPlaylist()">Clear All</button>
        </div>
        <ul class="channel-list" id="channelList"></ul>
    </div>
    
    <div class="player-container">
        <video id="videoPlayer" controls autoplay></video>
    </div>
</div>

<script>
    let playlist = [];
    let currentSource = null; // Stores last loaded URL or file context
    let hlsEngine = null;
    let dashEngine = null;

    const videoElement = document.getElementById('videoPlayer');
    const CORS_PROXY = "https://api.allorigins.win/raw?url=";

    // --- AUTOMATIC SOURCE EXTRACTOR ENGINE ---
    function extractDirectStream(url) {
        if (!url) return '';
        url = url.trim();
        // Dynamic regex pattern to pull direct .m3u8, .mpd, or .ts payloads hidden inside query parameters
        const match = url.match(/(https?:\/\/[^\s"]+\.(?:m3u8|mpd|ts|mp4)(?:\?[^\s"]*)?)/i);
        return match ? match[1] : url;
    }

    function parseM3U(content) {
        const lines = content.split('\n');
        const channels = [];
        let currentChannel = null;

        for (let line of lines) {
            line = line.strip ? line.strip() : line.trim();
            if (line.startsWith('#EXTINF:')) {
                const nameMatch = line.match(/,([^,]+)$/);
                const name = nameMatch ? nameMatch[1].trim() : "Unknown Stream";
                currentChannel = { name: name };
            } else if (line && !line.startsWith('#')) {
                const streamUrl = extractDirectStream(line);
                let type = 'HLS';
                if (streamUrl.includes('.mpd')) type = 'DASH';
                else if (streamUrl.includes('.mp4') || streamUrl.includes('.ts')) type = 'DIRECT';

                if (currentChannel) {
                    currentChannel.url = streamUrl;
                    currentChannel.type = type;
                    channels.push(currentChannel);
                    currentChannel = null;
                } else {
                    channels.push({ name: streamUrl.split('/').pop() || "Direct Stream", url: streamUrl, type: type });
                }
            }
        }
        return channels;
    }

    // --- PLAYBACK ENGINE ROUTER ---
    function playStream(url, type) {
        // Destroy existing engine instances
        if (hlsEngine) { hlsEngine.destroy(); hlsEngine = null; }
        if (dashEngine) { dashEngine.reset(); dashEngine = null; }

        console.log(`[Playback Engine] Playing: ${url} via${type}`);

        if (type === 'HLS' || url.includes('.m3u8')) {
            if (Hls.isSupported()) {
                hlsEngine = new Hls({ enableWorker: true });
                hlsEngine.loadSource(url);
                hlsEngine.attachMedia(videoElement);
                hlsEngine.on(Hls.Events.MANIFEST_PARSED, () => videoElement.play());
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                // Native Safari support
                videoElement.src = url;
                videoElement.play();
            }
        } else if (type === 'DASH' || url.includes('.mpd')) {
            dashEngine = dashjs.MediaPlayer().create();
            dashEngine.initialize(videoElement, url, true);
        } else {
            // Direct HTML5 supported files (.mp4, raw .ts via browser codecs)
            videoElement.src = url;
            videoElement.play();
        }
    }

    // --- PLAYLIST & UI MANAGEMENT ---
    function renderPlaylist() {
        const listEl = document.getElementById('channelList');
        document.getElementById('count').innerText = playlist.length;
        listEl.innerHTML = '';

        playlist.forEach((item, index) => {
            const li = document.createElement('li');
            li.className = 'channel-item';
            li.innerHTML = `
                <div class="channel-info" onclick="playStream('${item.url}', '${item.type}')">
                    <span>${item.name}</span>
                    <span class="channel-tag">${item.type}</span>
                </div>
                <button class="danger" style="padding: 2px 6px; font-size: 11px;" onclick="deleteChannel(${index})">✕</button>
            `;
            listEl.appendChild(li);
        });
    }

    async function fetchPlaylistData(targetUrl) {
        const useProxy = document.getElementById('corsToggle').checked;
        const finalUrl = useProxy ? `${CORS_PROXY}${encodeURIComponent(targetUrl)}` : targetUrl;
        
        const response = await fetch(finalUrl);
        if (!response.ok) throw new Error("Network request failed");
        return await response.text();
    }

    async function loadFromUrl() {
        const input = document.getElementById('urlInput').value.trim();
        if (!input) return alert("Please enter a valid HTTP/HTTPS URL");

        currentSource = { type: 'url', val: input };
        
        // Single stream vs M3U detection
        if (input.endsWith('.m3u8') || input.endsWith('.mpd')) {
            const extracted = extractDirectStream(input);
            const type = extracted.includes('.mpd') ? 'DASH' : 'HLS';
            playlist = [{ name: "Direct Link", url: extracted, type: type }];
            renderPlaylist();
            playStream(extracted, type);
            return;
        }

        try {
            const content = await fetchPlaylistData(input);
            playlist = parseM3U(content);
            renderPlaylist();
            if (playlist.length > 0) playStream(playlist[0].url, playlist[0].type);
        } catch (err) {
            alert(`Error loading playlist: ${err.message}. Try toggling the CORS Proxy.`);
        }
    }

    function loadFromFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        currentSource = { type: 'file', val: file };
        const reader = new FileReader();
        reader.onload = function(e) {
            playlist = parseM3U(e.target.result);
            renderPlaylist();
            if (playlist.length > 0) playStream(playlist[0].url, playlist[0].type);
        };
        reader.readAsText(file);
    }

    function deleteChannel(index) {
        playlist.splice(index, 1);
        renderPlaylist();
    }

    function clearPlaylist() {
        playlist = [];
        renderPlaylist();
        videoElement.pause();
        videoElement.src = "";
    }

    function refreshCurrentSource() {
        if (!currentSource) return alert("No active source to refresh.");
        if (currentSource.type === 'url') loadFromUrl();
        else alert("Re-select the file using 'Upload M3U' to refresh local contents.");
    }
</script>
</body>
</html>
