<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart IPTV Extractor & Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/dashjs@latest/dist/dash.all.min.js"></script>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #2563eb; --danger: #dc2626; --text: #f8fafc; }
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
        header { padding: 10px 16px; background: var(--panel); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; min-width: 200px; }
        button, label.btn { background: var(--accent); color: white; padding: 10px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
        button.danger { background: var(--danger); }
        input[type="file"] { display: none; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 320px; background: var(--panel); border-right: 1px solid #334155; display: flex; flex-direction: column; }
        .sidebar-header { padding: 12px; border-bottom: 1px solid #334155; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .channel-list { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 0; }
        .channel-item { padding: 10px 12px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; background: #0f172a; margin-bottom: 1px; }
        .channel-item:hover { background: #334155; }
        .channel-info { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
        .channel-tag { font-size: 9px; padding: 2px 5px; border-radius: 4px; background: #334155; margin-left: 6px; }
        .player-container { flex: 1; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        video { width: 100%; height: 100%; max-height: 85vh; aspect-ratio: 16/9; }
        
        /* Auto-Extractor Status Panel */
        .extractor-bar { width: 100%; background: #020617; padding: 8px 12px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; border-top: 1px solid #334155; font-size: 12px; }
        .extracted-url { flex: 1; background: #1e293b; padding: 6px 10px; border-radius: 4px; color: #38bdf8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: monospace; }
    </style>
</head>
<body>

<header>
    <input type="text" id="urlInput" placeholder="Paste HTTP/HTTPS stream link or M3U URL...">
    <button onclick="loadFromUrl()">Load Source</button>
    <label class="btn"><input type="file" id="fileInput" accept=".m3u,.m3u8" onchange="loadFromFile(event)">Upload M3U</label>
    <button onclick="refreshCurrentSource()">Refresh</button>
</header>

<div class="main-container">
    <div class="sidebar">
        <div class="sidebar-header">
            <span>Channels (<span id="count">0</span>)</span>
            <button class="danger" style="padding: 4px 8px;" onclick="clearPlaylist()">Clear All</button>
        </div>
        <ul class="channel-list" id="channelList"></ul>
    </div>
    
    <div class="player-container">
        <video id="video" controls autoplay playsinline></video>
        <!-- Real-Time Stream Link Extractor Display -->
        <div class="extractor-bar">
            <span>Extracted M3U8:</span>
            <div class="extracted-url" id="extractedUrlDisplay">Waiting for stream initialization...</div>
            <button style="padding: 4px 8px; font-size: 11px;" onclick="copyExtractedUrl()">Copy Link</button>
        </div>
    </div>
</div>

<script>
    let playlist = [];
    let currentSource = null;
    let hlsEngine = null;
    let dashEngine = null;
    let activeStreamUrl = "";

    const videoElement = document.getElementById('video');
    const displayEl = document.getElementById('extractedUrlDisplay');

    function buildProxyUrl(targetUrl) {
        if (!targetUrl) return '';
        if (targetUrl.includes('xtremplay.com/api/proxy')) return targetUrl;

        let refUrl = targetUrl;
        if (targetUrl.includes('/tracks-v1a1/')) {
            refUrl = targetUrl.replace(/\/tracks-v1a1\/.*$/, '/index.m3u8');
        }

        const encodedTarget = encodeURIComponent(targetUrl);
        const encodedRef = encodeURIComponent(refUrl);
        return `https://xtremplay.com/api/proxy?url=${encodedTarget}&ref=${encodedRef}`;
    }

    function extractDirectStream(rawUrl) {
        if (!rawUrl) return '';
        let url = rawUrl.trim();
        const match = url.match(/(https?:\/\/[^\s"]+)/i);
        return match ? match[1] : url;
    }

    function parseM3U(content) {
        const lines = content.split('\n');
        const channels = [];
        let currentName = "";

        for (let line of lines) {
            line = line.trim();
            if (line.startsWith('#EXTINF:')) {
                const parts = line.split(',');
                currentName = parts.length > 1 ? parts[parts.length - 1].trim() : "Live Stream";
            } else if (line && !line.startsWith('#')) {
                const streamUrl = extractDirectStream(line);
                let type = 'HLS';
                if (streamUrl.includes('.mpd')) type = 'DASH';
                else if (streamUrl.endsWith('.mp4') || streamUrl.endsWith('.ts')) type = 'DIRECT';

                channels.push({
                    name: currentName || streamUrl.split('/').pop() || "Channel",
                    url: streamUrl,
                    type: type
                });
                currentName = "";
            }
        }
        return channels;
    }

    function playStream(rawUrl, type) {
        if (hlsEngine) { hlsEngine.destroy(); hlsEngine = null; }
        if (dashEngine) { dashEngine.reset(); dashEngine = null; }

        const cleanUrl = extractDirectStream(rawUrl);
        const initialStreamUrl = buildProxyUrl(cleanUrl);

        displayEl.innerText = "Extracting live stream endpoint...";

        if (type === 'HLS' || cleanUrl.includes('.m3u8')) {
            if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                hlsEngine = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    defaultAudioCodec: 'mp4a.40.2',
                    xhrSetup: function(xhr, url) {
                        // Route sub-manifests and video chunks through proxy
                        if (!url.includes('xtremplay.com/api/proxy')) {
                            xhr.open('GET', buildProxyUrl(url), true);
                        }
                    }
                });

                hlsEngine.loadSource(initialStreamUrl);
                hlsEngine.attachMedia(videoElement);

                // AUTOMATIC SUB-MANIFEST LINK EXTRACTOR HOOK
                hlsEngine.on(Hls.Events.LEVEL_LOADED, function(event, data) {
                    if (data && data.details && data.details.url) {
                        activeStreamUrl = data.details.url;
                        displayEl.innerText = activeStreamUrl;
                        console.log("[Auto-Extractor] Sub-manifest extracted:", activeStreamUrl);
                    }
                });

                hlsEngine.on(Hls.Events.MANIFEST_PARSED, function(event, data) {
                    if (data.levels && data.levels[0] && data.levels[0].url) {
                        activeStreamUrl = data.levels[0].url;
                        displayEl.innerText = activeStreamUrl;
                    }
                    videoElement.play().catch(e => console.log("Autoplay blocked. Tap video to play."));
                });

                hlsEngine.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hlsEngine.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hlsEngine.recoverMediaError();
                                break;
                            default:
                                break;
                        }
                    }
                });
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                videoElement.src = initialStreamUrl;
                displayEl.innerText = cleanUrl;
                videoElement.play();
            }
        } else if (type === 'DASH' || cleanUrl.includes('.mpd')) {
            dashEngine = dashjs.MediaPlayer().create();
            dashEngine.initialize(videoElement, initialStreamUrl, true);
            displayEl.innerText = cleanUrl;
        } else {
            videoElement.src = initialStreamUrl;
            displayEl.innerText = cleanUrl;
            videoElement.play();
        }
    }

    function copyExtractedUrl() {
        if (!activeStreamUrl && displayEl.innerText.startsWith("http")) {
            activeStreamUrl = displayEl.innerText;
        }
        if (activeStreamUrl) {
            navigator.clipboard.writeText(activeStreamUrl);
            alert("Extracted M3U8 copied to clipboard!");
        } else {
            alert("No URL extracted yet.");
        }
    }

    function renderPlaylist() {
        const listEl = document.getElementById('channelList');
        document.getElementById('count').innerText = playlist.length;
        listEl.innerHTML = '';

        playlist.forEach((item, index) => {
            const li = document.createElement('li');
            li.className = 'channel-item';
            li.innerHTML = `
                <div class="channel-info" onclick="playStream('${item.url}', '${item.type}')">
                    <span>${item.name}</span>
                    <span class="channel-tag">${item.type}</span>
                </div>
                <button class="danger" style="padding: 2px 6px;" onclick="deleteChannel(${index})">✕</button>
            `;
            listEl.appendChild(li);
        });
    }

    async function loadFromUrl() {
        const input = document.getElementById('urlInput').value.trim();
        if (!input) return alert("Enter a stream or M3U link");

        currentSource = { type: 'url', val: input };
        const cleanUrl = extractDirectStream(input);

        if (cleanUrl.includes('.m3u8') || cleanUrl.includes('.mpd')) {
            const type = cleanUrl.includes('.mpd') ? 'DASH' : 'HLS';
            playlist = [{ name: cleanUrl.split('/')[3] || "Direct Stream", url: cleanUrl, type: type }];
            renderPlaylist();
            playStream(cleanUrl, type);
            return;
        }

        try {
            const response = await fetch(buildProxyUrl(cleanUrl));
            const content = await response.text();
            playlist = parseM3U(content);
            renderPlaylist();
            if (playlist.length > 0) playStream(playlist[0].url, playlist[0].type);
        } catch (err) {
            alert("Could not fetch playlist via proxy.");
        }
    }

    function loadFromFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        currentSource = { type: 'file', val: file };
        const reader = new FileReader();
        reader.onload = function(e) {
            playlist = parseM3U(e.target.result);
            renderPlaylist();
            if (playlist.length > 0) playStream(playlist[0].url, playlist[0].type);
        };
        reader.readAsText(file);
    }

    function deleteChannel(index) {
        playlist.splice(index, 1);
        renderPlaylist();
    }

    function clearPlaylist() {
        playlist = [];
        renderPlaylist();
        videoElement.pause();
        videoElement.src = "";
        displayEl.innerText = "Waiting for stream initialization...";
    }

    function refreshCurrentSource() {
        if (!currentSource) return;
        if (currentSource.type === 'url') loadFromUrl();
    }
</script>
</body>
</html>
