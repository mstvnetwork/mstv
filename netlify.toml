# ════════════════════════════════════════════════════════
# netlify.toml  (repo ROOT)
# Netlify-specific config.
# ════════════════════════════════════════════════════════

[build]
  publish = "."
  command = "node generate-sitemap.js"

[build.environment]
  NODE_VERSION = "18"

# ── Redirect ALL Netlify traffic → Cloudflare Pages ────
[[redirects]]
  from   = "/*"
  to     = "https://crickethd.pages.dev/:splat"
  status = 301
  force  = true

# ── Global Security Headers ────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    X-XSS-Protection       = "1; mode=block"

# ── Streamdata Cache Control ───────────────────────────
[[headers]]
  for = "/streamdata.json"
  [headers.values]
    Cache-Control               = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma                      = "no-cache"
    Access-Control-Allow-Origin = "*"
