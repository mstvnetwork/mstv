# ════════════════════════════════════════════════════════
# netlify.toml  (repo ROOT)
# Netlify-specific config. Cloudflare Pages ignores this.
# ════════════════════════════════════════════════════════

[build]
  publish = "."
  # If you run generate-sitemap.js before deploy:
  # command = "node generate-sitemap.js"

[build.environment]
  NODE_VERSION = "18"

# ── Redirect ALL Netlify traffic → Cloudflare ─────────
# ⚠️  Replace mstvnet.pages.dev with your CF domain
[[redirects]]
  from   = "/*"
  to     = "https://crickethd.pages.dev/:splat"
  status = 301
  force  = true

# ── Security Headers ──────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    X-XSS-Protection       = "1; mode=block"

# channels2.json must never be cached
[[headers]]
  for = "/channels2.json"
  [headers.values]
    Cache-Control               = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma                      = "no-cache"
    Access-Control-Allow-Origin = "*"
