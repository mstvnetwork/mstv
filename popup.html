<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sony TV HD - Stream Player</title>

    <script src="https://unpkg.com/@unpkg/x-frame-bypass"></script>
    <script type="module" src="https://unpkg.com/@unpkg/x-frame-bypass"></script>

    <style id="dynamicCrop">
        /* Default / Public CSS values applied when MODE = 'public' */
        :root {
  --crop-top: -140px;
  --crop-left: -10px;
  --crop-zoom: 0.7;
        }
    </style>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }

        .viewport { width: 100vw; height: 100vh; position: relative; overflow: hidden; background: #000; }

        /* Frame container styled with dynamic variables */
        #frameMover {
            position: absolute;
            top: var(--crop-top);
            left: var(--crop-left);
            width: 250%;
            height: 250%;
            transform: scale(var(--crop-zoom));
            transform-origin: 0 0;
        }

        #captureFrame { width: 100%; height: 100%; border: none; }

        /* --- PRIVATE ALIGNMENT CONTROLS (Hidden in PUBLIC mode) --- */
        #alignerPanel {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            background: rgba(15, 18, 32, 0.95);
            border: 1px solid #3df2ff;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            color: #fff;
            font-size: 11px;
            width: 280px;
        }

        #alignerPanel.active { display: block; }

        .control-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; text-align: center; }
        .control-grid button, .zoom-row button {
            background: #151933; color: #3df2ff; border: 1px solid rgba(61,242,255,0.3);
            padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer;
        }
        .control-grid button:active, .zoom-row button:active { background: #3df2ff; color: #000; }
        .zoom-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }

        .copy-btn {
            width: 100%; background: #33ff9b; color: #000; border: none;
            padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 6px;
        }
        
        #modeBadge {
            position: fixed; top: 10px; right: 10px; z-index: 99999;
            background: rgba(255,0,0,0.8); color: #fff; font-size: 10px;
            padding: 4px 8px; border-radius: 4px; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="modeBadge" style="display:none;">PRIVATE ALIGNMENT MODE</div>

    <div class="viewport">
        <div id="frameMover">
            <iframe id="captureFrame" is="x-frame-bypass" src="https://bhoomtv.org/live/sony-tv-hd/" scrolling="no"></iframe>
        </div>
    </div>

    <!-- Alignment overlay control box -->
    <div id="alignerPanel">
        <div class="zoom-row">
            <span>Zoom: <strong id="lblZoom">1.6</strong></span>
            <div>
                <button onclick="changeZoom(-0.1)">-</button>
                <button onclick="changeZoom(0.1)">+</button>
            </div>
        </div>
        <div class="control-grid">
            <div></div><button onclick="moveTop(-10)">▲</button><div></div>
            <button onclick="moveLeft(-10)">◄</button><button onclick="resetPos()">R</button><button onclick="moveLeft(10)">►</button>
            <div></div><button onclick="moveTop(10)">▼</button><div></div>
        </div>
        <div style="font-size:10px; color:#8790ac; text-align:center; margin: 4px 0;">
            Top: <span id="lblTop">-120</span>px | Left: <span id="lblLeft">-10</span>px
        </div>
        <button class="copy-btn" onclick="copyCSS()">📋 Copy Production CSS</button>
    </div>

<script>
    // ==========================================
    // TOGGLE MODE HERE: Set to 'private' or 'public'
    // ==========================================
    const MODE = 'private'; 

    let topVal = -120;
    let leftVal = -10;
    let zoomVal = 1.6;

    if (MODE === 'private') {
        document.getElementById('alignerPanel').classList.add('active');
        document.getElementById('modeBadge').style.display = 'block';
    }

    function applyStyles() {
        document.documentElement.style.setProperty('--crop-top', topVal + 'px');
        document.documentElement.style.setProperty('--crop-left', leftVal + 'px');
        document.documentElement.style.setProperty('--crop-zoom', zoomVal);

        document.getElementById('lblTop').textContent = topVal;
        document.getElementById('lblLeft').textContent = leftVal;
        document.getElementById('lblZoom').textContent = zoomVal.toFixed(1);
    }

    function moveTop(delta) { topVal += delta; applyStyles(); }
    function moveLeft(delta) { leftVal += delta; applyStyles(); }
    function changeZoom(delta) { zoomVal = Math.max(0.5, parseFloat((zoomVal + delta).toFixed(1))); applyStyles(); }
    function resetPos() { topVal = 0; leftVal = 0; zoomVal = 1.0; applyStyles(); }

    function copyCSS() {
        const cssCode = `:root {\n  --crop-top: ${topVal}px;\n  --crop-left: ${leftVal}px;\n  --crop-zoom: ${zoomVal};\n}`;
        navigator.clipboard.writeText(cssCode);
        alert('CSS variables copied! Replace the <style id="dynamicCrop"> section with these values, then set MODE = "public".');
    }
</script>
</body>
</html>
