<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apna TV - Live Broadcast</title>
    <!-- Include hls.js Engine via jsDelivr CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.1/dist/hls.min.js"></script>
    <style>
        :root {
            --control-bg: rgba(0, 0, 0, 0.65);
            --control-bg-hover: rgba(0, 0, 0, 0.85);
            --icon: #fff;
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            color: #fff;
            overflow: hidden;
        }

        .tv-frame {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.25s ease-in-out;
            pointer-events: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .video-layer.active {
            opacity: 1;
            z-index: 1;
            pointer-events: auto;
        }

        /* --- ISOLATED LOGO ENGINE --- */
        .logo-container-context {
            position: absolute;
            inset: 0;                
            pointer-events: none;    
            z-index: 15;             
            container-type: inline-size; 
        }

/* --- LOADING SPINNER ENGINE --- */
#loadingOverlay.loading-overlay {
    position: absolute;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    z-index: 200;
    transition: opacity 0.4s ease-in-out, visibility 0.4s ease-in-out;
}

/* Force hiding regardless of ID specificity and STOP animation paint cycles */
#loadingOverlay.hidden {
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
    display: none !important;
}

#loadingOverlay.hidden .red-spinner {
    animation: none !important; /* Prevents hidden spinner from stealing GPU/CPU frames */
}

.red-spinner {
    box-sizing: border-box;
    display: block;
    width: 48px;
    height: 48px;
    border: 4px solid rgba(255, 59, 48, 0.2);
    border-top-color: #ff3b30 !important;
    border-radius: 50%;
    will-change: transform; /* Hardware accelerate spinner on GPU layer */
    transform: translateZ(0);
    animation: spin-loader 0.8s linear infinite;
    flex-shrink: 0;
}

.loading-text {
    color: #ffffff;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.5px;
}

@keyframes spin-loader {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
        /* --- CHANNEL LOGO LAYOUT --- */
        .channel-logo {
            position: absolute;
            top: 0px;            
            right: 16px;  
            width: 64px;   
            height: auto;   
            object-fit: contain;
            opacity: 0.85;   
            pointer-events: none;
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.5));
            z-index: 100;
        }

        @container (min-width: 500px) {
            .channel-logo {
                top: -1.3cqw;            
                right: 2.5cqw;  
                width: 18cqw;   
            }
        }

        .title-box {
            position: absolute;
            top: max(2px, env(safe-area-inset-top));
            left: max(16px, env(safe-area-inset-left));
            font-size: 10px;
            font-weight: 600;
            color: #f1f1f1;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
            z-index: 100;
            max-width: 70vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
        }

        .ui-overlay {
            position: absolute;
            bottom: max(16px, env(safe-area-inset-bottom));
            right: max(16px, env(safe-area-inset-right));
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
        }

        .ctrl-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--control-bg);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background .15s ease, transform .1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .ctrl-btn:hover {
            background: var(--control-bg-hover);
        }

        .ctrl-btn:active {
            transform: scale(.92);
        }

        .ctrl-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--icon);
        }

        @media (max-width: 360px) {
            .title-box {
                font-size: 11px;
                padding: 4px 8px;
            }
            .ctrl-btn {
                width: 38px;
                height: 38px;
            }
            .ctrl-btn svg {
                width: 18px;
                height: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="tv-frame" id="tv-frame">
        <video id="player-1" class="video-layer active" muted playsinline></video>
        <video id="player-2" class="video-layer" muted playsinline></video>

        <div id="title-box" class="title-box">
            Now: Connecting...
        </div>

        <div class="logo-container-context">
            <img id="channelLogo" class="channel-logo" src="https://crickethd.pages.dev/apna3.webp" alt="Channel Logo">
        </div>
      <!-- Loading Spinner Overlay Layer -->
<div id="loadingOverlay" class="loading-overlay">
    <div class="red-spinner"></div>
    <div class="loading-text">Please Wait</div>
</div>


        <div class="ui-overlay">
            <button id="mute-btn" class="ctrl-btn" title="Unmute">
                <svg id="mute-icon" viewBox="0 0 24 24">
                    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                </svg>
            </button>

            <button id="fullscreen-btn" class="ctrl-btn" title="Fullscreen">
                <svg viewBox="0 0 24 24">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                </svg>
            </button>
        </div>
    </div>
  <script>
class UninterruptedBroadcast {
    constructor(playerId1, playerId2) {
        this.player1 = document.getElementById(playerId1);
        this.player2 = document.getElementById(playerId2);
        this.activePlayer = this.player1;
        this.bufferPlayer = this.player2;

        this.hls1 = null;
        this.hls2 = null;
        this.activeHls = null;
        this.bufferHls = null;

        this.playlist = [];
        this.anchorTime = 0;
        this.totalDuration = 0;
        
        this.currentVideoIndex = -1;
        this.currentUrl = "";
        this.isSwapping = false; 
        this.hasTunedIn = false;
        this.isMuted = true; 

        // Overlay element reference
        this.loadingOverlay = document.getElementById('loadingOverlay');

        // --- AI BRAIN DETECTOR ENGINE STATE ---
        this.aiEngine = {
            isSeekingInternally: false,
            lastValidTime: 0,
            consecutiveStalls: 0,
            healingInProgress: false,
            lastSyncCheck: Date.now(),
            velocityThreshold: 2.2 // Tolerance threshold for timeline anomalies
        };

        this.init();
    }

    async init() {
        await this.fetchPlaylistUpdates();
        
        this.setupPlayerListeners(this.player1);
        this.setupPlayerListeners(this.player2);
        this.setupUIHandlers();

        this.syncToGlobalTimeline();

        // Background synchronization & self-healing heartbeat loop
        setInterval(() => this.fetchPlaylistUpdates(), 15000);
        setInterval(() => this.runAIBrainHealer(), 2500);
    }

    async fetchPlaylistUpdates() {
        try {
            const response = await fetch(`./playlist200.json?cb=${Date.now()}`);
            const data = await response.json();
            
            this.playlist = data.playlist;
            this.anchorTime = data.anchorTime;
            this.totalDuration = this.playlist.reduce((acc, item) => acc + item.duration, 0);
            
            if (this.hasTunedIn && !this.isSwapping) {
                this.preloadUpcomingSequencedItem();
            }
        } catch (err) {
            console.error("[AI Brain] Manifest update fetch retry failure:", err);
        }
    }

    calculateBroadcastState() {
        if (this.totalDuration === 0 || this.anchorTime === 0) return null;

        const now = Math.floor(Date.now() / 1000);
        let elapsedSeconds = now - this.anchorTime;
        if (elapsedSeconds < 0) elapsedSeconds = 0; 

        let currentCyclePosition = elapsedSeconds % this.totalDuration;

        let accumulatedTime = 0;
        for (let i = 0; i < this.playlist.length; i++) {
            const video = this.playlist[i];
            if (currentCyclePosition >= accumulatedTime && currentCyclePosition < (accumulatedTime + video.duration)) {
                return { index: i, seekTo: currentCyclePosition - accumulatedTime, video: video };
            }
            accumulatedTime += video.duration;
        }
        return { index: 0, seekTo: 0, video: this.playlist[0] };
    }

    syncToGlobalTimeline() {
        this.hasTunedIn = true;
        const state = this.calculateBroadcastState();
        if (!state || !state.video) return;

        this.currentVideoIndex = state.index;
        this.currentUrl = state.video.url;
        
        this.updateTitleUI(state.video.title || "Live Broadcast Feed");

        if (this.activeHls) this.activeHls.destroy();
        this.activePlayer.muted = this.isMuted;
        
        this.aiEngine.isSeekingInternally = true;
        this.activeHls = this.loadHlsStream(this.activePlayer, state.video.url);
        
        const onInitialLoad = () => {
            this.activePlayer.currentTime = state.seekTo;
            this.activePlayer.play().catch(() => {});
            this.activePlayer.removeEventListener('loadedmetadata', onInitialLoad);
            
            setTimeout(() => {
                this.aiEngine.isSeekingInternally = false;
                this.aiEngine.lastValidTime = state.seekTo;
            }, 400);

            this.preloadUpcomingSequencedItem();
        };
        this.activePlayer.addEventListener('loadedmetadata', onInitialLoad);
    }

    setupPlayerListeners(player) {
        const hideOverlayHandler = () => {
            if (player === this.activePlayer && this.loadingOverlay) {
                this.loadingOverlay.classList.add('hidden');
            }
        };

        player.addEventListener('playing', () => {
            hideOverlayHandler();
            this.aiEngine.consecutiveStalls = 0;
        });

        player.addEventListener('timeupdate', () => {
            hideOverlayHandler();
            if (player === this.activePlayer && !this.aiEngine.isSeekingInternally) {
                this.aiEngine.lastValidTime = player.currentTime;
            }
        });

        player.addEventListener('waiting', () => {
            if (player === this.activePlayer && this.loadingOverlay) {
                this.loadingOverlay.classList.remove('hidden');
            }
        });

        player.addEventListener('ended', () => {
            if (player !== this.activePlayer || this.isSwapping) return;
            this.handleTrackEnded();
        });

        // --- AI AUTOMATIC DETECTOR: STRICT ANTI-SCRUB INTERCEPTOR ---
        player.addEventListener('seeking', () => {
            if (player !== this.activePlayer || this.isSwapping || this.aiEngine.isSeekingInternally) return;

            const state = this.calculateBroadcastState();
            if (!state || !state.video || state.video.url !== this.currentUrl) return;

            const targetSeek = state.seekTo;
            const delta = Math.abs(player.currentTime - targetSeek);

            // Anomaly detected: Manual scrub or external injection attempt
            if (delta > this.aiEngine.velocityThreshold) {
                console.warn(`[AI Anti-Scrub] Anomaly detected (${delta.toFixed(2)}s jump). Enforcing timeline lock.`);
                
                this.aiEngine.isSeekingInternally = true;
                player.currentTime = targetSeek;

                setTimeout(() => {
                    this.aiEngine.isSeekingInternally = false;
                }, 350);
            }
        });
    }

    // --- AI SELF-HEALING ENGINE ---
    runAIBrainHealer() {
        if (!this.hasTunedIn || this.isSwapping || this.aiEngine.healingInProgress) return;

        const state = this.calculateBroadcastState();
        if (!state || !state.video) return;

        // Auto Heal Case 1: Stream track change detected out-of-sync
        if (state.video.url !== this.currentUrl) {
            console.warn("[AI Self-Heal] Playlist boundary shift detected. Synchronizing...");
            this.aiEngine.healingInProgress = true;
            this.syncToGlobalTimeline();
            this.aiEngine.healingInProgress = false;
            return;
        }

        // Auto Heal Case 2: Playhead freeze or buffer stalled
        if (this.activePlayer.readyState < 3 && !this.activePlayer.paused) {
            this.aiEngine.consecutiveStalls++;
            if (this.aiEngine.consecutiveStalls >= 3) {
                console.warn("[AI Self-Heal] Playback stall detected. Recovering media pipeline...");
                this.aiEngine.consecutiveStalls = 0;
                this.aiEngine.healingInProgress = true;
                
                if (this.activeHls) {
                    this.activeHls.startLoad();
                }
                this.activePlayer.currentTime = state.seekTo;
                this.activePlayer.play().catch(() => {});
                
                setTimeout(() => { this.aiEngine.healingInProgress = false; }, 1000);
                return;
            }
        }

        // Auto Heal Case 3: Accumulated drift correction (e.g. background tab throttling)
        const drift = Math.abs(this.activePlayer.currentTime - state.seekTo);
        if (drift > 4.5) {
            console.warn(`[AI Self-Heal] Timeline drift resolved (${drift.toFixed(2)}s divergence). Adjusting smoothly.`);
            this.aiEngine.isSeekingInternally = true;
            this.activePlayer.currentTime = state.seekTo;
            
            setTimeout(() => {
                this.aiEngine.isSeekingInternally = false;
            }, 300);
        }
    }

    handleTrackEnded() {
        this.isSwapping = true;
        const oldActive = this.activePlayer;
        const newActive = this.bufferPlayer;

        console.log("[Handoff] Transitioning playback pipeline to buffered track...");

        newActive.muted = this.isMuted;

        newActive.play().then(() => {
            newActive.classList.add('active');
            oldActive.classList.remove('active');
            oldActive.pause();

            this.activePlayer = newActive;
            this.bufferPlayer = oldActive;

            const tempHls = this.activeHls;
            this.activeHls = this.bufferHls;
            this.bufferHls = tempHls;

            const state = this.calculateBroadcastState();
            if (state && state.video && state.video.url === newActive.src) {
                this.currentVideoIndex = state.index;
            } else {
                this.currentVideoIndex = (this.currentVideoIndex + 1) % this.playlist.length;
            }
            
            const currentSrc = newActive.currentSrc || newActive.src;
            this.currentUrl = this.playlist[this.currentVideoIndex] ? this.playlist[this.currentVideoIndex].url : currentSrc;
            
            const nextShowTitle = this.playlist[this.currentVideoIndex] ? this.playlist[this.currentVideoIndex].title : "Live Stream Broadcast";
            this.updateTitleUI(nextShowTitle);

            this.isSwapping = false;
            this.preloadUpcomingSequencedItem();
        }).catch(err => {
            console.error("[Transition Failure] AI Recovery trigger activated:", err);
            this.isSwapping = false;
            this.syncToGlobalTimeline();
        });
    }

    preloadUpcomingSequencedItem() {
        if (this.playlist.length <= 1) return;

        const nextIndex = (this.currentVideoIndex + 1) % this.playlist.length;
        const nextVideo = this.playlist[nextIndex];
        if (!nextVideo) return;
        
        if (this.bufferHls) this.bufferHls.destroy();
        
        this.bufferPlayer.muted = true;
        this.bufferHls = this.loadHlsStream(this.bufferPlayer, nextVideo.url);
        this.bufferPlayer.load();
    }

    loadHlsStream(player, url) {
        if (player.canPlayType('application/vnd.apple.mpegurl')) {
            player.src = url;
            return null;
        } else if (Hls.isSupported()) {
            const hls = new Hls({ 
                maxBufferLength: 12,
                maxMaxBufferLength: 24,
                enableWorker: true,
                lowLatencyMode: false
            });

            // AI HLS error self-healing listener
            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            console.warn("[AI Self-Heal] Network error encountered. Recovering stream...");
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            console.warn("[AI Self-Heal] Media decoding error encountered. Recovering buffer...");
                            hls.recoverMediaError();
                            break;
                        default:
                            console.error("[AI Self-Heal] Fatal error unrecoverable. Re-initializing pipeline.");
                            this.syncToGlobalTimeline();
                            break;
                    }
                }
            });

            hls.attachMedia(player);
            hls.on(Hls.Events.MEDIA_ATTACHED, () => hls.loadSource(url));
            return hls;
        }
        return null;
    }

    updateTitleUI(text) {
        document.getElementById('title-box').textContent = `Now: ${text}`;
    }

    setupUIHandlers() {
        const muteBtn = document.getElementById('mute-btn');
        const muteIcon = document.getElementById('mute-icon');
        const fsBtn = document.getElementById('fullscreen-btn');
        const frame = document.getElementById('tv-frame');

        muteBtn.addEventListener('click', () => {
            this.isMuted = !this.isMuted;
            this.activePlayer.muted = this.isMuted;
            this.bufferPlayer.muted = true; 

            if (this.isMuted) {
                muteBtn.title = "Unmute";
                muteIcon.innerHTML = `<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>`;
            } else {
                muteBtn.title = "Mute";
                muteIcon.innerHTML = `<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>`;
                this.activePlayer.play().catch(() => {});
            }
        });

        fsBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                frame.requestFullscreen().catch(err => console.log(`Fullscreen error: ${err.message}`));
            } else {
                document.exitFullscreen();
            }
        });
    }
}

const broadcastManager = new UninterruptedBroadcast('player-1', 'player-2');
    </script>      
</body>
</html>
