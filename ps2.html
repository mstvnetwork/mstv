<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-Live Global HLS TV Channel</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;

        .player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        /* Strip native controls completely */
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none; /* Prevents native interactions and scrubbing */
        }
        /* Bottom Right Floating Controls Container */
        .controls-overlay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 12px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }
        .control-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 4px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        /* Live Badge Indicator */
        .live-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #ff0000;
            color: white;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            letter-spacing: 1px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>

            <div class="live-dot"></div> LIVE TV

        <video id="tvPlayer" playsinline webkit-playsinline muted></video>

        <!-- Transparent Bottom Right Controls -->
        <div class="controls-overlay">
            <button id="muteBtn" class="control-btn">UNMUTE</button>
            <button id="fullscreenBtn" class="control-btn">FULLSCREEN</button>
        </div>

<script>
    const REPO_PLAYLIST_URL = './playlist.json'; // Use relative path if hosted on GitHub Pages
    const POLL_INTERVAL = 10000; // Check for JSON updates every 10 seconds

    const videoElem = document.getElementById('tvPlayer');
    const muteBtn = document.getElementById('muteBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const playerContainer = document.getElementById('playerContainer');

    let playlist = [];
    let currentPlaylistHash = '';
    let hlsInstance = null;

    // 1. Fetch Playlist via Serverless Endpoint
    async function fetchPlaylist() {
        try {
            const response = await fetch(REPO_PLAYLIST_URL + '?t=' + new Date().getTime());
            const data = await response.json();
            
            const newHash = JSON.stringify(data);
            if (newHash !== currentPlaylistHash) {
                currentPlaylistHash = newHash;
                playlist = data.videos; 
                console.log("AI Super Brain: Playlist synchronized.", playlist);
            }
        } catch (error) {
            console.error("Error fetching playlist:", error);
        }
    }

    // Load source and immediately lock it to the correct wall-clock offset
    function loadVideoSource(url, targetOffset) {
        const isSameSource = (videoElem.dataset.activeUrl === url);
        videoElem.dataset.activeUrl = url;

        if (url.endsWith('.m3u8')) {
            if (Hls.isSupported()) {
                if (!isSameSource) {
                    if (hlsInstance) hlsInstance.destroy();
                    // Pass startPosition directly to HLS.js so it starts at the right global timestamp
                    hlsInstance = new Hls({ startPosition: targetOffset });
                    hlsInstance.loadSource(url);
                    hlsInstance.attachMedia(videoElem);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        videoElem.play().catch(e => console.log("Autoplay blocked:", e));
                    });
                }
            } else if (videoElem.canPlayType('application/vnd.apple.mpegurl')) {
                // Native Safari HLS fallback
                if (!isSameSource) {
                    videoElem.src = url;
                }
                videoElem.currentTime = targetOffset;
                videoElem.play().catch(e => console.log("Autoplay blocked:", e));
            }
        } else {
            // Standard MP4 / WebM handling
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            if (!isSameSource) {
                videoElem.src = url;
            }
            // Ensure currentTime sticks once metadata is loaded
            if (videoElem.readyState >= 1) {
                if (Math.abs(videoElem.currentTime - targetOffset) > 1.5) {
                    videoElem.currentTime = targetOffset;
                }
            } else {
                videoElem.onloadedmetadata = () => {
                    videoElem.currentTime = targetOffset;
                    videoElem.onloadedmetadata = null;
                };
            }
            videoElem.play().catch(e => console.log("Autoplay blocked:", e));
        }
    }

    // 2. Wall-Clock Synchronization Engine
    function synchronizeBroadcast() {
        if (!playlist || playlist.length === 0) return;

        const totalPlaylistDuration = playlist.reduce((acc, item) => acc + item.duration, 0);
        const currentEpochSeconds = Math.floor(Date.now() / 1000);
        const currentGlobalPosition = currentEpochSeconds % totalPlaylistDuration;

        let accumulatedTime = 0;
        let activeIndex = 0;
        let targetOffset = 0;

        for (let i = 0; i < playlist.length; i++) {
            accumulatedTime += playlist[i].duration;
            if (currentGlobalPosition < accumulatedTime) {
                activeIndex = i;
                targetOffset = playlist[i].duration - (accumulatedTime - currentGlobalPosition);
                break;
            }
        }

        const activeVideo = playlist[activeIndex];
        loadVideoSource(activeVideo.url, targetOffset);

        // Continuous Anti-Drift check for standard files
        if (!activeVideo.url.endsWith('.m3u8') && Math.abs(videoElem.currentTime - targetOffset) > 1.5) {
            videoElem.currentTime = targetOffset;
        }
    }

    // 3. Strict Aggressive Revert Protection Against Seeking
    videoElem.addEventListener('seeking', () => {
        synchronizeBroadcast();
    });

    videoElem.addEventListener('contextmenu', e => e.preventDefault());

    // 4. Control Handlers
    muteBtn.addEventListener('click', () => {
        videoElem.muted = !videoElem.muted;
        muteBtn.textContent = videoElem.muted ? "UNMUTE" : "MUTE";
    });

    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            playerContainer.requestFullscreen().catch(err => console.error(err));
        } else {
            document.exitFullscreen();
        }
    });

    document.addEventListener('fullscreenchange', () => {
        fullscreenBtn.textContent = document.fullscreenElement ? "EXIT FS" : "FULLSCREEN";
    });

    // Initialize Loop Cycles immediately on load
    async function init() {
        await fetchPlaylist();
        synchronizeBroadcast(); // Run instantly on startup/refresh
        setInterval(fetchPlaylist, POLL_INTERVAL);
        setInterval(synchronizeBroadcast, 1000);   
    }

    init();
</script>
</body>
</html>
