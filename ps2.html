<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apna TV - Live Broadcast</title>
    <!-- Include hls.js Engine via jsDelivr CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.1/dist/hls.min.js"></script>
    <style>
        :root {
            --control-bg: rgba(0, 0, 0, 0.65);
            --control-bg-hover: rgba(0, 0, 0, 0.85);
            --icon: #fff;
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            color: #fff;
            overflow: hidden;
        }

        .tv-frame {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.25s ease-in-out;
            pointer-events: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .video-layer.active {
            opacity: 1;
            z-index: 1;
            pointer-events: auto;
        }

        /* --- ISOLATED LOGO ENGINE --- */
        .logo-container-context {
            position: absolute;
            inset: 0;                
            pointer-events: none;    
            z-index: 15;             
            container-type: inline-size; 
        }

/* --- LOADING SPINNER ENGINE --- */
#loadingOverlay.loading-overlay {
    position: absolute;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    z-index: 200;
    transition: opacity 0.4s ease-in-out, visibility 0.4s ease-in-out;
}

/* Force hiding regardless of ID specificity and STOP animation paint cycles */
#loadingOverlay.hidden {
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
    display: none !important;
}

#loadingOverlay.hidden .red-spinner {
    animation: none !important; /* Prevents hidden spinner from stealing GPU/CPU frames */
}

.red-spinner {
    box-sizing: border-box;
    display: block;
    width: 48px;
    height: 48px;
    border: 4px solid rgba(255, 59, 48, 0.2);
    border-top-color: #ff3b30 !important;
    border-radius: 50%;
    will-change: transform; /* Hardware accelerate spinner on GPU layer */
    transform: translateZ(0);
    animation: spin-loader 0.8s linear infinite;
    flex-shrink: 0;
}

.loading-text {
    color: #ffffff;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.5px;
}

@keyframes spin-loader {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
        /* --- CHANNEL LOGO LAYOUT --- */
        .channel-logo {
            position: absolute;
            top: 0px;            
            right: 16px;  
            width: 64px;   
            height: auto;   
            object-fit: contain;
            opacity: 0.85;   
            pointer-events: none;
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.5));
            z-index: 100;
        }

        @container (min-width: 500px) {
            .channel-logo {
                top: -1.3cqw;            
                right: 2.5cqw;  
                width: 18cqw;   
            }
        }

        .title-box {
            position: absolute;
            top: max(2px, env(safe-area-inset-top));
            left: max(16px, env(safe-area-inset-left));
            font-size: 10px;
            font-weight: 600;
            color: #f1f1f1;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
            z-index: 100;
            max-width: 70vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
        }

        .ui-overlay {
            position: absolute;
            bottom: max(16px, env(safe-area-inset-bottom));
            right: max(16px, env(safe-area-inset-right));
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
        }

        .ctrl-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--control-bg);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background .15s ease, transform .1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .ctrl-btn:hover {
            background: var(--control-bg-hover);
        }

        .ctrl-btn:active {
            transform: scale(.92);
        }

        .ctrl-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--icon);
        }

        @media (max-width: 360px) {
            .title-box {
                font-size: 11px;
                padding: 4px 8px;
            }
            .ctrl-btn {
                width: 38px;
                height: 38px;
            }
            .ctrl-btn svg {
                width: 18px;
                height: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="tv-frame" id="tv-frame">
        <video id="player-1" class="video-layer active" muted playsinline></video>
        <video id="player-2" class="video-layer" muted playsinline></video>

        <div id="title-box" class="title-box">
            Now: Connecting...
        </div>

        <div class="logo-container-context">
            <img id="channelLogo" class="channel-logo" src="https://crickethd.pages.dev/apna3.webp" alt="Channel Logo">
        </div>
      <!-- Loading Spinner Overlay Layer -->
<div id="loadingOverlay" class="loading-overlay">
    <div class="red-spinner"></div>
    <div class="loading-text">Please Wait</div>
</div>


        <div class="ui-overlay">
            <button id="mute-btn" class="ctrl-btn" title="Unmute">
                <svg id="mute-icon" viewBox="0 0 24 24">
                    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                </svg>
            </button>

            <button id="fullscreen-btn" class="ctrl-btn" title="Fullscreen">
                <svg viewBox="0 0 24 24">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                </svg>
            </button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
(function () {
    class BroadcastPlayer {
        constructor(options = {}) {
            this.playlistUrl = options.playlistUrl || 'playlist200.json';
            this.videoElement = options.videoElement;
            this.playlist = [];
            this.referenceId = 'ref-100';
            this.anchorStartTime = 1700000000;
            
            this.currentVideoUrl = null;
            this.hls = null;
            this.isEnforcingSync = false; // Flag to prevent infinite seek loops during automatic snaps
            
            this.init();
        }

        async init() {
            await this.fetchPlaylist();
            this.syncPlayback();
            this.attachStrictBypassProtection();

            // High-frequency 1-second clock check
            setInterval(() => this.syncPlayback(), 1000);

            // Poll playlist JSON every 30 seconds for schedule updates
            setInterval(() => this.fetchPlaylist(), 30000);
        }

        async fetchPlaylist() {
            try {
                const response = await fetch(`${this.playlistUrl}?t=${Date.now()}`);
                if (!response.ok) return;
                
                const data = await response.json();
                this.playlist = data.playlist || [];
                this.referenceId = data.referenceId || 'ref-100';
                this.anchorStartTime = data.anchorStartTime || 1700000000;
            } catch (err) {
                console.error('[BroadcastPlayer] Failed to load JSON schedule:', err);
            }
        }

        calculateBroadcastState() {
            if (!this.playlist || this.playlist.length === 0) return null;

            const now = Math.floor(Date.now() / 1000);

            let refIndex = this.playlist.findIndex(item => item.id === this.referenceId);
            if (refIndex === -1) refIndex = 0;

            let refOffset = 0;
            for (let i = 0; i < refIndex; i++) {
                refOffset += (this.playlist[i].duration || 0);
            }

            const effectiveAnchorTime = this.anchorStartTime - refOffset;
            let elapsedSeconds = now - effectiveAnchorTime;

            const totalDuration = this.playlist.reduce((sum, item) => sum + (item.duration || 0), 0);
            if (totalDuration === 0) return null;

            let cyclePosition = elapsedSeconds % totalDuration;
            if (cyclePosition < 0) cyclePosition += totalDuration;

            let accumulatedTime = 0;
            for (let i = 0; i < this.playlist.length; i++) {
                const video = this.playlist[i];
                const videoDuration = video.duration || 0;

                if (cyclePosition >= accumulatedTime && cyclePosition < (accumulatedTime + videoDuration)) {
                    return {
                        index: i,
                        seekTo: cyclePosition - accumulatedTime,
                        video: video
                    };
                }
                accumulatedTime += videoDuration;
            }

            return { index: 0, seekTo: 0, video: this.playlist[0] };
        }

        syncPlayback() {
            const state = this.calculateBroadcastState();
            if (!state || !state.video) return;

            const { video, seekTo } = state;

            // 1. IF VIDEO CHANGED: Load new track
            if (this.currentVideoUrl !== video.url) {
                this.currentVideoUrl = video.url;
                this.loadMediaStream(video.url, seekTo);
                return;
            }

            // 2. AUTOMATIC STRICT DRIFT REVERT: Snaps back if player lags or jumps by > 2s
            if (this.videoElement && !this.videoElement.paused && this.videoElement.readyState >= 2) {
                const drift = Math.abs(this.videoElement.currentTime - seekTo);
                if (drift > 2) {
                    console.warn(`[BroadcastPlayer] Desync detected (${drift.toFixed(1)}s). Strictly reverting to live...`);
                    this.isEnforcingSync = true;
                    this.videoElement.currentTime = seekTo;
                    setTimeout(() => { this.isEnforcingSync = false; }, 200);
                }
            }
        }

        // AUTOMATIC ANTI-SCRUBBING & STRICT BYPASS PROTECTION
        attachStrictBypassProtection() {
            if (!this.videoElement) return;

            // A. Catch manual seeking attempts (scrub bar dragging / hotkeys / video jumps)
            this.videoElement.addEventListener('seeking', () => {
                if (this.isEnforcingSync) return;

                const state = this.calculateBroadcastState();
                if (!state) return;

                const targetLiveTime = state.seekTo;
                const userAttemptedTime = this.videoElement.currentTime;

                // Detect bypass attempt if user tries to seek more than 1.5 seconds away from live point
                if (Math.abs(userAttemptedTime - targetLiveTime) > 1.5) {
                    console.warn('[BroadcastPlayer] Bypass attempt detected! Snapping back to live broadcast point.');
                    this.isEnforcingSync = true;
                    this.videoElement.currentTime = targetLiveTime;
                    setTimeout(() => { this.isEnforcingSync = false; }, 200);
                }
            });

            // B. Catch pause/unpause buffer delays or background tab throttling
            this.videoElement.addEventListener('play', () => {
                const state = this.calculateBroadcastState();
                if (state) {
                    const drift = Math.abs(this.videoElement.currentTime - state.seekTo);
                    if (drift > 1.5) {
                        this.isEnforcingSync = true;
                        this.videoElement.currentTime = state.seekTo;
                        setTimeout(() => { this.isEnforcingSync = false; }, 200);
                    }
                }
            });
        }

        loadMediaStream(url, seekTo) {
            if (!this.videoElement) return;

            const isHls = url.includes('.m3u8');

            if (this.hls) {
                this.hls.destroy();
                this.hls = null;
            }

            if (isHls && typeof Hls !== 'undefined' && Hls.isSupported()) {
                this.hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: false
                });
                
                this.hls.loadSource(url);
                this.hls.attachMedia(this.videoElement);
                
                this.hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    this.isEnforcingSync = true;
                    this.videoElement.currentTime = seekTo;
                    this.videoElement.play().catch(() => {});
                    setTimeout(() => { this.isEnforcingSync = false; }, 200);
                });
            } else {
                this.videoElement.src = url;
                this.isEnforcingSync = true;
                this.videoElement.currentTime = seekTo;
                this.videoElement.play().catch(() => {});
                setTimeout(() => { this.isEnforcingSync = false; }, 200);
            }
        }
    }

    // Auto-initialize when DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
        const videoElem = document.querySelector('video');
        if (videoElem) {
            window.playerInstance = new BroadcastPlayer({
                playlistUrl: 'playlist200.json',
                videoElement: videoElem
            });
        }
    });
})();
</script>      
</body>
</html>
