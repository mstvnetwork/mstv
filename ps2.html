<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Linear Live TV Player</title>
    <!-- Include hls.js engine for native M3U8 handling across non-Safari browsers -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }
        .player-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        /* Anti-Throttling Viewport Array Layout Matrix */
        .player-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        /* Active Display State Rules */
        .player-layer.active {
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: auto;
        }
        video, iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
            display: block;
        }
        /* Persistent Global Audio Interaction Shield Overlay Barrier */
        #interaction-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            cursor: pointer;
            text-align: center;
            padding: 20px;
        }
        #interaction-shield h2 {
            font-size: 24px;
            margin-bottom: 12px;
            font-weight: 500;
        }
        #interaction-shield p {
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <script>
        // System Configurations
        const PLAYLIST_URL = 'playlist.json';
        const FALLBACK_URL = 'https://github.com';
        const POLL_INTERVAL = 30000; 
        const ALLOWED_SEEK_DRIFT = 2.5; 

        // Runtime State Objects Array Memory
        let state = {
            playlist: [],
            currentVideoIndex: -1,
            targetPosition: 0,
            activeLayer: 'layer1',
            hasUserInteracted: false,
            hlsInstances: { layer1: null, layer2: null }
        };

        // Initialize User Engagement Layer Gate Context Check
        function setupInteractionGate() {
            const shield = document.getElementById('interaction-shield');
            shield.addEventListener('click', () => {
                state.hasUserInteracted = true;
                shield.style.display = 'none';
                
                // Unmute whichever layer is currently active immediately upon initial user tap gesture
                const activeVid = document.getElementById(state.activeLayer).querySelector('video');
                if (activeVid) activeVid.muted = false;

                initEngine();
            }, { once: true });
        }

        async function initEngine() {
            await fetchPlaylist();
            syncEngine();
            setInterval(fetchPlaylist, POLL_INTERVAL);
            setInterval(syncEngine, 1000);
        }

        // Fetch dynamic playlist updates silently from Cloudflare Pages origin
        async function fetchPlaylist() {
            try {
                const response = await fetch(`${PLAYLIST_URL}?t=${Date.now()}`);
                if (!response.ok) throw new Error('Failed to read config layout array profile source');
                const data = await response.json();
                if (Array.isArray(data) && data.length > 0) {
                    state.playlist = data;
                } else {
                    useFallbackPlaylist();
                }
            } catch (error) {
                console.error("Playlist read failed, deploying fallback engine:", error);
                if (state.playlist.length === 0) useFallbackPlaylist();
            }
        }

        function useFallbackPlaylist() {
            state.playlist = [{
                url: FALLBACK_URL,
                duration: 86400 
            }];
        }

        // Global Epoch mathematical synchronization timeline calculation loop
        function syncEngine() {
            if (state.playlist.length === 0 || !state.hasUserInteracted) return;

            let totalPlaylistDuration = 0;
            const videoSegments = state.playlist.map(item => {
                const start = totalPlaylistDuration;
                totalPlaylistDuration += parseInt(item.duration, 10);
                return { ...item, start, end: totalPlaylistDuration };
            });

            const currentUnixTimeSeconds = Math.floor(Date.now() / 1000);
            const globalTimelinePosition = currentUnixTimeSeconds % totalPlaylistDuration;

            let matchedIndex = 0;
            let videoInsidePosition = 0;

            for (let i = 0; i < videoSegments.length; i++) {
                if (globalTimelinePosition >= videoSegments[i].start && globalTimelinePosition < videoSegments[i].end) {
                    matchedIndex = i;
                    videoInsidePosition = globalTimelinePosition - videoSegments[i].start;
                    break;
                }
            }

            state.targetPosition = videoInsidePosition;
            
            if (state.currentVideoIndex !== matchedIndex) {
                state.currentVideoIndex = matchedIndex;
                transitionToSource(state.playlist[matchedIndex], videoInsidePosition);
            } else {
                enforceAntiScrubbing();
            }
        }
                // Seamless zero-jump dual layer handoff mechanism switcher logic
        function transitionToSource(videoItem, startTime) {
            const nextLayer = state.activeLayer === 'layer1' ? 'layer2' : 'layer1';
            const currentLayer = state.activeLayer;
            const container = document.getElementById(nextLayer);
            
            destroyLayerEngine(nextLayer);
            container.innerHTML = '';

            const engineType = getEngineType(videoItem.url);

            if (engineType === 'iframe') {
                const iframe = document.createElement('iframe');
                iframe.src = videoItem.url;
                iframe.allow = "autoplay; encrypted-media; picture-in-picture";
                iframe.setAttribute('allowfullscreen', '');
                container.appendChild(iframe);
                
                executeLayerSwap(nextLayer, currentLayer);
            } else {
                const video = document.createElement('video');
                
                // Mute background player strictly during pre-buffering to bypass engine startup crashes
                video.muted = true; 
                video.playsInline = true;
                video.controls = false;
                container.appendChild(video);

                const startPlayback = () => {
                    video.currentTime = startTime;
                    // Safely execute playback with promise validation rejection catch blocks
                    const playPromise = video.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(error => {
                            console.warn("Playback engine start delayed, waiting frame availability:", error);
                        });
                    }
                };

                if (engineType === 'hls') {
                    if (Hls.isSupported()) {
                        const hls = new Hls({ config: { maxMaxBufferLength: 8, enableWorker: true } });
                        state.hlsInstances[nextLayer] = hls;
                        hls.loadSource(videoItem.url);
                        hls.attachMedia(video);
                        hls.on(Hls.Events.MANIFEST_PARSED, startPlayback);
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = videoItem.url;
                        video.addEventListener('loadedmetadata', startPlayback);
                    }
                } else {
                    video.src = videoItem.url;
                    video.addEventListener('loadedmetadata', startPlayback);
                }

                // Fire layer swap instantly as soon as active visual frames start processing inside memory
                video.addEventListener('playing', function onPlayingHandler() {
                    executeLayerSwap(nextLayer, currentLayer);
                    video.removeEventListener('playing', onPlayingHandler);
                });
            }
        }

        function executeLayerSwap(nextLayer, currentLayer) {
            document.getElementById(nextLayer).classList.add('active');
            document.getElementById(currentLayer).classList.remove('active');
            state.activeLayer = nextLayer;
            
            const nextVideo = document.getElementById(nextLayer).querySelector('video');
            if (nextVideo && state.hasUserInteracted) {
                // Now safely allowed because user interaction gate tokens are cleared globally
                nextVideo.muted = false;
            }

            setTimeout(() => {
                if (state.activeLayer !== currentLayer) { 
                    destroyLayerEngine(currentLayer);
                    document.getElementById(currentLayer).innerHTML = '';
                }
            }, 600);
        }

        // Silent anti-scrubbing lock validation check operations
        function enforceAntiScrubbing() {
            const activeVideo = document.getElementById(state.activeLayer).querySelector('video');
            if (!activeVideo || activeVideo.paused) return;

            const drift = Math.abs(activeVideo.currentTime - state.targetPosition);
            if (drift > ALLOWED_SEEK_DRIFT) {
                activeVideo.currentTime = state.targetPosition;
            }
        }

        function destroyLayerEngine(layerId) {
            if (state.hlsInstances[layerId]) {
                state.hlsInstances[layerId].destroy();
                state.hlsInstances[layerId] = null;
            }
        }

        function getEngineType(url) {
            if (url.includes('.m3u8') || url.includes('hls/')) return 'hls';
            if (url.includes('.mp4') || url.includes('releases/download')) return 'mp4';
            return 'iframe'; 
        }

        window.onload = setupInteractionGate;
    </script>
</body>
</html>
