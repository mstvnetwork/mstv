<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>MSTV Global Linear Stream (GitHub Releases)</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #000; color: #fff; overflow: hidden; font-family: sans-serif; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: 100%; max-width: 100vw; aspect-ratio: 16/9; max-height: 100vh; background: #000; }
  /* No native controls = blocked Samsung Video Assistant / mobile swipe scrubbing */
  video { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  #live-badge { position: absolute; top: 16px; left: 16px; z-index: 10; background: rgba(255,59,48,0.85); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
  #controls { position: absolute; bottom: 16px; right: 16px; z-index: 10; display: flex; gap: 8px; }
  button { width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(0,0,0,0.6); color: #fff; cursor: pointer; }
</style>
</head>
<body>
  <div id="stage">
    <div id="live-badge">● LIVE SYNC</div>
    <video id="vid" playsinline muted></video>
    <div id="controls">
      <button id="mute-btn">🔇</button>
      <button id="fs-btn">⛶</button>
    </div>
  </div>

  <script>
    // Replace with your actual GitHub Release MP4 direct download URLs and exact file durations in seconds
    const PLAYLIST = [
      { file: "https://github.com/mstvnetwork/mstv/releases/download/v1.0.0/wwe-1.compressed.mp4", duration: 149 },
      { file: "https://github.com/mstvnetwork/mstv/releases/download/v1/video2.mp4", duration: 180 }
    ];
    
    const ANCHOR = 1767225600000; // 2026-01-01T00:00:00Z global baseline
    const TOTAL_DURATION = PLAYLIST.reduce((acc, i) => acc + i.duration, 0);

    const video = document.getElementById("vid");
    const muteBtn = document.getElementById("mute-btn");
    const fsBtn = document.getElementById("fs-btn");
    let currentIdx = -1;

    function getGlobalPosition() {
      const elapsed = ((Date.now() - ANCHOR) % TOTAL_DURATION + TOTAL_DURATION) % TOTAL_DURATION;
      let acc = 0;
      for (let i = 0; i < PLAYLIST.length; i++) {
        if (elapsed < acc + PLAYLIST[i].duration) {
          return { index: i, offset: elapsed - acc };
        }
        acc += PLAYLIST[i].duration;
      }
      return { index: 0, offset: 0 };
    }

    async function syncPlayback() {
      if (document.visibilityState !== "visible") return;
      const { index, offset } = getGlobalPosition();
      const item = PLAYLIST[index];
      if (!item) return;

      if (index !== currentIdx) {
        currentIdx = index;
        video.src = item.file;
        await video.load();
        video.currentTime = offset;
        video.play().catch(() => {});
      } else {
        // Enforce drift correction if > 4s off
        if (Math.abs(video.currentTime - offset) > 4.0) {
          video.currentTime = offset;
        }
      }
    }

    setInterval(syncPlayback, 2000);
    syncPlayback();

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        syncPlayback();
      } else {
        try { video.pause(); } catch(e){}
      }
    });

    muteBtn.addEventListener("click", () => {
      video.muted = !video.muted;
      muteBtn.textContent = video.muted ? "🔇" : "🔊";
    });

    fsBtn.addEventListener("click", () => {
      if (!document.fullscreenElement) document.getElementById("stage").requestFullscreen?.();
      else document.exitFullscreen?.();
    });
  </script>
</body>
</html>
