<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Continuous Live TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #08080a;
            color: #fff;
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .player-container {
            position: relative;
            width: 95%;
            max-width: 960px;
            aspect-ratio: 16/9;
            background: #000;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.95);
            border-radius: 16px;
            border: 1px solid #14141f;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.4s ease-in-out;
            background: #000;
        }
        .active { opacity: 1; z-index: 2; }
        .hidden { opacity: 0; z-index: 1; pointer-events: none; }
        
        .overlay-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(8, 8, 10, 0.85);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            border-left: 4px solid #00bcff;
            backdrop-filter: blur(8px);
        }
        .unmute-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            background: #00bcff;
            color: white;
            border: none;
            padding: 18px 36px;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Space Grotesk', sans-serif;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,188,255,0.4);
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .unmute-btn:hover {
            transform: translate(-50%, -50%) scale(1.05);
            background: #009ad4;
        }
    </style>
</head>
<body>

<div class="player-container">
    <button id="unmuteBtn" class="unmute-btn" onclick="unmutePlayers()">🔊 Click to Unmute & Sync Live</button>
    <div id="statusOverlay" class="overlay-ui">Securing Time-Locked Node...</div>
    <video id="player1" class="active" playsinline muted></video>
    <video id="player2" class="hidden" playsinline muted></video>
</div>

<script>
// Memory State Engine 
let channelConfig = { playlist: [] };

let p1 = document.getElementById('player1');
let p2 = document.getElementById('player2');
let activePlayer = p1;
let inactivePlayer = p2;
let hlsInstances = { player1: null, player2: null };

let currentTrackUrl = ""; 
let isEnforcingSync = false;
let userHasInteracted = false;

function loadMediaSource(player, url, targetSeekTime) {
    const playerId = player.id;
    if (hlsInstances[playerId]) {
        hlsInstances[playerId].destroy();
        hlsInstances[playerId] = null;
    }

    const applyTargetSyncTime = () => {
        player.currentTime = targetSeekTime;
        if (userHasInteracted) {
            player.play().catch(() => {});
        }
    };

    if (url.toLowerCase().includes('.m3u8')) {
        if (Hls.isSupported()) {
            const hls = new Hls({ maxBufferLength: 8, enableWorker: true });
            hlsInstances[playerId] = hls;
            hls.loadSource(url);
            hls.attachMedia(player);
            hls.once(Hls.Events.MANIFEST_PARSED, applyTargetSyncTime);
        } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
            player.src = url;
            player.onloadedmetadata = applyTargetSyncTime;
        }
    } else {
        player.src = url;
        player.onloadedmetadata = applyTargetSyncTime;
    }
    player.load();
}

// Clock-Indexed Scheduler (Immune to Array Append/Remove Jumps)
function getClockIndexedState() {
    const playlist = channelConfig.playlist;
    if (!playlist || playlist.length === 0) {
        return { url: "", seekTo: 0, title: "Offline" };
    }

    // Use a fixed calendar baseline (e.g., Midnight Jan 1st, 2024 UTC)
    // This value NEVER changes, ensuring identical chronological tracking worldwide.
    const calendarBaselineSecs = 1704067200; 
    const currentGlobalSecs = Math.floor(Date.now() / 1000);
    const timelineProgressSecs = currentGlobalSecs - calendarBaselineSecs;

    // Step 1: Pre-calculate the linear timeline footprint for the CURRENT playlist setup
    let totalPlaylistDuration = 0;
    const segments = playlist.map((track, idx) => {
        const item = {
            url: track.url,
            duration: track.duration,
            startOffset: totalPlaylistDuration,
            endOffset: totalPlaylistDuration + track.duration,
            title: track.title || `Track #${idx + 1}`
        };
        totalPlaylistDuration += track.duration;
        return item;
    });

    // Step 2: Extract the deterministic timeline remainder position
    const currentPlaylistPosition = timelineProgressSecs % totalPlaylistDuration;

    // Step 3: Match the remainder directly to the video item playing in this block
    for (let i = 0; i < segments.length; i++) {
        const seg = segments[i];
        if (currentPlaylistPosition >= seg.startOffset && currentPlaylistPosition < seg.endOffset) {
            return {
                url: seg.url,
                seekTo: currentPlaylistPosition - seg.startOffset,
                title: seg.title
            };
        }
    }

    return { url: playlist[0].url, seekTo: 0, title: "Re-indexing Stream" };
}

function refreshPlayerEngine() {
    const state = getClockIndexedState();
    if (!state.url) return;

    // Seamless Player 1 & Player 2 Cross-Fading Update Handler
    if (currentTrackUrl !== state.url) {
        currentTrackUrl = state.url;
        
        // Stage the next video silently in the background
        loadMediaSource(inactivePlayer, state.url, state.seekTo);
        
        // Smooth cross-fade transition
        activePlayer.className = "hidden";
        inactivePlayer.className = "active";
        
        // Swap player roles
        let temp = activePlayer;
        activePlayer = inactivePlayer;
        inactivePlayer = temp;
        
        document.getElementById('statusOverlay').innerHTML = `🔴 <b>LIVE:</b> ${state.title}`;
    } else {
        // Strict Anti-Drift Lock Framework (2.0-second tolerance threshold)
        if (Math.abs(activePlayer.currentTime - state.seekTo) > 2.0) {
            isEnforcingSync = true;
            activePlayer.currentTime = state.seekTo;
            setTimeout(() => { isEnforcingSync = false; }, 300);
        }
    }
}

// Automatic Anti-Scrub System Lock Framework
function setupAntiScrubSecurity(playerElement) {
    playerElement.addEventListener('seeking', () => {
        if (!isEnforcingSync) {
            const state = getClockIndexedState();
            isEnforcingSync = true;
            playerElement.currentTime = state.seekTo;
            document.getElementById('statusOverlay').innerHTML = "🔒 <b>Anti-Scrub:</b> Playback Position Locked.";
            setTimeout(() => { isEnforcingSync = false; }, 400);
        }
    });
}

async function fetchServerlessPlaylist() {
    try {
        const response = await fetch('./playlist.json?nocache=' + Date.now());
        if (response.ok) {
            const data = await response.json();
            if (data && Array.isArray(data.playlist)) {
                channelConfig = data;
            }
        }
    } catch (e) {
        console.log("Local standalone network environment ready.");
    }
}

function unmutePlayers() {
    userHasInteracted = true;
    p1.muted = false;
    p2.muted = false;
    document.getElementById('unmuteBtn').style.display = 'none';
    
    const state = getClockIndexedState();
    activePlayer.play().catch(() => {
        loadMediaSource(activePlayer, state.url, state.seekTo);
    });
}

// Initial Core Hook Initialization
setupAntiScrubSecurity(p1);
setupAntiScrubSecurity(p2);

fetchServerlessPlaylist().then(() => {
    refreshPlayerEngine();
    setInterval(refreshPlayerEngine, 1000);
    setInterval(fetchServerlessPlaylist, 10000); // Dynamic JSON background polling every 10 seconds
});
</script>
</body>
</html>
