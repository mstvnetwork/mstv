<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>MSTV Live Broadcast</title>

    <style>

        :root {
            --control-bg: rgba(0, 0, 0, 0.65);
            --control-bg-hover: rgba(0, 0, 0, 0.85);
            --icon: #fff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            height: 100dvh;

            color: #fff;
            overflow: hidden;
        }

        .tv-frame {
            position: relative;

            width: 100vw;
            height: 100vh;
            height: 100dvh;

            background: #000;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-layer {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            opacity: 0;

            transition:
                opacity 0.25s ease-in-out;

            pointer-events: none;
        }

        .video-layer.active {
            opacity: 1;
            z-index: 1;
        }

        /* =====================================================
           LOGO
           ===================================================== */

        .logo-container-context {
            position: absolute;
            inset: 0;

            pointer-events: none;

            z-index: 15;

            container-type: inline-size;
        }

        .channel-logo {
            position: absolute;

            top: -1.3cqw;
            right: 2.5cqw;

            width: 18cqw;
            height: auto;

            object-fit: contain;

            opacity: 0.8;

            pointer-events: none;

            filter:
                drop-shadow(
                    1px 1px 2px rgba(0,0,0,0.5)
                );
        }

        /* =====================================================
           TITLE
           ===================================================== */

        .title-box {
            position: absolute;

            top:
                max(
                    16px,
                    env(safe-area-inset-top)
                );

            left:
                max(
                    16px,
                    env(safe-area-inset-left)
                );

            font-size: 14px;

            font-weight: 600;

            color: #f1f1f1;

            text-shadow:
                0 1px 3px rgba(0, 0, 0, 0.9);

            z-index: 100;

            max-width: 80vw;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            pointer-events: none;
        }

        /* =====================================================
           CONTROLS
           ===================================================== */

        .ui-overlay {
            position: absolute;

            bottom:
                max(
                    16px,
                    env(safe-area-inset-bottom)
                );

            right:
                max(
                    16px,
                    env(safe-area-inset-right)
                );

            display: flex;

            align-items: center;

            gap: 12px;

            z-index: 100;
        }

        .ctrl-btn {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            border: none;

            background:
                var(--control-bg);

            backdrop-filter: blur(6px);

            -webkit-backdrop-filter: blur(6px);

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            flex-shrink: 0;

            transition:
                background .15s ease,
                transform .1s ease;

            -webkit-tap-highlight-color:
                transparent;
        }

        .ctrl-btn:hover {
            background:
                var(--control-bg-hover);
        }

        .ctrl-btn:active {
            transform:
                scale(.92);
        }

        .ctrl-btn svg {
            width: 20px;
            height: 20px;

            fill: var(--icon);
        }

        @media (max-width: 360px) {

            .title-box {
                font-size: 11px;
                padding: 6px 10px;
            }

            .ctrl-btn {
                width: 38px;
                height: 38px;
            }

            .ctrl-btn svg {
                width: 18px;
                height: 18px;
            }

        }

    </style>

</head>


<body>


<div
    class="tv-frame"
    id="tv-frame">


    <!-- =====================================================
         VIDEO PLAYER 1
         ===================================================== -->

    <video
        id="player-1"
        class="video-layer active"
        muted
        autoplay
        playsinline>
    </video>


    <!-- =====================================================
         VIDEO PLAYER 2
         ===================================================== -->

    <video
        id="player-2"
        class="video-layer"
        muted
        autoplay
        playsinline>
    </video>


    <!-- =====================================================
         TITLE
         ===================================================== -->

    <div
        id="title-box"
        class="title-box">

        Now: Connecting...

    </div>


    <!-- =====================================================
         LOGO
         ===================================================== -->

    <div class="logo-container-context">

        <img
            id="channelLogo"
            class="channel-logo"
            src="https://crickethd.pages.dev/apna3.webp"
            alt="Apna TV Logo">

    </div>


    <!-- =====================================================
         UI
         ===================================================== -->

    <div class="ui-overlay">


        <!-- MUTE -->

        <button
            id="mute-btn"
            class="ctrl-btn"
            title="Unmute">

            <svg
                id="mute-icon"
                viewBox="0 0 24 24">

                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>

            </svg>

        </button>


        <!-- FULLSCREEN -->

        <button
            id="fullscreen-btn"
            class="ctrl-btn"
            title="Fullscreen">

            <svg
                viewBox="0 0 24 24">

                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>

            </svg>

        </button>

    </div>


</div>
                
<script>

/* =========================================================
   ELEMENTS
   ========================================================= */

const player1 =
    document.getElementById('player-1');

const player2 =
    document.getElementById('player-2');

const titleBox =
    document.getElementById('title-box');

const muteBtn =
    document.getElementById('mute-btn');

const muteIcon =
    document.getElementById('mute-icon');

const fullscreenBtn =
    document.getElementById('fullscreen-btn');

const tvFrame =
    document.getElementById('tv-frame');


/* =========================================================
   CONFIG
   ========================================================= */

const endpoint =
    '/get-live-stream';


/*
 * How close the actual player position must be to the
 * authoritative position before we consider synchronization
 * successful.
 */
const SYNC_TOLERANCE = 0.25;


/*
 * How frequently the strict anti-seek watchdog verifies the
 * active player's position.
 */
const POSITION_CHECK_INTERVAL = 100;


/* =========================================================
   PLAYER STATE
   ========================================================= */

let activePlayerSlot = 1;

let currentStreamUrl = "";

let isMasterMuted = true;


/* =========================================================
   PLAYLIST STATE
   ========================================================= */

let playlist = [];

let playlistIndex = 0;

let playlistInitialized = false;

let lastPlaylistSignature = "";


/*
 * Unique number for every transition.
 */
let transitionGeneration = 0;


/*
 * True while a new player is being prepared.
 */
let transitionInProgress = false;


/*
 * Expected active playlist URL.
 */
let activePlaylistUrl = "";


/* =========================================================
   SERVER SYNCHRONIZATION STATE
   ========================================================= */

let fetchTimestamp = 0;

let basePlayed = 0;


/*
 * Exact performance timestamp when the server response
 * was received.
 */
let syncReceivedAt = 0;


/* =========================================================
   END WATCHDOG
   ========================================================= */

let endWatchdog = null;

let endWatchdogGeneration = 0;


/* =========================================================
   STRICT PLAYER STATE
   ========================================================= */

const playerGuardState =
    new WeakMap();


function getGuardState(
    player
) {

    if (
        !playerGuardState.has(player)
    ) {

        playerGuardState.set(
            player,
            {
                locked: false,

                /*
                 * true while WE are performing the initial
                 * synchronization seek.
                 */
                syncing: false,

                /*
                 * true while we are correcting an illegal
                 * seek.
                 */
                correcting: false,

                /*
                 * Last known valid position.
                 */
                lastValidTime: 0
            }
        );

    }


    return playerGuardState.get(
        player
    );
}


/* =========================================================
   EXPECTED LIVE POSITION
   ========================================================= */

function getExpectedTime() {

    const elapsed =
        (
            performance.now() -
            syncReceivedAt
        ) / 1000;


    return Math.max(
        0,
        basePlayed + elapsed
    );
}


/* =========================================================
   GET ACTIVE PLAYER
   ========================================================= */

function getActivePlayer() {

    return activePlayerSlot === 1
        ? player1
        : player2;
}


/* =========================================================
   STRICT POSITION CORRECTION
   ========================================================= */

function forceCorrectTime(
    player
) {

    const state =
        getGuardState(player);


    /*
     * Never interfere with our initial synchronization.
     */
    if (
        !state.locked ||
        state.syncing ||
        state.correcting
    ) {
        return;
    }


    if (
        player.paused ||
        player.ended
    ) {
        return;
    }


    if (
        !Number.isFinite(
            player.duration
        ) ||
        player.duration <= 0
    ) {
        return;
    }


    const expected =
        getExpectedTime();


    /*
     * Natural end is handled by the playlist system.
     */
    if (
        expected >=
        player.duration
    ) {
        return;
    }


    const actual =
        player.currentTime;


    const difference =
        Math.abs(
            actual - expected
        );


    /*
     * Strict correction.
     */
    if (
        difference >
        SYNC_TOLERANCE
    ) {

        console.log(
            "ILLEGAL SEEK DETECTED:",
            {
                player: player.id,
                actual: actual,
                expected: expected,
                difference: difference
            }
        );


        state.correcting =
            true;


        try {

            player.currentTime =
                expected;

        } catch (error) {

            console.warn(
                "Seek correction failed:",
                error
            );

        }


        requestAnimationFrame(
            () => {

                state.correcting =
                    false;

            }
        );

    }


    state.lastValidTime =
        expected;
}


/* =========================================================
   LOCK PLAYER
   ========================================================= */

function lockPlayer(
    player
) {

    const state =
        getGuardState(player);


    state.locked =
        true;


    state.syncing =
        false;


    state.correcting =
        false;


    state.lastValidTime =
        player.currentTime || 0;


    player.playbackRate =
        1;


    console.log(
        "SEEK LOCK ENABLED:",
        player.id,
        "position:",
        player.currentTime
    );
}


/* =========================================================
   UNLOCK PLAYER
   ========================================================= */

function unlockPlayer(
    player
) {

    const state =
        getGuardState(player);


    state.locked =
        false;


    state.syncing =
        false;


    state.correcting =
        false;

}


/* =========================================================
   INITIAL SYNC MODE
   ========================================================= */

function beginInitialSync(
    player
) {

    const state =
        getGuardState(player);


    state.locked =
        false;


    state.syncing =
        true;


    state.correcting =
        false;

}


/* =========================================================
   STRICT SEEK EVENTS
   ========================================================= */

function attachStrictSeekGuard(
    player
) {

    const state =
        getGuardState(player);


    /* =====================================================
       SEEKING
       ===================================================== */

    player.addEventListener(
        'seeking',
        () => {

            /*
             * Initial synchronization seek is allowed.
             */
            if (
                state.syncing
            ) {
                return;
            }


            /*
             * Player isn't protected.
             */
            if (
                !state.locked
            ) {
                return;
            }


            /*
             * Our own correction.
             */
            if (
                state.correcting
            ) {
                return;
            }


            console.log(
                "SEEK EVENT:",
                player.id,
                player.currentTime
            );


            forceCorrectTime(
                player
            );

        }
    );


    /* =====================================================
       SEEKED
       ===================================================== */

    player.addEventListener(
        'seeked',
        () => {

            if (
                state.syncing
            ) {
                return;
            }


            if (
                !state.locked
            ) {
                return;
            }


            if (
                state.correcting
            ) {
                return;
            }


            forceCorrectTime(
                player
            );

        }
    );


    /* =====================================================
       TIMEUPDATE
       ===================================================== */

    player.addEventListener(
        'timeupdate',
        () => {

            if (
                !state.locked ||
                state.syncing
            ) {
                return;
            }


            forceCorrectTime(
                player
            );

        }
    );


    /* =====================================================
       RATE CHANGE
       ===================================================== */

    player.addEventListener(
        'ratechange',
        () => {

            if (
                state.locked &&
                !state.syncing &&
                player.playbackRate !== 1
            ) {

                player.playbackRate =
                    1;

            }

        }
    );


    /* =====================================================
       PAUSE
       ===================================================== */

    player.addEventListener(
        'pause',
        () => {

            if (
                !state.locked ||
                state.syncing ||
                player.ended
            ) {
                return;
            }


            const active =
                getActivePlayer();


            if (
                player === active
            ) {

                player
                    .play()
                    .catch(
                        () => {}
                    );

            }

        }
    );

}


/* =========================================================
   ATTACH GUARDS
   ========================================================= */

attachStrictSeekGuard(
    player1
);

attachStrictSeekGuard(
    player2
);


/* =========================================================
   MUTE
   ========================================================= */

muteBtn.addEventListener(
    'click',
    () => {

        isMasterMuted =
            !isMasterMuted;


        player1.muted =
            isMasterMuted;

        player2.muted =
            isMasterMuted;


        if (
            isMasterMuted
        ) {

            muteIcon.innerHTML = `
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            `;

            muteBtn.title =
                "Unmute";

        } else {

            muteIcon.innerHTML = `
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            `;

            muteBtn.title =
                "Mute";

        }

    }
);


/* =========================================================
   FULLSCREEN
   ========================================================= */

fullscreenBtn.addEventListener(
    'click',
    () => {

        if (
            !document.fullscreenElement
        ) {

            if (
                tvFrame.requestFullscreen
            ) {

                tvFrame.requestFullscreen();

            } else if (
                tvFrame.webkitRequestFullscreen
            ) {

                tvFrame.webkitRequestFullscreen();

            }

        } else {

            if (
                document.exitFullscreen
            ) {

                document.exitFullscreen();

            } else if (
                document.webkitExitFullscreen
            ) {

                document.webkitExitFullscreen();

            }

        }

    }
);


/* =========================================================
   CLEAR END WATCHDOG
   ========================================================= */

function clearEndWatchdog() {

    if (
        endWatchdog
    ) {

        clearInterval(
            endWatchdog
        );

        endWatchdog =
            null;

    }


    endWatchdogGeneration =
        0;
}


/* =========================================================
   START END WATCHDOG
   ========================================================= */

function startEndWatchdog(
    player,
    generation
) {

    clearEndWatchdog();


    endWatchdogGeneration =
        generation;


    endWatchdog =
        setInterval(
            () => {

                if (
                    generation !==
                    transitionGeneration
                ) {

                    clearEndWatchdog();

                    return;

                }


                if (
                    player !==
                    getActivePlayer()
                ) {
                    return;
                }


                if (
                    !player.classList.contains(
                        'active'
                    )
                ) {
                    return;
                }


                if (
                    !playlistInitialized ||
                    playlist.length === 0
                ) {
                    return;
                }


                if (
                    player.ended
                ) {

                    clearEndWatchdog();


                    advancePlaylist(
                        generation
                    );


                    return;

                }


                if (
                    Number.isFinite(
                        player.duration
                    ) &&

                    player.duration > 0 &&

                    player.currentTime >=
                        player.duration - 0.15
                ) {

                    clearEndWatchdog();


                    advancePlaylist(
                        generation
                    );

                }

            },
            250
        );
}


/* =========================================================
   GET NEXT PLAYLIST ITEM
   ========================================================= */

function getNextPlaylistItem() {

    if (
        !playlist ||
        playlist.length === 0
    ) {
        return null;
    }


    playlistIndex =
        (
            playlistIndex + 1
        ) %
        playlist.length;


    return playlist[
        playlistIndex
    ];
}


/* =========================================================
   PLAY PLAYLIST ITEM
   ========================================================= */

function playPlaylistItem(
    item,
    startTime = 0
) {

    if (
        !item ||
        !item.url
    ) {

        console.warn(
            "Invalid playlist item:",
            item
        );

        return;

    }


    transitionGeneration++;


    const generation =
        transitionGeneration;


    transitionInProgress =
        true;


    clearEndWatchdog();


    currentStreamUrl =
        item.url;


    activePlaylistUrl =
        item.url;


    titleBox.innerText =
        "Now: " +
        (
            item.title || ""
        );


    /*
     * Authoritative server position.
     */
    basePlayed =
        Math.max(
            0,
            Number(startTime) || 0
        );


    /*
     * Start the authoritative clock NOW.
     */
    syncReceivedAt =
        performance.now();


    fetchTimestamp =
        syncReceivedAt;


    console.log(
        "PLAYING:",
        playlistIndex,
        item.title,
        item.url,
        "generation:",
        generation,
        "serverPlayed:",
        basePlayed
    );


    switchVideoInstantly(
        item.url,
        basePlayed,
        generation
    );
}


/* =========================================================
   ADVANCE PLAYLIST
   ========================================================= */

function advancePlaylist(
    sourceGeneration = null
) {

    if (
        sourceGeneration !== null &&
        sourceGeneration !==
            transitionGeneration
    ) {

        console.log(
            "IGNORED OLD TRANSITION:",
            sourceGeneration,
            "current:",
            transitionGeneration
        );

        return;

    }


    if (
        transitionInProgress
    ) {

        console.log(
            "IGNORED ADVANCE DURING TRANSITION"
        );

        return;

    }


    if (
        !playlist ||
        playlist.length === 0
    ) {
        return;
    }


    const nextItem =
        getNextPlaylistItem();


    if (
        !nextItem ||
        !nextItem.url
    ) {

        console.warn(
            "No valid next playlist item."
        );

        return;

    }


    console.log(
        "NEXT PLAYLIST ITEM:",
        playlistIndex,
        nextItem.title
    );


    playPlaylistItem(
        nextItem,
        0
    );
}


/* =========================================================
   ENDED EVENT
   ========================================================= */

function attachPlaylistEndedHandler(
    player
) {

    player.addEventListener(
        'ended',
        () => {

            console.log(
                "ENDED:",
                player.id,
                "URL:",
                player.currentSrc
            );


            if (
                !player.classList.contains(
                    'active'
                )
            ) {
                return;
            }


            if (
                currentStreamUrl &&
                player.currentSrc !==
                    currentStreamUrl
            ) {

                console.log(
                    "IGNORED ENDED FROM OLD URL"
                );

                return;

            }


            if (
                !playlistInitialized ||
                playlist.length === 0
            ) {
                return;
            }


            clearEndWatchdog();


            advancePlaylist(
                transitionGeneration
            );

        }
    );

}


attachPlaylistEndedHandler(
    player1
);

attachPlaylistEndedHandler(
    player2
);


/* =========================================================
   PLAYLIST SIGNATURE
   ========================================================= */

function createPlaylistSignature(
    items
) {

    if (
        !Array.isArray(items)
    ) {
        return "";
    }


    return items
        .map(
            item =>
                (
                    item.url || ""
                ) +
                "|" +
                (
                    item.title || ""
                ) +
                "|" +
                (
                    item.startHour || 0
                ) +
                ":" +
                (
                    item.startMinute || 0
                ) +
                ":" +
                (
                    item.startSecond || 0
                )
        )
        .join("||");
}


/* =========================================================
   WAIT FOR REAL SEEK
   ========================================================= */

function seekAndVerify(
    player,
    target,
    generation
) {

    return new Promise(
        resolve => {

            if (
                generation !==
                transitionGeneration
            ) {

                resolve(false);

                return;

            }


            /*
             * If target is already essentially where we want
             * to be, no seek is required.
             */
            if (
                Math.abs(
                    player.currentTime -
                    target
                ) <=
                SYNC_TOLERANCE
            ) {

                resolve(true);

                return;

            }


            let finished =
                false;


            let timeoutId =
                null;


            const cleanup =
                () => {

                    player.removeEventListener(
                        'seeked',
                        onSeeked
                    );


                    if (
                        timeoutId
                    ) {

                        clearTimeout(
                            timeoutId
                        );

                    }

                };


            const finish =
                success => {

                    if (
                        finished
                    ) {
                        return;
                    }


                    finished =
                        true;


                    cleanup();


                    resolve(
                        success
                    );

                };


            const onSeeked =
                () => {

                    if (
                        generation !==
                        transitionGeneration
                    ) {

                        finish(false);

                        return;

                    }


                    const difference =
                        Math.abs(
                            player.currentTime -
                            target
                        );


                    console.log(
                        "SEEK COMPLETE:",
                        {
                            requested: target,
                            actual: player.currentTime,
                            difference: difference
                        }
                    );


                    finish(
                        difference <=
                        SYNC_TOLERANCE
                    );

                };


            player.addEventListener(
                'seeked',
                onSeeked
            );


            try {

                player.currentTime =
                    target;

            } catch (error) {

                console.warn(
                    "Initial synchronization seek failed:",
                    error
                );


                finish(false);

                return;

            }


            /*
             * Some browsers do not reliably fire seeked for
             * every HLS/proxy situation.
             *
             * Verify after a short delay as a fallback.
             */
            timeoutId =
                setTimeout(
                    () => {

                        if (
                            generation !==
                            transitionGeneration
                        ) {

                            finish(false);

                            return;

                        }


                        const difference =
                            Math.abs(
                                player.currentTime -
                                target
                            );


                        console.log(
                            "SEEK FALLBACK CHECK:",
                            {
                                requested: target,
                                actual: player.currentTime,
                                difference: difference
                            }
                        );


                        finish(
                            difference <=
                            SYNC_TOLERANCE
                        );

                    },
                    1500
                );

        }
    );
}


/* =========================================================
   DOUBLE BUFFER SWITCH
   ========================================================= */

async function switchVideoInstantly(
    newUrl,
    targetTime,
    generation
) {

    const activePlayer =
        getActivePlayer();


    const standbyPlayer =
        activePlayerSlot === 1
            ? player2
            : player1;


    /*
     * This player is going to perform an initial
     * synchronization seek.
     */
    beginInitialSync(
        standbyPlayer
    );


    /*
     * Calculate the elapsed time between receiving the
     * authoritative server position and beginning playback.
     */
    const elapsedBeforeLoad =
        (
            performance.now() -
            syncReceivedAt
        ) / 1000;


    let startPos =
        Number(targetTime || 0) +
        elapsedBeforeLoad;


    console.log(
        "PREPARING SYNC:",
        {
            player: standbyPlayer.id,
            serverPosition: targetTime,
            elapsedBeforeLoad: elapsedBeforeLoad,
            requestedPosition: startPos,
            generation: generation
        }
    );


    /* =====================================================
       RESET STANDBY PLAYER
       ===================================================== */

    standbyPlayer.onloadedmetadata =
        null;

    standbyPlayer.oncanplay =
        null;


    standbyPlayer.pause();


    standbyPlayer.removeAttribute(
        'src'
    );


    standbyPlayer.load();


    /* =====================================================
       URL
       ===================================================== */

    standbyPlayer.src =
        newUrl;


    standbyPlayer.muted =
        isMasterMuted;


    standbyPlayer.playbackRate =
        1;


    /* =====================================================
       LOAD
       ===================================================== */

    standbyPlayer.load();


    /* =====================================================
       WAIT FOR METADATA
       ===================================================== */

    await new Promise(
        resolve => {

            if (
                generation !==
                transitionGeneration
            ) {

                resolve();

                return;

            }


            const onMetadata =
                () => {

                    standbyPlayer.removeEventListener(
                        'loadedmetadata',
                        onMetadata
                    );


                    resolve();

                };


            standbyPlayer.addEventListener(
                'loadedmetadata',
                onMetadata
            );

        }
    );


    /*
     * Transition may have become obsolete while loading.
     */
    if (
        generation !==
        transitionGeneration
    ) {

        return;
    }


    console.log(
        "METADATA READY:",
        {
            player: standbyPlayer.id,
            duration: standbyPlayer.duration,
            requestedPosition: startPos
        }
    );


    /* =====================================================
       VALIDATE TARGET
       ===================================================== */

    if (
        Number.isFinite(
            standbyPlayer.duration
        ) &&
        standbyPlayer.duration > 0
    ) {

        /*
         * Never wrap around.
         */
        if (
            startPos >=
            standbyPlayer.duration
        ) {

            console.warn(
                "SERVER POSITION IS AT END:",
                {
                    requested: startPos,
                    duration: standbyPlayer.duration
                }
            );


            startPos =
                Math.max(
                    0,
                    standbyPlayer.duration -
                    0.05
                );

        }

    }


    /* =====================================================
       PERFORM INITIAL SYNC SEEK
       ===================================================== */

    const syncSuccess =
        await seekAndVerify(
            standbyPlayer,
            startPos,
            generation
        );


    if (
        generation !==
        transitionGeneration
    ) {

        return;
    }


    console.log(
        "SYNC RESULT:",
        {
            player: standbyPlayer.id,
            success: syncSuccess,
            requested: startPos,
            actual: standbyPlayer.currentTime,
            duration: standbyPlayer.duration
        }
    );


    /*
     * If the browser failed to seek, try one more explicit
     * assignment before giving up.
     */
    if (
        !syncSuccess
    ) {

        console.warn(
            "FIRST SYNC FAILED - RETRYING:",
            {
                target: startPos,
                actual: standbyPlayer.currentTime
            }
        );


        try {

            standbyPlayer.currentTime =
                startPos;

        } catch (error) {

            console.warn(
                "Second synchronization seek failed:",
                error
            );

        }


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    300
                )
        );


        if (
            generation !==
            transitionGeneration
        ) {

            return;
        }


        const retryDifference =
            Math.abs(
                standbyPlayer.currentTime -
                startPos
            );


        console.log(
            "SYNC RETRY RESULT:",
            {
                target: startPos,
                actual: standbyPlayer.currentTime,
                difference: retryDifference
            }
        );

    }


    /* =====================================================
       CAN PLAY
       ===================================================== */

    await new Promise(
        resolve => {

            if (
                standbyPlayer.readyState >= 3
            ) {

                resolve();

                return;

            }


            const onCanPlay =
                () => {

                    standbyPlayer.removeEventListener(
                        'canplay',
                        onCanPlay
                    );


                    resolve();

                };


            standbyPlayer.addEventListener(
                'canplay',
                onCanPlay
            );

        }
    );


    if (
        generation !==
        transitionGeneration
    ) {

        return;
    }


    /* =====================================================
       FINAL POSITION CHECK
       ===================================================== */

    console.log(
        "FINAL PRE-PLAY POSITION:",
        {
            requested: startPos,
            actual: standbyPlayer.currentTime,
            difference:
                Math.abs(
                    standbyPlayer.currentTime -
                    startPos
                )
        }
    );


    /*
     * If the browser moved away from our requested position
     * while buffering, restore it once more.
     */
    if (
        Math.abs(
            standbyPlayer.currentTime -
            startPos
        ) >
        SYNC_TOLERANCE
    ) {

        try {

            standbyPlayer.currentTime =
                startPos;

        } catch (error) {

            console.warn(
                "Final sync correction failed:",
                error
            );

        }


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    150
                )
        );

    }


    if (
        generation !==
        transitionGeneration
    ) {

        return;
    }


    /* =====================================================
       PLAY
       ===================================================== */

    try {

        await standbyPlayer.play();

    } catch (error) {

        console.warn(
            "Playback deferred:",
            error
        );


        return;
    }


    if (
        generation !==
        transitionGeneration
    ) {

        return;
    }


    /* =====================================================
       ACTIVATE NEW PLAYER
       ===================================================== */

    standbyPlayer.classList.add(
        'active'
    );


    activePlayer.classList.remove(
        'active'
    );


    /*
     * Stop old player.
     */
    activePlayer.pause();


    activePlayer.removeAttribute(
        'src'
    );


    activePlayer.load();


    /* =====================================================
       SWAP ACTIVE PLAYER
       ===================================================== */

    activePlayerSlot =
        activePlayerSlot === 1
            ? 2
            : 1;


    /* =====================================================
       LOCK NEW PLAYER
       ===================================================== */

    lockPlayer(
        standbyPlayer
    );


    /*
     * Old player is no longer protected.
     */
    unlockPlayer(
        activePlayer
    );


    transitionInProgress =
        false;


    /* =====================================================
       WATCHDOG
       ===================================================== */

    if (
        playlistInitialized &&
        playlist.length > 0
    ) {

        startEndWatchdog(
            standbyPlayer,
            generation
        );

    }


    console.log(
        "ACTIVE PLAYER:",
        standbyPlayer.id,
        "generation:",
        generation,
        "FINAL POSITION:",
        standbyPlayer.currentTime,
        "EXPECTED:",
        getExpectedTime()
    );

}


/* =========================================================
   POLL SERVER
   ========================================================= */

function pollLiveConfig() {

    fetch(
        endpoint +
        '?t=' +
        Date.now(),
        {
            cache: 'no-store'
        }
    )

    .then(
        response => {

            if (
                !response.ok
            ) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            return response.json();

        }
    )

    .then(
        data => {

            /* =================================================
               PLAYLIST RESPONSE
               ================================================= */

            if (
                Array.isArray(
                    data.playlist
                ) &&
                data.playlist.length > 0
            ) {

                const newPlaylist =
                    data.playlist;


                const newSignature =
                    createPlaylistSignature(
                        newPlaylist
                    );


                const playlistChanged =
                    newSignature !==
                    lastPlaylistSignature;


                playlist =
                    newPlaylist;


                /* =============================================
                   FIRST CONNECTION
                   ============================================= */

                if (
                    !playlistInitialized
                ) {

                    playlistIndex =
                        Number.isInteger(
                            data.playlistIndex
                        )
                            ? data.playlistIndex
                            : 0;


                    if (
                        playlistIndex < 0 ||
                        playlistIndex >=
                            playlist.length
                    ) {

                        playlistIndex =
                            0;

                    }


                    const initialItem =
                        playlist[
                            playlistIndex
                        ];


                    if (
                        initialItem &&
                        initialItem.url
                    ) {

                        /*
                         * IMPORTANT:
                         *
                         * Capture the server response time
                         * BEFORE starting the video.
                         */
                        syncReceivedAt =
                            performance.now();


                        basePlayed =
                            Math.max(
                                0,
                                Number(
                                    data.played
                                ) || 0
                            );


                        console.log(
                            "===================================="
                        );


                        console.log(
                            "INITIAL SERVER SYNC:"
                        );


                        console.log(
                            {
                                playlistIndex:
                                    playlistIndex,

                                played:
                                    data.played,

                                numericPlayed:
                                    basePlayed,

                                title:
                                    initialItem.title,

                                url:
                                    initialItem.url
                            }
                        );


                        console.log(
                            "===================================="
                        );


                        playlistInitialized =
                            true;


                        lastPlaylistSignature =
                            newSignature;


                        playPlaylistItem(
                            initialItem,
                            basePlayed
                        );

                    }


                    return;

                }


                /* =============================================
                   PLAYLIST UPDATE
                   ============================================= */

                if (
                    playlistChanged
                ) {

                    console.log(
                        "PLAYLIST UPDATED FROM SERVER"
                    );


                    const currentIndex =
                        playlist.findIndex(
                            item =>
                                item &&
                                item.url ===
                                    currentStreamUrl
                        );


                    if (
                        currentIndex !== -1
                    ) {

                        playlistIndex =
                            currentIndex;

                    } else {

                        playlistIndex =
                            Math.min(
                                playlistIndex,
                                playlist.length - 1
                            );

                    }


                    lastPlaylistSignature =
                        newSignature;

                }

            }


            /* =================================================
               SINGLE STREAM FALLBACK
               ================================================= */

            else if (
                data.url
            ) {

                playlist = [];

                playlistIndex = 0;

                playlistInitialized =
                    false;

                lastPlaylistSignature =
                    "";

                clearEndWatchdog();


                if (
                    data.url !==
                    currentStreamUrl
                ) {

                    currentStreamUrl =
                        data.url;


                    activePlaylistUrl =
                        "";


                    titleBox.innerText =
                        "Now: " +
                        (
                            data.title || ""
                        );


                    syncReceivedAt =
                        performance.now();


                    basePlayed =
                        Math.max(
                            0,
                            Number(
                                data.played
                            ) || 0
                        );


                    transitionGeneration++;


                    switchVideoInstantly(
                        data.url,
                        basePlayed,
                        transitionGeneration
                    );

                }

            }

        }
    )

    .catch(
        error => {

            console.warn(
                "Polling sync notice:",
                error
            );

        }
    )

    .finally(
        () => {

            setTimeout(
                pollLiveConfig,
                1000
            );

        }
    );

}


/* =========================================================
   START
   ========================================================= */

console.log(
    "MSTV player starting..."
);


pollLiveConfig();
