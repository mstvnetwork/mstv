<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>MSTV Live Broadcast</title>


    <style>

        :root {
            --control-bg: rgba(0, 0, 0, 0.65);
            --control-bg-hover: rgba(0, 0, 0, 0.85);
            --icon: #fff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            height: 100dvh;

            color: #fff;
            overflow: hidden;
        }

        .tv-frame {
            position: relative;

            width: 100vw;
            height: 100vh;
            height: 100dvh;

            background: #000;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-layer {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            opacity: 0;

            transition:
                opacity 0.25s ease-in-out;

            pointer-events: none;
        }

        .video-layer.active {
            opacity: 1;
            z-index: 1;
        }
                /* --- ISOLATED LOGO ENGINE --- */
.logo-container-context {
    position: absolute;
    inset: 0;                
    pointer-events: none;    
    z-index: 15;             
    container-type: inline-size; 
}

/* --- CHANNEL LOGO LAYOUT --- */
.channel-logo {
    position: absolute;
    top: -1.3cqw;            
    right: 2.5cqw;  
    width: 18cqw;   
    height: auto;   
    object-fit: contain;
    opacity: 0.8;   
    pointer-events: none;
    filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.5));
}

        .title-box {
            position: absolute;

            top:
                max(
                    16px,
                    env(safe-area-inset-top)
                );

            left:
                max(
                    16px,
                    env(safe-area-inset-left)
                );

            font-size: 14px;
            font-weight: 600;

            color: #f1f1f1;

            text-shadow:
                0 1px 3px rgba(0, 0, 0, 0.9);

            z-index: 100;

            max-width: 80vw;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            pointer-events: none;
        }

        .ui-overlay {
            position: absolute;

            bottom:
                max(
                    16px,
                    env(safe-area-inset-bottom)
                );

            right:
                max(
                    16px,
                    env(safe-area-inset-right)
                );

            display: flex;
            align-items: center;

            gap: 12px;

            z-index: 100;
        }

        .ctrl-btn {
            width: 42px;
            height: 42px;

            border-radius: 50%;
            border: none;

            background:
                var(--control-bg);

            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            flex-shrink: 0;

            transition:
                background .15s ease,
                transform .1s ease;

            -webkit-tap-highlight-color:
                transparent;
        }

        .ctrl-btn:hover {
            background:
                var(--control-bg-hover);
        }

        .ctrl-btn:active {
            transform:
                scale(.92);
        }

        .ctrl-btn svg {
            width: 20px;
            height: 20px;

            fill: var(--icon);
        }

        @media (max-width: 360px) {

            .title-box {
                font-size: 11px;
                padding: 6px 10px;
            }

            .ctrl-btn {
                width: 38px;
                height: 38px;
            }

            .ctrl-btn svg {
                width: 18px;
                height: 18px;
            }
        }

    </style>

</head>


<body>


<script>
const player1 = document.getElementById('player-1');
const player2 = document.getElementById('player-2');
const titleBox = document.getElementById('title-box');
const muteBtn = document.getElementById('mute-btn');
const muteIcon = document.getElementById('mute-icon');
const fullscreenBtn = document.getElementById('fullscreen-btn');
const tvFrame = document.getElementById('tv-frame');

const endpoint = '/get-live-stream';

let activePlayerSlot = 1;
let currentStreamUrl = "";
let isMasterMuted = true;

// Playlist state
let playlist = [];
let playlistIndex = 0;
let playlistInitialized = false;

// Tracking state for anti-scrub guard and scheduling
let fetchTimestamp = 0;
let basePlayed = 0;
let isReverting = false;

// Guards against overlapping "ended" transitions firing twice
let transitionInFlight = false;

// Master Mute Sync
muteBtn.addEventListener('click', () => {
    isMasterMuted = !isMasterMuted;
    player1.muted = isMasterMuted;
    player2.muted = isMasterMuted;

    if (isMasterMuted) {
        muteIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
        muteBtn.title = "Unmute";
    } else {
        muteIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
        muteBtn.title = "Mute";
    }
});

// Fullscreen Toggle
fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
        if (tvFrame.requestFullscreen) tvFrame.requestFullscreen();
        else if (tvFrame.webkitRequestFullscreen) tvFrame.webkitRequestFullscreen();
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
});

// Strict Anti-Scrubbing Guard
function attachTimeupdateGuard(playerInstance) {
    playerInstance.addEventListener('timeupdate', () => {
        if (isReverting || playerInstance.paused || !playerInstance.duration) return;

        const elapsed = (performance.now() - fetchTimestamp) / 1000;
        let target = basePlayed + elapsed;
        if (playerInstance.duration && playerInstance.duration > 0) {
            target = target % playerInstance.duration;
        }

        if (Math.abs(playerInstance.currentTime - target) > 2.5) {
            isReverting = true;
            playerInstance.currentTime = target;
            setTimeout(() => { isReverting = false; }, 300);
        }
    });
}

attachTimeupdateGuard(player1);
attachTimeupdateGuard(player2);

// Advance to the next playlist item (wraps to 0 at the end) and play it
function playNextInPlaylist() {
    if (playlist.length === 0 || transitionInFlight) return;
    transitionInFlight = true;

    playlistIndex = (playlistIndex + 1) % playlist.length;
    const nextItem = playlist[playlistIndex];

    currentStreamUrl = nextItem.url;
    titleBox.innerText = "Now: " + (nextItem.title || '');
    fetchTimestamp = performance.now();
    basePlayed = 0; // always start a fresh loop item at 0

    switchVideoInstantly(nextItem.url, 0, () => {
        transitionInFlight = false;
    });
}

// Auto-Loop Playlist Handler
function attachPlaylistEndedHandler(playerInstance) {
    playerInstance.addEventListener('ended', () => {
        // Only the currently active player should trigger advancement
        if (!playerInstance.classList.contains('active')) return;
        playNextInPlaylist();
    });
}

attachPlaylistEndedHandler(player1);
attachPlaylistEndedHandler(player2);

// Real-Time Polling Loop
function pollLiveConfig() {
    fetch(endpoint + '?t=' + Date.now())
        .then(res => res.json())
        .then(data => {
            const newPlaylist = Array.isArray(data) ? data : (data.playlist || null);

            if (newPlaylist && newPlaylist.length > 0) {
                playlist = newPlaylist;

                if (!playlistInitialized) {
                    playlistInitialized = true;
                    playlistIndex = 0;
                    const initialItem = playlist[playlistIndex];
                    currentStreamUrl = initialItem.url;
                    titleBox.innerText = "Now: " + (initialItem.title || '');
                    fetchTimestamp = performance.now();
                    basePlayed = initialItem.played || 0;
                    switchVideoInstantly(initialItem.url, basePlayed);
                }
                // NOTE: once initialized, playlist advancement is driven locally
                // by the 'ended' event (playNextInPlaylist), not by re-polling —
                // this preserves your live-schedule sync on first load while
                // letting the loop run client-side afterward.

            } else if (data.url && data.url !== currentStreamUrl) {
                currentStreamUrl = data.url;
                if (data.title) titleBox.innerText = "Now: " + data.title;
                basePlayed = data.played || 0;
                fetchTimestamp = performance.now();
                switchVideoInstantly(data.url, basePlayed);
            }
        })
        .catch(err => {
            console.warn("Polling sync notice:", err);
        })
        .finally(() => {
            setTimeout(pollLiveConfig, 1000);
        });
}

// Double-buffering transition handler (now accepts an optional onDone callback)
function switchVideoInstantly(newUrl, targetTime, onDone) {
    const activePlayer = activePlayerSlot === 1 ? player1 : player2;
    const standbyPlayer = activePlayerSlot === 1 ? player2 : player1;

    const elapsed = (performance.now() - fetchTimestamp) / 1000;
    let startPos = targetTime + elapsed;

    standbyPlayer.src = newUrl;
    standbyPlayer.muted = isMasterMuted;

    standbyPlayer.onloadedmetadata = () => {
        if (standbyPlayer.duration && standbyPlayer.duration > 0) {
            startPos = startPos % standbyPlayer.duration;
        }
        standbyPlayer.currentTime = startPos;
    };

    standbyPlayer.load();

    standbyPlayer.oncanplay = () => {
        standbyPlayer.play().then(() => {
            standbyPlayer.classList.add('active');
            activePlayer.classList.remove('active');

            activePlayer.pause();
            activePlayer.src = "";

            activePlayerSlot = activePlayerSlot === 1 ? 2 : 1;

            if (typeof onDone === 'function') onDone();
        }).catch(e => {
            console.log("Playback constraint deferred:", e);
            if (typeof onDone === 'function') onDone();
        });
    };
}

// Ensure fallback video pause handler keeps it playing live
player1.addEventListener('pause', () => { if (!player1.ended && player1.classList.contains('active')) player1.play().catch(() => {}); });
player2.addEventListener('pause', () => { if (!player2.ended && player2.classList.contains('active')) player2.play().catch(() => {}); });

pollLiveConfig();
        </script>
        </body>
        </html>
