<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Serverless Globally Synced Live TV</title>
    <style>
      body, html { background-color: #000; height: 100%; width: 100%; margin: 0; overflow: hidden; }
      video { position: fixed; top: 0; left: 0; min-width: 100%; min-height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>

    <!-- Seamless Dual Player Buffer Components -->
    <video id="video1" muted playsinline></video>
    <video id="video2" muted playsinline></video>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
      const basePath = "https://github.com/mstvnetwork/test1/releases/download/v1/";

      let schedule = null;
      
      let activeVideo = $('#video1');
      let bufferVideo = $('#video2');
      let switchTimeout = null;

      // Core synchronization engine logic
      async function initLiveSync() {
        try {
          // Fetch the static schedule file baked by your repository automation
          const response = await fetch('schedule.json?t=' + new Date().getTime());
          schedule = await response.json();
          
          // Immediately sync the video stream location
          syncPlayer(true);
          
          // Periodically monitor playback position alignment
          setInterval(() => syncPlayer(false), 2000);
        } catch (e) {
          console.error("Failed to synchronize with serverless timeline schedule:", e);
        }
      }

      function calculateCurrentBroadcast() {
        const currentUnixTime = Math.floor(Date.now() / 1000);
        const elapsedSeconds = currentUnixTime - schedule.anchorTime;
        
        // Determine the remainder position within the overall looping block
        let currentLoopPosition = elapsedSeconds % schedule.totalDuration;
        if (currentLoopPosition < 0) currentLoopPosition += schedule.totalDuration;

        let accumulatedTime = 0;
        for (let i = 0; i < schedule.playlist.length; i++) {
          const clip = schedule.playlist[i];
          if (currentLoopPosition >= accumulatedTime && currentLoopPosition < (accumulatedTime + clip.duration)) {
            return {
              index: i,
              file: clip.file,
              seekTo: currentLoopPosition - accumulatedTime,
              remaining: (accumulatedTime + clip.duration) - currentLoopPosition
            };
          }
          accumulatedTime += clip.duration;
        }
        return null;
      }

      function syncPlayer(isFirstLoad) {
        if (!schedule) return;
        
        const broadcast = calculateCurrentBroadcast();
        if (!broadcast) return;

        const currentEl = activeVideo.get(0);
        const expectedSrc = basePath + broadcast.file;

        // If the current video source doesn't match the timeline or the player has drifted
        if (isFirstLoad || currentEl.src !== expectedSrc || Math.abs(currentEl.currentTime - broadcast.seekTo) > 2) {
          console.log(`Syncing channel: Loading ${broadcast.file} jumping to ${broadcast.seekTo.toFixed(2)}s`);
          
          currentEl.src = expectedSrc;
          currentEl.currentTime = broadcast.seekTo;
          currentEl.play().catch(err => console.log("Playback interaction deferred:", err));
          
          setupSeamlessTransition(broadcast.remaining);
        }
      }

      function setupSeamlessTransition(timeRemaining) {
        clearTimeout(switchTimeout);
        
        // Queue the next source transition to execute precisely 0.5 seconds before the video ends
        const triggerDelay = (timeRemaining - 0.5) * 1000;
        if (triggerDelay <= 0) return;

        switchTimeout = setTimeout(() => {
          // Identify the upcoming scheduled item in sequence loop
          const currentUnixTime = Math.floor(Date.now() / 1000) + 1; 
          const elapsedSeconds = currentUnixTime - schedule.anchorTime;
          let currentLoopPosition = elapsedSeconds % schedule.totalDuration;
          
          let nextClipFile = schedule.playlist[0].file;
          let accum = 0;
          for (let i = 0; i < schedule.playlist.length; i++) {
            if (currentLoopPosition >= accum && currentLoopPosition < (accum + schedule.playlist[i].duration)) {
              nextClipFile = schedule.playlist[i].file;
              break;
            }
            accum += schedule.playlist[i].duration;
          }

          // Prime the background element buffer layer
          const bufferEl = bufferVideo.get(0);
          bufferEl.src = basePath + nextClipFile;
          bufferEl.currentTime = 0;
          bufferEl.play().catch(() => {});

          // Transition the display visibility layers
          setTimeout(() => {
            bufferVideo.css('z-index', '500');
            activeVideo.css('z-index', '0');
            activeVideo.get(0).pause();

            // Swap player identities for continuous execution rotation
            const temp = activeVideo;
            activeVideo = bufferVideo;
            bufferVideo = temp;
            
            // Re-arm synchronization loops
            syncPlayer(false);
          }, 500);

        }, triggerDelay);
      }

      $(document).ready(initLiveSync);
    </script>
  </body>
</html>
