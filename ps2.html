<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>MSTV Global Linear Stream</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #000; color: #fff; overflow: hidden; font-family: sans-serif; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: 100%; max-width: 100vw; aspect-ratio: 16/9; max-height: 100vh; background: #000; }
  video { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  #live-badge { position: absolute; top: 16px; left: 16px; z-index: 10; background: rgba(255,59,48,0.85); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
  #controls { position: absolute; bottom: 16px; right: 16px; z-index: 10; display: flex; gap: 8px; }
  button { width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(0,0,0,0.6); color: #fff; cursor: pointer; }
</style>
</head>
<body>
  <div id="stage">
    <div id="live-badge">● LIVE SYNC</div>
    <video id="vid" playsinline muted></video>
    <div id="controls">
      <button id="mute-btn">🔇</button>
      <button id="fs-btn">⛶</button>
    </div>
  </div>

  <script>
    const PLAYLIST = [
      { 
        file: "https://xtremplay.com/api/proxy?url=https%3A%2F%2Fftmain.cachefly.net%2Ffiles%2Fa8wn4hw%2Fvi%2Ffb%2F63%2F10207843%2Fhls-hi%2Fs10207843.m3u8&ref=https%3A%2F%2Fftmain.cachefly.net%2Ffiles%2Fa8wn4hw%2Fvi%2Ffb%2F63%2F10207843%2Fhls-hi%2Fs10207843.m3u8", 
        type: "proxy-hls", 
        duration: 219 
      },
      { file: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", type: "hls", duration: 30 }
    ];
    
    const ANCHOR = 1767225600000;
    const TOTAL_DURATION = PLAYLIST.reduce((acc, i) => acc + i.duration, 0);

    const video = document.getElementById("vid");
    const muteBtn = document.getElementById("mute-btn");
    const fsBtn = document.getElementById("fs-btn");
    let hlsInstance = null;
    let currentIdx = -1;

    function getGlobalPosition() {
      const elapsed = ((Date.now() - ANCHOR) % TOTAL_DURATION + TOTAL_DURATION) % TOTAL_DURATION;
      let acc = 0;
      for (let i = 0; i < PLAYLIST.length; i++) {
        if (elapsed < acc + PLAYLIST[i].duration) {
          return { index: i, offset: elapsed - acc };
        }
        acc += PLAYLIST[i].duration;
      }
      return { index: 0, offset: 0 };
    }

    async function syncPlayback() {
      const { index, offset } = getGlobalPosition();
      const item = PLAYLIST[index];
      if (!item) return;

      if (index !== currentIdx) {
        currentIdx = index;
        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
        
        if (item.type === "proxy-hls" || (item.type === "hls" && video.canPlayType('application/vnd.apple.mpegurl'))) {
          // Native playback handles proxied/tokenized m3u8 streams best on Safari/supported browsers
          video.src = item.file;
          await video.load();
          video.currentTime = offset;
          video.play().catch(() => {});
        } else if (item.type === "hls" && Hls.isSupported()) {
          hlsInstance = new Hls({ startPosition: offset, liveSyncDurationCount: 3 });
          hlsInstance.loadSource(item.file);
          hlsInstance.attachMedia(video);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
        } else {
          video.src = item.file;
          await video.load();
          video.currentTime = offset;
          video.play().catch(() => {});
        }
      } else {
        if (Math.abs(video.currentTime - offset) > 3.0) {
          video.currentTime = offset;
        }
      }
    }

    setInterval(syncPlayback, 1000);
    syncPlayback();

    muteBtn.addEventListener("click", () => {
      video.muted = !video.muted;
      muteBtn.textContent = video.muted ? "🔇" : "🔊";
    });

    fsBtn.addEventListener("click", () => {
      if (!document.fullscreenElement) document.getElementById("stage").requestFullscreen?.();
      else document.exitFullscreen?.();
    });
  </script>
</body>
</html>
