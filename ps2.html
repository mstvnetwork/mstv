<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Linear Live TV Player</title>
    <!-- Include HLS.js for adaptive .m3u8 playback across all browsers -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            color: #fff;
        }
        #player-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.4s ease-in-out;
            background: #000;
        }
        .active-player {
            opacity: 1;
            z-index: 2;
        }
        .background-player {
            opacity: 0;
            z-index: 1;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
        }
        #on-air-badge {
            display: inline-block;
            background: #ff0055;
            color: white;
            padding: 4px 8px;
            font-weight: bold;
            font-size: 12px;
            border-radius: 4px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        #video-title {
            font-size: 18px;
            font-weight: 500;
        }
        #controls-overlay {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 10;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }
        button:hover {
            background: #0056b3;
        }
        #error-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            display: none;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div id="player-container">
        <!-- Dual Player Isolation Architecture -->
        <video id="playerA" class="active-player" playsinline muted></video>
        <video id="playerB" class="background-player" playsinline muted></video>

        <!-- Dynamic UI HUD -->
        <div id="ui-overlay">
            <div id="on-air-badge">Live On-Air</div>
            <div id="video-title">Syncing Broadcast Time...</div>
        </div>

        <!-- Autoplay Security Overlay -->
        <div id="controls-overlay">
            <button id="unmute-btn" onclick="unmuteAudio()">🔈 Unmute Audio</button>
        </div>
    </div>

    <!-- Error Interface screen -->
    <div id="error-screen">
        <div>
            <h2>Broadcast Sync Failed</h2>
            <p id="error-text" style="color: #aaa; margin-top: 10px;"></p>
        </div>
    </div>

    <script>
        // Core Config
        let anchorTime = 0;
        let activePlaylist = [];
        
        // Tracking Engine States
        let currentVideoIndex = -1;
        let syncInterval = null;
        const SCRUB_THRESHOLD_SECONDS = 1.5;

        // Player DOM Node Selection
        const playerA = document.getElementById('playerA');
        const playerB = document.getElementById('playerB');
        let activePlayer = playerA;
        let backgroundPlayer = playerB;
        
        let activeHls = null;
        let backgroundHls = null;

        // 1. Core Bootstrapper & Loader
        async function initBroadcastEngine() {
            try {
                const response = await fetch('./playlist200.json?nocache=' + Date.now());
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                
                const data = await response.json();
                anchorTime = parseInt(data.anchorTime);
                activePlaylist = data.playlist;

                // Fire initialization sequence
                syncBroadcastTimeline(true);

                // Polling background ticker (Every 10 Seconds)
                setInterval(pollPlaylistUpdates, 10000);

                // Primary sync clock engine loop (High frequency correction)
                if (syncInterval) clearInterval(syncInterval);
                syncInterval = setInterval(() => syncBroadcastTimeline(false), 500);

            } catch (err) {
                console.error("Critical linear layout initialization crash: ", err);
                document.getElementById('error-screen').style.display = 'flex';
                document.getElementById('error-text').innerText = "Unable to read configuration payload from root directory.";
            }
        }

        // Silent continuous manifest integration updates
        async function pollPlaylistUpdates() {
            try {
                const response = await fetch('./playlist200.json?nocache=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    if (data.playlist && JSON.stringify(data.playlist) !== JSON.stringify(activePlaylist)) {
                        console.log("Hot updates detected safely in manifest storage mapping.");
                        activePlaylist = data.playlist;
                    }
                }
            } catch(e) { /* Protection fail-safes */ }
        }

        // 2. High-Fidelity Time Calculation Matrix
        // Computes time slices independent of modifying list sizes to eliminate timeline jumps.
        function computeLiveBroadcastCoordinates() {
            const now = Math.floor(Date.now() / 1000);
            if (now < anchorTime) {
                return { index: 0, seekTime: 0, currentItem: activePlaylist[0] };
            }

            let timeCursor = anchorTime;
            let infiniteSafetyLoopCounter = 0;
            
            // Re-simulate timeline sequentially up to the current absolute timestamp block.
            // This treats changes made down-list as zero-impact factors to current playheads.
            while (true) {
                infiniteSafetyLoopCounter++;
                if(infiniteSafetyLoopCounter > 20000) { 
                    // Breakout safety threshold
                    break; 
                }

                let cycleAdvanced = false;
                for (let i = 0; i < activePlaylist.length; i++) {
                    const item = activePlaylist[i];
                    const duration = parseInt(item.duration);

                    if (now >= timeCursor && now < timeCursor + duration) {
                        return {
                            index: i,
                            seekTime: now - timeCursor,
                            currentItem: item
                        };
                    }
                    timeCursor += duration;
                    cycleAdvanced = true;
                }

                // If playlist array was empty or structural loop parameters collapsed
                if (!cycleAdvanced) break;
            }

            return { index: 0, seekTime: 0, currentItem: activePlaylist[0] };
        }

        // 3. Coordination Synchronization Loop
        function syncBroadcastTimeline(isFirstLaunch = false) {
            if (!activePlaylist || activePlaylist.length === 0) return;

            const target = computeLiveBroadcastCoordinates();

            // Track Transition Layer
            if (isFirstLaunch || currentVideoIndex !== target.index) {
                if (isFirstLaunch) {
                    currentVideoIndex = target.index;
                    document.getElementById('video-title').innerText = target.currentItem.title;
                    setupPlayer(activePlayer, target.currentItem.url, target.seekTime, true);
                    preStageNextVideo();
                } else {
                    // Safe linear engine hardware switch execution
                    executeDualPlayerTransition(target);
                }
                return;
            }

            // Anti-Scrubbing Enforcement Protection Core
            const timeDelta = Math.abs(activePlayer.currentTime - target.seekTime);
            if (timeDelta > SCRUB_THRESHOLD_SECONDS) {
                console.warn(`Anti-Scrub Action: Retracking broadcast line drift (${timeDelta.toFixed(2)}s).`);
                activePlayer.currentTime = target.seekTime;
                activePlayer.play().catch(()=>{});
            }
        }

               // 4. Execution Switching Infrastructure
        function executeDualPlayerTransition(targetMetrics) {
            currentVideoIndex = targetMetrics.index;
            document.getElementById('video-title').innerText = targetMetrics.currentItem.title;

            const savedMuteStatus = activePlayer.muted;
            const savedVolumeLevel = activePlayer.volume;

            // Trigger structural CSS transformation layers instantly
            backgroundPlayer.className = "active-player";
            activePlayer.className = "background-player";

            backgroundPlayer.muted = savedMuteStatus;
            backgroundPlayer.volume = savedVolumeLevel;
            activePlayer.muted = true;

            // Transpose active processing structures
            const swapNode = activePlayer;
            activePlayer = backgroundPlayer;
            backgroundPlayer = swapNode;

            const swapHls = activeHls;
            activeHls = backgroundHls;
            backgroundHls = swapHls;

            // Align active player content parameters instantly
            activePlayer.currentTime = targetMetrics.seekTime;
            activePlayer.play().catch(() => {});

            // Initialize buffer staging on background layer elements
            preStageNextVideo();
        }

        function preStageNextVideo() {
            if (currentVideoIndex === -1 || activePlaylist.length === 0) return;
            const nextIndex = (currentVideoIndex + 1) % activePlaylist.length;
            setupPlayer(backgroundPlayer, activePlaylist[nextIndex].url, 0, false);
            backgroundPlayer.muted = true;
        }

        function setupPlayer(playerElement, url, startTime, isActiveFrame) {
            if (isActiveFrame && activeHls) { activeHls.destroy(); activeHls = null; }
            if (!isActiveFrame && backgroundHls) { backgroundHls.destroy(); backgroundHls = null; }

            if (Hls.isSupported()) {
                const hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 15
                });
                
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(playerElement);
                
                if (isActiveFrame) activeHls = hlsInstance;
                else backgroundHls = hlsInstance;

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    playerElement.currentTime = startTime;
                    playerElement.play().catch(() => {});
                });
            } 
            else if (playerElement.canPlayType('application/vnd.apple.mpegurl')) {
                playerElement.src = url;
                playerElement.addEventListener('loadedmetadata', () => {
                    playerElement.currentTime = startTime;
                    playerElement.play().catch(() => {});
                }, { once: true });
            }
        }

        function unmuteAudio() {
            activePlayer.muted = false;
            backgroundPlayer.muted = true;
            document.getElementById('controls-overlay').style.display = 'none';
        }

        window.addEventListener('DOMContentLoaded', initBroadcastEngine);
</script>
</body>
</html>
