<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Linear Live TV Player</title>
    <!-- Include HLS.js for .m3u8 playback support across all modern desktop browsers -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            color: #fff;
        }
        #player-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.4s ease-in-out;
            background: #000;
        }
        .active-player {
            opacity: 1;
            z-index: 2;
        }
        .background-player {
            opacity: 0;
            z-index: 1;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
        }
        #on-air-badge {
            display: inline-block;
            background: #ff0055;
            color: white;
            padding: 4px 8px;
            font-weight: bold;
            font-size: 12px;
            border-radius: 4px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        #video-title {
            font-size: 18px;
            font-weight: 500;
        }
        #controls-overlay {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 10;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }
        button:hover {
            background: #0056b3;
        }
        #error-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            display: none;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div id="player-container">
        <!-- Dual Player Architecture -->
        <video id="playerA" class="active-player" playsinline muted></video>
        <video id="playerB" class="background-player" playsinline muted></video>

        <!-- Dynamic UI HUD -->
        <div id="ui-overlay">
            <div id="on-air-badge">Live On-Air</div>
            <div id="video-title">Syncing Broadcast Time...</div>
        </div>

        <!-- Master Interaction Button (Required by Browser Autoplay Security) -->
        <div id="controls-overlay">
            <button id="unmute-btn" onclick="unmuteAudio()">🔈 Unmute Audio</button>
        </div>
    </div>

    <!-- Error Screen Display -->
    <div id="error-screen">
        <div>
            <h2>Broadcast Sync Failed</h2>
            <p id="error-text" style="color: #aaa; margin-top: 10px;"></p>
        </div>
    </div>

    <script>
        // Data Structures
        let anchorTime = 0;
        let playlist = [];
        
        // Critical fix: We cache the initial snapshot structure parameters on player startup.
        // This ensures that continuous viewers calculate cycles identically to new viewers
        // during the lifecycle of the currently running video block.
        let structuralPlaylistSnapshot = [];
        let snapshotTotalDuration = 0;

        // Player DOM Node Selection
        const playerA = document.getElementById('playerA');
        const playerB = document.getElementById('playerB');
        
        let activePlayer = playerA;
        let backgroundPlayer = playerB;
        
        // HLS.js Interface Instances
        let activeHls = null;
        let backgroundHls = null;

        // Operational Core Variables
        let currentVideoIndex = -1;
        let syncInterval = null;
        const SCRUB_THRESHOLD_SECONDS = 2.0;

        // 1. Initial Launch Manifest Setup
        async function loadPlaylist() {
            try {
                const response = await fetch('./playlist200.json?nocache=' + Date.now());
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                
                const data = await response.json();
                
                anchorTime = data.anchorTime;
                playlist = data.playlist;

                // Create the immutable structural snapshot for sync lock mapping
                structuralPlaylistSnapshot = [...playlist];
                snapshotTotalDuration = structuralPlaylistSnapshot.reduce((t, item) => t + parseInt(item.duration), 0);
                
                // Initialize playback engine
                startLinearBroadcast();
                
                // Poll configuration JSON continuously in background (Every 15s) 
                setInterval(hotReloadPlaylist, 15000);

            } catch (err) {
                console.error("Failed to load global playlist: ", err);
                document.getElementById('error-screen').style.display = 'flex';
                document.getElementById('error-text').innerText = "Unable to read 'playlist200.json'. Verify file configuration.";
            }
        }

        // Silent backend playlist monitoring for secure updates 
        async function hotReloadPlaylist() {
            try {
                const response = await fetch('./playlist200.json?nocache=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    if (data.playlist) {
                        playlist = data.playlist;
                        // Notice: We purposefully DO NOT overwrite structuralPlaylistSnapshot here.
                        // The structural timeline math updates only at natural track boundaries, 
                        // ensuring current on-air viewer math matches fresh landing page loads perfectly!
                    }
                }
            } catch(e) { /* Fail silently to protect on-air feed */ }
        }

        // 2. Linear Scheduling Engine (Time-Locked Loop Alignment)
        function getGlobalTimelineMetrics() {
            const currentUnixTimestamp = Math.floor(Date.now() / 1000);
            
            if (currentUnixTimestamp < anchorTime) {
                return { index: 0, seekTime: 0, sourceArray: structuralPlaylistSnapshot };
            }

            const elapsedSecondsSinceAnchor = currentUnixTimestamp - anchorTime;
            
            // Calculate playback position using the frozen baseline snapshot duration.
            // This guarantees fresh loads and old players calculate the exact same layout coordinates.
            const currentPlaylistCycleRemainder = elapsedSecondsSinceAnchor % snapshotTotalDuration;

            let runningCumulativeTime = 0;
            for (let i = 0; i < structuralPlaylistSnapshot.length; i++) {
                const videoDuration = parseInt(structuralPlaylistSnapshot[i].duration);
                if (currentPlaylistCycleRemainder < runningCumulativeTime + videoDuration) {
                    return {
                        index: i,
                        seekTime: currentPlaylistCycleRemainder - runningCumulativeTime,
                        sourceArray: structuralPlaylistSnapshot
                    };
                }
                runningCumulativeTime += videoDuration;
            }
            return { index: 0, seekTime: 0, sourceArray: structuralPlaylistSnapshot };
        }

        // 3. Media Player Execution Matrix
        function startLinearBroadcast() {
            const metrics = getGlobalTimelineMetrics();
            currentVideoIndex = metrics.index;

            setupPlayer(activePlayer, metrics.sourceArray[currentVideoIndex].url, metrics.seekTime, true);
            document.getElementById('video-title').innerText = metrics.sourceArray[currentVideoIndex].title;

            // Pre-stage opposite interface player
            preStageNextVideo();

            // Run high frequency sync tracking clock loops
            if(syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(enforceGlobalTimelineLock, 500);
        }

        function setupPlayer(playerElement, url, startTime, isActiveFrame) {
            if (isActiveFrame && activeHls) { activeHls.destroy(); activeHls = null; }
            if (!isActiveFrame && backgroundHls) { backgroundHls.destroy(); backgroundHls = null; }

            if (Hls.isSupported()) {
                const hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 30
                });
                
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(playerElement);
                if (isActiveFrame) activeHls = hlsInstance;
                else backgroundHls = hlsInstance;

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    playerElement.currentTime = startTime;
                    playerElement.play().catch(() => console.log("Autoplay waiting for audio activation."));
                });
            } 
            else if (playerElement.canPlayType('application/vnd.apple.mpegurl')) {
                playerElement.src = url;
                playerElement.addEventListener('loadedmetadata', () => {
                    playerElement.currentTime = startTime;
                    playerElement.play().catch(() => console.log("Autoplay waiting for audio activation."));
                }, { once: true });
            }
        }

        function preStageNextVideo() {
            // Next video is prepared out of the hot-reloaded active playlist array.
            // If items were appended or removed at the bottom, the next track dynamically adapts.
            const nextIndex = (currentVideoIndex + 1) % playlist.length;
            setupPlayer(backgroundPlayer, playlist[nextIndex].url, 0, false);
            backgroundPlayer.muted = true;
        }

        // 4. Automated Anti-Scrubbing Lock & Track Alignment Boundaries
        function enforceGlobalTimelineLock() {
            const metrics = getGlobalTimelineMetrics();

            // Handle Track Transitions Seamlessly
            if (metrics.index !== currentVideoIndex) {
                executeDualPlayerSwap(metrics);
                return;
            }

            // Anti-Scrubbing Enforcement Loop
            const driftDelta = Math.abs(activePlayer.currentTime - metrics.seekTime);
            if (driftDelta > SCRUB_THRESHOLD_SECONDS) {
                console.warn(`Anti-Scrub: Reverting playhead back to live timeline.`);
                activePlayer.currentTime = metrics.seekTime;
                activePlayer.play().catch(()=>{});
            }
        }

        function executeDualPlayerSwap(targetMetrics) {
            // SAFE ATOMIC COMMIT:
            // The running item has completed. We now safely commit the updated background playlist 
            // array into our structural timeline snapshot calculations. This updates the timeline cycle 
            // calculation for both current viewers and any new user opening the page moving forward.
            structuralPlaylistSnapshot = [...playlist];
            snapshotTotalDuration = structuralPlaylistSnapshot.reduce((t, item) => t + parseInt(item.duration), 0);

            // Re-evaluate index position matching against the newly committed snapshot
            const refreshedMetrics = getGlobalTimelineMetrics();
            currentVideoIndex = refreshedMetrics.index;
            
            document.getElementById('video-title').innerText = refreshedMetrics.sourceArray[currentVideoIndex].title;

            // Preserve current global volume adjustments on interface flip
            const existingMutedState = activePlayer.muted;
            const existingVolumeLevel = activePlayer.volume;

            // Flip active rendering references instantly via hardware layers
            backgroundPlayer.className = "active-player";
            activePlayer.className = "background-player";

            backgroundPlayer.muted = existingMutedState;
            backgroundPlayer.volume = existingVolumeLevel;
            activePlayer.muted = true;

            // Cycle variable instances
            const temporaryReference = activePlayer;
            activePlayer = backgroundPlayer;
            backgroundPlayer = temporaryReference;

            const temporaryHls = activeHls;
            activeHls = backgroundHls;
            backgroundHls = temporaryHls;

            // Snap active context directly onto accurate structural frame
            activePlayer.currentTime = refreshedMetrics.seekTime;
            activePlayer.play().catch(()=>{});

            // Pre-stage new upcoming node safely
            preStageNextVideo();
        }

        function unmuteAudio() {
            activePlayer.muted = false;
            backgroundPlayer.muted = true;
            document.getElementById('controls-overlay').style.display = 'none';
        }

        // Bootstrapping Launch
        window.addEventListener('DOMContentLoaded', loadPlaylist);
    </script>
</body>
</html>
