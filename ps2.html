<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Synchronized Linear TV Player</title>
    <!-- Include hls.js engine for handling live .m3u8 streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
            color: #fff;
        }
        .player-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            pointer-events: none;
        }
        video.active {
            opacity: 1;
            pointer-events: auto;
        }
        #interaction-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 0.4s ease;
        }
        .play-btn {
            background: #ff0000;
            border: none;
            color: white;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
            margin-bottom: 15px;
        }
        .play-btn:hover {
            background: #cc0000;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
        }
        .live-indicator {
            display: inline-block;
            background: #ff0000;
            color: white;
            padding: 2px 6px;
            font-weight: bold;
            font-size: 12px;
            border-radius: 3px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<!-- User Gesture Layer to satisfy Autoplay Policies -->
<div id="interaction-overlay" onclick="startBroadcastEngine()">
    <button class="play-btn">Tune Into Live Stream</button>
    <p style="margin: 0; font-size: 14px; opacity: 0.8;">Click anywhere to sync and unmute global broadcast</p>
</div>

<div class="player-container">
    <video id="player1" playsinline muted crossorigin="anonymous"></video>
    <video id="player2" playsinline muted crossorigin="anonymous"></video>

    <div id="ui-overlay">
        <div class="live-indicator">● LIVE</div>
        <div id="track-title">Awaiting User Connection...</div>
        <div id="sync-status">Time Lock: Active</div>
    </div>
</div>

<script>
    const PLAYLIST_URL = 'playlist.json'; 
    const GRID_CYCLE = 43200; 
    const MAX_ALLOWED_DRIFT = 2.5; 

    let playlist = [];
    let activePlayer = null;
    let inactivePlayer = null;
    let p1Hls = null;
    let p2Hls = null;
    let engineStarted = false;
    
    const p1 = document.getElementById('player1');
    const p2 = document.getElementById('player2');

    activePlayer = p1;
    inactivePlayer = p2;

    function getGlobalGridTime() {
        return Math.floor(Date.now() / 1000) % GRID_CYCLE;
    }

    function calculateCurrentSchedule(playlistData) {
        if (!playlistData || playlistData.length === 0) return null;

        let totalPlaylistDuration = playlistData.reduce((sum, item) => sum + item.duration, 0);
        if (totalPlaylistDuration === 0) return null;

        let currentGridTime = getGlobalGridTime();
        let targetPlaylistTime = currentGridTime % totalPlaylistDuration;

        let accumulatedTime = 0;
        for (let i = 0; i < playlistData.length; i++) {
            let track = playlistData[i];
            if (targetPlaylistTime >= accumulatedTime && targetPlaylistTime < (accumulatedTime + track.duration)) {
                return {
                    track: track,
                    index: i,
                    seekTime: targetPlaylistTime - accumulatedTime
                };
            }
            accumulatedTime += track.duration;
        }
        return { track: playlistData[0], index: 0, seekTime: 0 };
    }

    function setupEngine(player, url, seekTime, shouldPlay = false) {
        if (player === p1 && p1Hls) { p1Hls.destroy(); p1Hls = null; }
        if (player === p2 && p2Hls) { p2Hls.destroy(); p2Hls = null; }

        const isHLS = url.includes('.m3u8') || url.includes('api/proxy');

        if (isHLS) {
            if (Hls.isSupported()) {
                const hlsInstance = new Hls({ 
                    enableWorker: true,
                    maxBufferLength: 10,
                    liveSyncDuration: 3
                });
                if (player === p1) p1Hls = hlsInstance;
                if (player === p2) p2Hls = hlsInstance;

                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(player);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    player.currentTime = seekTime;
                    if (shouldPlay && engineStarted) {
                        player.play().catch(e => console.log("Play block:", e));
                    }
                });
            } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
                player.src = url;
                player.addEventListener('loadedmetadata', () => {
                    player.currentTime = seekTime;
                    if (shouldPlay && engineStarted) player.play().catch(e => console.log(e));
                }, { once: true });
            }
        } else {
            player.src = url;
            player.load();
            player.addEventListener('loadedmetadata', () => {
                player.currentTime = seekTime;
                if (shouldPlay && engineStarted) player.play().catch(e => console.log(e));
            }, { once: true });
        }
    }

    function syncBroadcast(isInitialLoad = false) {
        if (playlist.length === 0) return;

        const currentSchedule = calculateCurrentSchedule(playlist);
        if (!currentSchedule) return;

        const targetUrl = currentSchedule.track.url;
        const targetSeek = currentSchedule.seekTime;

        document.getElementById('track-title').innerText = `Playing Item #${currentSchedule.index + 1}`;

        if (isInitialLoad || activePlayer.src !== targetUrl) {
            setupEngine(activePlayer, targetUrl, targetSeek, true);
            activePlayer.classList.add('active');
            
            if (engineStarted) {
                activePlayer.muted = false;
                activePlayer.play().catch(e => console.log(e));
            }

            preloadNextTrack(currentSchedule.index);
        }
    }

    function preloadNextTrack(currentIndex) {
        let nextIndex = (currentIndex + 1) % playlist.length;
        let nextTrack = playlist[nextIndex];
        setupEngine(inactivePlayer, nextTrack.url, 0, false);
        inactivePlayer.pause();
        inactivePlayer.classList.remove('active');
    }

    function switchPlayers() {
        let temp = activePlayer;
        activePlayer = inactivePlayer;
        inactivePlayer = temp;

        activePlayer.classList.add('active');
        if (engineStarted) {
            activePlayer.muted = false;
            activePlayer.play().catch(e => console.log(e));
        }

        inactivePlayer.classList.remove('active');
        inactivePlayer.muted = true;
        inactivePlayer.pause();

        const currentSchedule = calculateCurrentSchedule(playlist);
        if (currentSchedule) {
            preloadNextTrack(currentSchedule.index);
        }
    }

    function startBroadcastEngine() {
        if (engineStarted) return;
        engineStarted = true;
        
        // Hide explicit overlay shield
        document.getElementById('interaction-overlay').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('interaction-overlay').style.display = 'none';
        }, 400);

        // Bootstrap explicit play sequence now that we have context
        if (activePlayer) {
            activePlayer.muted = false;
            const currentSchedule = calculateCurrentSchedule(playlist);
            if (currentSchedule) {
                activePlayer.currentTime = currentSchedule.seekTime;
            }
            activePlayer.play().catch(e => console.log("Engine initialization bypass:", e));
        }
    }

    function startAntiScrubbingWatchdog() {
        setInterval(() => {
            if (playlist.length === 0 || !activePlayer || !engineStarted) return;

            const schedule = calculateCurrentSchedule(playlist);
            if (!schedule) return;

            if (activePlayer.src !== schedule.track.url) {
                syncBroadcast(false);
                return;
            }

            // Enforce linear lock against system clock drift or manual user scrubbing overrides
            const drift = Math.abs(activePlayer.currentTime - schedule.seekTime);
            if (drift > MAX_ALLOWED_DRIFT) {
                console.warn(`Anti-Scrub lock engagement. Syncing: ${drift.toFixed(2)}s drift.`);
                activePlayer.currentTime = schedule.seekTime;
                if (activePlayer.paused) activePlayer.play().catch(e => console.log(e));
            }

            if (activePlayer.currentTime >= (schedule.track.duration - 0.5)) {
                switchPlayers();
            }
        }, 1000);
    }

    function startBackgroundPlaylistPoller() {
        setInterval(() => {
            fetch(PLAYLIST_URL, { cache: "no-store" })
                .then(res => res.json())
                .then(data => {
                    playlist = data;
                    console.log("Background playlist refreshed successfully.");
                }).catch(err => console.error("Error refreshing playlist updates: ", err));
        }, 30000);
    }

    // Load static pipeline configurations
    fetch(PLAYLIST_URL, { cache: "no-store" })
        .then(res => res.json())
        .then(data => {
            playlist = data;
            syncBroadcast(true);
            startAntiScrubbingWatchdog();
            startBackgroundPlaylistPoller();
        })
        .catch(err => {
            document.getElementById('track-title').innerText = "Failed to load broadcast grid playlist.";
            console.error(err);
        });
</script>
</body>
</html>
