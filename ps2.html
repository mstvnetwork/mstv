<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Global Sync Pseudo Live TV</title>
    <!-- Robust, clean CDN path to ensure no source-map warnings -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <style>
        body { 
            margin: 0; 
            background-color: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: sans-serif; 
        }
        .video-container { 
            position: relative; 
            width: 100%; 
            max-width: 1280px; 
            aspect-ratio: 16/9; 
            background: #000; 
        }
        video { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            opacity: 0; 
            transition: opacity 0.3s ease-in-out; 
            pointer-events: none; 
        }
        video.active { 
            opacity: 1; 
            pointer-events: auto; 
        }
        .gatekeeper-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.9); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 999; 
            cursor: pointer; 
        }
        .gatekeeper-btn { 
            background: #ff3b30; 
            color: white; 
            border: none; 
            padding: 15px 40px; 
            font-size: 1.2rem; 
            font-weight: bold; 
            border-radius: 30px; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.4); 
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Direct element hook with verified global execution access -->
        <div id="gatekeeper" class="gatekeeper-overlay" onclick="startBroadcastChannel()">
            <button class="gatekeeper-btn">📺 JOIN LIVE TV BROADCAST</button>
        </div>
        <video id="player1" class="active" playsinline></video>
        <video id="player2" playsinline></video>
    </div>

    <script>
        // --- 1. THE STABLE TV LINEUP ---
        // Adding or removing items at the bottom here will NEVER shift the timestamp of active streams
        const playlist = [
            { title: "Stream 1", url: "https://xtremplay.com/api/proxy?url=https%3A%2F%2Fsi.videoapne.to%2Fhls%2Fbdohxjxe7bboxuzvta274tanrc4emxhgot33hl6b4djoaxt3s5t4wbi7kkfq%2Findex-v1-a1.m3u8&ref=https%3A%2F%2Fsi.videoapne.to%2Fhls%2Fbdohxjxe7bboxuzvta274tanrc4emxhgot33hl6b4djoaxt3s5t4wbi7kkfq%2Findex-v1-a1.m3u8", duration: 3166 }
        
            


            
        ];
        const p1 = document.getElementById('player1');
        const p2 = document.getElementById('player2');
        const gatekeeper = document.getElementById('gatekeeper');
        
        let activePlayer = p1;
        let idlePlayer = p2;
        let expectedTime = 0;
        let hasStarted = false;
        
        // Split line declarations explicitly to eliminate token exceptions
        let hls1 = null;
        let hls2 = null;

        // --- 2. THE CALENDAR DAY TIMELINE MATRICES ---
        function getLiveState() {
            const now = new Date();
            
            // Absolute anchor: Total elapsed seconds since midnight today (Local machine clock)
            let secondsPassedToday = (now.getHours() * 3600) + (now.getMinutes() * 60) + now.getSeconds();
            let elapsedTime = 0;
            
            // Linear progression evaluation block
            for (let i = 0; i < playlist.length; i++) {
                let video = playlist[i];
                
                if (secondsPassedToday >= elapsedTime && secondsPassedToday < (elapsedTime + video.duration)) {
                    let offset = secondsPassedToday - elapsedTime;
                    let nextIndex = (i + 1) % playlist.length;
                    return { currentVideo: video, offset: offset, nextVideo: playlist[nextIndex] };
                }
                elapsedTime += video.duration;
            }

            // SAFETY INTERCEPT: If time exceeds full list size, it loops purely on the fallback duration subset
            let totalDuration = elapsedTime;
            let fallbackPosition = secondsPassedToday % totalDuration;
            let fallbackElapsed = 0;
            
            for (let i = 0; i < playlist.length; i++) {
                let video = playlist[i];
                if (fallbackPosition >= fallbackElapsed && fallbackPosition < (fallbackElapsed + video.duration)) {
                    let offset = fallbackPosition - fallbackElapsed;
                    let nextIndex = (i + 1) % playlist.length;
                    return { currentVideo: video, offset: offset, nextVideo: playlist[nextIndex] };
                }
                fallbackElapsed += video.duration;
            }
        }

        // --- 3. HARDWARE STREAM LOADER ---
        function loadHlsStream(player, url, instanceName) {
            if (instanceName === 'hls1' && hls1) { hls1.destroy(); hls1 = null; }
            if (instanceName === 'hls2' && hls2) { hls2.destroy(); hls2 = null; }

            if (Hls.isSupported()) {
                const hls = new Hls({ maxBufferLength: 20, liveSyncDuration: 3, enableWorker: true });
                hls.loadSource(url);
                hls.attachMedia(player);
                if (instanceName === 'hls1') hls1 = hls;
                if (instanceName === 'hls2') hls2 = hls;
            } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
                player.src = url;
            }
        }

        function syncBroadcast(isInitialLoad = false) {
            if (!hasStarted) return;

            const state = getLiveState();
            if (!state) return;

            expectedTime = state.offset;
            const activeInstanceName = (activePlayer === p1) ? 'hls1' : 'hls2';

            if (isInitialLoad || activePlayer.dataset.currentUrl !== state.currentVideo.url) {
                activePlayer.dataset.currentUrl = state.currentVideo.url;
                loadHlsStream(activePlayer, state.currentVideo.url, activeInstanceName);
                
                activePlayer.onloadedmetadata = () => {
                    activePlayer.currentTime = state.offset;
                    activePlayer.play().catch(e => console.log("Stream init safety handled."));
                    activePlayer.onloadedmetadata = null;
                };
            } else {
                if (Math.abs(activePlayer.currentTime - expectedTime) > 2) {
                    activePlayer.currentTime = expectedTime;
                }
            }

            // Stagger loading the next player to avoid network traffic spikes
            setTimeout(() => {
                const idleInstanceName = (idlePlayer === p1) ? 'hls1' : 'hls2';
                if (idlePlayer.dataset.currentUrl !== state.nextVideo.url) {
                    idlePlayer.dataset.currentUrl = state.nextVideo.url;
                    loadHlsStream(idlePlayer, state.nextVideo.url, idleInstanceName);
                    
                    idlePlayer.onloadedmetadata = () => {
                        idlePlayer.muted = true;
                        idlePlayer.pause();
                        idlePlayer.onloadedmetadata = null;
                    };
                }
            }, isInitialLoad ? 4000 : 100);
        }

        // --- 4. ENGINE CONTROLS & TRIGGERS ---
        function startBroadcastChannel() {
            hasStarted = true;
            gatekeeper.style.opacity = '0';
            setTimeout(() => gatekeeper.remove(), 400);
            p1.muted = false; 
            p2.muted = false;
            syncBroadcast(true);
        }

        function handleVideoEnded() {
            activePlayer.classList.remove('active');
            idlePlayer.classList.add('active');

            let tempPlayer = activePlayer; 
            activePlayer = idlePlayer; 
            idlePlayer = tempPlayer;

            activePlayer.muted = false;
            activePlayer.play().catch(e => console.log("Handoff sequence complete."));
            expectedTime = 0;

            setTimeout(() => syncBroadcast(false), 1000);
        }

        function enforceStrictTimeline() {
            if (Math.abs(activePlayer.currentTime - expectedTime) > 1.5) {
                activePlayer.currentTime = expectedTime;
            }
        }

        setInterval(() => {
            if (hasStarted && !activePlayer.paused) {
                expectedTime += 1;
            }
        }, 1000);

        // Core continuous timeline configurations
        [p1, p2].forEach(player => {
            player.addEventListener('ended', handleVideoEnded);
            player.addEventListener('seeking', enforceStrictTimeline);
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && hasStarted) {
                syncBroadcast(true);
            }
        });
    </script>
</body>
</html>
