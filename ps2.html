<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Global Sync Linear TV</title>
    <!-- Include HLS.js for .m3u8 live stream support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .player-container {
            position: relative;
            width: 100%;
            max-width: 960px;
            aspect-ratio: 16/9;
            background: #000;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.4s ease-in-out;
        }
        .active { opacity: 1; z-index: 2; }
        .hidden { opacity: 0; z-index: 1; pointer-events: none; }
        
        .overlay-ui {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            pointer-events: none;
            border-left: 3px solid #00bcff;
        }
        .unmute-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            background: #00bcff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,188,255,0.4);
        }
    </style>
</head>
<body>

<div class="player-container">
    <button id="unmuteBtn" class="unmute-btn" onclick="unmutePlayers()">🔊 Click to Unmute / Sync Live</button>
    <div id="statusOverlay" class="overlay-ui">Initialising Stream...</div>
    <video id="player1" class="active" playsinline muted></video>
    <video id="player2" class="hidden" playsinline muted></video>
</div>

<script>
// 1. Fixed Epoch & Fallback Playlist Configuration
// Changing this timestamp resets the loop calculation baseline globally
const EPOCH_START = 1700000000000; 

let playlist = [
    { url: 'https://googleapis.com', duration: 596 },
    { url: 'https://mux.dev', duration: 600 }, // HLS Stream Example
    { url: 'https://googleapis.com', duration: 653 }
];

let p1 = document.getElementById('player1');
let p2 = document.getElementById('player2');
let activePlayer = p1;
let inactivePlayer = p2;
let hlsInstances = { player1: null, player2: null };

let currentTrackIndex = -1;
let isEnforcingSync = false;
let timeOffset = 0; // Drifts adjusted dynamically if server sync added

// 2. Format Agnostic Video Engine (Handles MP4 & M3U8 seamlessly)
function loadMediaSource(player, url) {
    const playerId = player.id;
    
    // Clean up previous HLS instances on this player slot to free memory
    if (hlsInstances[playerId]) {
        hlsInstances[playerId].destroy();
        hlsInstances[playerId] = null;
    }

    if (url.includes('.m3u8')) {
        if (Hls.isSupported()) {
            const hls = new Hls({ maxBufferLength: 10, enableWorker: true });
            hlsInstances[playerId] = hls;
            hls.loadSource(url);
            hls.attachMedia(player);
        } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
            // Native Safari HLS execution
            player.src = url;
        }
    } else {
        // Fallback to standard progressive MP4
        player.src = url;
    }
    player.load();
}

// 3. Mathematical Timeline Matrix Calculations
function getGlobalTimelineState() {
    let totalPlaylistDuration = playlist.reduce((sum, track) => sum + track.duration, 0);
    let msSinceEpoch = (Date.now() + timeOffset) - EPOCH_START;
    let totalSecondsElapsed = Math.floor(msSinceEpoch / 1000);
    
    // Calculate current loop sequence position
    let currentPlaylistTime = totalSecondsElapsed % totalPlaylistDuration;
    
    let accumulatedTime = 0;
    for (let i = 0; i < playlist.length; i++) {
        if (currentPlaylistTime >= accumulatedTime && currentPlaylistTime < accumulatedTime + playlist[i].duration) {
            return {
                index: i,
                seekTo: currentPlaylistTime - accumulatedTime,
                track: playlist[i]
            };
        }
        accumulatedTime += playlist[i].duration;
    }
    return { index: 0, seekTo: 0, track: playlist[0] };
}

// 4. Dual-Player Soft Crossfading
function syncPlayerEngine() {
    const state = getGlobalTimelineState();
    
    // Check if video file has changed context or playlist appended new data
    if (currentTrackIndex !== state.index) {
        currentTrackIndex = state.index;
        
        // Stage background player pipeline
        loadMediaSource(inactivePlayer, state.track.url);
        
        const runSwap = () => {
            inactivePlayer.currentTime = state.seekTo;
            inactivePlayer.play().catch(() => {});
            
            // Perform seamless execution swap without screen flickering
            activePlayer.className = "hidden";
            inactivePlayer.className = "active";
            
            // Swap reference elements smoothly
            let temp = activePlayer;
            activePlayer = inactivePlayer;
            inactivePlayer = temp;
            
            document.getElementById('statusOverlay').innerHTML = `🔴 <b>LIVE ON-AIR:</b> Track #${currentTrackIndex + 1}`;
            inactivePlayer.onseeked = null; 
        };

        // Buffer and execute setup sequence
        if (state.track.url.includes('.m3u8') && hlsInstances[inactivePlayer.id]) {
            hlsInstances[inactivePlayer.id].once(Hls.Events.MANIFEST_PARSED, runSwap);
        } else {
            inactivePlayer.onloadedmetadata = runSwap;
        }
    } else {
        // Track Lock Correction (Fixes system lag drifts within 1.5 seconds tolerance)
        if (Math.abs(activePlayer.currentTime - state.seekTo) > 1.5) {
            isEnforcingSync = true;
            activePlayer.currentTime = state.seekTo;
            setTimeout(() => { isEnforcingSync = false; }, 300);
        }
    }
}

// 5. Hardened Anti-Scrub System Hook
function setupAntiScrub(playerElement) {
    playerElement.addEventListener('seeking', () => {
        if (!isEnforcingSync) {
            const state = getGlobalTimelineState();
            isEnforcingSync = true;
            playerElement.currentTime = state.seekTo;
            document.getElementById('statusOverlay').innerHTML = "🔒 <b>Anti-Scrub System:</b> Seek locked.";
            setTimeout(() => { isEnforcingSync = false; }, 400);
        }
    });
}

// 6. Serverless Background Updates (Poller from GitHub repository file)
async function poolServerlessPlaylistUpdate() {
    try {
        // Tip: Replace with your actual repository absolute configuration URL path
        // e.g., 'https://githubusercontent.com'
        const response = await fetch('./playlist.json?nocache=' + Date.now());
        if (response.ok) {
            const remotePlaylist = await response.json();
            if (remotePlaylist && remotePlaylist.length >= playlist.length) {
                playlist = remotePlaylist; // Appends elements transparently
            }
        }
    } catch (e) {
        console.log("No dynamic file 'playlist.json' discovered, relying on memory array configuration.");
    }
}

function unmutePlayers() {
    p1.muted = false;
    p2.muted = false;
    document.getElementById('unmuteBtn').style.display = 'none';
    syncPlayerEngine();
}

// Initialise core pipeline
setupAntiScrub(p1);
setupAntiScrub(p2);
syncPlayerEngine();

// Periodic heartbeats: sync engine clocks and serverless JSON checking
setInterval(syncPlayerEngine, 1000);
setInterval(poolServerlessPlaylistUpdate, 30000); // Check for playlist updates every 30 seconds
</script>
</body>
</html>
