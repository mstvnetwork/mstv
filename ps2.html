<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Global Sync Linear TV</title>
    <!-- Include HLS.js for .m3u8 live stream support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <!-- Mapped font link to fix the browser preload console error -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .player-container {
            position: relative;
            width: 95%;
            max-width: 960px;
            aspect-ratio: 16/9;
            background: #000;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.4s ease-in-out;
            background: #000;
        }
        .active { opacity: 1; z-index: 2; }
        .hidden { opacity: 0; z-index: 1; pointer-events: none; }
        
        .overlay-ui {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            pointer-events: none;
            border-left: 3px solid #00bcff;
            letter-spacing: 0.5px;
        }
        .unmute-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            background: #00bcff;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Space Grotesk', sans-serif;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,188,255,0.4);
            transition: transform 0.2s ease;
        }
        .unmute-btn:hover {
            transform: translate(-50%, -50%) scale(1.05);
        }
    </style>
</head>
<body>

<div class="player-container">
    <button id="unmuteBtn" class="unmute-btn" onclick="unmutePlayers()">🔊 Click to Unmute / Sync Live</button>
    <div id="statusOverlay" class="overlay-ui">Syncing Global Time Grid...</div>
    <video id="player1" class="active" playsinline muted></video>
    <video id="player2" class="hidden" playsinline muted></video>
</div>

<script>
// 1. Fixed Reference Epoch Time Configuration
const EPOCH_START = 1700000000000; 

// Memory fallback used instantly if external file isn't loaded yet
let playlist = [
 { "url": "https://xtremplay.com/api/proxy?url=https%3A%2F%2Fsi.videoapne.to%2Fhls%2Fbdohxlfh7bboxuzvta5p4hqrs3xzfskymy77idnkubzgrkx5swcjli36fdca%2Findex-v1-a1.m3u8&ref=https%3A%2F%2Fsi.videoapne.to%2Fhls%2Fbdohxlfh7bboxuzvta5p4hqrs3xzfskymy77idnkubzgrkx5swcjli36fdca%2Findex-v1-a1.m3u8",
 "duration": 4403 },
  { "url": "https://xtremplay.com/api/proxy?url=https%3A%2F%2Fsi.videoapne.to%2Fhls%2Fbdohw6ff7bboxuzvta5p4batqfhjhylse7ducvr5mb6x6r6s6ru2hz35tz2a%2Findex-v1-a1.m3u8&ref=https%3A%2F%2Fsi.videoapne.to%2Fhls%2Fbdohw6ff7bboxuzvta5p4batqfhjhylse7ducvr5mb6x6r6s6ru2hz35tz2a%2Findex-v1-a1.m3u8",
 "duration": 4672 }
 
    ];

let p1 = document.getElementById('player1');
let p2 = document.getElementById('player2');
let activePlayer = p1;
let inactivePlayer = p2;
let hlsInstances = { player1: null, player2: null };

let currentTrackIndex = -1;
let isEnforcingSync = false;
let userHasInteracted = false;

// 2. Uniform Event Pipeline (Resolves the buffer freezing issue)
function loadMediaSource(player, url, targetSeekTime) {
    const playerId = player.id;
    
    // Completely clear existing HLS instances on this background slot
    if (hlsInstances[playerId]) {
        hlsInstances[playerId].destroy();
        hlsInstances[playerId] = null;
    }

    // Native inline execution callback helper
    const preparePlaybackState = () => {
        player.currentTime = targetSeekTime;
        if (userHasInteracted) {
            player.play().catch(e => console.log("Playback error: ", e));
        }
    };

    if (url.toLowerCase().includes('.m3u8')) {
        if (Hls.isSupported()) {
            const hls = new Hls({ maxBufferLength: 15, enableWorker: true });
            hlsInstances[playerId] = hls;
            hls.loadSource(url);
            hls.attachMedia(player);
            // Execute playback instantly when HLS parses the video container mapping
            hls.once(Hls.Events.MANIFEST_PARSED, () => {
                preparePlaybackState();
            });
        } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
            player.src = url;
            player.onloadedmetadata = preparePlaybackState;
        }
    } else {
        // Standard progressive MP4 routing
        player.src = url;
        player.onloadedmetadata = preparePlaybackState;
    }
    player.load();
}

// 3. Mathematical Global Engine Calculations
function getGlobalTimelineState() {
    let totalPlaylistDuration = playlist.reduce((sum, track) => sum + track.duration, 0);
    let msSinceEpoch = Date.now() - EPOCH_START;
    let totalSecondsElapsed = Math.floor(msSinceEpoch / 1000);
    
    let currentPlaylistTime = totalSecondsElapsed % totalPlaylistDuration;
    
    let accumulatedTime = 0;
    for (let i = 0; i < playlist.length; i++) {
        if (currentPlaylistTime >= accumulatedTime && currentPlaylistTime < accumulatedTime + playlist[i].duration) {
            return {
                index: i,
                seekTo: currentPlaylistTime - accumulatedTime,
                track: playlist[i]
            };
        }
        accumulatedTime += playlist[i].duration;
    }
    return { index: 0, seekTo: 0, track: playlist[0] };
}

// 4. Synchronize Transitions Safely
function syncPlayerEngine() {
    const state = getGlobalTimelineState();
    
    if (currentTrackIndex !== state.index) {
        currentTrackIndex = state.index;
        
        // Stage the stream change inside the hidden layer
        loadMediaSource(inactivePlayer, state.track.url, state.seekTo);
        
        // Swap visibility smoothly
        activePlayer.className = "hidden";
        inactivePlayer.className = "active";
        
        let temp = activePlayer;
        activePlayer = inactivePlayer;
        inactivePlayer = temp;
        
        document.getElementById('statusOverlay').innerHTML = `🔴 <b>LIVE ON-AIR:</b> Track #${currentTrackIndex + 1}`;
    } else {
        // Ongoing timeline corrections (corrects for background tab drift within 2 seconds)
        if (Math.abs(activePlayer.currentTime - state.seekTo) > 2.0) {
            isEnforcingSync = true;
            activePlayer.currentTime = state.seekTo;
            setTimeout(() => { isEnforcingSync = false; }, 300);
        }
    }
}

// 5. Anti-Scrub System Hook
function setupAntiScrub(playerElement) {
    playerElement.addEventListener('seeking', () => {
        if (!isEnforcingSync) {
            const state = getGlobalTimelineState();
            isEnforcingSync = true;
            playerElement.currentTime = state.seekTo;
            document.getElementById('statusOverlay').innerHTML = "🔒 <b>Anti-Scrub System:</b> Stream position locked.";
            setTimeout(() => { isEnforcingSync = false; }, 400);
        }
    });
}

// 6. Dynamic Local File Poller
async function poolServerlessPlaylistUpdate() {
    try {
        const response = await fetch('./playlist.json?nocache=' + Date.now());
        if (response.ok) {
            const remotePlaylist = await response.json();
            if (remotePlaylist && Array.isArray(remotePlaylist) && remotePlaylist.length > 0) {
                playlist = remotePlaylist;
                console.log("Playlist synchronized from local storage file successfully.");
            }
        }
    } catch (e) {
        // Suppresses console noise silently if running without a local web server instance
    }
}

function unmutePlayers() {
    userHasInteracted = true;
    p1.muted = false;
    p2.muted = false;
    document.getElementById('unmuteBtn').style.display = 'none';
    
    // Explicit trigger to kickstart the stream on user click
    const state = getGlobalTimelineState();
    activePlayer.play().catch(() => {
        // Re-enforce source sync if browser stalled state elements
        loadMediaSource(activePlayer, state.track.url, state.seekTo);
    });
}

// Core Execution
setupAntiScrub(p1);
setupAntiScrub(p2);
poolServerlessPlaylistUpdate().then(() => {
    syncPlayerEngine();
});

// Loop heartbeats
setInterval(syncPlayerEngine, 1000);
setInterval(poolServerlessPlaylistUpdate, 20000);
</script>
</body>
</html>
