<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Serverless Synced Hybrid Live TV</title>
    <style>
      body, html { 
        background-color: #000; 
        height: 100%; 
        width: 100%; 
        margin: 0; 
        overflow: hidden; 
        font-family: sans-serif;
      }
      
      /* Seamless Dual Video Buffers */
      video { 
        position: fixed; 
        top: 0; 
        left: 0; 
        min-width: 100%; 
        min-height: 100%; 
        object-fit: cover; 
      }

      /* Master UI Overlay Layer */
      #ui-layer {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 9999;
        pointer-events: none;
      }

      /* Top Right Logo Box Container */
      .logo-container {
        position: absolute;
        top: 20px;
        right: 20px;
        pointer-events: auto;
      }
      
      .logo-container img {
        max-width: 150px;
        max-height: 60px;
        object-fit: contain;
        filter: drop-shadow(0px 2px 8px rgba(0, 0, 0, 0.5));
      }

      /* Bottom Right Sleek Controls Container */
      .controls-container {
        position: absolute;
        bottom: 20px;
        right: 20px;
        display: flex;
        gap: 10px;
        pointer-events: auto;
      }

      /* Sleek Round Icon Buttons */
      .control-btn {
        background: rgba(25, 25, 25, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.85);
        width: 38px;
        height: 38px;
        border-radius: 50%;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: background 0.2s, transform 0.1s;
        outline: none;
      }

      .control-btn svg {
        width: 17px;
        height: 17px;
        fill: rgba(255, 255, 255, 0.9);
      }

      .control-btn:active {
        transform: scale(0.9);
        background: rgba(50, 50, 50, 0.75);
      }
      
      .control-btn:hover {
        background: rgba(40, 40, 40, 0.70);
      }
    </style>
  </head>
  <body>

  
    <!-- Master Interactive UI Layer Container -->
    <div id="ui-layer">
      
      <!-- Top Right: Station Logo Layout -->
      <div class="logo-container">
        <img id="tv-logo" src="https://githubusercontent.com" alt="TV Logo">
      </div>

      <!-- Bottom Right: Dynamic Interactive Control Widgets -->
      <div class="controls-container">
        
        <!-- Toggle Audio Mute Switch -->
        <button id="mute-btn" class="control-btn" title="Toggle Mute">
          <svg id="icon-muted" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
          <svg id="icon-unmuted" viewBox="0 0 24 24" style="display:none;"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>

        <!-- Toggle Screen Display Mode -->
        <button id="fullscreen-btn" class="control-btn" title="Toggle Fullscreen">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>

      </div>
    </div>

    <!-- Required Dependency Components -->
    <!-- FIXED: Loading resources via CDNs to bypass Cloudflare Pages MIME errors -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>


    
    
    <script>
      const basePath = "https://github.com/mstvnetwork/test1/releases/download/v1/";
      
      let playlistData = [];
      let totalPlaylistDuration = 0;
      let activeVideo = $('#video1');
      let bufferVideo = $('#video2');
      let switchTimeout = null;
      let isGlobalMuted = true;

      // HLS Engine instances tracked per video component layer
      let hlsInstances = { 'video1': null, 'video2': null };

      async function initLiveSync() {
        try {
          const response = await fetch('playlist.json?t=' + new Date().getTime());
          playlistData = await response.json();
          
          totalPlaylistDuration = 0;
          playlistData.forEach(item => totalPlaylistDuration += item.duration);
          
          console.log("Playlist synchronized. Total loop length:", totalPlaylistDuration, "seconds.");
          
          syncPlayer(true);
          setInterval(() => syncPlayer(false), 3000);
        } catch (e) {
          console.error("Failed to load playlist.json:", e);
        }
      }

      function calculateCurrentBroadcast() {
        if (playlistData.length === 0 || totalPlaylistDuration === 0) return null;

        const currentUnixTime = Math.floor(Date.now() / 1000);
        const baseAnchorTime = Math.floor(Date.now() / 86400000) * 86400; 
        const elapsedSeconds = currentUnixTime - baseAnchorTime;
        
        let currentLoopPosition = elapsedSeconds % totalPlaylistDuration;

        let accumulatedTime = 0;
        for (let i = 0; i < playlistData.length; i++) {
          const clip = playlistData[i];
          if (currentLoopPosition >= accumulatedTime && currentLoopPosition < (accumulatedTime + clip.duration)) {
            return {
              index: i,
              file: clip.file,
              isExternal: clip.isExternal || false,
              seekTo: currentLoopPosition - accumulatedTime,
              remaining: (accumulatedTime + clip.duration) - currentLoopPosition
            };
          }
          accumulatedTime += clip.duration;
        }
        return null;
      }

      // Safe video loader abstraction handling native streams vs HLS streams
      function loadMediaSource(videoContainer, sourceUrl) {
        const videoEl = videoContainer.get(0);
        const elementId = videoContainer.attr('id');

        // Destroy existing HLS wrapper instances attached to this layout node to free up memory
        if (hlsInstances[elementId]) {
          hlsInstances[elementId].destroy();
          hlsInstances[elementId] = null;
        }

        // Detect if file target string is an HLS live manifest stream
        if (sourceUrl.includes('.m3u8')) {
          if (Hls.isSupported()) {
            const hls = new Hls({ maxMaxBufferLength: 10 });
            hls.loadSource(sourceUrl);
            hls.attachMedia(videoEl);
            hlsInstances[elementId] = hls;
          } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
            // Native Safari browser fallbacks support HLS directly natively
            videoEl.src = sourceUrl;
          }
        } else {
          // Standard MP4 processing pipelines
          videoEl.src = sourceUrl;
        }
      }

      function syncPlayer(isFirstLoad) {
        const broadcast = calculateCurrentBroadcast();
        if (!broadcast) return;

        const currentEl = activeVideo.get(0);
        const expectedSrc = broadcast.isExternal ? broadcast.file : basePath + broadcast.file;

        // Verify if stream targets or mathematical sync tracking bounds have broken rules
        const currentTrackingSrc = currentEl.src || "";
        if (isFirstLoad || !currentTrackingSrc.includes(broadcast.file) || Math.abs(currentEl.currentTime - broadcast.seekTo) > 4) {
          console.log(`Live Channel Match: Loading ${broadcast.file} jumping forward to ${broadcast.seekTo.toFixed(2)}s`);
          
          loadMediaSource(activeVideo, expectedSrc);
          currentEl.currentTime = broadcast.seekTo;
          currentEl.muted = isGlobalMuted;
          
          currentEl.play().catch(err => console.log("Playback deferred:", err));
          setupSeamlessTransition(broadcast.remaining);
        }
      }

      function setupSeamlessTransition(timeRemaining) {
        clearTimeout(switchTimeout);
        
        // Prepare the background swap buffer 1.5 seconds early to accommodate network handshake rules on HLS
        const triggerDelay = (timeRemaining - 1.5) * 1000;
        if (triggerDelay <= 0) return;

        switchTimeout = setTimeout(() => {
          const upcomingBroadcast = calculateCurrentBroadcast();
          if (!upcomingBroadcast) return;

          const bufferEl = bufferVideo.get(0);
          const nextSrc = upcomingBroadcast.isExternal ? upcomingBroadcast.file : basePath + upcomingBroadcast.file;

          loadMediaSource(bufferVideo, nextSrc);
          bufferEl.currentTime = 0;
          bufferEl.muted = isGlobalMuted;
          
          bufferEl.play().catch(() => {});

          setTimeout(() => {
            bufferVideo.css('z-index', '500');
            activeVideo.css('z-index', '0');
            activeVideo.get(0).pause();

            const temp = activeVideo;
            activeVideo = bufferVideo;
            bufferVideo = temp;
            
            syncPlayer(false);
          }, 1500);

        }, triggerDelay);
      }

      // Handle Sound Button Clicks
      $('#mute-btn').on('click', function() {
        isGlobalMuted = !isGlobalMuted;
        $('#video1').get(0).muted = isGlobalMuted;
        $('#video2').get(0).muted = isGlobalMuted;

        if (isGlobalMuted) {
          $('#icon-muted').show();
          $('#icon-unmuted').hide();
        } else {
          $('#icon-muted').hide();
          $('#icon-unmuted').show();
        }
      });

      // ... (Previous loadMediaSource, syncPlayer, and setupSeamlessTransition functions run above here)
      // ==========================================
      // UI BUTTON INTERACTION HANDLERS
      // ==========================================
      
      // Handle Sound Button Clicks
      $('#mute-btn').on('click', function() {
        // Toggle our global tracker state
        isGlobalMuted = !isGlobalMuted;

        const v1 = $('#video1').get(0);
        const v2 = $('#video2').get(0);

        // Explicitly apply state onto browser element properties
        v1.muted = isGlobalMuted;
        v2.muted = isGlobalMuted;

        // Force volume values to 100% explicitly to clear internal library overrides
        if (!isGlobalMuted) {
          v1.volume = 1.0;
          v2.volume = 1.0;
          
          // Re-trigger playback immediately to bypass browser security context freezes
          v1.play().catch(() => {});
          v2.play().catch(() => {});
        }

        // Switch the SVG display indicators layout based on current state
        if (isGlobalMuted) {
          $('#icon-muted').show();
          $('#icon-unmuted').hide();
          console.log("Global State Changed: Muted");
        } else {
          $('#icon-muted').hide();
          $('#icon-unmuted').show();
          console.log("Global State Changed: Unmuted");
        }
      });

      // Handle Fullscreen Button Clicks
      $('#fullscreen-btn').on('click', function() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => {
            console.error(`Fullscreen missing: ${err.message}`);
          });
        } else {
          document.exitFullscreen();
        }
      });

      // Boot Layer Setup Hook
      function bootPlayerSetup() {
        // Enforce safe initial muted properties in JavaScript to satisfy browser Autoplay Rules
        $('#video1').get(0).muted = true;
        $('#video2').get(0).muted = true;
        $('#video1').get(0).volume = 0.0;
        $('#video2').get(0).volume = 0.0;
        
        // Fire synchronization logic
        initLiveSync();
      }

      // Start the Engine on Document Ready via our explicit boot script
      $(document).ready(bootPlayerSetup);
    </script>
  </body>
</html>



    </script>
  </body>
</html>
