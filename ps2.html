<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MSTV Live Broadcast</title>
    <style>
        :root {
            --control-bg: rgba(0, 0, 0, 0.65);
            --control-bg-hover: rgba(0, 0, 0, 0.85);
            --icon: #fff;
        }
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            height: 100dvh; 
            color: #fff; 
            overflow: hidden; 
        }
        .tv-frame { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            height: 100dvh; 
            background: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        .video-layer { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            opacity: 0;
            transition: opacity 0.25s ease-in-out;
            pointer-events: none;
        }
        .video-layer.active { 
            opacity: 1;
            z-index: 1;
        }
        .title-box {
            position: absolute;
            top: max(16px, env(safe-area-inset-top));
            left: max(16px, env(safe-area-inset-left));
            font-size: 14px;
            font-weight: 600;
            color: #f1f1f1;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
            z-index: 100;
            max-width: 80vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
        }
        .ui-overlay { 
            position: absolute; 
            bottom: max(16px, env(safe-area-inset-bottom)); 
            right: max(16px, env(safe-area-inset-right)); 
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
        }
        .ctrl-btn {
            width: 42px; 
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--control-bg);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex; 
            align-items: center; 
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background .15s ease, transform .1s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .ctrl-btn:hover { background: var(--control-bg-hover); }
        .ctrl-btn:active { transform: scale(.92); }
        .ctrl-btn svg { width: 20px; height: 20px; fill: var(--icon); }
        #fullscreen-btn { margin-left: 0px; }
        @media (max-width: 360px) {
            .title-box { font-size: 11px; padding: 6px 10px; }
            .ctrl-btn { width: 38px; height: 38px; }
            .ctrl-btn svg { width: 18px; height: 18px; }
        }
    </style>
</head>
<body>

<div class="tv-frame" id="tv-frame">
    <video id="player-1" class="video-layer active" muted autoplay playsinline></video>
    <video id="player-2" class="video-layer" muted autoplay playsinline></video>

    <div id="title-box" class="title-box">Now: Connecting...</div>

    <div class="ui-overlay">
        <button id="mute-btn" class="ctrl-btn" title="Unmute">
            <svg id="mute-icon" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
        <button id="fullscreen-btn" class="ctrl-btn" title="Fullscreen">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
    </div>
</div>
<script>
    const player1 = document.getElementById('player-1');
    const player2 = document.getElementById('player-2');
    const titleBox = document.getElementById('title-box');
    const muteBtn = document.getElementById('mute-btn');
    const muteIcon = document.getElementById('mute-icon');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const tvFrame = document.getElementById('tv-frame');

    const endpoint = 'functions2/get-live-stream2';

    let activePlayerSlot = 1;
    let currentStreamUrl = "";
    let isMasterMuted = true;

    // Playlist + schedule sync state
    let playlist = [];
    let playlistIndex = -1;
    let playlistInitialized = false;
    let transitionInFlight = false;

    let fetchTimestamp = 0;
    let basePlayed = 0;
    let isReverting = false;

    muteBtn.addEventListener('click', () => {
        isMasterMuted = !isMasterMuted;
        player1.muted = isMasterMuted;
        player2.muted = isMasterMuted;

        if (isMasterMuted) {
            muteIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
            muteBtn.title = "Unmute";
        } else {
            muteIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
            muteBtn.title = "Mute";
        }
    });

    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            if (tvFrame.requestFullscreen) tvFrame.requestFullscreen();
            else if (tvFrame.webkitRequestFullscreen) tvFrame.webkitRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
    });

    function attachTimeupdateGuard(playerInstance) {
        playerInstance.addEventListener('timeupdate', () => {
            if (isReverting || playerInstance.paused || !playerInstance.duration) return;

            const elapsed = (performance.now() - fetchTimestamp) / 1000;
            let target = basePlayed + elapsed;
            if (playerInstance.duration && playerInstance.duration > 0) {
                target = target % playerInstance.duration;
            }

            if (Math.abs(playerInstance.currentTime - target) > 2.5) {
                isReverting = true;
                playerInstance.currentTime = target;
                setTimeout(() => { isReverting = false; }, 300);
            }
        });
    }

    attachTimeupdateGuard(player1);
    attachTimeupdateGuard(player2);

    // Advance sequentially through the playlist array (0 -> 1 -> 2 -> 0 ...)
    function playNextInPlaylist() {
        if (playlist.length === 0 || transitionInFlight) return;
        transitionInFlight = true;

        playlistIndex = (playlistIndex + 1) % playlist.length;
        const nextItem = playlist[playlistIndex];

        currentStreamUrl = nextItem.url;
        titleBox.innerText = "Now: " + (nextItem.title || '');
        fetchTimestamp = performance.now();
        basePlayed = 0;

        switchVideoInstantly(nextItem.url, 0, () => {
            transitionInFlight = false;
        });
    }

    function attachPlaylistEndedHandler(playerInstance) {
        playerInstance.addEventListener('ended', () => {
            if (!playerInstance.classList.contains('active')) return;
            playNextInPlaylist();
        });
    }

    attachPlaylistEndedHandler(player1);
    attachPlaylistEndedHandler(player2);

    // Poll the backend. First response initializes playback at the server's
    // computed schedule position. After that, looping is driven locally by
    // 'ended' events (sequential 0->1->2->0...), while each poll re-syncs
    // playlistIndex/basePlayed to the server's authoritative position if
    // they've drifted apart (e.g. tab was backgrounded, network hiccup).
    function pollLiveConfig() {
        fetch(endpoint + '?t=' + Date.now())
            .then(res => res.json())
            .then(data => {
                const newPlaylist = Array.isArray(data) ? data : (data.playlist || null);

                if (newPlaylist && newPlaylist.length > 0) {
                    playlist = newPlaylist;

                    const serverIndex = Number.isInteger(data.playlistIndex) ? data.playlistIndex : 0;
                    const serverPlayed = Number(data.played) || 0;

                    if (!playlistInitialized) {
                        playlistInitialized = true;
                        playlistIndex = serverIndex;
                        const initialItem = playlist[playlistIndex];
                        currentStreamUrl = initialItem.url;
                        titleBox.innerText = "Now: " + (initialItem.title || '');
                        fetchTimestamp = performance.now();
                        basePlayed = serverPlayed;
                        switchVideoInstantly(initialItem.url, basePlayed);
                    } else if (serverIndex !== playlistIndex && !transitionInFlight) {
                        // Server says a different item should be live (e.g. we
                        // drifted, or the schedule itself changed) — resync.
                        playlistIndex = serverIndex;
                        const item = playlist[playlistIndex];
                        currentStreamUrl = item.url;
                        titleBox.innerText = "Now: " + (item.title || '');
                        fetchTimestamp = performance.now();
                        basePlayed = serverPlayed;
                        switchVideoInstantly(item.url, basePlayed);
                    }

                } else if (data.url && data.url !== currentStreamUrl) {
                    currentStreamUrl = data.url;
                    if (data.title) titleBox.innerText = "Now: " + data.title;
                    basePlayed = data.played || 0;
                    fetchTimestamp = performance.now();
                    switchVideoInstantly(data.url, basePlayed);
                }
            })
            .catch(err => {
                console.warn("Polling sync notice:", err);
            })
            .finally(() => {
                setTimeout(pollLiveConfig, 1000);
            });
    }

    function switchVideoInstantly(newUrl, targetTime, onDone) {
        const activePlayer = activePlayerSlot === 1 ? player1 : player2;
        const standbyPlayer = activePlayerSlot === 1 ? player2 : player1;

        const elapsed = (performance.now() - fetchTimestamp) / 1000;
        let startPos = targetTime + elapsed;

        standbyPlayer.onerror = () => {
            console.error("VIDEO LOAD ERROR:", newUrl, standbyPlayer.error);
            if (typeof onDone === 'function') onDone();
        };

        standbyPlayer.src = newUrl;
        standbyPlayer.muted = isMasterMuted;

        standbyPlayer.onloadedmetadata = () => {
            if (standbyPlayer.duration && standbyPlayer.duration > 0) {
                startPos = startPos % standbyPlayer.duration;
            }
            standbyPlayer.currentTime = startPos;
        };

        standbyPlayer.load();

        standbyPlayer.oncanplay = () => {
            standbyPlayer.play().then(() => {
                standbyPlayer.classList.add('active');
                activePlayer.classList.remove('active');

                activePlayer.pause();
                activePlayer.src = "";

                activePlayerSlot = activePlayerSlot === 1 ? 2 : 1;

                if (typeof onDone === 'function') onDone();
            }).catch(e => {
                console.log("Playback constraint deferred:", e);
                if (typeof onDone === 'function') onDone();
            });
        };
    }

    player1.addEventListener('pause', () => { if (!player1.ended && player1.classList.contains('active')) player1.play().catch(() => {}); });
    player2.addEventListener('pause', () => { if (!player2.ended && player2.classList.contains('active')) player2.play().catch(() => {}); });

    pollLiveConfig();
</script>

</body>
</html>
