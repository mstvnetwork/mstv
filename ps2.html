<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Serverless Synced Live TV</title>
    <style>
      body, html { background-color: #000; height: 100%; width: 100%; margin: 0; overflow: hidden; }
      video { position: fixed; top: 0; left: 0; min-width: 100%; min-height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>

    <!-- Seamless Dual Player Buffer Components -->
    <video id="video1" muted playsinline></video>
    <video id="video2" muted playsinline></video>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
      // Your GitHub release folder path where your .mp4 files are kept
      const basePath = "https://github.com/mstvnetwork/test1/releases/download/v1/";
      
      let playlistData = [];
      let totalPlaylistDuration = 0;
      let activeVideo = $('#video1');
      let bufferVideo = $('#video2');
      let switchTimeout = null;

      async function initLiveSync() {
        try {
          // Fetch your raw playlist file directly from your repo folder
          const response = await fetch('playlist.json?t=' + new Date().getTime());
          playlistData = await response.json();
          
          // Calculate the total duration of the playlist loops
          totalPlaylistDuration = 0;
          playlistData.forEach(item => totalPlaylistDuration += item.duration);
          
          console.log("Playlist synchronized. Total loop length:", totalPlaylistDuration, "seconds.");
          
          // Immediately sync the video stream location
          syncPlayer(true);
          
          // Periodically monitor playback position alignment every 3 seconds to correct drift
          setInterval(() => syncPlayer(false), 3000);
        } catch (e) {
          console.error("Failed to load playlist.json:", e);
        }
      }

      function calculateCurrentBroadcast() {
        if (playlistData.length === 0 || totalPlaylistDuration === 0) return null;

        const currentUnixTime = Math.floor(Date.now() / 1000);
        
        // ANCHOR POINT: Anchor the global stream to midnight UTC of the current day
        // This ensures the loop reset time updates naturally alongside your daily edits
        const baseAnchorTime = Math.floor(Date.now() / 86400000) * 86400; 
        const elapsedSeconds = currentUnixTime - baseAnchorTime;
        
        // Find out exactly where we are in the endless looping block
        let currentLoopPosition = elapsedSeconds % totalPlaylistDuration;

        let accumulatedTime = 0;
        for (let i = 0; i < playlistData.length; i++) {
          const clip = playlistData[i];
          if (currentLoopPosition >= accumulatedTime && currentLoopPosition < (accumulatedTime + clip.duration)) {
            return {
              index: i,
              file: clip.file,
              seekTo: currentLoopPosition - accumulatedTime,
              remaining: (accumulatedTime + clip.duration) - currentLoopPosition
            };
          }
          accumulatedTime += clip.duration;
        }
        return null;
      }

      function syncPlayer(isFirstLoad) {
        const broadcast = calculateCurrentBroadcast();
        if (!broadcast) return;

        const currentEl = activeVideo.get(0);
        const expectedSrc = basePath + broadcast.file;

        // If it's a fresh visit, if a video finished, or if a user refreshed their page:
        if (isFirstLoad || currentEl.src !== expectedSrc || Math.abs(currentEl.currentTime - broadcast.seekTo) > 3) {
          console.log(`Live Channel Match: Loading ${broadcast.file} jumping forward to ${broadcast.seekTo.toFixed(2)}s`);
          
          currentEl.src = expectedSrc;
          currentEl.currentTime = broadcast.seekTo;
          currentEl.play().catch(err => console.log("Browser playback interaction deferred:", err));
          
          setupSeamlessTransition(broadcast.remaining);
        }
      }

      function setupSeamlessTransition(timeRemaining) {
        clearTimeout(switchTimeout);
        
        // Prepare the background swap buffer 1 second before the current track finishes
        const triggerDelay = (timeRemaining - 1.0) * 1000;
        if (triggerDelay <= 0) return;

        switchTimeout = setTimeout(() => {
          // Peek forward to see what track is scheduled next
          const upcomingBroadcast = calculateCurrentBroadcast();
          if (!upcomingBroadcast) return;

          // Silent pre-load on the background player
          const bufferEl = bufferVideo.get(0);
          bufferEl.src = basePath + upcomingBroadcast.file;
          bufferEl.currentTime = 0;
          bufferEl.play().catch(() => {});

          // Transition the display visibility layers seamlessly
          setTimeout(() => {
            bufferVideo.css('z-index', '500');
            activeVideo.css('z-index', '0');
            activeVideo.get(0).pause();

            // Swap player object roles for the next continuous track loop
            const temp = activeVideo;
            activeVideo = bufferVideo;
            bufferVideo = temp;
            
            // Re-arm synchronization loops
            syncPlayer(false);
          }, 1000);

        }, triggerDelay);
      }

      $(document).ready(initLiveSync);
    </script>
  </body>
</html>
