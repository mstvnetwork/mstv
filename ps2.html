<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Linear Live TV Player</title>
    <!-- Include HLS.js for HLS streaming support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #video-container {
            position: relative;
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16/9;
            background: #050505;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .media-target {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: black;
            opacity: 0;
            z-index: 1;
            transition: opacity 0.4s ease-in-out;
            pointer-events: none;
        }
        .media-target.active {
            opacity: 1;
            z-index: 2;
            pointer-events: auto;
        }
        #ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 15px;
            border-radius: 4px;
            font-size: 14px;
            pointer-events: none;
            border-left: 4px solid #ff0055;
        }
    </style>
</head>
<body>

<div id="video-container">
    <div id="ui-overlay">🔴 LIVE</div>
    
    <!-- Seamless Dual Player Matrix -->
    <video id="player1" class="media-target" playsinline muted></video>
    <video id="player2" class="media-target" playsinline muted></video>
    <iframe id="iframe-player" class="media-target" allow="autoplay; encrypted-media"></iframe>
</div>

<script>
    // Configure your raw JSON playlist URL here
    const PLAYLIST_URL = "https://crickethd.pages.dev/playlist.json"; 
    
    let playlist = [];
    let totalPlaylistDuration = 0;
    
    const p1 = document.getElementById('player1');
    const p2 = document.getElementById('player2');
    const iframe = document.getElementById('iframe-player');
    
    let activePlayer = null; 
    let currentVideoIndex = -1;
    let hlsInstance = null;
    let antiScrubLock = false;

    // Initialization logic
    async function initLiveEngine() {
        await fetchPlaylist();
        if (playlist.length === 0) return;

        // Auto-play recovery sequence handles explicit audio unmuting rules safely
        window.addEventListener('click', () => {
            if (activePlayer && activePlayer.muted) {
                activePlayer.muted = false;
            }
        }, { once: false });

        // Synchronize loop cycle
        tick();
        setInterval(tick, 1000); 
        
        // Background playlist updates without affecting On-Air playback
        setInterval(fetchPlaylist, 30000); 
    }

    async function fetchPlaylist() {
        try {
            const res = await fetch(`${PLAYLIST_URL}?t=${Date.now()}`);
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
                playlist = data;
                totalPlaylistDuration = playlist.reduce((sum, item) => sum + item.duration, 0);
            }
        } catch (e) {
            console.warn("Silent failure protecting engine during background playlist append:", e);
        }
    }

    function tick() {
        if (playlist.length === 0 || totalPlaylistDuration === 0) return;

        const currentUnixTime = Math.floor(Date.now() / 1000);
        const globalTimelinePosition = currentUnixTime % totalPlaylistDuration;

        let accumulatedTime = 0;
        let targetIndex = 0;
        let targetSeekTime = 0;

        // Calculate current On-Air item and track timeline coordinates
        for (let i = 0; i < playlist.length; i++) {
            if (globalTimelinePosition >= accumulatedTime && globalTimelinePosition < accumulatedTime + playlist[i].duration) {
                targetIndex = i;
                targetSeekTime = globalTimelinePosition - accumulatedTime;
                break;
            }
            accumulatedTime += playlist[i].duration;
        }

        // Handle source transitions seamlessly
        if (targetIndex !== currentVideoIndex) {
            switchPlayerSource(targetIndex, targetSeekTime);
        } else {
            // Anti-Scrubbing Guard rails
            enforceTimelineLock(targetSeekTime);
        }
    }

    function switchPlayerSource(index, seekTime) {
        currentVideoIndex = index;
        const targetItem = playlist[index];
        const isIframe = targetItem.url.includes("youtube.com") || targetItem.url.includes("vimeo.com") || !targetItem.url.includes(".mp4") && !targetItem.url.includes(".m3u8") && !targetItem.url.includes("proxy");

        // Cleanup active pipeline bindings
        if (hlsInstance) {
            hlsInstance.destroy();
            hlsInstance = null;
        }

        if (isIframe) {
            // Deploy explicit Iframe stream pipeline
            setElementActive(iframe);
            iframe.src = `${targetItem.url}${targetItem.url.includes('?') ? '&' : '?'}autoplay=1&mute=1&start=${seekTime}`;
            activePlayer = null;
        } else {
            // Switch roles between dual targets to eliminate stream jump frames
            const nextPlayer = (activePlayer === p1) ? p2 : p1;
            const fallbackPlayer = (nextPlayer === p1) ? p2 : p1;

            // Smart Native Streaming Delivery (Bypass strict external CORS policies)
            nextPlayer.removeAttribute('crossorigin'); 
            
            if (targetItem.url.includes(".m3u8") || targetItem.url.includes("index-v1")) {
                if (Hls.isSupported()) {
                    hlsInstance = new Hls({ maxBufferLength: 10, enableWorker: true });
                    hlsInstance.loadSource(targetItem.url);
                    hlsInstance.attachMedia(nextPlayer);
                } else if (nextPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                    nextPlayer.src = targetItem.url;
                }
            } else {
                // Native pipeline for structural MP4 playbacks
                nextPlayer.src = targetItem.url;
            }

            nextPlayer.currentTime = seekTime;
            
            // Asynchronous Media Promise Defenses
            nextPlayer.play().then(() => {
                setElementActive(nextPlayer);
                activePlayer = nextPlayer;
                
                // Clear the inactive fallback background pipeline 
                fallbackPlayer.pause();
                fallbackPlayer.src = "";
            }).catch(err => {
                // Silently bypass pipeline blocking rules if browser blocks autoplay
                setElementActive(nextPlayer);
                activePlayer = nextPlayer;
            });
        }
    }

    function setElementActive(el) {
        [p1, p2, iframe].forEach(node => node.classList.remove('active'));
        el.classList.add('active');
    }

    function enforceTimelineLock(expectedTime) {
        if (!activePlayer || antiScrubLock) return;

        // Anti-Scrubbing Debounce Watchdog: Allows buffering window space on Cloudflare
        const drift = Math.abs(activePlayer.currentTime - expectedTime);
        if (drift > 3.5) {
            antiScrubLock = true;
            activePlayer.currentTime = expectedTime;
            setTimeout(() => { antiScrubLock = false; }, 800); 
        }
    }

    window.onload = initLiveEngine;
</script>

</body>
</html>
