<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Pseudo Live TV (HLS .m3u8 Mode)</title>
    <!-- Updated CDN link to prevent Source Map 404 errors -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16/9;
            background: #000;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
        }
        video.active {
            opacity: 1;
            pointer-events: auto;
        }
        /* --- CRITICAL: Autoplay Blocker Overlay --- */
        .gatekeeper-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            cursor: pointer;
            transition: opacity 0.4s ease;
        }
        .gatekeeper-btn {
            background: #ff3b30;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.4);
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Overlay to clear browser autoplay restrictions -->
        <div id="gatekeeper" class="gatekeeper-overlay" onclick="startBroadcastChannel()">
            <button class="gatekeeper-btn">📺 CLICK TO WATCH LIVE BROADCAST</button>
        </div>

        <!-- Dual Video Players -->
        <video id="player1" class="active" playsinline></video>
        <video id="player2" playsinline></video>
    </div>

    <script>
        const playlist = [
            { title: "Stream 1", url: "https://xtremplay.com/api/proxy?url=https%3A%2F%2Fsi.videoapne.to%2Fhls%2Fbdohxjxe7bboxuzvta274tanrc4emxhgot33hl6b4djoaxt3s5t4wbi7kkfq%2Findex-v1-a1.m3u8&ref=https%3A%2F%2Fsi.videoapne.to%2Fhls%2Fbdohxjxe7bboxuzvta274tanrc4emxhgot33hl6b4djoaxt3s5t4wbi7kkfq%2Findex-v1-a1.m3u8", duration: 3166 },
            { title: "Stream 2", url: "https://xtremplay.com/api/proxy?url=https%3A%2F%2Fsi.videoapne.to%2Fhls%2Fbdohxjxe7bboxuzvta274tanrc4emxhgot33hl6b4djoaxt3s5t4wbi7kkfq%2Findex-v1-a1.m3u8&ref=https%3A%2F%2Fsi.videoapne.to%2Fhls%2Fbdohxjxe7bboxuzvta274tanrc4emxhgot33hl6b4djoaxt3s5t4wbi7kkfq%2Findex-v1-a1.m3u8", duration: 3166 },
            { title: "Stream 3", url: "https://xtremplay.com/api/proxy?url=https%3A%2F%2Fftmain.cachefly.net%2Ffiles%2Fa8wn4hw%2Fvi%2Ffb%2F63%2F10207843%2Fhls-hi%2Fs10207843.m3u8&ref=https%3A%2F%2Fftmain.cachefly.net%2Ffiles%2Fa8wn4hw%2Fvi%2Ffb%2F63%2F10207843%2Fhls-hi%2Fs10207843.m3u8", duration: 219 }
  
        ];
        

        const p1 = document.getElementById('player1');
        const p2 = document.getElementById('player2');
        const gatekeeper = document.getElementById('gatekeeper');
        
        let activePlayer = p1;
        let idlePlayer = p2;
        let totalLoopDuration = playlist.reduce((sum, vid) => sum + vid.duration, 0);
        let expectedTime = 0;
        let hasStarted = false;

        let hls1 = null;
        let hls2 = null;

        function getLiveState() {
            let currentUnixTime = Math.floor(Date.now() / 1000);
            let currentPositionInLoop = currentUnixTime % totalLoopDuration;

            let elapsedTime = 0;
            for (let i = 0; i < playlist.length; i++) {
                let video = playlist[i];
                if (currentPositionInLoop >= elapsedTime && currentPositionInLoop < (elapsedTime + video.duration)) {
                    let offset = currentPositionInLoop - elapsedTime;
                    let nextIndex = (i + 1) % playlist.length;
                    return { currentVideo: video, offset: offset, nextVideo: playlist[nextIndex] };
                }
                elapsedTime += video.duration;
            }
        }

        function loadHlsStream(player, url, instanceName) {
            if (instanceName === 'hls1' && hls1) { hls1.destroy(); hls1 = null; }
            if (instanceName === 'hls2' && hls2) { hls2.destroy(); hls2 = null; }

            if (Hls.isSupported()) {
                // Tuned parameters for faster initialization loops
                const hls = new Hls({ 
                    maxBufferLength: 20, 
                    maxMaxBufferLength: 40,
                    liveSyncDuration: 3,
                    enableWorker: true
                });
                hls.loadSource(url);
                hls.attachMedia(player);
                
                if (instanceName === 'hls1') hls1 = hls;
                if (instanceName === 'hls2') hls2 = hls;
            } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
                player.src = url;
            }
        }

        function syncBroadcast(isInitialLoad = false) {
            if (!hasStarted) return; // Wait until they click the overlay button

            const state = getLiveState();
            if (!state) return;

            expectedTime = state.offset;
            const activeInstanceName = (activePlayer === p1) ? 'hls1' : 'hls2';

            if (isInitialLoad || activePlayer.dataset.currentUrl !== state.currentVideo.url) {
                activePlayer.dataset.currentUrl = state.currentVideo.url;
                loadHlsStream(activePlayer, state.currentVideo.url, activeInstanceName);
                
                // Jump to the exact stream second as soon as data loads
                activePlayer.onloadedmetadata = () => {
                    activePlayer.currentTime = state.offset;
                    activePlayer.play().catch(e => console.log("Playback engine blocked:", e));
                    activePlayer.onloadedmetadata = null;
                };
            } else {
                if (Math.abs(activePlayer.currentTime - expectedTime) > 2) {
                    activePlayer.currentTime = expectedTime;
                }
            }

            // --- DELAYED IDLE PRE-BUFFERING ---
            // Don't preload immediately on page initialization to avoid segment drops
            setTimeout(() => {
                const idleInstanceName = (idlePlayer === p1) ? 'hls1' : 'hls2';
                if (idlePlayer.dataset.currentUrl !== state.nextVideo.url) {
                    idlePlayer.dataset.currentUrl = state.nextVideo.url;
                    loadHlsStream(idlePlayer, state.nextVideo.url, idleInstanceName);
                    
                    idlePlayer.onloadedmetadata = () => {
                        idlePlayer.muted = true;
                        idlePlayer.pause();
                        idlePlayer.onloadedmetadata = null;
                    };
                }
            }, isInitialLoad ? 5000 : 100); // 5s grace period on start
        }

        // Triggered by the user interface overlay button
        function startBroadcastChannel() {
            hasStarted = true;
            gatekeeper.style.opacity = '0';
            setTimeout(() => gatekeeper.remove(), 400); // Clean up the DOM
            
            // Unmute players globally based on user interaction allowance rules
            p1.muted = false;
            p2.muted = false;
            
            syncBroadcast(true);
        }

        function handleVideoEnded() {
            activePlayer.classList.remove('active');
            idlePlayer.classList.add('active');

            let tempPlayer = activePlayer;
            activePlayer = idlePlayer;
            idlePlayer = tempPlayer;

            activePlayer.muted = false;
            activePlayer.play().catch(e => console.log("Flipping playback catch triggered:", e));
            expectedTime = 0;

            setTimeout(() => syncBroadcast(false), 1000);
        }

        function enforceStrictTimeline() {
            if (Math.abs(activePlayer.currentTime - expectedTime) > 1.5) {
                activePlayer.currentTime = expectedTime;
            }
        }

        setInterval(() => {
            if (hasStarted && !activePlayer.paused) {
                expectedTime += 1;
            }
        }, 1000);

        [p1, p2].forEach(player => {
            player.addEventListener('ended', handleVideoEnded);
            player.addEventListener('seeking', enforceStrictTimeline);
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && hasStarted) {
                syncBroadcast(true);
            }
        });
    </script>
</body>
</html>
