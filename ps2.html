<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuous Linear TV Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #0d0d11;
            color: #fff;
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .player-container {
            position: relative;
            width: 95%;
            max-width: 960px;
            aspect-ratio: 16/9;
            background: #000;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border-radius: 12px;
            border: 1px solid #222;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.5s ease-in-out;
            background: #000;
        }
        .active { opacity: 1; z-index: 2; }
        .hidden { opacity: 0; z-index: 1; pointer-events: none; }
        
        .overlay-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(13, 13, 17, 0.85);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            border-left: 4px solid #00bcff;
            backdrop-filter: blur(5px);
        }
        .unmute-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            background: #00bcff;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Space Grotesk', sans-serif;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,188,255,0.4);
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .unmute-btn:hover {
            transform: translate(-50%, -50%) scale(1.05);
            background: #009ad4;
        }
    </style>
</head>
<body>

<div class="player-container">
    <button id="unmuteBtn" class="unmute-btn" onclick="unmutePlayers()">🔊 Click to Unmute & Sync Live</button>
    <div id="statusOverlay" class="overlay-ui">Connecting to Live Grid...</div>
    <video id="player1" class="active" playsinline muted></video>
    <video id="player2" class="hidden" playsinline muted></video>
</div>

<script>
// State Management
let channelConfig = {
    activeLoopStart: 1772640000000, // Fallback Epoch
    playlist: [
          { url: 'https://xtremplay.com/api/proxy?url=https%3A%2F%2Fsi.videoapne.to%2Fhls%2Fbdohxlfh7bboxuzvta5p4hqrs3xzfskymy77idnkubzgrkx5swcjli36fdca%2Findex-v1-a1.m3u8&ref=https%3A%2F%2Fsi.videoapne.to%2Fhls%2Fbdohxlfh7bboxuzvta5p4hqrs3xzfskymy77idnkubzgrkx5swcjli36fdca%2Findex-v1-a1.m3u8'
           ,duration: 4403 },
        { url: ' https://xtremplay.com/api/proxy?url=https%3A%2F%2Fsi.videoapne.to%2Fhls%2Fbdohw6ff7bboxuzvta5p4batqfhjhylse7ducvr5mb6x6r6s6ru2hz35tz2a%2Findex-v1-a1.m3u8&ref=https%3A%2F%2Fsi.videoapne.to%2Fhls%2Fbdohw6ff7bboxuzvta5p4batqfhjhylse7ducvr5mb6x6r6s6ru2hz35tz2a%2Findex-v1-a1.m3u8',
  duration: 4672  },
        { url: 'https://xtremplay.com/api/proxy?url=https%3A%2F%2Fs2.videoapne.to%2Fhls%2Fbdohxbog7bboxuzvta574ckttrs5li3wcu72b5mreyduvd7thg6u6uq7mi7q%2Findex-v1-a1.m3u8&ref=https%3A%2F%2Fs2.videoapne.to%2Fhls%2Fbdohxbog7bboxuzvta574ckttrs5li3wcu72b5mreyduvd7thg6u6uq7mi7q%2Findex-v1-a1.m3u8',
   duration:3580   }
        
        
  
    ]
};

let p1 = document.getElementById('player1');
let p2 = document.getElementById('player2');
let activePlayer = p1;
let inactivePlayer = p2;
let hlsInstances = { player1: null, player2: null };

let currentTrackIndex = -1;
let isEnforcingSync = false;
let userHasInteracted = false;

// Format-Agnostic Engine Pipeline
function loadMediaSource(player, url, targetSeekTime) {
    const playerId = player.id;
    
    if (hlsInstances[playerId]) {
        hlsInstances[playerId].destroy();
        hlsInstances[playerId] = null;
    }

    const applyTargetSyncTime = () => {
        player.currentTime = targetSeekTime;
        if (userHasInteracted) {
            player.play().catch(e => console.log("Playback engine waiting: ", e));
        }
    };

    if (url.toLowerCase().includes('.m3u8')) {
        if (Hls.isSupported()) {
            const hls = new Hls({ maxBufferLength: 10, enableWorker: true });
            hlsInstances[playerId] = hls;
            hls.loadSource(url);
            hls.attachMedia(player);
            hls.once(Hls.Events.MANIFEST_PARSED, applyTargetSyncTime);
        } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
            player.src = url;
            player.onloadedmetadata = applyTargetSyncTime;
        }
    } else {
        player.src = url;
        player.onloadedmetadata = applyTargetSyncTime;
    }
    player.load();
}

// Linear Schedule Timeline Engine
function getLinearTimelineState() {
    const playlist = channelConfig.playlist;
    const totalDuration = playlist.reduce((sum, t) => sum + t.duration, 0);
    const msSinceLoopStart = Date.now() - channelConfig.activeLoopStart;
    const totalSecondsElapsed = Math.floor(msSinceLoopStart / 1000);

    // Calculate position within the current playback loop iteration
    let currentPlaylistTime = totalSecondsElapsed % totalDuration;
    if (currentPlaylistTime < 0) currentPlaylistTime += totalDuration;

    let accumulatedTime = 0;
    for (let i = 0; i < playlist.length; i++) {
        if (currentPlaylistTime >= accumulatedTime && currentPlaylistTime < accumulatedTime + playlist[i].duration) {
            return {
                index: i,
                seekTo: currentPlaylistTime - accumulatedTime,
                track: playlist[i]
            };
        }
        accumulatedTime += playlist[i].duration;
    }
    return { index: 0, seekTo: 0, track: playlist[0] };
}

// Execution and Crossfading Controller
function refreshPlayerEngine() {
    if (!channelConfig.playlist || channelConfig.playlist.length === 0) return;
    
    const state = getLinearTimelineState();
    
    if (currentTrackIndex !== state.index) {
        currentTrackIndex = state.index;
        
        // Stage upcoming track on background element
        loadMediaSource(inactivePlayer, state.track.url, state.seekTo);
        
        // Smooth transition swap
        activePlayer.className = "hidden";
        inactivePlayer.className = "active";
        
        let temp = activePlayer;
        activePlayer = inactivePlayer;
        inactivePlayer = temp;
        
        document.getElementById('statusOverlay').innerHTML = `🔴 <b>LIVE ON-AIR:</b> Video #${currentTrackIndex + 1}`;
    } else {
        // Enforce anti-drift timeline lock (2-second threshold)
        if (Math.abs(activePlayer.currentTime - state.seekTo) > 2.0) {
            isEnforcingSync = true;
            activePlayer.currentTime = state.seekTo;
            setTimeout(() => { isEnforcingSync = false; }, 300);
        }
    }
}

// Hardened Anti-Scrub Lock Hook
function setupAntiScrubSecurity(playerElement) {
    playerElement.addEventListener('seeking', () => {
        if (!isEnforcingSync) {
            const state = getLinearTimelineState();
            isEnforcingSync = true;
            playerElement.currentTime = state.seekTo;
            document.getElementById('statusOverlay').innerHTML = "🔒 <b>Anti-Scrub System:</b> Sync Locked.";
            setTimeout(() => { isEnforcingSync = false; }, 400);
        }
    });
}

// Serverless Config Fetcher
async function fetchServerlessPlaylist() {
    try {
        const response = await fetch('./playlist.json?nocache=' + Date.now());
        if (response.ok) {
            const data = await response.json();
            if (data && data.playlist && Array.isArray(data.playlist)) {
                channelConfig = data;
            }
        }
    } catch (e) {
        console.log("Local playlist parsing paused until hosted live via server or GitHub Pages.");
    }
}

function unmutePlayers() {
    userHasInteracted = true;
    p1.muted = false;
    p2.muted = false;
    document.getElementById('unmuteBtn').style.display = 'none';
    
    const state = getLinearTimelineState();
    activePlayer.play().catch(() => {
        loadMediaSource(activePlayer, state.track.url, state.seekTo);
    });
}

// Initialization Sequence
setupAntiScrubSecurity(p1);
setupAntiScrubSecurity(p2);

fetchServerlessPlaylist().then(() => {
    refreshPlayerEngine();
    // Heartbeats
    setInterval(refreshPlayerEngine, 1000);
    setInterval(fetchServerlessPlaylist, 15000); // Poll playlist adjustments every 15 seconds
});
</script>
</body>
</html>
