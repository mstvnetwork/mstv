<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Linear Live TV Player</title>
    <!-- Include hls.js engine for native M3U8 handling across non-Safari browsers -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        .player-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        /* Dual Layered Window Arrays */
        .player-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            z-index: 1;
        }
        .player-layer.active {
            opacity: 1;
            visibility: visible;
            z-index: 2;
        }
        video, iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Player Layer 1 -->
        <div id="layer1" class="player-layer"></div>
        <!-- Player Layer 2 -->
        <div id="layer2" class="player-layer"></div>
    </div>
        <script>
        // System Configurations
        const PLAYLIST_URL = 'playlist.json';
        const FALLBACK_URL = 'https://github.com';
        const POLL_INTERVAL = 30000; // 30 seconds dynamic backend update verification
        const ALLOWED_SEEK_DRIFT = 2; // Maximum drift window in seconds before snapback forces correction

        // Runtime Tracking Object Variables
        let state = {
            playlist: [],
            currentVideoIndex: -1,
            targetPosition: 0,
            activeLayer: 'layer1',
            hlsInstances: { layer1: null, layer2: null }
        };

        // Initialize App Engine
        async function init() {
            await fetchPlaylist();
            syncEngine();
            // Start background synchronization polling loops
            setInterval(fetchPlaylist, POLL_INTERVAL);
            setInterval(syncEngine, 1000);
        }

        // Fetch dynamic playlist updates silently from Cloudflare Pages origin hosting boundary
        async function fetchPlaylist() {
            try {
                const response = await fetch(`${PLAYLIST_URL}?t=${Date.now()}`);
                if (!response.ok) throw new Error('Network error reading current playlist manifest file');
                const data = await response.json();
                if (Array.isArray(data) && data.length > 0) {
                    state.playlist = data;
                } else {
                    useFallbackPlaylist();
                }
            } catch (error) {
                console.error("Playlist read failed, deploying fallback engine protection:", error);
                if (state.playlist.length === 0) useFallbackPlaylist();
            }
        }

        function useFallbackPlaylist() {
            state.playlist = [{
                url: FALLBACK_URL,
                duration: 86400 // Set massive virtual loop timeline configuration for fallback asset
            }];
        }

        // Global Epoch mathematical synchronization timeline calculation loop
        function syncEngine() {
            if (state.playlist.length === 0) return;

            // Compute cumulative total time parameters dynamically
            let totalPlaylistDuration = 0;
            const videoSegments = state.playlist.map(item => {
                const start = totalPlaylistDuration;
                totalPlaylistDuration += parseInt(item.duration, 10);
                return { ...item, start, end: totalPlaylistDuration };
            });

            // Find global live wall position coordinates
            const currentUnixTimeSeconds = Math.floor(Date.now() / 1000);
            const globalTimelinePosition = currentUnixTimeSeconds % totalPlaylistDuration;

            // Identify active indexed array structural context matching timeline location
            let matchedIndex = 0;
            let videoInsidePosition = 0;

            for (let i = 0; i < videoSegments.length; i++) {
                if (globalTimelinePosition >= videoSegments[i].start && globalTimelinePosition < videoSegments[i].end) {
                    matchedIndex = i;
                    videoInsidePosition = globalTimelinePosition - videoSegments[i].start;
                    break;
                }
            }

            state.targetPosition = videoInsidePosition;
            
            // Check if active target source index state matches playing configurations
            if (state.currentVideoIndex !== matchedIndex) {
                state.currentVideoIndex = matchedIndex;
                transitionToSource(state.playlist[matchedIndex], videoInsidePosition);
            } else {
                // Run background verification checks tracking user interactive scrubbing attempts
                enforceAntiScrubbing();
            }
        }
        // Seamless zero-jump dual layer handoff mechanism switcher logic
        function transitionToSource(videoItem, startTime) {
            const nextLayer = state.activeLayer === 'layer1' ? 'layer2' : 'layer1';
            const currentLayer = state.activeLayer;
            const container = document.getElementById(nextLayer);
            
            // Clean dynamic components inside alternative targets memory fields beforehand
            destroyLayerEngine(nextLayer);
            container.innerHTML = '';

            const engineType = getEngineType(videoItem.url);

            if (engineType === 'iframe') {
                const iframe = document.createElement('iframe');
                iframe.src = videoItem.url;
                iframe.allow = "autoplay; encrypted-media; picture-in-picture";
                iframe.setAttribute('allowfullscreen', '');
                container.appendChild(iframe);
                
                // Complete layer swap workflow instantly since iframe embeds cannot pass time vectors natively
                executeLayerSwap(nextLayer, currentLayer);
            } else {
                // Initialize clean HTML5 video structures for native stream engines handling routines
                const video = document.createElement('video');
                video.muted = true; // Auto-play browser standard compliance rule validation engine
                video.playsInline = true;
                video.controls = false; // Completely strip controls natively to reduce interaction variables
                container.appendChild(video);

                if (engineType === 'hls') {
                    if (Hls.isSupported()) {
                        const hls = new Hls({ config: { maxMaxBufferLength: 10 } });
                        state.hlsInstances[nextLayer] = hls;
                        hls.loadSource(videoItem.url);
                        hls.attachMedia(video);
                        hls.on(Hls.Events.MANIFEST_PARSED, () => {
                            video.currentTime = startTime;
                            video.play().catch(() => handleAutoplayBlock(video));
                        });
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        // Native Safari Fallback pipeline logic
                        video.src = videoItem.url;
                        video.addEventListener('loadedmetadata', () => {
                            video.currentTime = startTime;
                            video.play().catch(() => handleAutoplayBlock(video));
                        });
                    }
                } else {
                    // Standard raw progressive MP4 profile target configuration routing
                    video.src = videoItem.url;
                    video.addEventListener('loadedmetadata', () => {
                        video.currentTime = startTime;
                        video.play().catch(() => handleAutoplayBlock(video));
                    });
                }

                // Wait for video frame to be ready before firing the swap to ensure a zero-jump switchover
                video.addEventListener('playing', function onPlayingHandler() {
                    executeLayerSwap(nextLayer, currentLayer);
                    video.removeEventListener('playing', onPlayingHandler);
                });
            }
        }

        function executeLayerSwap(nextLayer, currentLayer) {
            document.getElementById(nextLayer).classList.add('active');
            document.getElementById(currentLayer).classList.remove('active');
            state.activeLayer = nextLayer;
            
            // Unmute the newly visible layer once it's on-air
            const nextVideo = document.getElementById(nextLayer).querySelector('video');
            if (nextVideo) nextVideo.muted = false;

            // Safely wind down and clear assets from the old background layer
            setTimeout(() => {
                if (state.activeLayer !== currentLayer) { 
                    destroyLayerEngine(currentLayer);
                    document.getElementById(currentLayer).innerHTML = '';
                }
            }, 500);
        }

        // Silent anti-scrubbing lock validation check operations
        function enforceAntiScrubbing() {
            const activeVideo = document.getElementById(state.activeLayer).querySelector('video');
            if (!activeVideo || activeVideo.paused) return;

            const drift = Math.abs(activeVideo.currentTime - state.targetPosition);
            if (drift > ALLOWED_SEEK_DRIFT) {
                // Force silent absolute snap correction without throwing UI warning states to user interface canvas
                activeVideo.currentTime = state.targetPosition;
            }
        }

        function destroyLayerEngine(layerId) {
            if (state.hlsInstances[layerId]) {
                state.hlsInstances[layerId].destroy();
                state.hlsInstances[layerId] = null;
            }
        }

        function getEngineType(url) {
            if (url.includes('.m3u8') || url.includes('hls/')) return 'hls';
            if (url.includes('.mp4') || url.includes('releases/download')) return 'mp4';
            return 'iframe'; // Fallback detection matrix defaults routing targeting unmapped paths directly into iframe windows
        }

        function handleAutoplayBlock(videoElement) {
            // Browsers require explicit user engagement vectors before granting dynamic sound permissions
            videoElement.muted = true;
            videoElement.play();
            
            // Window click listener converts system safely to unmuted output once user touches anywhere on page canvas
            window.addEventListener('click', () => {
                videoElement.muted = false;
            }, { once: true });
        }

        window.onload = init;
    </script>
</body>
</html>
