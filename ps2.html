<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuous Fixed Linear TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #09090c;
            color: #fff;
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .player-container {
            position: relative;
            width: 95%;
            max-width: 960px;
            aspect-ratio: 16/9;
            background: #000;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border-radius: 12px;
            border: 1px solid #1a1a24;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.4s ease-in-out;
            background: #000;
        }
        .active { opacity: 1; z-index: 2; }
        .hidden { opacity: 0; z-index: 1; pointer-events: none; }
        
        .overlay-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(9, 9, 12, 0.85);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            border-left: 4px solid #00bcff;
            backdrop-filter: blur(5px);
        }
        .unmute-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            background: #00bcff;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Space Grotesk', sans-serif;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,188,255,0.4);
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .unmute-btn:hover {
            transform: translate(-50%, -50%) scale(1.05);
            background: #009ad4;
        }
    </style>
</head>
<body>

<div class="player-container">
    <button id="unmuteBtn" class="unmute-btn" onclick="unmutePlayers()">🔊 Click to Unmute & Sync Live</button>
    <div id="statusOverlay" class="overlay-ui">Constructing Time-Stable Engine...</div>
    <video id="player1" class="active" playsinline muted></video>
    <video id="player2" class="hidden" playsinline muted></video>
</div>

<script>
// Time-stable configuration architecture
let channelConfig = {
    activeLoopStart: 1700000000000, // Locked Anchor Point
    playlist: []
};

let p1 = document.getElementById('player1');
let p2 = document.getElementById('player2');
let activePlayer = p1;
let inactivePlayer = p2;
let hlsInstances = { player1: null, player2: null };

let currentTrackUrl = ""; 
let isEnforcingSync = false;
let userHasInteracted = false;

function loadMediaSource(player, url, targetSeekTime) {
    const playerId = player.id;
    if (hlsInstances[playerId]) {
        hlsInstances[playerId].destroy();
        hlsInstances[playerId] = null;
    }

    const applyTargetSyncTime = () => {
        player.currentTime = targetSeekTime;
        if (userHasInteracted) {
            player.play().catch(() => {});
        }
    };

    if (url.toLowerCase().includes('.m3u8')) {
        if (Hls.isSupported()) {
            const hls = new Hls({ maxBufferLength: 8, enableWorker: true });
            hlsInstances[playerId] = hls;
            hls.loadSource(url);
            hls.attachMedia(player);
            hls.once(Hls.Events.MANIFEST_PARSED, applyTargetSyncTime);
        } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
            player.src = url;
            player.onloadedmetadata = applyTargetSyncTime;
        }
    } else {
        player.src = url;
        player.onloadedmetadata = applyTargetSyncTime;
    }
    player.load();
}

// Chronologically Stable Virtual Timeline Tracker
function getStableTimelineState() {
    const playlist = channelConfig.playlist;
    if (!playlist || playlist.length === 0) {
        return { url: "", seekTo: 0, title: "Streaming Offline" };
    }

    const startSecs = Math.floor(channelConfig.activeLoopStart / 1000);
    const nowSecs = Math.floor(Date.now() / 1000);
    
    // Prevent errors if the device clock is behind the anchor point
    if (nowSecs < startSecs) {
        return { url: playlist[0].url, seekTo: 0, title: "Preroll Sync" };
    }

    // Step 1: Calculate the cumulative track timing offsets for a single loop pass
    let singleLoopDuration = 0;
    const trackWindows = playlist.map((track, idx) => {
        const entry = {
            url: track.url,
            duration: track.duration,
            startOffset: singleLoopDuration,
            endOffset: singleLoopDuration + track.duration,
            title: track.title || `Track #${idx + 1}`
        };
        singleLoopDuration += track.duration;
        return entry;
    });

    // Step 2: Step forward loop by loop from the historical anchor point
    let totalSecondsElapsed = nowSecs - startSecs;
    let loopCount = Math.floor(totalSecondsElapsed / singleLoopDuration);
    let remainderTime = totalSecondsElapsed % singleLoopDuration;

    // Step 3: Map the remainder time to the corresponding track window
    for (let i = 0; i < trackWindows.length; i++) {
        const t = trackWindows[i];
        if (remainderTime >= t.startOffset && remainderTime < t.endOffset) {
            return {
                url: t.url,
                seekTo: remainderTime - t.startOffset,
                title: `${t.title} (Loop #${loopCount + 1})`
            };
        }
    }

    return { url: playlist[0].url, seekTo: 0, title: "Loop Recalibration" };
}

function refreshPlayerEngine() {
    const state = getStableTimelineState();
    if (!state.url) return;

    if (currentTrackUrl !== state.url) {
        currentTrackUrl = state.url;
        
        loadMediaSource(inactivePlayer, state.url, state.seekTo);
        
        activePlayer.className = "hidden";
        inactivePlayer.className = "active";
        
        let temp = activePlayer;
        activePlayer = inactivePlayer;
        inactivePlayer = temp;
        
        document.getElementById('statusOverlay').innerHTML = `🔴 <b>LIVE ON-AIR:</b> ${state.title}`;
    } else {
        // Correct for small timeline drifts (2.0-second threshold)
        if (Math.abs(activePlayer.currentTime - state.seekTo) > 2.0) {
            isEnforcingSync = true;
            activePlayer.currentTime = state.seekTo;
            setTimeout(() => { isEnforcingSync = false; }, 300);
        }
    }
}

function setupAntiScrubSecurity(playerElement) {
    playerElement.addEventListener('seeking', () => {
        if (!isEnforcingSync) {
            const state = getStableTimelineState();
            isEnforcingSync = true;
            playerElement.currentTime = state.seekTo;
            document.getElementById('statusOverlay').innerHTML = "🔒 <b>Anti-Scrub System:</b> Playback Fixed.";
            setTimeout(() => { isEnforcingSync = false; }, 400);
        }
    });
}

async function fetchServerlessPlaylist() {
    try {
        const response = await fetch('./playlist.json?nocache=' + Date.now());
        if (response.ok) {
            const data = await response.json();
            if (data && Array.isArray(data.playlist)) {
                channelConfig = data;
            }
        }
    } catch (e) {
        console.log("Local system file tracking fallback operational.");
    }
}

function unmutePlayers() {
    userHasInteracted = true;
    p1.muted = false;
    p2.muted = false;
    document.getElementById('unmuteBtn').style.display = 'none';
    
    const state = getStableTimelineState();
    activePlayer.play().catch(() => {
        loadMediaSource(activePlayer, state.url, state.seekTo);
    });
}

setupAntiScrubSecurity(p1);
setupAntiScrubSecurity(p2);

fetchServerlessPlaylist().then(() => {
    refreshPlayerEngine();
    setInterval(refreshPlayerEngine, 1000);
    setInterval(fetchServerlessPlaylist, 10000);
});
</script>
</body>
</html>
