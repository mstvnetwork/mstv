<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Synchronized Linear TV Player</title>
    <!-- Include hls.js engine for handling live .m3u8 streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .player-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            pointer-events: none; /* Prevents users from pausing via right-click/taps */
        }
        video.active {
            opacity: 1;
            pointer-events: auto;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
        }
        .live-indicator {
            display: inline-block;
            background: #ff0000;
            color: white;
            padding: 2px 6px;
            font-weight: bold;
            font-size: 12px;
            border-radius: 3px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="player-container">
    <!-- Dual Player Setup -->
    <video id="player1" playsinline muted></video>
    <video id="player2" playsinline muted></video>

    <!-- Overlay Info Panel -->
    <div id="ui-overlay">
        <div class="live-indicator">● LIVE</div>
        <div id="track-title">Synchronizing Grid...</div>
        <div id="sync-status">Time Lock: Active</div>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    // Change this to your Cloudflare URL or GitHub Pages URL where playlist.json is built/served
    const PLAYLIST_URL = 'playlist.json'; 
    const GRID_CYCLE = 43200; // Strict 12-Hour Broadcast Loop Frame (Seconds)
    const MAX_ALLOWED_DRIFT = 2; // Anti-scrub max deviation tolerance in seconds

    let playlist = [];
    let activePlayer = null;
    let inactivePlayer = null;
    let p1Hls = null;
    let p2Hls = null;
    
    const p1 = document.getElementById('player1');
    const p2 = document.getElementById('player2');

    // Initialize players
    activePlayer = p1;
    inactivePlayer = p2;

    // --- UTILITIES ---
    function getGlobalGridTime() {
        // Absolute global unix time lock across all modern browsers
        return Math.floor(Date.now() / 1000) % GRID_CYCLE;
    }

    // --- PLAYLIST TIMING ENGINE ---
    function calculateCurrentSchedule(playlistData) {
        if (!playlistData || playlistData.length === 0) return null;

        // 1. Calculate total duration of all playlist tracks combined
        let totalPlaylistDuration = playlistData.reduce((sum, item) => sum + item.duration, 0);
        if (totalPlaylistDuration === 0) return null;

        // 2. Map global 12-hour grid time directly to the playlist track sequence loop
        let currentGridTime = getGlobalGridTime();
        let targetPlaylistTime = currentGridTime % totalPlaylistDuration;

        let accumulatedTime = 0;
        for (let i = 0; i < playlistData.length; i++) {
            let track = playlistData[i];
            if (targetPlaylistTime >= accumulatedTime && targetPlaylistTime < (accumulatedTime + track.duration)) {
                return {
                    track: track,
                    index: i,
                    seekTime: targetPlaylistTime - accumulatedTime
                };
            }
            accumulatedTime += track.duration;
        }
        return { track: playlistData, index: 0, seekTime: 0 };
    }

    // --- ENGINE CONTROL ---
    function setupEngine(player, url, seekTime) {
        // Destroy existing HLS instances on this player instance if present
        if (player === p1 && p1Hls) { p1Hls.destroy(); p1Hls = null; }
        if (player === p2 && p2Hls) { p2Hls.destroy(); p2Hls = null; }

        const isHLS = url.includes('.m3u8') || url.includes('api/proxy');

        if (isHLS) {
            if (Hls.isSupported()) {
                const hlsInstance = new Hls({ enableWorker: true });
                if (player === p1) p1Hls = hlsInstance;
                if (player === p2) p2Hls = hlsInstance;

                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(player);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    player.currentTime = seekTime;
                    player.play().catch(() => console.log("Waiting for user gesture interaction."));
                });
            } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
                // Native Apple HLS fallback (Safari)
                player.src = url;
                player.addEventListener('loadedmetadata', () => {
                    player.currentTime = seekTime;
                    player.play();
                }, { once: true });
            }
        } else {
            // Standard MP4 handling pipeline
            player.src = url;
            player.load();
            player.addEventListener('loadedmetadata', () => {
                player.currentTime = seekTime;
                player.play().catch(() => console.log("Waiting for user gesture interaction."));
            }, { once: true });
        }
    }

    // --- SEAMLESS TRANSITIONS ---
    function syncBroadcast(isInitialLoad = false) {
        if (playlist.length === 0) return;

        const currentSchedule = calculateCurrentSchedule(playlist);
        if (!currentSchedule) return;

        const targetUrl = currentSchedule.track.url;
        const targetSeek = currentSchedule.seekTime;

        document.getElementById('track-title').innerText = `Playing Item #${currentSchedule.index + 1}`;

        if (isInitialLoad || activePlayer.src !== targetUrl) {
            // Setup Active Player instantly
            setupEngine(activePlayer, targetUrl, targetSeek);
            activePlayer.classList.add('active');
            
            // Unmute handling (browsers often require user actions to unmute audio)
            activePlayer.muted = false; 

            // Pre-buffer next video using the secondary background player
            preloadNextTrack(currentSchedule.index);
        }
    }

    function preloadNextTrack(currentIndex) {
        let nextIndex = (currentIndex + 1) % playlist.length;
        let nextTrack = playlist[nextIndex];
        
        // Silently prep background stream without playing/unmuting
        setupEngine(inactivePlayer, nextTrack.url, 0);
        inactivePlayer.pause();
        inactivePlayer.classList.remove('active');
    }

    function switchPlayers() {
        // Swap references (Ping-pong logic)
        let temp = activePlayer;
        activePlayer = inactivePlayer;
        inactivePlayer = temp;

        // Crossfade visual layers instantly
        activePlayer.classList.add('active');
        activePlayer.muted = false;
        activePlayer.play().catch(e => console.log(e));

        inactivePlayer.classList.remove('active');
        inactivePlayer.muted = true;
        inactivePlayer.pause();

        // Dynamically calculate and trigger the next background item preload
        const currentSchedule = calculateCurrentSchedule(playlist);
        if (currentSchedule) {
            preloadNextTrack(currentSchedule.index);
        }
    }

    // --- RUNTIME WATCHDOGS ---
    function startAntiScrubbingWatchdog() {
        setInterval(() => {
            if (playlist.length === 0 || !activePlayer || activePlayer.paused) return;

            const schedule = calculateCurrentSchedule(playlist);
            if (!schedule) return;

            // Check if track shifted under background updates
            if (activePlayer.src !== schedule.track.url) {
                syncBroadcast(false);
                return;
            }

            // Anti-Scrubbing enforcement: Match current position against global calculated frame time
            const drift = Math.abs(activePlayer.currentTime - schedule.seekTime);
            if (drift > MAX_ALLOWED_DRIFT) {
                console.warn(`Anti-Scrub: Drifting detected (${drift.toFixed(2)}s). Resynchronizing back to lock position.`);
                activePlayer.currentTime = schedule.seekTime;
            }

            // Trigger natural player swap if active stream is within 0.5s of its end duration limit
            if (activePlayer.currentTime >= (schedule.track.duration - 0.5)) {
                switchPlayers();
            }
        }, 1000);
    }

    function startBackgroundPlaylistPoller() {
        // Poll playlist modifications silently in background every 30 seconds
        setInterval(() => {
            fetch(PLAYLIST_URL, { cache: "no-store" })
                .then(res => res.json())
                .then(data => {
                    playlist = data;
                    console.log("Background playlist refreshed successfully.");
                }).catch(err => console.error("Error refreshing playlist updates: ", err));
        }, 30000);
    }

    // --- INITIALIZATION ---
    fetch(PLAYLIST_URL, { cache: "no-store" })
        .then(res => res.json())
        .then(data => {
            playlist = data;
            syncBroadcast(true);
            startAntiScrubbingWatchdog();
            startBackgroundPlaylistPoller();
        })
        .catch(err => {
            document.getElementById('track-title').innerText = "Failed to load broadcast grid playlist.";
            console.error(err);
        });

    // Handle user activation requirements (unmutes player if browser blocked it)
    window.addEventListener('click', () => {
        if(activePlayer) activePlayer.muted = false;
    }, { once: true });
</script>
</body>
</html>
