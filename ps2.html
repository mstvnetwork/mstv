<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Linear Live TV Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background-color: #000; font-family: sans-serif; overflow: hidden; color: #fff; }
        #player-container { position: relative; width: 100%; height: 100%; }
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; transition: opacity 0.4s ease; background: #000; }
        .active-player { opacity: 1; z-index: 2; }
        .background-player { opacity: 0; z-index: 1; }
        #ui-overlay { position: absolute; top: 20px; left: 20px; z-index: 10; pointer-events: none; background: rgba(0, 0, 0, 0.6); padding: 15px; border-radius: 8px; backdrop-filter: blur(5px); }
        #on-air-badge { display: inline-block; background: #ff0055; color: white; padding: 4px 8px; font-weight: bold; font-size: 12px; border-radius: 4px; margin-bottom: 8px; text-transform: uppercase; }
        #video-title { font-size: 18px; font-weight: 500; }
        #controls-overlay { position: absolute; bottom: 30px; right: 30px; z-index: 10; }
        button { background: #007bff; color: white; border: none; padding: 12px 24px; font-size: 14px; font-weight: 600; border-radius: 5px; cursor: pointer; }
        #error-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; align-items: center; justify-content: center; z-index: 100; display: none; text-align: center; }
    </style>
</head>
<body>
    <div id="player-container">
        <video id="playerA" class="active-player" playsinline muted></video>
        <video id="playerB" class="background-player" playsinline muted></video>
        <div id="ui-overlay">
            <div id="on-air-badge">Live On-Air</div>
            <div id="video-title">Syncing Broadcast Time...</div>
        </div>
        <div id="controls-overlay">
            <button id="unmute-btn" onclick="unmuteAudio()">🔈 Unmute Audio</button>
        </div>
    </div>
    <div id="error-screen"><div id="error-text"></div></div>
        <script>
        let anchorTime = 0;
        let activePlaylist = [];
        let currentVideoId = null; 
        let currentPlaylistIndex = -1;
        let syncInterval = null;
        const SCRUB_THRESHOLD = 1.5;

        const playerA = document.getElementById('playerA');
        const playerB = document.getElementById('playerB');
        let activePlayer = playerA;
        let backgroundPlayer = playerB;
        let activeHls = null;
        let backgroundHls = null;

        async function initBroadcastEngine() {
            try {
                const response = await fetch('./playlist200.json?nocache=' + Date.now());
                if (!response.ok) throw new Error("Manifest load failed");
                const data = await response.json();
                
                anchorTime = parseInt(data.anchorTime);
                activePlaylist = data.playlist;

                // Enforce immediate timeline positioning
                syncBroadcastTimeline(true);
                setInterval(pollPlaylistUpdates, 8000);

                if (syncInterval) clearInterval(syncInterval);
                syncInterval = setInterval(() => syncBroadcastTimeline(false), 500);
            } catch (err) {
                document.getElementById('error-screen').style.display = 'flex';
                document.getElementById('error-text').innerText = "Failed to sync TV timeline config.";
            }
        }

        async function pollPlaylistUpdates() {
            try {
                const response = await fetch('./playlist200.json?nocache=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    if (data.playlist) {
                        activePlaylist = data.playlist;
                    }
                }
            } catch(e) {}
        }
        function computeLiveBroadcastCoordinates() {
            if (!activePlaylist || activePlaylist.length === 0) return null;

            const now = Math.floor(Date.now() / 1000);
            if (now < anchorTime) return { index: 0, seekTime: 0, item: activePlaylist[0] };

            const totalDuration = activePlaylist.reduce((acc, item) => acc + parseInt(item.duration), 0);
            const elapsedSinceAnchor = now - anchorTime;
            
            // Loop the timeline over the total active duration
            const currentRemainder = elapsedSinceAnchor % totalDuration;

            let timeCursor = 0;
            for (let i = 0; i < activePlaylist.length; i++) {
                const item = activePlaylist[i];
                const duration = parseInt(item.duration);

                if (currentRemainder >= timeCursor && currentRemainder < timeCursor + duration) {
                    return {
                        index: i,
                        seekTime: currentRemainder - timeCursor,
                        item: item
                    };
                }
                timeCursor += duration;
            }
            return { index: 0, seekTime: 0, item: activePlaylist[0] };
        }
        function syncBroadcastTimeline(isFirstLaunch = false) {
            const target = computeLiveBroadcastCoordinates();
            if (!target) return;

            // Transition strictly on unique Reference IDs
            if (isFirstLaunch || currentVideoId !== target.item.id) {
                if (isFirstLaunch) {
                    currentVideoId = target.item.id;
                    currentPlaylistIndex = target.index;
                    document.getElementById('video-title').innerText = target.item.title;
                    setupPlayer(activePlayer, target.item.url, target.seekTime, true);
                    preStageNextVideo();
                } else {
                    executeDualPlayerTransition(target);
                }
                return;
            }

            const drift = Math.abs(activePlayer.currentTime - target.seekTime);
            if (drift > SCRUB_THRESHOLD) {
                activePlayer.currentTime = target.seekTime;
                activePlayer.play().catch(() => {});
            }
        }

        function executeDualPlayerTransition(targetMetrics) {
            currentVideoId = targetMetrics.item.id;
            currentPlaylistIndex = targetMetrics.index;
            document.getElementById('video-title').innerText = targetMetrics.item.title;

            const savedMute = activePlayer.muted;
            const savedVol = activePlayer.volume;

            backgroundPlayer.className = "active-player";
            activePlayer.className = "background-player";

            backgroundPlayer.muted = savedMute;
            backgroundPlayer.volume = savedVol;
            activePlayer.muted = true;

            const swapNode = activePlayer; activePlayer = backgroundPlayer; backgroundPlayer = swapNode;
            const swapHls = activeHls; activeHls = backgroundHls; backgroundHls = swapHls;

            activePlayer.currentTime = targetMetrics.seekTime;
            activePlayer.play().catch(() => {});

            preStageNextVideo();
        }

        function preStageNextVideo() {
            if (currentPlaylistIndex === -1 || activePlaylist.length === 0) return;
            const nextIndex = (currentPlaylistIndex + 1) % activePlaylist.length;
            setupPlayer(backgroundPlayer, activePlaylist[nextIndex].url, 0, false);
            backgroundPlayer.muted = true;
        }

        function setupPlayer(playerElement, url, startTime, isActiveFrame) {
            if (isActiveFrame && activeHls) { activeHls.destroy(); activeHls = null; }
            if (!isActiveFrame && backgroundHls) { backgroundHls.destroy(); backgroundHls = null; }

            if (Hls.isSupported()) {
                const hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true, backBufferLength: 10 });
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(playerElement);
                if (isActiveFrame) activeHls = hlsInstance; else backgroundHls = hlsInstance;
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    playerElement.currentTime = startTime;
                    playerElement.play().catch(() => {});
                });
            } else if (playerElement.canPlayType('application/vnd.apple.mpegurl')) {
                playerElement.src = url;
                playerElement.addEventListener('loadedmetadata', () => {
                    playerElement.currentTime = startTime;
                    playerElement.play().catch(() => {});
                }, { once: true });
            }
        }

        function unmuteAudio() {
            activePlayer.muted = false;
            backgroundPlayer.muted = true;
            document.getElementById('controls-overlay').style.display = 'none';
        }

        window.addEventListener('DOMContentLoaded', initBroadcastEngine);
    </script>
</body>
</html>
