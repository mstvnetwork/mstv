<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Linear Live TV Player</title>
    <!-- Include HLS.js for HLS (.m3u8) streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            background-color: #000;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        #player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        .player-node {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            pointer-events: none;
            z-index: 1;
        }
        .player-node.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 2;
        }
        /* Overlay to initiate audio context if blocked by browser autoplay rules */
        #unmute-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            border: 1px solid #444;
            display: none;
        }
    </style>
</head>
<body>

<div id="player-container">
    <!-- Player A (Native Video) -->
    <video id="videoA" class="player-node" playsinline webkit-playsinline></video>
    <!-- Player A (Iframe) -->
    <iframe id="iframeA" class="player-node" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>

    <!-- Player B (Native Video) -->
    <video id="videoB" class="player-node" playsinline webkit-playsinline></video>
    <!-- Player B (Iframe) -->
    <iframe id="iframeB" class="player-node" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    
    <div id="unmute-overlay">Click to Unmute / Sync Audio</div>
</div>

<script>
const CONFIG = {
    PLAYLIST_URL: 'playlist.json',
    FETCH_INTERVAL_MS: 30000,   // Check background updates every 30s
    GRID_CYCLE_SEC: 43200,      // Fixed 12-Hour Broadcast Grid (12 * 3600)
    SCRUB_THRESHOLD_SEC: 2.5,   // Tolerated drift before forcing re-sync
    POLL_TICK_MS: 1000          // Core Watchdog Engine tick rate
};

let state = {
    playlist: [],
    totalPlaylistDuration: 0,
    activePlayerSlot: 'A',      // 'A' or 'B'
    currentMediaIndex: -1,
    hlsInstances: { A: null, B: null },
    isBuffering: false,
    lastSeekTime: 0
};

// UI Elements
const dom = {
    videoA: document.getElementById('videoA'),
    iframeA: document.getElementById('iframeA'),
    videoB: document.getElementById('videoB'),
    iframeB: document.getElementById('iframeB'),
    unmuteBtn: document.getElementById('unmute-overlay')
};

// Initialize Engine
async function initEngine() {
    await fetchPlaylist();
    setInterval(fetchPlaylist, CONFIG.FETCH_INTERVAL_MS);
    setInterval(broadcastWatchdog, CONFIG.POLL_TICK_MS);
    setupAntiScrubbing();
}

// Fetch and calculate network broadcast state
async function fetchPlaylist() {
    try {
        const response = await fetch(CONFIG.PLAYLIST_URL + '?cacheBust=' + Date.now());
        if (!response.ok) return;
        const data = await response.json();
        
        if (Array.isArray(data) && data.length > 0) {
            state.playlist = data;
            state.totalPlaylistDuration = data.reduce((acc, item) => acc + item.duration, 0);
        }
    } catch (e) {
        console.warn("Playlist background sync failed:", e);
    }
}

// Global Mathematical Broadcast Position Calculation
function getGlobalBroadcastPosition() {
    if (!state.playlist.length || state.totalPlaylistDuration === 0) return null;

    const currentUnixTime = Math.floor(Date.now() / 1000);
    // Locked 12-hour Epoch Grid calculation
    const gridOffset = currentUnixTime % CONFIG.GRID_CYCLE_SEC; 
    // Loop over the combined playlist duration if it's less than 12 hours
    const playlistOffset = gridOffset % state.totalPlaylistDuration;

    let accumulatedTime = 0;
    for (let i = 0; i < state.playlist.length; i++) {
        const item = state.playlist[i];
        if (playlistOffset < accumulatedTime + item.duration) {
            return {
                index: i,
                item: item,
                seekTo: playlistOffset - accumulatedTime
            };
        }
        accumulatedTime += item.duration;
    }
    return { index: 0, item: state.playlist[0], seekTo: 0 };
}

// Core Synchronizing Engine (Watchdog Loop)
async function broadcastWatchdog() {
    const live = getGlobalBroadcastPosition();
    if (!live) return;

    // Detect track change requirement
    if (live.index !== state.currentMediaIndex) {
        state.currentMediaIndex = live.index;
        await transitionToMedia(live.item, live.seekTo);
    } else {
        // Enforce synchronization on current track (Anti-Scrub lock)
        const activeVideo = state.activePlayerSlot === 'A' ? dom.videoA : dom.videoB;
        if (activeVideo.classList.contains('active') && !state.isBuffering) {
            const drift = Math.abs(activeVideo.currentTime - live.seekTo);
            if (drift > CONFIG.SCRUB_THRESHOLD_SEC) {
                activeVideo.currentTime = live.seekTo;
            }
        }
    }
}

// Transitions & Loaders (A/B Seamless Switcher)
async function transitionToMedia(mediaItem, seekTime) {
    const incomingSlot = state.activePlayerSlot === 'A' ? 'B' : 'A';
    const outgoingSlot = state.activePlayerSlot;

    const incomingVideo = dom[`video${incomingSlot}`];
    const incomingIframe = dom[`iframe${incomingSlot}`];
    
    // Media detection
    const isIframe = mediaItem.url.includes('iframe') || mediaItem.url.includes('embed') || mediaItem.isIframe;
    const isHLS = mediaItem.url.includes('.m3u8');

    // Load incoming slot
    if (isIframe) {
        incomingVideo.style.display = 'none';
        incomingIframe.style.display = 'block';
        // Format iframe url with auto-start & deep-link seek time where supported
        let targetUrl = mediaItem.url;
        targetUrl += (targetUrl.includes('?') ? '&' : '?') + `autoplay=1&t=${Math.floor(seekTime)}`;
        incomingIframe.src = targetUrl;
    } else {
        incomingIframe.style.display = 'none';
        incomingIframe.src = 'about:blank';
        incomingVideo.style.display = 'block';

        // Cleanup existing HLS instance on incoming player if exists
        if (state.hlsInstances[incomingSlot]) {
            state.hlsInstances[incomingSlot].destroy();
            state.hlsInstances[incomingSlot] = null;
        }

        if (isHLS) {
            if (Hls.isSupported()) {
                const hls = new Hls({ enableWorker: true });
                hls.loadSource(mediaItem.url);
                hls.attachMedia(incomingVideo);
                state.hlsInstances[incomingSlot] = hls;
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    incomingVideo.currentTime = seekTime;
                    safePlay(incomingVideo);
                });
            } else if (incomingVideo.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari Native HLS Fallback Pipeline
                incomingVideo.src = mediaItem.url;
                incomingVideo.currentTime = seekTime;
                safePlay(incomingVideo);
            }
        } else {
            // Standard MP4 Fallback Pipeline (No strict CORS to allow native playback)
            incomingVideo.removeAttribute('crossorigin');
            incomingVideo.src = mediaItem.url;
            incomingVideo.currentTime = seekTime;
            safePlay(incomingVideo);
        }
    }

    // Toggle Visibility Layers
    const incomingElements = [incomingVideo, incomingIframe];
    const outgoingElements = [dom[`video${outgoingSlot}`], dom[`iframe${outgoingSlot}`]];

    incomingElements.forEach(el => {
        if(el.style.display !== 'none') el.classList.add('active');
    });
    
    outgoingElements.forEach(el => {
        el.classList.remove('active');
        // Delay resetting outgoing media to prevent black flash
        setTimeout(() => {
            if (!el.classList.contains('active')) {
                if(el.tagName === 'VIDEO') {
                    el.pause();
                    el.removeAttribute('src');
                    el.load();
                } else if(el.tagName === 'IFRAME') {
                    el.src = 'about:blank';
                }
            }
        }, 600);
    });

    state.activePlayerSlot = incomingSlot;
}

// Asynchronous Safety Play Invocation Wrapper
function safePlay(videoElement) {
    state.isBuffering = true;
    const playPromise = videoElement.play();
    
    if (playPromise !== undefined) {
        playPromise.then(() => {
            state.isBuffering = false;
        }).catch(error => {
            state.isBuffering = false;
            console.warn("Autoplay defense interrupted or prevented play state:", error);
            // Show unmute UI if browser blocked autoplay with sound
            if (error.name === "NotAllowedError") {
                dom.unmuteBtn.style.display = "block";
            }
        });
    }
}

// Anti-Scrubbing Listener Setup
function setupAntiScrubbing() {
    const handleSeeking = (e) => {
        if (state.isBuffering) return;
        const live = getGlobalBroadcastPosition();
        if (live && Math.abs(e.target.currentTime - live.seekTo) > CONFIG.SCRUB_THRESHOLD_SEC) {
            e.target.currentTime = live.seekTo;
        }
    };

    dom.videoA.addEventListener('seeking', handleSeeking);
    dom.videoB.addEventListener('seeking', handleSeeking);

    dom.videoA.addEventListener('waiting', () => state.isBuffering = true);
    dom.videoB.addEventListener('waiting', () => state.isBuffering = true);
    dom.videoA.addEventListener('playing', () => state.isBuffering = false);
    dom.videoB.addEventListener('playing', () => state.isBuffering = false);

    dom.unmuteBtn.addEventListener('click', () => {
        [dom.videoA, dom.videoB].forEach(v => {
            v.muted = false;
            safePlay(v);
        });
        dom.unmuteBtn.style.display = "none";
    });
}

// Boot up
window.addEventListener('DOMContentLoaded', initEngine);
</script>
</body>
</html>
