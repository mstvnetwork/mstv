<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>MSTV Live Broadcast</title>


    <style>

        :root {
            --control-bg: rgba(0, 0, 0, 0.65);
            --control-bg-hover: rgba(0, 0, 0, 0.85);
            --icon: #fff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            height: 100dvh;

            color: #fff;
            overflow: hidden;
        }

        .tv-frame {
            position: relative;

            width: 100vw;
            height: 100vh;
            height: 100dvh;

            background: #000;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-layer {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            opacity: 0;

            transition:
                opacity 0.25s ease-in-out;

            pointer-events: none;
        }

        .video-layer.active {
            opacity: 1;
            z-index: 1;
        }
                /* --- ISOLATED LOGO ENGINE --- */
.logo-container-context {
    position: absolute;
    inset: 0;                
    pointer-events: none;    
    z-index: 15;             
    container-type: inline-size; 
}

/* --- CHANNEL LOGO LAYOUT --- */
.channel-logo {
    position: absolute;
    top: -1.3cqw;            
    right: 2.5cqw;  
    width: 18cqw;   
    height: auto;   
    object-fit: contain;
    opacity: 0.8;   
    pointer-events: none;
    filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.5));
}

        .title-box {
            position: absolute;

            top:
                max(
                    16px,
                    env(safe-area-inset-top)
                );

            left:
                max(
                    16px,
                    env(safe-area-inset-left)
                );

            font-size: 14px;
            font-weight: 600;

            color: #f1f1f1;

            text-shadow:
                0 1px 3px rgba(0, 0, 0, 0.9);

            z-index: 100;

            max-width: 80vw;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            pointer-events: none;
        }

        .ui-overlay {
            position: absolute;

            bottom:
                max(
                    16px,
                    env(safe-area-inset-bottom)
                );

            right:
                max(
                    16px,
                    env(safe-area-inset-right)
                );

            display: flex;
            align-items: center;

            gap: 12px;

            z-index: 100;
        }

        .ctrl-btn {
            width: 42px;
            height: 42px;

            border-radius: 50%;
            border: none;

            background:
                var(--control-bg);

            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            flex-shrink: 0;

            transition:
                background .15s ease,
                transform .1s ease;

            -webkit-tap-highlight-color:
                transparent;
        }

        .ctrl-btn:hover {
            background:
                var(--control-bg-hover);
        }

        .ctrl-btn:active {
            transform:
                scale(.92);
        }

        .ctrl-btn svg {
            width: 20px;
            height: 20px;

            fill: var(--icon);
        }

        @media (max-width: 360px) {

            .title-box {
                font-size: 11px;
                padding: 6px 10px;
            }

            .ctrl-btn {
                width: 38px;
                height: 38px;
            }

            .ctrl-btn svg {
                width: 18px;
                height: 18px;
            }
        }

    </style>

</head>


<body>


<div
    class="tv-frame"
    id="tv-frame">


    <video
        id="player-1"
        class="video-layer active"
        muted
        autoplay
        playsinline>
    </video>


    <video
        id="player-2"
        class="video-layer"
        muted
        autoplay
        playsinline>
    </video>


    <div
        id="title-box"
        class="title-box">

        Now: Connecting...

    </div>
    <div class="logo-container-context">
            <img id="channelLogo" class="channel-logo" src="https://crickethd.pages.dev/apna3.webp" alt="Apna TV Logo">
    </div>


    <div class="ui-overlay">


        <button
            id="mute-btn"
            class="ctrl-btn"
            title="Unmute">

            <svg
                id="mute-icon"
                viewBox="0 0 24 24">

                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>

            </svg>

        </button>


        <button
            id="fullscreen-btn"
            class="ctrl-btn"
            title="Fullscreen">

            <svg
                viewBox="0 0 24 24">

                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>

            </svg>

        </button>

    </div>

</div>

   
    <script>
        const REPO_PLAYLIST_URL = './playlist200.json'; 
        const POLL_INTERVAL = 10000; // Check for JSON updates every 10 seconds

        const videoElem = document.getElementById('tvPlayer');
        const muteBtn = document.getElementById('muteBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const playerContainer = document.getElementById('playerContainer');

        let playlist = [];
        let currentPlaylistHash = '';
        let hlsInstance = null;
        let expectedTargetTime = 0; // Telemetry tracker

        // 1. Fetch Playlist via Serverless Endpoint
        async function fetchPlaylist() {
            try {
                const response = await fetch(REPO_PLAYLIST_URL + '?t=' + new Date().getTime());
                const data = await response.json();
                
                const newHash = JSON.stringify(data);
                if (newHash !== currentPlaylistHash) {
                    currentPlaylistHash = newHash;
                    playlist = data.videos; 
                    console.log("Playlist synchronized.", playlist);
                }
            } catch (error) {
                console.error("Error fetching playlist:", error);
            }
        }

        // Load source and lock it to the correct wall-clock offset (Supports HLS & MP4)
        function loadVideoSource(url, targetOffset) {
            const isSameSource = (videoElem.dataset.activeUrl === url);
            videoElem.dataset.activeUrl = url;

            if (url.endsWith('.m3u8')) {
                if (Hls.isSupported()) {
                    if (!isSameSource) {
                        if (hlsInstance) hlsInstance.destroy();
                        hlsInstance = new Hls({ 
                            startPosition: targetOffset,
                            liveSyncDurationCount: 3
                        });
                        hlsInstance.loadSource(url);
                        hlsInstance.attachMedia(videoElem);
                        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                            videoElem.play().catch(e => console.log("Autoplay blocked:", e));
                        });
                    } else if (hlsInstance) {
                        // Enforce position check for active HLS streams if drifted
                        if (Math.abs(videoElem.currentTime - targetOffset) > 2.0) {
                            videoElem.currentTime = targetOffset;
                        }
                    }
                } else if (videoElem.canPlayType('application/vnd.apple.mpegurl')) {
                    if (!isSameSource) {
                        videoElem.src = url;
                    }
                    if (Math.abs(videoElem.currentTime - targetOffset) > 2.0) {
                        videoElem.currentTime = targetOffset;
                    }
                    videoElem.play().catch(e => console.log("Autoplay blocked:", e));
                }
            } else {
                if (hlsInstance) {
                    hlsInstance.destroy();
                    hlsInstance = null;
                }
                if (!isSameSource) {
                    videoElem.src = url;
                }
                if (videoElem.readyState >= 1) {
                    if (Math.abs(videoElem.currentTime - targetOffset) > 1.0) {
                        videoElem.currentTime = targetOffset;
                    }
                } else {
                    videoElem.onloadedmetadata = () => {
                        videoElem.currentTime = targetOffset;
                        videoElem.onloadedmetadata = null;
                    };
                }
                videoElem.play().catch(e => console.log("Autoplay blocked:", e));
            }
        }

        // 2. Wall-Clock Synchronization & Universal Anti-Scrubbing Guard
        function synchronizeBroadcast() {
            if (!playlist || playlist.length === 0) return;

            const totalPlaylistDuration = playlist.reduce((acc, item) => acc + item.duration, 0);
            const currentEpochSeconds = Math.floor(Date.now() / 1000);
            const currentGlobalPosition = currentEpochSeconds % totalPlaylistDuration;

            let accumulatedTime = 0;
            let activeIndex = 0;
            let targetOffset = 0;

            for (let i = 0; i < playlist.length; i++) {
                accumulatedTime += playlist[i].duration;
                if (currentGlobalPosition < accumulatedTime) {
                    activeIndex = i;
                    targetOffset = playlist[i].duration - (accumulatedTime - currentGlobalPosition);
                    break;
                }
            }

            const activeVideo = playlist[activeIndex];
            expectedTargetTime = targetOffset; // Cache expected telemetry position

            loadVideoSource(activeVideo.url, targetOffset);

            // 3. Strict Aggressive Revert Protection (Enforced across ALL formats, including HLS)
            const timeDiff = Math.abs(videoElem.currentTime - expectedTargetTime);
            if (timeDiff > 1.5) {
                console.warn(`Anti-Scrub: Scrubbing attempt detected! Snapping back from ${videoElem.currentTime.toFixed(2)}s to live broadcast position ${expectedTargetTime.toFixed(2)}s`);
                videoElem.currentTime = expectedTargetTime;
            }
        }

        // Instant hardware intercept listeners to block scrubbing attempts
        videoElem.addEventListener('seeking', (e) => {
            if (Math.abs(videoElem.currentTime - expectedTargetTime) > 0.8) {
                videoElem.currentTime = expectedTargetTime;
            }
        });

        videoElem.addEventListener('contextmenu', e => e.preventDefault());

        // 4. Control Handlers
        muteBtn.addEventListener('click', () => {
            videoElem.muted = !videoElem.muted;
            muteBtn.textContent = videoElem.muted ? "UNMUTE" : "MUTE";
        });

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                playerContainer.requestFullscreen().catch(err => console.error(err));
            } else {
                document.exitFullscreen();
            }
        });

        document.addEventListener('fullscreenchange', () => {
            fullscreenBtn.textContent = document.fullscreenElement ? "EXIT FS" : "FULLSCREEN";
        });

        // Initialize Loop Cycles immediately on load
        async function init() {
            await fetchPlaylist();
            synchronizeBroadcast(); 
            setInterval(fetchPlaylist, POLL_INTERVAL);
            setInterval(synchronizeBroadcast, 500); // High-frequency heartbeat check (every 0.5s) for zero-tolerance anti-scrubbing
        }

        init();
    </script>
</body>
</html>
