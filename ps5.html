<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Global Linear TV</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: #000;
    overflow: hidden; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }
  #stage {
    position: relative; width: 100vw; height: 100vh;
    background: #000; display: flex; align-items: center; justify-content: center;
  }
  /* Strict 16:9 letterboxed viewport, centered on any screen shape */
  #viewport {
    position: relative;
    width: 100%;
    max-width: calc(100vh * 16 / 9);
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
  }
  /* Every engine (mp4/hls video element, iframe embed) shares this layer contract */
  .layer {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; background: #000; object-fit: contain;
    opacity: 0; pointer-events: none;           /* locked: no click-through scrubbing */
    transition: opacity .4s ease;
    z-index: 1;
  }
  .layer.active { opacity: 1; z-index: 2; }

  /* --- "Now:" title box — fully transparent, no box/background at all --- */
  #nowPlaying {
    position: absolute; top: 14px; left: 16px; z-index: 15;
    max-width: 70%;
    color: #fff; font-size: 15px; font-weight: 600; line-height: 1.3;
    background: none; background-color: transparent;
    text-shadow: 0 1px 3px rgba(0,0,0,.95), 0 0 14px rgba(0,0,0,.7);
    pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transition: opacity .5s ease;
  }
  #nowPlaying.visible { opacity: 1; }
  #nowPlaying .np-prefix { color: #ff3b3b; font-weight: 800; letter-spacing: .02em; }

  /* --- Animated transparent channel bug, top-right --- */
  #channelLogo {
    position: absolute; top: 14px; right: 16px; z-index: 15;
    width: 54px; height: 54px;
    opacity: .82; pointer-events: none;
    filter: drop-shadow(0 1px 4px rgba(0,0,0,.6));
  }
  #channelLogo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  #channelLogo .logo-ring {
    fill: none; stroke: #fff; stroke-width: 2.5; opacity: .9;
    stroke-dasharray: 8 6;
    transform-origin: 50% 50%;
    animation: logoSpin 12s linear infinite;
  }
  #channelLogo .logo-glow {
    animation: logoPulse 2.6s ease-in-out infinite;
    transform-origin: 50% 50%;
  }
  @keyframes logoSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes logoPulse {
    0%, 100% { opacity: .75; transform: scale(1); }
    50%      { opacity: 1;  transform: scale(1.06); }
  }

  /* --- Bottom-right control bar: unmute + fullscreen, standard player skin --- */
  #controls {
    position: absolute; bottom: 12px; right: 12px; z-index: 20;
    display: flex; gap: 8px;
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  #controls.visible { opacity: 1; pointer-events: auto; }
  .ctrl-btn {
    width: 38px; height: 38px; border-radius: 50%;
    border: none; cursor: pointer;
    background: rgba(20,20,20,.55); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    transition: background .15s ease, transform .1s ease;
  }
  .ctrl-btn:hover { background: rgba(20,20,20,.8); }
  .ctrl-btn:active { transform: scale(.92); }
  .ctrl-btn svg { width: 19px; height: 19px; fill: #fff; }
  #hud {
    position: fixed; top: 8px; left: 8px; z-index: 50;
    color: #7CFC00; font: 11px/1.5 ui-monospace, Menlo, monospace;
    background: rgba(0,0,0,.55); padding: 6px 9px; border-radius: 6px;
    white-space: pre; pointer-events: none; display: none;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="viewport">
    <video id="video1" class="layer" playsinline webkit-playsinline></video>
    <video id="video2" class="layer" playsinline webkit-playsinline></video>
    <iframe id="iframe1" class="layer" allow="autoplay; encrypted-media; fullscreen"></iframe>
    <iframe id="iframe2" class="layer" allow="autoplay; encrypted-media; fullscreen"></iframe>

    <div id="nowPlaying"><span class="np-prefix">Now:</span> <span id="npTitle">—</span></div>

    <!-- Default animated transparent logo. Replace CONFIG.LOGO_IMAGE_URL below
         with your own transparent PNG/SVG to swap this out entirely. -->
    <div id="channelLogo">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle class="logo-ring" cx="50" cy="50" r="44"/>
        <g class="logo-glow">
          <circle cx="50" cy="50" r="30" fill="rgba(255,255,255,0.10)"/>
          <text x="50" y="58" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif"
                font-size="26" font-weight="800" fill="#fff">TV</text>
        </g>
      </svg>
    </div>

    <div id="controls">
      <button id="btnMute" class="ctrl-btn" aria-label="Mute or unmute"></button>
      <button id="btnFullscreen" class="ctrl-btn" aria-label="Fullscreen"></button>
    </div>
  </div>
</div>

<div id="hud"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
(function () {
  'use strict';

  // State Management
  let playlist = [];
  let playlistDuration = 0;
  let activeBufferIdx = 0; // 0 or 1
  let currentItemIdx = -1;
  let isMuted = true;
  let isClockRunning = false;
  let clockInterval = null;

  // Dual Buffer Containers (References HTML Elements)
  const buffers = [
    { container: document.getElementById('buffer-0'), video: document.getElementById('video-0'), hls: null, itemIdx: -1 },
    { container: document.getElementById('buffer-1'), video: document.getElementById('video-1'), hls: null, itemIdx: -1 }
  ];

  // Helper: Detect if a URL is an external third-party stream
  function isExternalUrl(url) {
    try {
      const origin = new URL(url, window.location.href).origin;
      return !origin.includes('workers.dev') && origin !== window.location.origin;
    } catch (e) {
      return false;
    }
  }

  // Engine Detection (HLS vs Native MP4/WebM)
  function detectEngine(url) {
    if (!url) return 'native';
    const cleanUrl = url.split('?')[0].toLowerCase();
    if (cleanUrl.endsWith('.m3u8') || url.includes('.m3u8?')) return 'hls';
    return 'native';
  }

  // Global Timeline Offset Calculation
  function getScheduleOffset() {
    if (!playlistDuration || playlistDuration <= 0) return { itemIdx: 0, seekSeconds: 0 };
    const nowSec = Math.floor(Date.now() / 1000);
    let offsetSec = nowSec % playlistDuration;

    for (let i = 0; i < playlist.length; i++) {
      const itemDur = playlist[i].duration || 0;
      if (offsetSec < itemDur) {
        return { itemIdx: i, seekSeconds: offsetSec };
      }
      offsetSec -= itemDur;
    }
    return { itemIdx: 0, seekSeconds: 0 };
  }

  // Safe Playback Helpers
  function safePlay(video) {
    const p = video.play();
    if (p && typeof p.catch === 'function') {
      p.catch(err => console.warn('[LinearTV] Play inhibited:', err.message));
    }
  }

  function safeSeek(video, seekTime) {
    if (!video || !isFinite(seekTime)) return;
    if (video.readyState >= 1) {
      video.currentTime = seekTime;
    } else {
      video.addEventListener('loadedmetadata', function once() {
        video.currentTime = seekTime;
      }, { once: true });
    }
  }

  // Clean up buffer resources
  function destroyBuffer(bufIdx) {
    const b = buffers[bufIdx];
    if (b.hls) {
      b.hls.destroy();
      b.hls = null;
    }
    b.video.pause();
    b.video.removeAttribute('src');
    b.video.load();
    b.itemIdx = -1;
  }

  // Handle fatal errors on specific buffer
  function handleFatalError(bufIdx) {
    console.error(`[LinearTV] Fatal error on Buffer ${bufIdx}. Skipping stream...`);
    if (bufIdx === activeBufferIdx) {
      advanceSchedule();
    }
  }

  // Load an item into a specified buffer
  function loadItemIntoBuffer(bufIdx, itemIdx, seekSeconds) {
    const b = buffers[bufIdx];
    const item = playlist[itemIdx];
    if (!item) return;

    // Clean up existing instance on this buffer
    if (b.hls) {
      b.hls.destroy();
      b.hls = null;
    }

    b.itemIdx = itemIdx;
    const engine = detectEngine(item.url);
    const v = b.video;
    const external = isExternalUrl(item.url);

    // Adaptively handle CORS attribute for 3rd-party vs. Worker streams
    if (external) {
      v.removeAttribute('crossorigin');
    } else {
      v.crossOrigin = 'anonymous';
    }

    v.muted = isMuted;
    v.playsInline = true;

    if (engine === 'hls') {
      if (window.Hls && Hls.isSupported()) {
        const hls = new Hls({
          maxBufferLength: 30,
          backBufferLength: 30,
          xhrSetup: function (xhr) {
            xhr.withCredentials = false;
          }
        });
        b.hls = hls;

        // Auto-recovery for external stream network or media errors
        hls.on(Hls.Events.ERROR, (_evt, data) => {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                console.warn('[LinearTV] External HLS network error, attempting recovery...');
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                console.warn('[LinearTV] External HLS media error, attempting recovery...');
                hls.recoverMediaError();
                break;
              default:
                handleFatalError(bufIdx);
                break;
            }
          }
        });

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          safeSeek(v, seekSeconds);
          safePlay(v);
        });

        hls.loadSource(item.url);
        hls.attachMedia(v);
      } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
        // Safari / Native iOS HLS support
        v.src = item.url;
        v.addEventListener('loadedmetadata', function once() {
          safeSeek(v, seekSeconds);
          safePlay(v);
        }, { once: true });
        v.addEventListener('error', () => handleFatalError(bufIdx), { once: true });
      } else {
        handleFatalError(bufIdx);
      }
    } else {
      // Direct MP4 / WebM fallback
      v.src = item.url;
      safeSeek(v, seekSeconds);
      safePlay(v);
      v.addEventListener('error', () => handleFatalError(bufIdx), { once: true });
    }
  }

  // Switch display and audio between dual buffers
  function switchActiveBuffer(newActiveIdx) {
    activeBufferIdx = newActiveIdx;
    const inactiveIdx = 1 - activeBufferIdx;

    buffers[activeBufferIdx].container.classList.add('active');
    buffers[inactiveIdx].container.classList.remove('active');

    buffers[activeBufferIdx].video.muted = isMuted;
    buffers[inactiveIdx].video.muted = true;
  }

  // Clock Execution and Synchronization
  function advanceSchedule() {
    const { itemIdx, seekSeconds } = getScheduleOffset();
    const nextItemIdx = (itemIdx + 1) % playlist.length;

    if (itemIdx !== currentItemIdx) {
      currentItemIdx = itemIdx;

      // Load active buffer
      loadItemIntoBuffer(activeBufferIdx, itemIdx, seekSeconds);
      switchActiveBuffer(activeBufferIdx);

      // Preload inactive buffer with the upcoming item
      const inactiveIdx = 1 - activeBufferIdx;
      destroyBuffer(inactiveIdx);
      loadItemIntoBuffer(inactiveIdx, nextItemIdx, 0);
    } else {
      // Handle drift (> 3s shift)
      const activeVideo = buffers[activeBufferIdx].video;
      if (activeVideo && activeVideo.readyState >= 1) {
        if (Math.abs(activeVideo.currentTime - seekSeconds) > 3) {
          console.warn('[LinearTV] Drift detected, resyncing playback position...');
          safeSeek(activeVideo, seekSeconds);
        }
      }
    }
  }

  // Start Global Timeline Clock
  function startClock() {
    if (isClockRunning) return;
    isClockRunning = true;
    advanceSchedule();
    clockInterval = setInterval(advanceSchedule, 1000);
  }

  // Initialize Player
  async function initPlayer(playlistUrl = '/playlist.json') {
    try {
      const res = await fetch(playlistUrl);
      if (!res.ok) throw new Error(`HTTP error ${res.status}`);
      playlist = await res.json();

      playlistDuration = playlist.reduce((acc, item) => acc + (item.duration || 0), 0);
      if (playlistDuration <= 0) throw new Error('Playlist total duration is invalid.');

      startClock();
    } catch (err) {
      console.error('[LinearTV] Failed to initialize playlist:', err.message);
    }
  }

  // Global Unmute on User Interaction
  document.addEventListener('click', function unlockAudio() {
    isMuted = false;
    buffers[activeBufferIdx].video.muted = false;
    document.removeEventListener('click', unlockAudio);
  }, { once: true });

  // Public API Initializer
  window.LinearTV = { init: initPlayer };
})();
</script>
</body>
</html>
