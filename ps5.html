<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Makes sure the browser sends this site's address as the Referer to the worker -->
  <meta name="referrer" content="origin">
  <title>Video Player Test</title>
  <style>
    body { margin: 0; padding: 20px; background: #111; color: #eee; font-family: system-ui, sans-serif; }
    main { max-width: 800px; margin: 0 auto; }
    video { width: 100%; background: #000; border-radius: 8px; }
    .row { display: flex; gap: 8px; margin: 12px 0; }
    input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: #eee; }
    button { padding: 10px 18px; border: 0; border-radius: 6px; background: #2f7df6; color: #fff; cursor: pointer; }
    pre { background: #000; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-word; min-height: 60px; }
    a { color: #6ea8fe; }
  </style>
</head>
<body>
<main>
  <h1>Video Player Test</h1>

  <video id="player" controls playsinline preload="metadata"></video>

  <div class="row">
    <input id="url" type="text"
      value="https://test.gitrelease-videos.workers.dev/v1.0.0/Screen_Recording_20260919_201037_Mask.Browser_360p_360p.mp4">
    <button id="load">Load</button>
  </div>

  <p><a id="direct" href="#" target="_blank">Open worker URL directly (shows the worker's error message, if any)</a></p>

  <pre id="log"></pre>
</main>

<script>
  const video = document.getElementById("player");
  const input = document.getElementById("url");
  const log = document.getElementById("log");
  const direct = document.getElementById("direct");

  const ERROR_NAMES = {
    1: "Playback aborted",
    2: "Network error while loading",
    3: "Decode error (file corrupt or unsupported codec)",
    4: "Source not supported or blocked (check the worker response with the link above)"
  };

  function write(message) {
    log.textContent += "[" + new Date().toLocaleTimeString() + "] " + message + "\n";
  }

  function load() {
    log.textContent = "";
    write("Page origin: " + location.origin);
    write("Loading: " + input.value);
    direct.href = input.value;
    video.src = input.value;
    video.load();
  }

  video.addEventListener("loadedmetadata", () => {
    write("Metadata loaded. Duration: " + Math.round(video.duration) + "s, size: " + video.videoWidth + "x" + video.videoHeight);
  });
  video.addEventListener("canplay", () => write("Ready to play."));
  video.addEventListener("error", () => {
    const code = video.error ? video.error.code : 0;
    write("ERROR " + code + ": " + (ERROR_NAMES[code] || "Unknown error"));
  });

  document.getElementById("load").addEventListener("click", load);
  load();
</script>
</body>
</html>
