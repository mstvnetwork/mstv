<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>MSTV Live Broadcast</title>


    <style>

        :root {
            --control-bg: rgba(0, 0, 0, 0.65);
            --control-bg-hover: rgba(0, 0, 0, 0.85);
            --icon: #fff;
        }


        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            background: #000;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            height: 100dvh;

            color: #fff;
            overflow: hidden;
        }


        .tv-frame {
            position: relative;

            width: 100vw;
            height: 100vh;
            height: 100dvh;

            background: #000;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =====================================================
           VIDEO LAYERS
           ===================================================== */

        .video-layer {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            opacity: 0;

            transition:
                opacity 0.25s ease-in-out;

            pointer-events: none;
        }


        .video-layer.active {
            opacity: 1;
            z-index: 1;
        }


        /* =====================================================
           TITLE
           ===================================================== */

        .title-box {
            position: absolute;

            top:
                max(
                    16px,
                    env(safe-area-inset-top)
                );

            left:
                max(
                    16px,
                    env(safe-area-inset-left)
                );

            font-size: 14px;
            font-weight: 600;

            color: #f1f1f1;

            text-shadow:
                0 1px 3px rgba(0, 0, 0, 0.9);

            z-index: 100;

            max-width: 80vw;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            pointer-events: none;
        }


        /* =====================================================
           CONTROLS
           ===================================================== */

        .ui-overlay {
            position: absolute;

            bottom:
                max(
                    16px,
                    env(safe-area-inset-bottom)
                );

            right:
                max(
                    16px,
                    env(safe-area-inset-right)
                );

            display: flex;
            align-items: center;

            gap: 12px;

            z-index: 100;
        }


        .ctrl-btn {
            width: 42px;
            height: 42px;

            border-radius: 50%;
            border: none;

            background:
                var(--control-bg);

            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            flex-shrink: 0;

            transition:
                background .15s ease,
                transform .1s ease;

            -webkit-tap-highlight-color:
                transparent;
        }


        .ctrl-btn:hover {
            background:
                var(--control-bg-hover);
        }


        .ctrl-btn:active {
            transform:
                scale(.92);
        }


        .ctrl-btn svg {
            width: 20px;
            height: 20px;

            fill: var(--icon);
        }


        @media (max-width: 360px) {

            .title-box {
                font-size: 11px;
                padding: 6px 10px;
            }


            .ctrl-btn {
                width: 38px;
                height: 38px;
            }


            .ctrl-btn svg {
                width: 18px;
                height: 18px;
            }
        }

    </style>

</head>


<body>


<div
    class="tv-frame"
    id="tv-frame">


    <!-- =====================================================
         DOUBLE BUFFER
         ===================================================== -->

    <video
        id="player-1"
        class="video-layer active"
        muted
        autoplay
        playsinline>
    </video>


    <video
        id="player-2"
        class="video-layer"
        muted
        autoplay
        playsinline>
    </video>


    <!-- =====================================================
         TITLE
         ===================================================== -->

    <div
        id="title-box"
        class="title-box">

        Now: Connecting...

    </div>


    <!-- =====================================================
         CONTROLS
         ===================================================== -->

    <div class="ui-overlay">


        <button
            id="mute-btn"
            class="ctrl-btn"
            title="Unmute">


            <svg
                id="mute-icon"
                viewBox="0 0 24 24">

                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>

            </svg>

        </button>


        <button
            id="fullscreen-btn"
            class="ctrl-btn"
            title="Fullscreen">


            <svg
                viewBox="0 0 24 24">

                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>

            </svg>

        </button>


    </div>

</div>


<script>


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const player1 =
        document.getElementById('player-1');

    const player2 =
        document.getElementById('player-2');

    const titleBox =
        document.getElementById('title-box');

    const muteBtn =
        document.getElementById('mute-btn');

    const muteIcon =
        document.getElementById('mute-icon');

    const fullscreenBtn =
        document.getElementById('fullscreen-btn');

    const tvFrame =
        document.getElementById('tv-frame');


    /* =========================================================
       CONFIG
       ========================================================= */

    const endpoint =
        '/get-live-stream';


    /* =========================================================
       PLAYER STATE
       ========================================================= */

    let activePlayerSlot = 1;

    let currentStreamUrl = "";

    let isMasterMuted = true;


    /* =========================================================
       PLAYLIST STATE
       ========================================================= */

    let playlist = [];

    let playlistIndex = 0;

    let playlistInitialized = false;

    let playlistTransitionInProgress = false;

    let lastPlaylistSignature = "";


    /* =========================================================
       TIMING STATE
       ========================================================= */

    let fetchTimestamp = 0;

    let basePlayed = 0;

    let isReverting = false;


    /* =========================================================
       END WATCHDOG
       ========================================================= */

    let endWatchdog = null;


    /* =========================================================
       MUTE
       ========================================================= */

    muteBtn.addEventListener(
        'click',
        () => {

            isMasterMuted =
                !isMasterMuted;


            player1.muted =
                isMasterMuted;

            player2.muted =
                isMasterMuted;


            if (isMasterMuted) {

                muteIcon.innerHTML = `
                    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                `;

                muteBtn.title =
                    "Unmute";

            } else {

                muteIcon.innerHTML = `
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                `;

                muteBtn.title =
                    "Mute";
            }

        }
    );


    /* =========================================================
       FULLSCREEN
       ========================================================= */

    fullscreenBtn.addEventListener(
        'click',
        () => {

            if (!document.fullscreenElement) {

                if (
                    tvFrame.requestFullscreen
                ) {

                    tvFrame.requestFullscreen();

                } else if (
                    tvFrame.webkitRequestFullscreen
                ) {

                    tvFrame.webkitRequestFullscreen();
                }

            } else {

                if (
                    document.exitFullscreen
                ) {

                    document.exitFullscreen();

                } else if (
                    document.webkitExitFullscreen
                ) {

                    document.webkitExitFullscreen();
                }
            }

        }
    );


    /* =========================================================
       ANTI-SCRUB GUARD
       ========================================================= */

    function attachTimeupdateGuard(
        playerInstance
    ) {

        playerInstance.addEventListener(
            'timeupdate',
            () => {

                if (
                    isReverting ||
                    playerInstance.paused ||
                    !playerInstance.duration ||
                    playerInstance.ended
                ) {
                    return;
                }


                const elapsed =
                    (
                        performance.now() -
                        fetchTimestamp
                    ) / 1000;


                /*
                 * IMPORTANT:
                 *
                 * NEVER modulo this value here.
                 *
                 * Doing:
                 *
                 * target % duration
                 *
                 * would reset the current video to 0 before
                 * "ended" and prevent playlist progression.
                 */
                const target =
                    basePlayed + elapsed;


                /*
                 * Let the browser reach the natural end.
                 */
                if (
                    target >=
                    playerInstance.duration
                ) {
                    return;
                }


                /*
                 * Anti-scrubbing correction.
                 */
                if (
                    Math.abs(
                        playerInstance.currentTime -
                        target
                    ) > 2.5
                ) {

                    isReverting = true;


                    try {

                        playerInstance.currentTime =
                            target;

                    } catch (e) {

                        console.warn(
                            "Seek correction failed:",
                            e
                        );
                    }


                    setTimeout(
                        () => {
                            isReverting = false;
                        },
                        300
                    );
                }

            }
        );
    }


    attachTimeupdateGuard(player1);

    attachTimeupdateGuard(player2);


    /* =========================================================
       CLEAR WATCHDOG
       ========================================================= */

    function clearEndWatchdog() {

        if (endWatchdog) {

            clearInterval(
                endWatchdog
            );

            endWatchdog = null;
        }
    }


    /* =========================================================
       START WATCHDOG
       ========================================================= */

    function startEndWatchdog(
        playerInstance
    ) {

        clearEndWatchdog();


        endWatchdog =
            setInterval(
                () => {

                    if (
                        !playlistInitialized ||
                        playlist.length === 0
                    ) {
                        return;
                    }


                    if (
                        !playerInstance.classList.contains(
                            'active'
                        )
                    ) {
                        return;
                    }


                    /*
                     * Normal ended event fallback.
                     */
                    if (
                        playerInstance.ended
                    ) {

                        clearEndWatchdog();

                        advancePlaylist();

                        return;
                    }


                    /*
                     * Backup end detection.
                     *
                     * 0.15 sec is close enough to the actual
                     * end that the transition feels natural.
                     */
                    if (
                        Number.isFinite(
                            playerInstance.duration
                        ) &&

                        playerInstance.duration > 0 &&

                        playerInstance.currentTime >=
                            playerInstance.duration -
                            0.15
                    ) {

                        clearEndWatchdog();

                        advancePlaylist();
                    }

                },
                250
            );
    }


    /* =========================================================
       NEXT PLAYLIST ITEM
       ========================================================= */

    function getNextPlaylistItem() {

        if (
            !playlist ||
            playlist.length === 0
        ) {
            return null;
        }


        /*
         * THE LOOP
         *
         * 0 -> 1 -> 2 -> 0 -> 1 -> 2...
         */
        playlistIndex =
            (
                playlistIndex + 1
            ) %
            playlist.length;


        return playlist[
            playlistIndex
        ];
    }


    /* =========================================================
       PLAY PLAYLIST ITEM
       ========================================================= */

    function playPlaylistItem(
        item,
        startTime = 0
    ) {

        if (
            !item ||
            !item.url
        ) {

            console.warn(
                "Invalid playlist item:",
                item
            );

            return;
        }


        currentStreamUrl =
            item.url;


        titleBox.innerText =
            "Now: " +
            (item.title || "");


        fetchTimestamp =
            performance.now();


        basePlayed =
            Number(startTime) || 0;


        console.log(
            "PLAYING:",
            playlistIndex,
            item.title,
            item.url
        );


        switchVideoInstantly(
            item.url,
            basePlayed
        );
    }


    /* =========================================================
       ADVANCE PLAYLIST
       ========================================================= */

    function advancePlaylist() {

        if (
            playlistTransitionInProgress
        ) {
            return;
        }


        if (
            !playlist ||
            playlist.length === 0
        ) {
            return;
        }


        playlistTransitionInProgress =
            true;


        const nextItem =
            getNextPlaylistItem();


        if (
            nextItem &&
            nextItem.url
        ) {

            console.log(
                "NEXT PLAYLIST ITEM:",
                playlistIndex,
                nextItem.title
            );


            /*
             * ALWAYS start next item at zero.
             */
            playPlaylistItem(
                nextItem,
                0
            );

        }


        setTimeout(
            () => {

                playlistTransitionInProgress =
                    false;

            },
            750
        );
    }


    /* =========================================================
       ENDED EVENTS
       ========================================================= */

    function attachPlaylistEndedHandler(
        playerInstance
    ) {

        playerInstance.addEventListener(
            'ended',
            () => {

                console.log(
                    "ENDED:",
                    playerInstance.id
                );


                /*
                 * Ignore inactive buffer.
                 */
                if (
                    !playerInstance.classList.contains(
                        'active'
                    )
                ) {
                    return;
                }


                if (
                    !playlistInitialized ||
                    playlist.length === 0
                ) {
                    return;
                }


                clearEndWatchdog();


                advancePlaylist();
            }
        );
    }


    attachPlaylistEndedHandler(player1);

    attachPlaylistEndedHandler(player2);


    /* =========================================================
       PLAYLIST SIGNATURE
       ========================================================= */

    function createPlaylistSignature(
        items
    ) {

        if (
            !Array.isArray(items)
        ) {
            return "";
        }


        return items
            .map(
                item =>
                    (
                        item.url || ""
                    ) +
                    "|" +
                    (
                        item.title || ""
                    )
            )
            .join("||");
    }


    /* =========================================================
       POLL SERVER
       ========================================================= */

    function pollLiveConfig() {

        fetch(
            endpoint +
            '?t=' +
            Date.now(),
            {
                cache: 'no-store'
            }
        )

        .then(
            response => {

                if (!response.ok) {

                    throw new Error(
                        "HTTP " +
                        response.status
                    );
                }


                return response.json();
            }
        )

        .then(
            data => {

                /* =================================================
                   NEW PLAYLIST FORMAT
                   ================================================= */

                if (
                    Array.isArray(
                        data.playlist
                    ) &&
                    data.playlist.length > 0
                ) {

                    const newPlaylist =
                        data.playlist;


                    const newSignature =
                        createPlaylistSignature(
                            newPlaylist
                        );


                    const playlistChanged =
                        newSignature !==
                        lastPlaylistSignature;


                    /*
                     * Update playlist data.
                     */
                    playlist =
                        newPlaylist;


                    /*
                     * FIRST LOAD
                     */
                    if (
                        !playlistInitialized
                    ) {

                        /*
                         * Server tells us which show should
                         * currently be playing according to UTC.
                         */
                        playlistIndex =
                            Number.isInteger(
                                data.playlistIndex
                            )
                                ? data.playlistIndex
                                : 0;


                        /*
                         * Safety.
                         */
                        if (
                            playlistIndex < 0 ||
                            playlistIndex >=
                                playlist.length
                        ) {

                            playlistIndex = 0;
                        }


                        const initialItem =
                            playlist[
                                playlistIndex
                            ];


                        if (
                            initialItem &&
                            initialItem.url
                        ) {

                            console.log(
                                "INITIAL PLAYLIST ITEM:",
                                playlistIndex,
                                initialItem.title
                            );


                            playlistInitialized =
                                true;


                            lastPlaylistSignature =
                                newSignature;


                            playPlaylistItem(
                                initialItem,
                                Number(data.played) || 0
                            );

                        }

                        return;
                    }


                    /*
                     * PLAYLIST HAS CHANGED ON SERVER
                     */
                    if (
                        playlistChanged
                    ) {

                        console.log(
                            "PLAYLIST UPDATED FROM SERVER"
                        );


                        /*
                         * Find currently playing URL in the
                         * new playlist.
                         */
                        const currentIndex =
                            playlist.findIndex(
                                item =>
                                    item &&
                                    item.url ===
                                        currentStreamUrl
                            );


                        if (
                            currentIndex !== -1
                        ) {

                            /*
                             * Preserve current program.
                             */
                            playlistIndex =
                                currentIndex;

                        } else {

                            /*
                             * Current program was removed.
                             *
                             * Safely keep index valid.
                             */
                            playlistIndex =
                                Math.min(
                                    playlistIndex,
                                    playlist.length - 1
                                );
                        }


                        lastPlaylistSignature =
                            newSignature;
                    }


                    /*
                     * VERY IMPORTANT:
                     *
                     * We do NOT use data.playlistIndex or
                     * data.played on every poll.
                     *
                     * Otherwise the server clock would
                     * repeatedly force us back to the
                     * scheduled item and destroy the local
                     * playlist loop.
                     */

                }


                /* =================================================
                   OLD SINGLE-STREAM FALLBACK
                   ================================================= */

                else if (
                    data.url
                ) {

                    /*
                     * This means the endpoint is still returning
                     * the old single-object format.
                     */
                    playlist = [];

                    playlistIndex = 0;

                    playlistInitialized = false;

                    lastPlaylistSignature = "";

                    clearEndWatchdog();


                    if (
                        data.url !==
                        currentStreamUrl
                    ) {

                        currentStreamUrl =
                            data.url;


                        titleBox.innerText =
                            "Now: " +
                            (
                                data.title || ""
                            );


                        fetchTimestamp =
                            performance.now();


                        basePlayed =
                            Number(data.played) || 0;


                        switchVideoInstantly(
                            data.url,
                            basePlayed
                        );
                    }

                }

            }
        )

        .catch(
            error => {

                console.warn(
                    "Polling sync notice:",
                    error
                );

            }
        )

        .finally(
            () => {

                setTimeout(
                    pollLiveConfig,
                    1000
                );
            }
        );
    }


    /* =========================================================
       DOUBLE BUFFER SWITCH
       ========================================================= */

    function switchVideoInstantly(
        newUrl,
        targetTime
    ) {

        const activePlayer =
            activePlayerSlot === 1
                ? player1
                : player2;


        const standbyPlayer =
            activePlayerSlot === 1
                ? player2
                : player1;


        /*
         * Calculate network/fetch delay.
         */
        const elapsed =
            (
                performance.now() -
                fetchTimestamp
            ) / 1000;


        let startPos =
            Number(targetTime || 0) +
            elapsed;


        /*
         * Remove old handlers.
         */
        standbyPlayer.onloadedmetadata =
            null;

        standbyPlayer.oncanplay =
            null;


        /*
         * Set new source.
         */
        standbyPlayer.src =
            newUrl;


        standbyPlayer.muted =
            isMasterMuted;


        /* =====================================================
           METADATA
           ===================================================== */

        standbyPlayer.onloadedmetadata =
            () => {

                if (
                    standbyPlayer.duration &&
                    standbyPlayer.duration > 0
                ) {

                    /*
                     * Only protect initial seek position.
                     *
                     * This is NOT used by timeupdate, so it
                     * cannot interfere with "ended".
                     */
                    if (
                        startPos >=
                        standbyPlayer.duration
                    ) {

                        startPos =
                            startPos %
                            standbyPlayer.duration;
                    }
                }


                try {

                    standbyPlayer.currentTime =
                        Math.max(
                            0,
                            startPos
                        );

                } catch (e) {

                    console.warn(
                        "Initial seek failed:",
                        e
                    );
                }
            };


        /*
         * Load standby buffer.
         */
        standbyPlayer.load();


        /* =====================================================
           CAN PLAY
           ===================================================== */

        standbyPlayer.oncanplay =
            () => {

                standbyPlayer
                    .play()

                    .then(
                        () => {

                            /*
                             * New player becomes visible.
                             */
                            standbyPlayer.classList.add(
                                'active'
                            );


                            /*
                             * Hide old player.
                             */
                            activePlayer.classList.remove(
                                'active'
                            );


                            /*
                             * Stop old player.
                             */
                            activePlayer.pause();


                            activePlayer.removeAttribute(
                                'src'
                            );


                            activePlayer.load();


                            /*
                             * Swap active slot.
                             */
                            activePlayerSlot =
                                activePlayerSlot === 1
                                    ? 2
                                    : 1;


                            /*
                             * Watch new active video.
                             */
                            if (
                                playlistInitialized &&
                                playlist.length > 0
                            ) {

                                startEndWatchdog(
                                    standbyPlayer
                                );
                            }

                        }
                    )

                    .catch(
                        error => {

                            console.log(
                                "Playback deferred:",
                                error
                            );
                        }
                    );
            };
    }


    /* =========================================================
       KEEP ACTIVE VIDEO PLAYING
       ========================================================= */

    player1.addEventListener(
        'pause',
        () => {

            if (
                !player1.ended &&
                player1.classList.contains(
                    'active'
                )
            ) {

                player1
                    .play()
                    .catch(
                        () => {}
                    );
            }
        }
    );


    player2.addEventListener(
        'pause',
        () => {

            if (
                !player2.ended &&
                player2.classList.contains(
                    'active'
                )
            ) {

                player2
                    .play()
                    .catch(
                        () => {}
                    );
            }
        }
    );


    /* =========================================================
       START
       ========================================================= */

    console.log(
        "MSTV player starting..."
    );


    pollLiveConfig();

</script>

</body>

</html>
