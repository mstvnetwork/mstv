<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>MSTV Live Broadcast</title>

    <style>
        :root {
            --control-bg: rgba(0, 0, 0, 0.65);
            --control-bg-hover: rgba(0, 0, 0, 0.85);
            --icon: #fff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            color: #fff;
            overflow: hidden;
        }

        .tv-frame {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Dual-buffer video layers */
        .video-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.25s ease-in-out;
            pointer-events: none;
        }

        .video-layer.active {
            opacity: 1;
            z-index: 1;
        }

        /* Top-left title */
        .title-box {
            position: absolute;
            top: max(16px, env(safe-area-inset-top));
            left: max(16px, env(safe-area-inset-left));
            font-size: 14px;
            font-weight: 600;
            color: #f1f1f1;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
            z-index: 100;
            max-width: 80vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
        }

        /* Bottom controls */
        .ui-overlay {
            position: absolute;
            bottom: max(16px, env(safe-area-inset-bottom));
            right: max(16px, env(safe-area-inset-right));
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
        }

        .ctrl-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--control-bg);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background .15s ease, transform .1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .ctrl-btn:hover {
            background: var(--control-bg-hover);
        }

        .ctrl-btn:active {
            transform: scale(.92);
        }

        .ctrl-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--icon);
        }

        #fullscreen-btn {
            margin-left: 0;
        }

        @media (max-width: 360px) {
            .title-box {
                font-size: 11px;
                padding: 6px 10px;
            }

            .ctrl-btn {
                width: 38px;
                height: 38px;
            }

            .ctrl-btn svg {
                width: 18px;
                height: 18px;
            }
        }
    </style>
</head>

<body>

<div class="tv-frame" id="tv-frame">

    <!-- Double-buffered players -->
    <video
        id="player-1"
        class="video-layer active"
        muted
        autoplay
        playsinline>
    </video>

    <video
        id="player-2"
        class="video-layer"
        muted
        autoplay
        playsinline>
    </video>

    <!-- Program title -->
    <div id="title-box" class="title-box">
        Now: Connecting...
    </div>

    <!-- Controls -->
    <div class="ui-overlay">

        <button
            id="mute-btn"
            class="ctrl-btn"
            title="Unmute">

            <svg id="mute-icon" viewBox="0 0 24 24">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>

        </button>

        <button
            id="fullscreen-btn"
            class="ctrl-btn"
            title="Fullscreen">

            <svg viewBox="0 0 24 24">
                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
            </svg>

        </button>

    </div>

</div>

<script>

    /* =========================================================
       ELEMENTS
       ========================================================= */

    const player1 = document.getElementById('player-1');
    const player2 = document.getElementById('player-2');

    const titleBox = document.getElementById('title-box');

    const muteBtn = document.getElementById('mute-btn');
    const muteIcon = document.getElementById('mute-icon');

    const fullscreenBtn =
        document.getElementById('fullscreen-btn');

    const tvFrame =
        document.getElementById('tv-frame');


    /* =========================================================
       CONFIG
       ========================================================= */

    const endpoint = '/get-live-stream';


    /* =========================================================
       PLAYER STATE
       ========================================================= */

    let activePlayerSlot = 1;

    let currentStreamUrl = "";

    let isMasterMuted = true;


    /* =========================================================
       PLAYLIST STATE
       ========================================================= */

    let playlist = [];

    let playlistIndex = 0;

    /*
     * True while switching from one playlist item
     * to another.
     */
    let playlistTransitionInProgress = false;

    /*
     * Identifies the currently playing playlist URL.
     */
    let currentPlaylistUrl = "";


    /* =========================================================
       PLAYBACK / ANTI-SCRUB STATE
       ========================================================= */

    let fetchTimestamp = 0;

    let basePlayed = 0;

    let isReverting = false;


    /* =========================================================
       END WATCHDOG STATE
       ========================================================= */

    /*
     * The watchdog is a backup for browsers/codecs that
     * don't reliably fire the "ended" event.
     */
    let endWatchdog = null;


    /* =========================================================
       MUTE BUTTON
       ========================================================= */

    muteBtn.addEventListener('click', () => {

        isMasterMuted = !isMasterMuted;

        player1.muted = isMasterMuted;
        player2.muted = isMasterMuted;

        if (isMasterMuted) {

            muteIcon.innerHTML = `
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            `;

            muteBtn.title = "Unmute";

        } else {

            muteIcon.innerHTML = `
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            `;

            muteBtn.title = "Mute";
        }
    });


    /* =========================================================
       FULLSCREEN
       ========================================================= */

    fullscreenBtn.addEventListener('click', () => {

        if (!document.fullscreenElement) {

            if (tvFrame.requestFullscreen) {
                tvFrame.requestFullscreen();
            } else if (tvFrame.webkitRequestFullscreen) {
                tvFrame.webkitRequestFullscreen();
            }

        } else {

            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }
    });


    /* =========================================================
       ANTI-SCRUB GUARD
       ========================================================= */

    function attachTimeupdateGuard(playerInstance) {

        playerInstance.addEventListener(
            'timeupdate',
            () => {

                if (
                    isReverting ||
                    playerInstance.paused ||
                    !playerInstance.duration ||
                    playerInstance.ended
                ) {
                    return;
                }


                const elapsed =
                    (performance.now() - fetchTimestamp) / 1000;


                /*
                 * IMPORTANT:
                 *
                 * There is intentionally NO:
                 *
                 * target % duration
                 *
                 * here.
                 *
                 * Wrapping the currentTime back to zero would
                 * prevent the natural "ended" event and cause
                 * the last video to repeat.
                 */
                const target =
                    basePlayed + elapsed;


                /*
                 * Once we reach the end, leave the player
                 * alone so the browser can fire "ended".
                 */
                if (
                    target >= playerInstance.duration
                ) {
                    return;
                }


                /*
                 * Anti-scrubbing protection.
                 */
                if (
                    Math.abs(
                        playerInstance.currentTime - target
                    ) > 2.5
                ) {

                    isReverting = true;

                    try {
                        playerInstance.currentTime =
                            target;
                    } catch (e) {
                        console.warn(
                            "Seek correction failed:",
                            e
                        );
                    }

                    setTimeout(() => {
                        isReverting = false;
                    }, 300);
                }

            }
        );
    }


    attachTimeupdateGuard(player1);
    attachTimeupdateGuard(player2);


    /* =========================================================
       CLEAR END WATCHDOG
       ========================================================= */

    function clearEndWatchdog() {

        if (endWatchdog) {

            clearInterval(endWatchdog);

            endWatchdog = null;
        }
    }


    /* =========================================================
       START END WATCHDOG
       ========================================================= */

    function startEndWatchdog(playerInstance) {

        clearEndWatchdog();


        /*
         * Check approximately 4 times per second.
         */
        endWatchdog = setInterval(() => {

            /*
             * Only watch the active player.
             */
            if (
                !playerInstance.classList.contains('active')
            ) {
                return;
            }


            if (
                !playlist ||
                playlist.length === 0
            ) {
                return;
            }


            if (
                playerInstance.ended
            ) {

                clearEndWatchdog();

                advancePlaylist();

                return;
            }


            /*
             * Backup detection.
             *
             * If currentTime has reached essentially the
             * end of the file, advance even if "ended" hasn't
             * fired yet.
             */
            if (
                Number.isFinite(playerInstance.duration) &&
                playerInstance.duration > 0 &&
                playerInstance.currentTime >=
                    playerInstance.duration - 0.15
            ) {

                clearEndWatchdog();

                advancePlaylist();
            }

        }, 250);
    }


    /* =========================================================
       GET NEXT PLAYLIST ITEM
       ========================================================= */

    function getNextPlaylistItem() {

        if (
            !playlist ||
            playlist.length === 0
        ) {
            return null;
        }


        /*
         * THE LOOP:
         *
         * 0 -> 1 -> 2 -> 0 -> 1 -> 2 ...
         *
         * Example:
         *
         * playlist.length = 3
         *
         * (0 + 1) % 3 = 1
         * (1 + 1) % 3 = 2
         * (2 + 1) % 3 = 0
         */
        playlistIndex =
            (playlistIndex + 1) %
            playlist.length;


        return playlist[playlistIndex];
    }


    /* =========================================================
       PLAY PLAYLIST ITEM
       ========================================================= */

    function playPlaylistItem(
        item,
        startTime = 0
    ) {

        if (
            !item ||
            !item.url
        ) {
            console.warn(
                "Invalid playlist item:",
                item
            );

            return;
        }


        currentPlaylistUrl =
            item.url;

        currentStreamUrl =
            item.url;


        titleBox.innerText =
            "Now: " +
            (item.title || "");


        /*
         * New playlist object always gets a fresh timing
         * reference.
         */
        fetchTimestamp =
            performance.now();


        basePlayed =
            Number(startTime) || 0;


        switchVideoInstantly(
            item.url,
            basePlayed
        );
    }


    /* =========================================================
       ADVANCE PLAYLIST
       ========================================================= */

    function advancePlaylist() {

        /*
         * Protect against duplicate calls caused by:
         *
         * - ended event
         * - watchdog
         *
         * firing at nearly the same time.
         */
        if (
            playlistTransitionInProgress
        ) {
            return;
        }


        if (
            !playlist ||
            playlist.length === 0
        ) {
            return;
        }


        playlistTransitionInProgress =
            true;


        const nextItem =
            getNextPlaylistItem();


        if (
            nextItem &&
            nextItem.url
        ) {

            console.log(
                "Playlist advance:",
                playlistIndex,
                nextItem.title,
                nextItem.url
            );


            /*
             * New item starts from zero.
             */
            playPlaylistItem(
                nextItem,
                0
            );

        } else {

            console.warn(
                "Could not find next playlist item."
            );
        }


        /*
         * Release transition lock.
         */
        setTimeout(() => {

            playlistTransitionInProgress =
                false;

        }, 750);
    }


    /* =========================================================
       ENDED EVENT
       ========================================================= */

    function attachPlaylistEndedHandler(
        playerInstance
    ) {

        playerInstance.addEventListener(
            'ended',
            () => {

                console.log(
                    "VIDEO ENDED:",
                    playerInstance.id
                );


                /*
                 * Ignore ended events from the inactive
                 * buffer.
                 */
                if (
                    !playerInstance.classList.contains(
                        'active'
                    )
                ) {
                    return;
                }


                /*
                 * Ignore ended in single-stream mode.
                 */
                if (
                    !playlist ||
                    playlist.length === 0
                ) {
                    return;
                }


                advancePlaylist();
            }
        );
    }


    attachPlaylistEndedHandler(player1);
    attachPlaylistEndedHandler(player2);


    /* =========================================================
       POLL SERVERLESS JSON
       ========================================================= */

    function pollLiveConfig() {

        fetch(
            endpoint +
            '?t=' +
            Date.now(),
            {
                cache: 'no-store'
            }
        )

        .then(res => {

            if (!res.ok) {
                throw new Error(
                    "HTTP " + res.status
                );
            }

            return res.json();
        })

        .then(data => {


            /* =================================================
               DETECT PLAYLIST
               ================================================= */

            const newPlaylist =
                Array.isArray(data)
                    ? data
                    : (
                        Array.isArray(data.playlist)
                            ? data.playlist
                            : null
                    );


            /* =================================================
               PLAYLIST MODE
               ================================================= */

            if (
                newPlaylist &&
                newPlaylist.length > 0
            ) {

                /*
                 * Remember what was playing before refreshing
                 * the JSON.
                 */
                const oldCurrentUrl =
                    currentStreamUrl;


                /*
                 * Replace playlist with latest server data.
                 */
                playlist =
                    newPlaylist;


                /*
                 * FIRST LOAD
                 */
                if (!oldCurrentUrl) {

                    playlistIndex = 0;

                    const initialItem =
                        playlist[0];


                    if (
                        initialItem &&
                        initialItem.url
                    ) {

                        console.log(
                            "Starting playlist:",
                            initialItem.title
                        );


                        playPlaylistItem(
                            initialItem,
                            initialItem.played || 0
                        );
                    }

                } else {

                    /*
                     * Find currently playing object in the
                     * refreshed JSON.
                     */
                    const refreshedIndex =
                        playlist.findIndex(
                            item =>
                                item &&
                                item.url === oldCurrentUrl
                        );


                    if (
                        refreshedIndex !== -1
                    ) {

                        /*
                         * Preserve current position in the
                         * refreshed playlist.
                         */
                        playlistIndex =
                            refreshedIndex;

                    } else {

                        /*
                         * Current object no longer exists.
                         *
                         * Keep index valid.
                         */
                        playlistIndex =
                            Math.min(
                                playlistIndex,
                                playlist.length - 1
                            );
                    }
                }

            }


            /* =================================================
               SINGLE STREAM FALLBACK
               ================================================= */

            else if (
                data.url &&
                data.url !== currentStreamUrl
            ) {

                /*
                 * Disable playlist mode.
                 */
                playlist = [];

                playlistIndex = 0;

                clearEndWatchdog();


                currentStreamUrl =
                    data.url;


                currentPlaylistUrl =
                    "";


                if (data.title) {

                    titleBox.innerText =
                        "Now: " +
                        data.title;
                }


                basePlayed =
                    Number(data.played) || 0;


                fetchTimestamp =
                    performance.now();


                switchVideoInstantly(
                    data.url,
                    basePlayed
                );
            }

        })

        .catch(err => {

            console.warn(
                "Polling sync notice:",
                err
            );

        })

        .finally(() => {

            setTimeout(
                pollLiveConfig,
                1000
            );
        });
    }


    /* =========================================================
       DOUBLE-BUFFER VIDEO SWITCH
       ========================================================= */

    function switchVideoInstantly(
        newUrl,
        targetTime
    ) {

        const activePlayer =
            activePlayerSlot === 1
                ? player1
                : player2;


        const standbyPlayer =
            activePlayerSlot === 1
                ? player2
                : player1;


        /*
         * Calculate fetch/network delay.
         */
        const elapsed =
            (
                performance.now() -
                fetchTimestamp
            ) / 1000;


        let startPos =
            Number(targetTime || 0) +
            elapsed;


        /*
         * Clear previous handlers.
         */
        standbyPlayer.onloadedmetadata =
            null;

        standbyPlayer.oncanplay =
            null;


        /*
         * Set new source.
         */
        standbyPlayer.src =
            newUrl;


        standbyPlayer.muted =
            isMasterMuted;


        /* =====================================================
           METADATA
           ===================================================== */

        standbyPlayer.onloadedmetadata =
            () => {

                if (
                    standbyPlayer.duration &&
                    standbyPlayer.duration > 0
                ) {

                    /*
                     * For normal starting positions, keep the
                     * calculated position.
                     *
                     * This modulo is ONLY for initial seeking.
                     * It does NOT run during timeupdate and
                     * therefore cannot interfere with "ended".
                     */
                    if (
                        startPos >=
                        standbyPlayer.duration
                    ) {

                        startPos =
                            startPos %
                            standbyPlayer.duration;
                    }
                }


                try {

                    standbyPlayer.currentTime =
                        Math.max(
                            0,
                            startPos
                        );

                } catch (e) {

                    console.warn(
                        "Unable to set playback position:",
                        e
                    );
                }
            };


        /*
         * Load standby buffer.
         */
        standbyPlayer.load();


        /* =====================================================
           CAN PLAY
           ===================================================== */

        standbyPlayer.oncanplay =
            () => {

                standbyPlayer
                    .play()

                    .then(() => {

                        /*
                         * Activate new buffer.
                         */
                        standbyPlayer.classList.add(
                            'active'
                        );


                        /*
                         * Remove old buffer from screen.
                         */
                        activePlayer.classList.remove(
                            'active'
                        );


                        /*
                         * Stop old player.
                         */
                        activePlayer.pause();


                        activePlayer.removeAttribute(
                            'src'
                        );


                        activePlayer.load();


                        /*
                         * Swap active slot.
                         */
                        activePlayerSlot =
                            activePlayerSlot === 1
                                ? 2
                                : 1;


                        /*
                         * Start watching this new active
                         * playlist item for its end.
                         */
                        if (
                            playlist &&
                            playlist.length > 0
                        ) {

                            startEndWatchdog(
                                standbyPlayer
                            );
                        }

                    })

                    .catch(e => {

                        console.log(
                            "Playback constraint deferred:",
                            e
                        );
                    });
            };
    }


    /* =========================================================
       KEEP ACTIVE PLAYER PLAYING
       ========================================================= */

    player1.addEventListener(
        'pause',
        () => {

            if (
                !player1.ended &&
                player1.classList.contains('active')
            ) {

                player1
                    .play()
                    .catch(() => {});
            }
        }
    );


    player2.addEventListener(
        'pause',
        () => {

            if (
                !player2.ended &&
                player2.classList.contains('active')
            ) {

                player2
                    .play()
                    .catch(() => {});
            }
        }
    );


    /* =========================================================
       START PLAYER
       ========================================================= */

    pollLiveConfig();

</script>

</body>
</html>
