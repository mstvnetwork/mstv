<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MSTV Live Broadcast</title>
    <style>
        :root {
            --control-bg: rgba(0, 0, 0, 0.65);
            --control-bg-hover: rgba(0, 0, 0, 0.85);
            --icon: #fff;
        }
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            height: 100dvh; 
            color: #fff; 
            overflow: hidden; 
        }
        .tv-frame { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            height: 100dvh; 
            background: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        
        /* Dual-buffer video layers for seamless real-time switching */
        .video-layer { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            opacity: 0;
            transition: opacity 0.25s ease-in-out;
            pointer-events: none;
        }
        .video-layer.active { 
            opacity: 1;
            z-index: 1;
        }
        
        .ui-overlay { 
            position: absolute; 
            bottom: max(16px, env(safe-area-inset-bottom)); 
            left: max(16px, env(safe-area-inset-left)); 
            right: max(16px, env(safe-area-inset-right)); 
            background: rgba(0, 0, 0, 0.8); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 12px 18px; 
            border-radius: 12px; 
            border-left: 5px solid #ff3b30; 
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
        }

        .info-container {
            display: flex;
            flex-direction: column;
            min-width: 0;
            flex: 1;
        }

        .live-row {
            display: flex;
            align-items: center;
        }

        .live-dot { 
            color: #ff3b30; 
            font-weight: 900; 
            font-size: 12px;
            letter-spacing: 0.5px;
            animation: blink 1.5s infinite; 
            margin-right: 6px; 
        }

        #show-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #f1f1f1;
        }

        @keyframes blink { 
            0% { opacity: 0.3; } 
            50% { opacity: 1; } 
            100% { opacity: 0.3; } 
        }

        .ctrl-btn {
            width: 42px; 
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--control-bg);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex; 
            align-items: center; 
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background .15s ease, transform .1s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .ctrl-btn:hover { background: var(--control-bg-hover); }
        .ctrl-btn:active { transform: scale(.92); }
        .ctrl-btn svg { width: 20px; height: 20px; fill: var(--icon); }
        
        #fullscreen-btn { margin-left: 8px; }

        @media (max-width: 360px) {
            .ui-overlay { padding: 10px 14px; }
            .ctrl-btn { width: 38px; height: 38px; }
            .ctrl-btn svg { width: 18px; height: 18px; }
            #show-title { font-size: 12px; }
        }
    </style>
</head>
<body>

<div class="tv-frame" id="tv-frame">
    <!-- Double-buffered video players for instant switching without user refreshes -->
    <video id="player-1" class="video-layer active" muted autoplay playsinline></video>
    <video id="player-2" class="video-layer" muted autoplay playsinline></video>

    <div class="ui-overlay">
        <div class="info-container">
            <div class="live-row">
                <span class="live-dot">● LIVE</span>
            </div>
            <span id="show-title">Connecting to Broadcast...</span>
        </div>
        <button id="mute-btn" class="ctrl-btn" title="Unmute">
            <svg id="mute-icon" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
        <button id="fullscreen-btn" class="ctrl-btn" title="Fullscreen">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
    </div>
</div>

<script>
    const player1 = document.getElementById('player-1');
    const player2 = document.getElementById('player-2');
    const titleText = document.getElementById('show-title');
    const muteBtn = document.getElementById('mute-btn');
    const muteIcon = document.getElementById('mute-icon');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const tvFrame = document.getElementById('tv-frame');

    // Point this to your configuration JSON file or API endpoint
    // Structure expected: { "url": "https://...", "title": "Show Title", "played": 0 }
    const endpoint = '/get-live-stream'; 

    let activePlayerSlot = 1; // Tracks whether player-1 or player-2 is currently live
    let currentStreamUrl = "";
    let isMasterMuted = true;

    // Master Mute Sync across both buffers
    muteBtn.addEventListener('click', () => {
        isMasterMuted = !isMasterMuted;
        player1.muted = isMasterMuted;
        player2.muted = isMasterMuted;

        if (isMasterMuted) {
            muteIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4 z"/>';
            muteBtn.title = "Unmute";
        } else {
            muteIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
            muteBtn.title = "Mute";
        }
    });

    // Fullscreen Toggle
    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            if (tvFrame.requestFullscreen) tvFrame.requestFullscreen();
            else if (tvFrame.webkitRequestFullscreen) tvFrame.webkitRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
    });
     // Strict Anti-Scrubbing Guard: Snaps back immediately if user tries to seek
    video.addEventListener('timeupdate', () => {
        if (isReverting || video.paused || !video.duration) return;

        const elapsed = (performance.now() - fetchTimestamp) / 1000;
        let target = basePlayed + elapsed;
        if (video.duration && video.duration > 0) {
            target = target % video.duration; // Handle looping safely
        }

        // If user deviates more than 2 seconds from the calculated schedule position
        if (Math.abs(video.currentTime - target) > 2.5) {
            isReverting = true;
            video.currentTime = target;
            setTimeout(() => { isReverting = false; }, 300);
        }
    });

    function tuneIn() {
        fetch(endpoint)
            .then(res => res.json())
            .then(data => {
                titleText.innerText = data.title;
                basePlayed = data.played;
                fetchTimestamp = performance.now();

                if (Hls.isSupported()) {
                    if (activeHls) activeHls.destroy();
                    
                    const hls = new Hls({ enableWorker: true });
                    activeHls = hls;
                    hls.loadSource(data.url);
                    hls.attachMedia(video);
                    
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        const elapsed = (performance.now() - fetchTimestamp) / 1000;
                        let startPos = data.played + elapsed;
                        
                        if (video.duration && video.duration > 0) {
                            startPos = startPos % video.duration;
                        }
                        
                        try {
                            video.currentTime = startPos;
                        } catch (e) {
                            console.warn("Seek bounds error, defaulting to start", e);
                        }
                        video.play().catch(() => {});
                    });
                } 
                else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = data.url;
                    video.addEventListener('loadedmetadata', () => {
                        const elapsed = (performance.now() - fetchTimestamp) / 1000;
                        let startPos = data.played + elapsed;
                        
                        if (video.duration && video.duration > 0) {
                            startPos = startPos % video.duration;
                        }
                        
                        video.currentTime = startPos;
                        video.play().catch(() => {});
                    });
                }
            })
            .catch(err => {
                titleText.innerText = "Signal Interrupted. Retrying...";
                console.error(err);
                setTimeout(tuneIn, 4000);
            });
    }

    tuneIn();
    
    video.addEventListener('pause', () => {
        if (!video.ended) video.play().catch(() => {});
    });

    // Real-Time Polling Loop (Checks for JSON changes every 1 second)
    function pollLiveConfig() {
        fetch(endpoint + '?t=' + Date.now()) // Prevent caching issues
            .then(res => res.json())
            .then(data => {
                if (data.url && data.url !== currentStreamUrl) {
                    currentStreamUrl = data.url;
                    titleText.innerText = data.title || "Live Broadcast";
                    switchVideoInstantly(data.url, data.played || 0);
                }
            })
            .catch(err => {
                console.warn("Polling sync notice:", err);
            })
            .finally(() => {
                setTimeout(pollLiveConfig, 1000); // Check configuration every 1 second
            });
    }

    // Double-buffering transition handler
    function switchVideoInstantly(newUrl, targetTime) {
        const activePlayer = activePlayerSlot === 1 ? player1 : player2;
        const standbyPlayer = activePlayerSlot === 1 ? player2 : player1;

        // Prepare the standby player in the background
        standbyPlayer.src = newUrl;
        standbyPlayer.muted = isMasterMuted;
        standbyPlayer.currentTime = targetTime;
        standbyPlayer.load();

        standbyPlayer.oncanplay = () => {
            standbyPlayer.play().then(() => {
                // Instantly crossfade to the new stream buffer
                standbyPlayer.classList.add('active');
                activePlayer.classList.remove('active');

                // Stop the old player to free hardware memory
                activePlayer.pause();
                activePlayer.src = "";

                // Swap active slot pointer
                activePlayerSlot = activePlayerSlot === 1 ? 2 : 1;
            }).catch(e => {
                console.log("Playback constraint deferred:", e);
            });
        };
    }

    // Kick off automatic polling right away
    pollLiveConfig();
</script>

</body>
</html>
