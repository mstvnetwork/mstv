<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>MSTV Live Broadcast</title>


    <style>

        :root {
            --control-bg: rgba(0, 0, 0, 0.65);
            --control-bg-hover: rgba(0, 0, 0, 0.85);
            --icon: #fff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            height: 100dvh;

            color: #fff;
            overflow: hidden;
        }

        .tv-frame {
            position: relative;

            width: 100vw;
            height: 100vh;
            height: 100dvh;

            background: #000;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-layer {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            opacity: 0;

            transition:
                opacity 0.25s ease-in-out;

            pointer-events: none;
        }

        .video-layer.active {
            opacity: 1;
            z-index: 1;
        }

        .title-box {
            position: absolute;

            top:
                max(
                    16px,
                    env(safe-area-inset-top)
                );

            left:
                max(
                    16px,
                    env(safe-area-inset-left)
                );

            font-size: 14px;
            font-weight: 600;

            color: #f1f1f1;

            text-shadow:
                0 1px 3px rgba(0, 0, 0, 0.9);

            z-index: 100;

            max-width: 80vw;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            pointer-events: none;
        }

        .ui-overlay {
            position: absolute;

            bottom:
                max(
                    16px,
                    env(safe-area-inset-bottom)
                );

            right:
                max(
                    16px,
                    env(safe-area-inset-right)
                );

            display: flex;
            align-items: center;

            gap: 12px;

            z-index: 100;
        }

        .ctrl-btn {
            width: 42px;
            height: 42px;

            border-radius: 50%;
            border: none;

            background:
                var(--control-bg);

            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            flex-shrink: 0;

            transition:
                background .15s ease,
                transform .1s ease;

            -webkit-tap-highlight-color:
                transparent;
        }

        .ctrl-btn:hover {
            background:
                var(--control-bg-hover);
        }

        .ctrl-btn:active {
            transform:
                scale(.92);
        }

        .ctrl-btn svg {
            width: 20px;
            height: 20px;

            fill: var(--icon);
        }

        @media (max-width: 360px) {

            .title-box {
                font-size: 11px;
                padding: 6px 10px;
            }

            .ctrl-btn {
                width: 38px;
                height: 38px;
            }

            .ctrl-btn svg {
                width: 18px;
                height: 18px;
            }
        }

    </style>

</head>


<body>


<div
    class="tv-frame"
    id="tv-frame">


    <video
        id="player-1"
        class="video-layer active"
        muted
        autoplay
        playsinline>
    </video>


    <video
        id="player-2"
        class="video-layer"
        muted
        autoplay
        playsinline>
    </video>


    <div
        id="title-box"
        class="title-box">

        Now: Connecting...

    </div>


    <div class="ui-overlay">


        <button
            id="mute-btn"
            class="ctrl-btn"
            title="Unmute">

            <svg
                id="mute-icon"
                viewBox="0 0 24 24">

                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>

            </svg>

        </button>


        <button
            id="fullscreen-btn"
            class="ctrl-btn"
            title="Fullscreen">

            <svg
                viewBox="0 0 24 24">

                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>

            </svg>

        </button>

    </div>

</div>


<script>


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const player1 =
        document.getElementById('player-1');

    const player2 =
        document.getElementById('player-2');

    const titleBox =
        document.getElementById('title-box');

    const muteBtn =
        document.getElementById('mute-btn');

    const muteIcon =
        document.getElementById('mute-icon');

    const fullscreenBtn =
        document.getElementById('fullscreen-btn');

    const tvFrame =
        document.getElementById('tv-frame');


    /* =========================================================
       CONFIG
       ========================================================= */

    const endpoint =
        '/get-live-stream';


    /* =========================================================
       PLAYER STATE
       ========================================================= */

    let activePlayerSlot = 1;

    let currentStreamUrl = "";

    let isMasterMuted = true;


    /* =========================================================
       PLAYLIST STATE
       ========================================================= */

    let playlist = [];

    let playlistIndex = 0;

    let playlistInitialized = false;

    let lastPlaylistSignature = "";


    /*
     * Unique number for every playlist transition.
     *
     * This is the important protection against old events
     * advancing the playlist a second time.
     */
    let transitionGeneration = 0;


    /*
     * True while the new player is being prepared.
     */
    let transitionInProgress = false;


    /*
     * Which URL is expected to be playing on the active
     * player.
     */
    let activePlaylistUrl = "";


    /* =========================================================
       TIMING STATE
       ========================================================= */

    let fetchTimestamp = 0;

    let basePlayed = 0;

    let isReverting = false;


    /* =========================================================
       WATCHDOG
       ========================================================= */

    let endWatchdog = null;

    let endWatchdogGeneration = 0;


    /* =========================================================
       MUTE
       ========================================================= */

    muteBtn.addEventListener(
        'click',
        () => {

            isMasterMuted =
                !isMasterMuted;


            player1.muted =
                isMasterMuted;

            player2.muted =
                isMasterMuted;


            if (isMasterMuted) {

                muteIcon.innerHTML = `
                    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 14.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                `;

                muteBtn.title =
                    "Unmute";

            } else {

                muteIcon.innerHTML = `
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                `;

                muteBtn.title =
                    "Mute";
            }

        }
    );


    /* =========================================================
       FULLSCREEN
       ========================================================= */

    fullscreenBtn.addEventListener(
        'click',
        () => {

            if (!document.fullscreenElement) {

                if (
                    tvFrame.requestFullscreen
                ) {

                    tvFrame.requestFullscreen();

                } else if (
                    tvFrame.webkitRequestFullscreen
                ) {

                    tvFrame.webkitRequestFullscreen();
                }

            } else {

                if (
                    document.exitFullscreen
                ) {

                    document.exitFullscreen();

                } else if (
                    document.webkitExitFullscreen
                ) {

                    document.webkitExitFullscreen();
                }
            }

        }
    );


    /* =========================================================
       ANTI-SCRUB GUARD
       ========================================================= */

    function attachTimeupdateGuard(
        playerInstance
    ) {

        playerInstance.addEventListener(
            'timeupdate',
            () => {

                if (
                    isReverting ||
                    playerInstance.paused ||
                    !playerInstance.duration ||
                    playerInstance.ended
                ) {
                    return;
                }


                const elapsed =
                    (
                        performance.now() -
                        fetchTimestamp
                    ) / 1000;


                /*
                 * NEVER modulo this value.
                 *
                 * The browser must be allowed to reach
                 * the natural end of the video.
                 */
                const target =
                    basePlayed + elapsed;


                /*
                 * Don't interfere with the final moment.
                 */
                if (
                    target >=
                    playerInstance.duration
                ) {
                    return;
                }


                if (
                    Math.abs(
                        playerInstance.currentTime -
                        target
                    ) > 2.5
                ) {

                    isReverting = true;


                    try {

                        playerInstance.currentTime =
                            target;

                    } catch (e) {

                        console.warn(
                            "Seek correction failed:",
                            e
                        );
                    }


                    setTimeout(
                        () => {

                            isReverting = false;

                        },
                        300
                    );
                }

            }
        );
    }


    attachTimeupdateGuard(player1);

    attachTimeupdateGuard(player2);


    /* =========================================================
       CLEAR END WATCHDOG
       ========================================================= */

    function clearEndWatchdog() {

        if (endWatchdog) {

            clearInterval(
                endWatchdog
            );

            endWatchdog = null;
        }

        endWatchdogGeneration = 0;
    }


    /* =========================================================
       START END WATCHDOG
       ========================================================= */

    function startEndWatchdog(
        playerInstance,
        generation
    ) {

        clearEndWatchdog();


        endWatchdogGeneration =
            generation;


        endWatchdog =
            setInterval(
                () => {

                    /*
                     * If another transition has happened,
                     * this watchdog is obsolete.
                     */
                    if (
                        generation !==
                        transitionGeneration
                    ) {

                        clearEndWatchdog();

                        return;
                    }


                    /*
                     * Watchdog must belong to the active
                     * player.
                     */
                    if (
                        playerInstance !==
                        (
                            activePlayerSlot === 1
                                ? player1
                                : player2
                        )
                    ) {
                        return;
                    }


                    if (
                        !playerInstance.classList.contains(
                            'active'
                        )
                    ) {
                        return;
                    }


                    if (
                        !playlistInitialized ||
                        playlist.length === 0
                    ) {
                        return;
                    }


                    /*
                     * NORMAL ENDED.
                     */
                    if (
                        playerInstance.ended
                    ) {

                        clearEndWatchdog();

                        advancePlaylist(
                            generation
                        );

                        return;
                    }


                    /*
                     * BACKUP END DETECTION.
                     *
                     * Only trigger if this exact player and
                     * exact transition are still active.
                     */
                    if (
                        Number.isFinite(
                            playerInstance.duration
                        ) &&

                        playerInstance.duration > 0 &&

                        playerInstance.currentTime >=
                            playerInstance.duration -
                            0.15
                    ) {

                        clearEndWatchdog();

                        advancePlaylist(
                            generation
                        );
                    }

                },
                250
            );
    }


    /* =========================================================
       GET NEXT PLAYLIST ITEM
       ========================================================= */

    function getNextPlaylistItem() {

        if (
            !playlist ||
            playlist.length === 0
        ) {
            return null;
        }


        playlistIndex =
            (
                playlistIndex + 1
            ) %
            playlist.length;


        return playlist[
            playlistIndex
        ];
    }


    /* =========================================================
       PLAY PLAYLIST ITEM
       ========================================================= */

    function playPlaylistItem(
        item,
        startTime = 0
    ) {

        if (
            !item ||
            !item.url
        ) {

            console.warn(
                "Invalid playlist item:",
                item
            );

            return;
        }


        /*
         * Every new playlist item gets a completely new
         * transition generation.
         */
        transitionGeneration++;


        const generation =
            transitionGeneration;


        transitionInProgress =
            true;


        clearEndWatchdog();


        currentStreamUrl =
            item.url;


        activePlaylistUrl =
            item.url;


        titleBox.innerText =
            "Now: " +
            (
                item.title || ""
            );


        fetchTimestamp =
            performance.now();


        basePlayed =
            Number(startTime) || 0;


        console.log(
            "PLAYING:",
            playlistIndex,
            item.title,
            item.url,
            "generation:",
            generation
        );


        switchVideoInstantly(
            item.url,
            basePlayed,
            generation
        );
    }


    /* =========================================================
       ADVANCE PLAYLIST
       ========================================================= */

    function advancePlaylist(
        sourceGeneration = null
    ) {

        /*
         * If the call came from an old watchdog/event,
         * completely ignore it.
         */
        if (
            sourceGeneration !== null &&
            sourceGeneration !==
                transitionGeneration
        ) {

            console.log(
                "IGNORED OLD TRANSITION:",
                sourceGeneration,
                "current:",
                transitionGeneration
            );

            return;
        }


        /*
         * Never advance while another item is still
         * being switched in.
         */
        if (
            transitionInProgress
        ) {

            console.log(
                "IGNORED ADVANCE DURING TRANSITION"
            );

            return;
        }


        if (
            !playlist ||
            playlist.length === 0
        ) {
            return;
        }


        const nextItem =
            getNextPlaylistItem();


        if (
            !nextItem ||
            !nextItem.url
        ) {

            console.warn(
                "No valid next playlist item."
            );

            return;
        }


        console.log(
            "NEXT PLAYLIST ITEM:",
            playlistIndex,
            nextItem.title
        );


        /*
         * Start next object from the beginning.
         */
        playPlaylistItem(
            nextItem,
            0
        );
    }


    /* =========================================================
       ENDED EVENT
       ========================================================= */

    function attachPlaylistEndedHandler(
        playerInstance
    ) {

        playerInstance.addEventListener(
            'ended',
            () => {

                console.log(
                    "ENDED:",
                    playerInstance.id,
                    "URL:",
                    playerInstance.currentSrc
                );


                /*
                 * Ignore inactive player.
                 */
                if (
                    !playerInstance.classList.contains(
                        'active'
                    )
                ) {
                    return;
                }


                /*
                 * Ignore if this is not actually the
                 * currently expected playlist URL.
                 */
                if (
                    currentStreamUrl &&
                    playerInstance.currentSrc !==
                        currentStreamUrl
                ) {

                    console.log(
                        "IGNORED ENDED FROM OLD URL"
                    );

                    return;
                }


                if (
                    !playlistInitialized ||
                    playlist.length === 0
                ) {
                    return;
                }


                clearEndWatchdog();


                /*
                 * The active player's current generation
                 * is the only generation allowed to advance.
                 */
                advancePlaylist(
                    transitionGeneration
                );
            }
        );
    }


    attachPlaylistEndedHandler(player1);

    attachPlaylistEndedHandler(player2);


    /* =========================================================
       PLAYLIST SIGNATURE
       ========================================================= */

    function createPlaylistSignature(
        items
    ) {

        if (
            !Array.isArray(items)
        ) {
            return "";
        }


        return items
            .map(
                item =>
                    (
                        item.url || ""
                    ) +
                    "|" +
                    (
                        item.title || ""
                    ) +
                    "|" +
                    (
                        item.startHour || 0
                    ) +
                    ":" +
                    (
                        item.startMinute || 0
                    ) +
                    ":" +
                    (
                        item.startSecond || 0
                    )
            )
            .join("||");
    }


    /* =========================================================
       POLL SERVER
       ========================================================= */

    function pollLiveConfig() {

        fetch(
            endpoint +
            '?t=' +
            Date.now(),
            {
                cache: 'no-store'
            }
        )

        .then(
            response => {

                if (!response.ok) {

                    throw new Error(
                        "HTTP " +
                        response.status
                    );
                }


                return response.json();
            }
        )

        .then(
            data => {

                /* =================================================
                   PLAYLIST RESPONSE
                   ================================================= */

                if (
                    Array.isArray(
                        data.playlist
                    ) &&
                    data.playlist.length > 0
                ) {

                    const newPlaylist =
                        data.playlist;


                    const newSignature =
                        createPlaylistSignature(
                            newPlaylist
                        );


                    const playlistChanged =
                        newSignature !==
                        lastPlaylistSignature;


                    playlist =
                        newPlaylist;


                    /*
                     * FIRST CONNECTION
                     */
                    if (
                        !playlistInitialized
                    ) {

                        playlistIndex =
                            Number.isInteger(
                                data.playlistIndex
                            )
                                ? data.playlistIndex
                                : 0;


                        if (
                            playlistIndex < 0 ||
                            playlistIndex >=
                                playlist.length
                        ) {

                            playlistIndex = 0;
                        }


                        const initialItem =
                            playlist[
                                playlistIndex
                            ];


                        if (
                            initialItem &&
                            initialItem.url
                        ) {

                            playlistInitialized =
                                true;


                            lastPlaylistSignature =
                                newSignature;


                            console.log(
                                "INITIAL PLAYLIST ITEM:",
                                playlistIndex,
                                initialItem.title
                            );


                            playPlaylistItem(
                                initialItem,
                                Number(
                                    data.played
                                ) || 0
                            );
                        }


                        return;
                    }


                    /*
                     * REFRESH PLAYLIST DATA.
                     *
                     * Do NOT restart the current video every
                     * second.
                     */
                    if (
                        playlistChanged
                    ) {

                        console.log(
                            "PLAYLIST UPDATED FROM SERVER"
                        );


                        const currentIndex =
                            playlist.findIndex(
                                item =>
                                    item &&
                                    item.url ===
                                        currentStreamUrl
                            );


                        if (
                            currentIndex !== -1
                        ) {

                            playlistIndex =
                                currentIndex;

                        } else {

                            playlistIndex =
                                Math.min(
                                    playlistIndex,
                                    playlist.length - 1
                                );
                        }


                        lastPlaylistSignature =
                            newSignature;
                    }


                    /*
                     * IMPORTANT:
                     *
                     * Once playback has started, we IGNORE
                     * data.playlistIndex and data.played.
                     *
                     * The browser controls playlist progression.
                     */
                }


                /* =================================================
                   SINGLE STREAM FALLBACK
                   ================================================= */

                else if (
                    data.url
                ) {

                    playlist = [];

                    playlistIndex = 0;

                    playlistInitialized =
                        false;

                    lastPlaylistSignature =
                        "";

                    clearEndWatchdog();


                    if (
                        data.url !==
                        currentStreamUrl
                    ) {

                        currentStreamUrl =
                            data.url;


                        activePlaylistUrl =
                            "";


                        titleBox.innerText =
                            "Now: " +
                            (
                                data.title || ""
                            );


                        fetchTimestamp =
                            performance.now();


                        basePlayed =
                            Number(
                                data.played
                            ) || 0;


                        transitionGeneration++;


                        switchVideoInstantly(
                            data.url,
                            basePlayed,
                            transitionGeneration
                        );
                    }

                }

            }
        )

        .catch(
            error => {

                console.warn(
                    "Polling sync notice:",
                    error
                );

            }
        )

        .finally(
            () => {

                setTimeout(
                    pollLiveConfig,
                    1000
                );
            }
        );
    }


    /* =========================================================
       DOUBLE BUFFER SWITCH
       ========================================================= */

    function switchVideoInstantly(
        newUrl,
        targetTime,
        generation
    ) {

        const activePlayer =
            activePlayerSlot === 1
                ? player1
                : player2;


        const standbyPlayer =
            activePlayerSlot === 1
                ? player2
                : player1;


        /*
         * Calculate network/fetch delay.
         */
        const elapsed =
            (
                performance.now() -
                fetchTimestamp
            ) / 1000;


        let startPos =
            Number(targetTime || 0) +
            elapsed;


        /*
         * Clear old event handlers.
         */
        standbyPlayer.onloadedmetadata =
            null;

        standbyPlayer.oncanplay =
            null;


        /*
         * Clear the old standby source.
         */
        standbyPlayer.pause();

        standbyPlayer.removeAttribute(
            'src'
        );

        standbyPlayer.load();


        /*
         * Set new URL.
         */
        standbyPlayer.src =
            newUrl;


        standbyPlayer.muted =
            isMasterMuted;


        /* =====================================================
           METADATA
           ===================================================== */

        standbyPlayer.onloadedmetadata =
            () => {

                /*
                 * If another transition happened while this
                 * video was loading, abandon this event.
                 */
                if (
                    generation !==
                    transitionGeneration
                ) {
                    return;
                }


                if (
                    standbyPlayer.duration &&
                    standbyPlayer.duration > 0
                ) {

                    /*
                     * Only initial seek uses modulo.
                     */
                    if (
                        startPos >=
                        standbyPlayer.duration
                    ) {

                        startPos =
                            startPos %
                            standbyPlayer.duration;
                    }
                }


                try {

                    standbyPlayer.currentTime =
                        Math.max(
                            0,
                            startPos
                        );

                } catch (e) {

                    console.warn(
                        "Initial seek failed:",
                        e
                    );
                }
            };


        /*
         * Load new video.
         */
        standbyPlayer.load();


        /* =====================================================
           CAN PLAY
           ===================================================== */

        standbyPlayer.oncanplay =
            () => {

                /*
                 * Ignore stale buffer.
                 */
                if (
                    generation !==
                    transitionGeneration
                ) {
                    return;
                }


                standbyPlayer
                    .play()

                    .then(
                        () => {

                            /*
                             * Still current?
                             */
                            if (
                                generation !==
                                transitionGeneration
                            ) {
                                return;
                            }


                            /*
                             * New player becomes active.
                             */
                            standbyPlayer.classList.add(
                                'active'
                            );


                            activePlayer.classList.remove(
                                'active'
                            );


                            /*
                             * Stop old player.
                             */
                            activePlayer.pause();


                            activePlayer.removeAttribute(
                                'src'
                            );


                            activePlayer.load();


                            /*
                             * Swap active slot.
                             */
                            activePlayerSlot =
                                activePlayerSlot === 1
                                    ? 2
                                    : 1;


                            /*
                             * Transition is COMPLETE.
                             *
                             * This is important:
                             * we do NOT allow another playlist
                             * advance until the new player is
                             * actually active.
                             */
                            transitionInProgress =
                                false;


                            /*
                             * Start watchdog ONLY after the
                             * new player is active.
                             */
                            if (
                                playlistInitialized &&
                                playlist.length > 0
                            ) {

                                startEndWatchdog(
                                    standbyPlayer,
                                    generation
                                );
                            }


                            console.log(
                                "ACTIVE PLAYER:",
                                standbyPlayer.id,
                                "generation:",
                                generation
                            );

                        }
                    )

                    .catch(
                        error => {

                            console.log(
                                "Playback deferred:",
                                error
                            );
                        }
                    );
            };
    }


    /* =========================================================
       START
