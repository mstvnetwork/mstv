<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSTV Player</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.7.11/dist/shaka-player.compiled.debug.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background: #000; overflow: hidden; width: 100%; height: 100%; }
        .container { display: flex; width: 100vw; height: 100vh; background: #000; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <div class="container">
        <video id="video" controls autoplay crossorigin="anonymous"></video>
    </div>
    <script>
  const streamList = [
    {
        "name": "Zee TV (DASH ClearKey)",
        "type": "dash",
        "url": "https://d1g8wgjurz8via.cloudfront.net/bpk-tv/Zeetv/default/main.mpd",
        "drm": {
            "ed068cf84f0640ccbc7c0e395c0a272e": "bb722190f2bb446391020411a7d0828b"
        }
    },
    {
        "name": "Premiere Sports 1",
        "type": "dash",
        "url": "https://otte.live.fly.ww.aiv-cdn.net/gru-nitro/live/clients/dash/enc/nelfyucw9a/out/v1/6ffb2c365ad14f88b154591beb43d1f6/cenc.mpd",
        "drm": {
            "56b79c1782b30e6b6fc973b0e8fd4104": "fa38aaa865a57eda7c77444697ba8ed3"
        }
    }
];



 async function initApp() {
            const video = document.getElementById('video');
            const hash = window.location.hash.substring(1);
            let index = (parseInt(hash, 10) || 1) - 1;
            const stream = streamList[index] || streamList[0];

            // --- 1. HLS ENGINE (STRICTLY NON-SHAKA) ---
            if (stream.type === "hls") {
                if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = stream.url;
                } 
                else if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(stream.url);
                    hls.attachMedia(video);
                } 
                return; 
            }

            // --- 2. DASH ENGINE (STRICTLY SHAKA) ---
            if (stream.type === "dash") {
                if (typeof shaka === 'undefined') return;

                shaka.polyfill.installAll();
                const player = new shaka.Player(video);

                if (stream.drm) {
                    player.configure({ drm: { clearKeys: stream.drm } });
                }

                try {
                    await player.load(stream.url);
                } catch (e) {
                    console.error('DASH Load Error', e);
                }
            }
        }

        window.addEventListener('hashchange', () => window.location.reload());
        window.onload = initApp;
    </script>
</body>
</html>
