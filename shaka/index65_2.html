<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linear TV Stream Platform</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

/* Master Layout Frameworks */
.player-wrap {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}
body.public-mode .player-wrap {
    max-width: 100%;
    padding: 0;
}

.video-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    overflow: hidden;
}
body.public-mode .video-container {
    width: 100vw;
    height: 100vh;
    aspect-ratio: auto;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* Transparent Borderless Dynamic Text Box Overlay */
.now-playing-overlay {
    position: absolute;
    top: 15px;
    left: 15px;
    color: rgba(255, 255, 255, 0.85);
    font-size: 16px;
    font-weight: bold;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
    pointer-events: none;
    z-index: 10;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

/* Loader Layout Structures */
.loader {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.6);
    z-index: 5;
}
.loader.hidden { display: none; }

.error {
    display: none;
    padding: 10px;
    background: #900;
    margin-top: 10px;
    z-index: 6;
}
.error.show { display: block; }

/* Custom Sleek HLS Player Control Bar Overlay */
.hls-controls-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
    padding: 15px 20px;
    display: flex;
    align-items: center;
    gap: 15px;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}
/* Trigger interface display layout on movement loops */
.video-container.show-ui .hls-controls-overlay {
    opacity: 1;
    pointer-events: auto;
}

.control-btn {
    background: none;
    border: none;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    padding: 5px 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s ease;
}
.control-btn:hover { transform: scale(1.1); }

.volume-wrapper {
    display: flex;
    align-items: center;
    gap: 8px;
}
.vol-slider {
    cursor: pointer;
    width: 80px;
    accent-color: #0f0;
}

.progress-timeline-container {
    flex-grow: 1;
    height: 6px;
    background: rgba(255,255,255,0.25);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
}
.progress-fill {
    height: 100%;
    width: 0%;
    background: #0f0;
    border-radius: 3px;
}

/* Sidebar Info Blocks (Hidden natively in public execution modes) */
.private-ui-block { display: block; }
body.public-mode .private-ui-block { display: none !important; }

.schedule {
    margin-top: 20px;
    max-height: 250px;
    overflow-y: auto;
    border: 1px solid #333;
}
.schedule-item { padding: 10px; border-bottom: 1px solid #222; }
.schedule-item.active { background: #222; border-left: 4px solid #0f0; }

.toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: #222;
    padding: 10px 15px;
    border-radius: 6px;
    opacity: 0;
    transition: .3s;
    z-index: 100;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="player-wrap">

    <div class="private-ui-block">
        <h2 id="nowTitle">Loading Playlist Structure...</h2>
        <div id="clock"></div>
        <div id="clockDate"></div>
    </div>

    <!-- Media Player Viewport Container Block -->
    <div id="videoContainer" class="video-container">

        <!-- Borderless Dynamic Text Box Overlay -->
        <div id="nowPlayingOverlay" class="now-playing-overlay">Now Playing: Connecting...</div>

        <!-- HTML5 Video Component (Controls native attributes completely stripped) -->
        <video id="videoPlayer" playsinline></video>

        <div id="loader" class="loader">Loading Broadcast...</div>

        <!-- Pro Aligned Floating Custom HLS Interface Control Bar -->
        <div class="hls-controls-overlay">
            <button id="btnPlay" class="control-btn">⏸</button>
            <button id="btnMute" class="control-btn">🔊</button>
            
            <div class="volume-wrapper">
                <input id="volSlider" class="vol-slider" type="range" min="0" max="1" step="0.01" value="0.8">
            </div>

            <div class="progress-timeline-container">
                <div id="progressFill" class="progress-fill"></div>
            </div>

            <button id="btnFullscreen" class="control-btn">⛶</button>
        </div>

    </div>

    <div id="errorMsg" class="error">Playback error routing stream channel. Syncing...</div>

    <div class="private-ui-block">
        <div id="statusText" style="margin-top:10px; font-size:12px; color:#aaa;"></div>
        <div id="statusOffset" style="font-size:12px; color:#aaa;"></div>
        <h3>Station Broadcast Schedule</h3>
        <div id="scheduleList" class="schedule"></div>
    </div>

</div>

<div id="syncToast" class="toast">Synced to live track position</div>
<div id="updateToast" class="toast">Station playlist updated dynamically</div>

<script src="./player.js"></script>
<script>
initPlayer({
    videoId: 'videoPlayer',
    videoContainerId: 'videoContainer',
    loaderId: 'loader',
    errorId: 'errorMsg',
    btnPlayId: 'btnPlay',
    btnMuteId: 'btnMute',
    volSliderId: 'volSlider',
    btnFullscreenId: 'btnFullscreen',
    progressFillId: 'progressFill',
    scheduleListId: 'scheduleList',
    syncToastId: 'syncToast',
    updateToastId: 'updateToast',
    statusTextId: 'statusText',
    statusOffsetId: 'statusOffset',
    nowTitleId: 'nowTitle',
    nowPlayingOverlayId: 'nowPlayingOverlay',
    showClock: true,
    clockId: 'clock',
    clockDateId: 'clockDate'
});
</script>

</body>
</html>
