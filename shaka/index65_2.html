<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linear TV Test</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: Arial, sans-serif;
}

.player-wrap {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.video-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    overflow: hidden;
}

video,
iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

.loader {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.6);
    z-index: 10;
}

.loader.hidden {
    display: none;
}

.error {
    display: none;
    padding: 10px;
    background: #900;
    margin-top: 10px;
}

.error.show {
    display: block;
}

/* Controls inside video container for overlay appearance */
.video-controls-wrapper {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0));
    padding: 20px 15px 10px 15px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 8px;
    opacity: 0.9;
    transition: opacity 0.3s ease;
}

.controls {
    display: flex;
    gap: 12px;
    align-items: center;
}

button {
    cursor: pointer;
    padding: 6px 12px;
    background: rgba(51, 51, 51, 0.8);
    color: #fff;
    border: 1px solid #555;
    border-radius: 4px;
}

button:hover {
    background: rgba(68, 68, 68, 0.9);
}

.progress {
    height: 5px;
    background: rgba(255, 255, 255, 0.3);
    width: 100%;
    cursor: pointer;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #0f0;
}

.schedule {
    margin-top: 20px;
    max-height: 300px;
    overflow: auto;
    border: 1px solid #333;
}

.schedule-item {
    padding: 10px;
    border-bottom: 1px solid #222;
}

.schedule-item.active {
    background: #222;
}

.toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: #222;
    padding: 10px 15px;
    border-radius: 6px;
    opacity: 0;
    transition: .3s;
    z-index: 999;
}

.toast.show {
    opacity: 1;
}

.vol-overlay {
    display: none;
    position: absolute;
    bottom: 60px;
    left: 10px;
    padding: 6px 10px;
    background: rgba(0,0,0,.7);
    border-radius: 4px;
    font-size: 12px;
    z-index: 100;
    pointer-events: none;
}


/* ... (keep your existing base styles) ... */

/* --- EMBED MODE CONFIGURATION --- */
body.embed-mode {
    background: transparent;
    padding: 0;
}

body.embed-mode .player-wrap {
    max-width: 100%;
    padding: 0;
}

/* Hide extra UI elements, schedules, and toasts in embed mode */
body.embed-mode #nowTitle,
body.embed-mode #clock,
body.embed-mode #clockDate,
body.embed-mode #errorMsg,
body.embed-mode #statusText,
body.embed-mode #statusOffset,
body.embed-mode h3,
body.embed-mode #scheduleList,
body.embed-mode #updateToast,
body.embed-mode .progress,
body.embed-mode #volSlider {
    display: none !important;
}

body.embed-mode .video-container {
    width: 100vw;
    height: 100vh;
    aspect-ratio: unset;
}
</style>
</head>
<body>

<div class="player-wrap" id="playerWrap">

    <h2 id="nowTitle">Loading...</h2>

    <div id="clock"></div>
    <div id="clockDate"></div>

    <div class="video-container" id="videoContainer">

        <video
            id="videoPlayer"
            playsinline
            controlslist="nodownload">
        </video>

        <iframe
            id="iframePlayer"
            style="display:none;"
            allowfullscreen>
        </iframe>

        <div id="loader" class="loader">
            Loading...
        </div>

        <div id="volOverlay" class="vol-overlay">
            Volume controlled by embedded player
        </div>

        <!-- Controls and Progress Moved Inside Container -->
        <div class="video-controls-wrapper">
            <div class="controls">
                <button id="btnPlay" title="Play/Pause">⏸</button>
                <button id="btnMute" title="Mute/Unmute">🔇</button>

                <input
                    id="volSlider"
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.8">

                <button id="btnFullscreen" title="Toggle Fullscreen">⛶</button>
            </div>

            <div class="progress">
                <div id="progressFill" class="progress-fill"></div>
            </div>
        </div>

    </div>

    <div id="errorMsg" class="error">
        Playback error. Retrying...
    </div>

    <div id="statusText"></div>
    <div id="statusOffset"></div>

    <h3>Schedule</h3>
    <div id="scheduleList" class="schedule"></div>

</div>

<div id="syncToast" class="toast">
    Synced to live position
</div>

<div id="updateToast" class="toast">
    Playlist updated
</div>

<script>
// Automatically toggle Embed Mode based on URL query parameter (e.g., ?mode=embed)
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('mode') === 'embed') {
    document.body.classList.add('embed-mode');
}
</script>

<script src="./player2.js"></script>

<script>
initPlayer({
    videoId: 'videoPlayer',
    iframeId: 'iframePlayer',
    containerId: 'videoContainer',

    loaderId: 'loader',
    errorId: 'errorMsg',

    btnPlayId: 'btnPlay',
    btnMuteId: 'btnMute',
    btnFullscreenId: 'btnFullscreen',
    volSliderId: 'volSlider',

    progressFillId: 'progressFill',
    scheduleListId: 'scheduleList',

    syncToastId: 'syncToast',
    updateToastId: 'updateToast',

    statusTextId: 'statusText',
    statusOffsetId: 'statusOffset',

    nowTitleId: 'nowTitle',
    volOverlayId: 'volOverlay',

    showClock: true,
    clockId: 'clock',
    clockDateId: 'clockDate'
});
</script>

</body>
</html>
