<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Linear TV Stream Platform</title>

<!-- ADD (cdnjs fallback): -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>

<style>
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

.player-wrap {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}
body.public-mode .player-wrap {
    max-width: 100%;
    padding: 0;
}
/* --- UPDATED VIDEO CONTAINER --- */
.video-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    overflow: hidden;
    /* Crucial: Establishes a container context so the logo can read its width */
    container-type: inline-size; 
}
body.public-mode .video-container {
    width: 100vw;
    height: 100vh;
    aspect-ratio: auto;
    /* Keeps the container context active in full-screen public mode */
    container-type: inline-size; 
}

/* --- UPDATED UNIFIED LOGO CLASS --- */
.channel-logo {
    position: absolute;
    /* Adjust these percents to perfectly match your target placement */
    top: -1.9cqw;    
    right: 2.5cqw;  
    
    /* Removes standard height constraints and scales dynamically */
    width: 18cqw;   /* The logo width will always occupy exactly 18% of the player's width */
    height: auto;   /* Lets the height scale naturally based on the image's proportions */
    
    object-fit: contain;
    opacity: 0.8;   /* Slightly increased so the thin 'Entertainment Unlimited' text doesn't wash out over video */
    pointer-events: none;
    z-index: 15;
    filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.5));
}

/* --- COMPLETELY REMOVE OR DELETE THIS BLOCK --- */
/* 
@media (max-width: 600px) {
    .channel-logo { ... }
} 
*/




.now-playing-overlay {
    position: absolute;
    top: 12px;
    left: 15px;
    color: rgba(255, 255, 255, 0.9);
    font-size: 9px;
    font-weight: normal;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
    pointer-events: none;
    z-index: 15;
}

.loader {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.6);
    z-index: 5;
    pointer-events: none;
}
.loader.hidden { display: none; }

.error {
    display: none;
    padding: 10px;
    background: #900;
    margin-top: 10px;
    z-index: 6;
}
.error.show { display: block; }

.hls-controls-overlay {
    position: absolute;
    bottom: 20px;
    left: 15px;
    right: 15px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 15px;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

.fullscreen-right-wrapper {
    margin-left: auto;
    pointer-events: auto;
}

.video-container.show-ui .hls-controls-overlay {
    opacity: 1;
}

.control-btn {
    background: rgba(255, 255, 255, 0.2);
    border: none;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.2s;
}
.control-btn:active {
    background: rgba(255, 255, 255, 0.4);
}

.private-ui-block { display: block; }
body.public-mode .private-ui-block { display: none !important; }

.schedule {
    margin-top: 20px;
    max-height: 250px;
    overflow-y: auto;
    border: 1px solid #333;
}
.schedule-item { padding: 10px; border-bottom: 1px solid #222; }
.schedule-item.active { background: #222; border-left: 4px solid #0f0; }

.toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: #222;
    padding: 10px 15px;
    border-radius: 6px;
    opacity: 0;
    transition: .3s;
    z-index: 100;
}
.toast.show { opacity: 1; }
/* Force structural hiding when public mode is applied to body engine */
body.public-mode .toast { display: none !important; opacity: 0 !important; }
</style>
</head>
<body>

<div class="player-wrap">

    <div class="private-ui-block">
        <h2 id="nowTitle">Loading Platform Setup...</h2>
        <div id="clock"></div>
        <div id="clockDate"></div>
    </div>

    <div id="videoContainer" class="video-container">

        <div id="nowPlayingOverlay" class="now-playing-overlay">Now Playing: Connecting...</div>
        <img id="channelLogo" class="channel-logo" src="https://crickethd.pages.dev/apna3.webp" alt="Apna TV Logo">
        <video id="videoPlayer" playsinline></video>
        <div id="loader" class="loader">Loading...</div>

        <div class="hls-controls-overlay">
            <button id="btnPlay" class="control-btn">⏸</button>
            <button id="btnMute" class="control-btn">🔊</button>
            
            <div class="fullscreen-right-wrapper">
                <button id="btnFullscreen" class="control-btn">⛶</button>
            </div>
        </div>

    </div>

    <div id="errorMsg" class="error">Playback routing error. Retrying...</div>

    <div class="private-ui-block">
        <div id="statusText" style="margin-top:10px; font-size:12px; color:#aaa;"></div>
        <div id="statusOffset" style="font-size:12px; color:#aaa;"></div>
        <h3>Station Broadcast Schedule</h3>
        <div id="scheduleList" class="schedule"></div>
    </div>

</div>

<script src="./player2.js"></script>
<script>
// Auto-detect public mode parameter early
const isPublicMode = window.location.search.includes('mode=public');
if (isPublicMode) {
    document.body.classList.add('public-mode');
}

// CORS & Smooth Playback Patch Core
(function patchVideoEngine() {
    const videoElement = document.getElementById('videoPlayer');
    if (!videoElement) return;

    // Fixed: Autoplay fallback without forcing aggressive pause/play stutter loops
    videoElement.addEventListener('canplay', function() {
        if (videoElement.paused) {
            videoElement.play().catch(() => {
                videoElement.muted = true;
                videoElement.play();
                const muteBtn = document.getElementById('btnMute');
                if (muteBtn) muteBtn.innerText = "🔇";
            });
        }
    }, { once: true });

    // CORS Interception Architecture
    Object.defineProperty(videoElement, 'src', {
        set: function(url) {
            if (typeof url === 'string' && url.includes('.mp4')) {
                if (window.hlsInstance) {
                    window.hlsInstance.destroy();
                    window.hlsInstance = null;
                }
                this.setAttribute('src', url);
            } else {
                this.setAttribute('src', url);
            }
        },
        get: function() {
            return this.getAttribute('src');
        }
    });

    const OriginalHls = window.Hls;
    if (OriginalHls) {
        window.Hls = function(config) {
            const instance = new OriginalHls(config);
            window.hlsInstance = instance;
            
            const originalLoadSource = instance.loadSource;
            instance.loadSource = function(source) {
                if (source.includes('.mp4')) {
                    videoElement.src = source;
                    const loader = document.getElementById('loader');
                    if (loader) loader.classList.add('hidden');
                    return;
                }
                originalLoadSource.apply(this, arguments);
            };
            return instance;
        };

        // Transfer all static properties (including Events) to prevent undefined errors
        Object.assign(window.Hls, OriginalHls);
        window.Hls.prototype = OriginalHls.prototype;
    }

    // Completely block Toast notifications if mode=public is active
    if (isPublicMode) {
        const blockToastElement = (id) => {
            const el = document.getElementById(id);
            if (!el) return;
            Object.defineProperty(el, 'className', {
                set: function() { /* Intercept and drop showing assignments */ },
                get: function() { return 'toast'; }
            });
            el.style.display = 'none';
        };
        blockToastElement('syncToast');
        blockToastElement('updateToast');
    }
})();

// Platform player engine runtime execution
initPlayer({
    videoId: 'videoPlayer',
    videoContainerId: 'videoContainer',
    loaderId: 'loader',
    errorId: 'errorMsg',
    btnPlayId: 'btnPlay',
    btnMuteId: 'btnMute',
    btnFullscreenId: 'btnFullscreen',
    scheduleListId: 'scheduleList',
    syncToastId: 'syncToast',
    updateToastId: 'updateToast',
    statusTextId: 'statusText',
    statusOffsetId: 'statusOffset',
    nowTitleId: 'nowTitle',
    nowPlayingOverlayId: 'nowPlayingOverlay',
    showClock: true,
    clockId: 'clock',
    clockDateId: 'clockDate'
});
</script>
