<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Sync Player - Embed</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
  html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  }

  .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
  }

  video, iframe#iframePlayer {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      object-fit: contain;
      background: #000;
  }

  .loader {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.6);
      color: #fff;
      font-size: 14px;
      letter-spacing: .5px;
      z-index: 20;
  }

  .loader.hidden { display: none; }

  .error {
      display: none;
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      padding: 8px 12px;
      background: rgba(153,0,0,.85);
      border-radius: 6px;
      font-size: 13px;
      z-index: 25;
  }

  .error.show { display: block; }

  .controls-overlay {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      background: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .25s ease, transform .25s ease;
      z-index: 30;
      pointer-events: none;
  }

  .video-container.show-controls .controls-overlay {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
  }

  #btnPlay, #btnFullscreen {
      cursor: pointer;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      color: #fff;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s ease, transform .15s ease;
  }

  #btnPlay:hover, #btnFullscreen:hover { background: rgba(255,255,255,.25); transform: scale(1.06); }
  #btnPlay:active, #btnFullscreen:active { transform: scale(0.94); }

  .vol-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1 1 auto;
      min-width: 0;
      transition: opacity .2s ease;
  }

  .vol-icon {
      flex: 0 0 auto;
      font-size: 14px;
      opacity: .85;
      width: 16px;
      text-align: center;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }

  #volSlider {
      -webkit-appearance: none;
      appearance: none;
      width: 90px;
      max-width: 30%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,.35);
      outline: none;
      cursor: pointer;
  }

  #volSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 4px rgba(0,0,0,.6);
  }

  #volSlider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: none;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
  }

  .live-badge {
      margin-left: auto;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .5px;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }

  .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e33;
      animation: pulse 1.4s infinite;
  }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  .vol-overlay {
      display: none;
      position: absolute;
      bottom: 66px;
      left: 14px;
      padding: 5px 10px;
      background: rgba(0,0,0,.7);
      border-radius: 4px;
      font-size: 11px;
      z-index: 100;
      pointer-events: none;
      color: #fff;
  }

  .progress { display: none; }

  .progress-fill {
      height: 100%;
      width: 0%;
      background: #e33;
  }
</style>
</head>
<body>

<div class="video-container" id="videoContainer">

    <video
        id="videoPlayer"
        playsinline
        controlslist="nodownload">
    </video>

    <iframe
        id="iframePlayer"
        style="display:none;"
        allowfullscreen>
    </iframe>

    <div id="loader" class="loader">Loading...</div>

    <div id="errorMsg" class="error">Playback error. Retrying...</div>

    <div id="volOverlay" class="vol-overlay">
        Volume controlled by embedded player
    </div>

    <div class="progress">
        <div id="progressFill" class="progress-fill"></div>
    </div>

    <div class="controls-overlay">
        <button id="btnPlay">⏸</button>

        <div class="vol-wrap">
            <span class="vol-icon">🔊</span>
            <input
                id="volSlider"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.8">
        </div>

        <div class="live-badge">
            <span class="live-dot"></span>LIVE
        </div>

        <button id="btnFullscreen" title="Fullscreen">⛶</button>
    </div>

</div>

<!-- Kept in DOM (hidden) only so player.js's getElementById calls
     for these IDs don't return null. Not touched functionally. -->
<div style="display:none;">
    <h2 id="nowTitle"></h2>
    <div id="clock"></div>
    <div id="clockDate"></div>
    <div id="statusText"></div>
    <div id="statusOffset"></div>
    <div id="scheduleList"></div>
    <div id="syncToast">Synced to live position</div>
    <div id="updateToast">Playlist updated</div>
</div>

<script src="./player.js"></script>

<script>

initPlayer({
    videoId: 'videoPlayer',
    iframeId: 'iframePlayer',

    loaderId: 'loader',
    errorId: 'errorMsg',

    btnPlayId: 'btnPlay',
    volSliderId: 'volSlider',

    progressFillId: 'progressFill',
    scheduleListId: 'scheduleList',

    syncToastId: 'syncToast',
    updateToastId: 'updateToast',

    statusTextId: 'statusText',
    statusOffsetId: 'statusOffset',

    nowTitleId: 'nowTitle',

    volOverlayId: 'volOverlay',

    showClock: false,
    clockId: 'clock',
    clockDateId: 'clockDate'
});

// Click-to-toggle controls: show on click, auto-hide after a few seconds
const container = document.getElementById('videoContainer');
let hideTimer;

function revealControls() {
    container.classList.add('show-controls');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
        container.classList.remove('show-controls');
    }, 2500);
}

revealControls();

container.addEventListener('click', () => {
    revealControls();
});

// Fullscreen toggle — independent of player.js, only touches the container element
const btnFullscreen = document.getElementById('btnFullscreen');

function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
}

function updateFullscreenIcon() {
    btnFullscreen.textContent = isFullscreen() ? '⤢' : '⛶';
}

btnFullscreen.addEventListener('click', (e) => {
    e.stopPropagation(); // don't let this click also trigger the hide-timer twice unexpectedly
    if (!isFullscreen()) {
        if (container.requestFullscreen) container.requestFullscreen();
        else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
});

document.addEventListener('fullscreenchange', updateFullscreenIcon);
document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

</script>

</body>
</html>
