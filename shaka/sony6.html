<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sony TV HD - Mobile Stream</title>

    <style>
        :root { --primary: #00ffA0; }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #000;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        .viewport {
            width: 100vw; max-width: 1000px; aspect-ratio: 16 / 9; 
            overflow: hidden; position: relative;
            border: 4px solid var(--primary); border-radius: 12px;
            background: #111;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .stream-link-btn {
            display: inline-block;
            padding: 15px 30px;
            background: var(--primary);
            color: #000;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 18px;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 255, 160, 0.4);
            transition: transform 0.2s;
            z-index: 10001;
        }

        .stream-link-btn:active {
            transform: scale(0.95);
        }

        #ticker {
            position: absolute; 
            top: 0px; 
            left: 0;
            width: 100%; 
            background: transparent;
            overflow: hidden; 
            white-space: nowrap;
            z-index: 10000; 
            padding: 11px 0;
        }

        #ticker span {
            display: inline-block; 
            padding-left: 100%;
            animation: scroll 30s linear infinite;
            font-family: sans-serif; 
            font-size: 14px;
            color: #FFFF00; 
            font-weight: bold; 
            text-shadow: 
                -2px -2px 0 #000,  
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000; 
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        #fallback {
            display: none; text-align: center; color: #fff; font-family: sans-serif;
        }
    </style>
</head>
<body>

    <!-- Mobile Viewer -->
    <div class="viewport" id="playerWrapper">
        <!-- Ticker -->
        <div id="ticker">
            <span>Click the button below to watch the stream. To remove ads, download any free ad blocker extension to your browser.</span>
        </div>

        <!-- Safe external link replacement -->
        <a class="stream-link-btn" href="https://bhoomtv.org/jwplayer/?source=https%3a%2f%2fmaamusic.keralive.workers.dev%2fout%2fv1%2fa526e652e4644463bca88e350785bed0%2findex.m3u8&id=24886&type=mp4" target="_blank" rel="noopener noreferrer">
            Watch Sony TV HD Stream
        </a>
    </div>

    <!-- Non-Mobile Fallback -->
    <div id="fallback">
        <h2>Mobile Device Required</h2>
        <p>Please open this page on Android or iOS to view the stream.</p>
    </div>

<script>
(function() {
    function isAllowedDevice() {
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        return /iPhone|iPad|iPod|Android/i.test(ua);
    }

    if (!isAllowedDevice()) {
        document.addEventListener("DOMContentLoaded", function() {
            const wrapper = document.getElementById('playerWrapper');
            const fallback = document.getElementById('fallback');
            if (wrapper) wrapper.remove();
            if (fallback) fallback.style.display = 'block';
        });
    }
})();
</script>
</body>
</html>
