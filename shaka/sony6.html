<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sony TV HD - Premium Stream</title>
    <style>
        :root {
            --primary: #00ffA0;
            --bg-dark: #0a0a0c;
            --card-bg: #14141b;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        .premium-container {
            width: 90vw; max-width: 800px;
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        /* Player Placeholder Layout */
        .video-placeholder {
            width: 100%; aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, #1e1e24 0%, #0a0a0c 100%);
            position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer;
            text-decoration: none;
        }

        .video-placeholder::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,255,160,0.05) 0%, transparent 70%);
        }

        /* Animated Pulse Play Button */
        .play-btn {
            width: 80px; height: 80px;
            background: var(--primary);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            position: relative; z-index: 2;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 30px rgba(0, 255, 160, 0.3);
        }

        .play-btn svg {
            width: 32px; height: 32px; fill: #000; margin-left: 4px;
        }

        .video-placeholder:hover .play-btn {
            transform: scale(1.08);
            box-shadow: 0 0 40px rgba(0, 255, 160, 0.5);
        }

        .play-pulse {
            position: absolute; width: 100%; height: 100%;
            border: 2px solid var(--primary); border-radius: 50%;
            animation: pulse 2s infinite; opacity: 0;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        /* Channel Metadata Info Bar */
        .channel-info {
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .meta-left { display: flex; flex-direction: column; gap: 4px; }
        .channel-title { color: #fff; font-size: 18px; font-weight: 700; margin: 0; }
        
        .status-badge {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--primary); font-size: 12px; font-weight: 600; text-transform: uppercase;
        }

        .status-dot { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; }

        #fallback { display: none; text-align: center; color: #fff; padding: 20px; }
    </style>
</head>
<body>

    <div class="premium-container" id="playerWrapper">
        <!-- Ticker Style Ad Alert Placeholder -->
        <a class="video-placeholder" href="https://bhoomtv.org/live/bollywood-colors/" target="_blank" rel="noopener noreferrer">
            <div class="play-btn">
                <div class="play-pulse"></div>
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
        </a>

        <div class="channel-info">
            <div class="meta-left">
                <h1 class="channel-title">Sony TV HD</h1>
                <div class="status-badge"><span class="status-dot"></span> Live Stream Available</div>
            </div>
        </div>
    </div>

    <div id="fallback">
        <h2>Mobile Device Required</h2>
        <p>Please open this link on Android or iOS to launch the stream configuration hub.</p>
    </div>

<script>
(function() {
    function isAllowedDevice() {
        return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent || navigator.vendor || window.opera);
    }
    if (!isAllowedDevice()) {
        document.addEventListener("DOMContentLoaded", function() {
            const wrapper = document.getElementById('playerWrapper');
            const fallback = document.getElementById('fallback');
            if (wrapper) wrapper.remove();
            if (fallback) fallback.style.display = 'block';
        });
    }
})();
</script>
</body>
</html>
