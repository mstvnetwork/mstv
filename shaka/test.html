<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Embedded Player</title>
    <!-- Shaka Player UI library & CSS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        .player-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
        }
        #channel-info {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
            display: none;
        }
        #error-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(220, 53, 69, 0.9);
            color: #fff;
            padding: 15px 25px;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
            z-index: 101;
            display: none;
            max-width: 80%;
        }
    </style>
</head>
<body>

<!-- Auto-bind container using data-shaka-player-container -->
<div class="player-container" data-shaka-player-container>
    <div id="channel-info">Loading...</div>
    <div id="error-banner"></div>
    <!-- Auto-bind video using data-shaka-player -->
    <video data-shaka-player id="video" muted playsinline></video>
</div>

<script>
const CHANNELS = [
    {
        "name": "Tears of Steel (Public HLS Stream)",
        "type": "hls",
        "url": "https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8",
        "headers": {},
        "drm": {}
    },
    {
        "name": "Angel One (Public DASH Stream)",
        "type": "dash",
        "url": "https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd",
        "headers": {},
        "drm": {}
    }
];

let player;
let ui;

async function initPlayer() {
    // Install polyfills
    shaka.polyfill.installAll();

    if (!shaka.Player.isBrowserSupported()) {
        showError('Browser does not support Shaka Player.');
        return;
    }

    // Wait for Shaka's declarative UI system to load automatically
    document.addEventListener('shaka-ui-loaded', onUiLoaded);
    // Fallback if shaka-ui-loaded already fired
    if (window['shaka-ui']) {
        onUiLoaded();
    }
}

async function onUiLoaded() {
    const video = document.getElementById('video');
    const container = document.querySelector('[data-shaka-player-container]');
    
    // Obtain instance created automatically by data-shaka-player attributes
    ui = container['ui'];
    player = ui.getControls().getPlayer();

    // Register Networking Filter for headers
    player.getNetworkingEngine().registerRequestFilter((type, request) => {
        const channel = CHANNELS[getChannelIndexFromHash()];
        if (channel && channel.headers) {
            for (const [key, value] of Object.entries(channel.headers)) {
                request.headers[key] = value;
            }
        }
    });

    player.addEventListener('error', (event) => {
        console.error('Shaka Error Code:', event.detail.code, event.detail);
        showError(`Playback Error (Code: ${event.detail.code})`);
    });

    await loadChannelFromHash();
    window.addEventListener('hashchange', loadChannelFromHash);
}

function getChannelIndexFromHash() {
    const hash = window.location.hash.replace('#', '');
    const index = parseInt(hash, 10);
    if (!isNaN(index) && index > 0 && index <= CHANNELS.length) {
        return index - 1;
    }
    return 0; // Default to channel 1
}

function showError(msg) {
    const errBanner = document.getElementById('error-banner');
    errBanner.innerText = msg;
    errBanner.style.display = 'block';
}

function hideError() {
    const errBanner = document.getElementById('error-banner');
    errBanner.style.display = 'none';
}

async function loadChannelFromHash() {
    if (!player) return;
    
    hideError();
    const index = getChannelIndexFromHash();
    const channel = CHANNELS[index];

    if (!channel) {
        showError('Channel not found');
        return;
    }

    const infoBox = document.getElementById('channel-info');
    infoBox.innerText = `[#${index + 1}] ${channel.name}`;
    infoBox.style.display = 'block';

    // Configure ClearKey DRM safely
    const drmConfig = { clearKeys: {} };
    if (channel.drm && Object.keys(channel.drm).length > 0) {
        drmConfig.clearKeys = channel.drm;
    }

    player.configure({ 
        drm: drmConfig,
        manifest: {
            dash: {
                ignoreMinBufferTime: true
            }
        }
    });

    try {
        // Shaka UI handles unloading automatically when load() is called on the UI player
        await player.load(channel.url);
        const video = document.getElementById('video');
        await video.play();
    } catch (error) {
        if (error.name !== 'AbortError' && error.code !== 7000) {
            console.error(`Failed to load ${channel.name}:`, error);
        }
    }
}

document.addEventListener('DOMContentLoaded', initPlayer);
</script>

</body>
</html>
