<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Embedded Player</title>
    <!-- Shaka Player UI library and CSS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        .player-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
        }
        #channel-info {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
            display: none;
        }
        #error-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(220, 53, 69, 0.9);
            color: #fff;
            padding: 15px 25px;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
            z-index: 101;
            display: none;
            max-width: 80%;
        }
    </style>
</head>
<body>

<div class="player-container" id="container" data-shaka-player-container>
    <div id="channel-info">Loading...</div>
    <div id="error-banner"></div>
    <video data-shaka-player id="video" muted playsinline></video>
</div>

<script>
// Paste your output JSON generated by the Python script here
const CHANNELS = [
    {
        "name": "ABC Cartoons (ClearKey DRM Example)",
        "type": "dash",
        "url": "https://abc-iview-mediapackagestreams-1.akamaized.net/out/v1/399aa25b71e84ab19a7d3261703c4a29/index.mpd",
        "headers": {},
        "drm": {
            "aec51cf82ef14226a097a4ff91b7b32e": "652bcaec397fb789fa5138fd3461333c"
        }
    },
    {
        "name": "Star Sports 1 (Referrer Header Example)",
        "type": "hls",
        "url": "https://cdn7.zohanayaan.com:1686/hls/star1in.m3u8?md5=qDL0OZL9QuPu2aS0c2AW2w&expires=1785178226",
        "headers": {
            "Referer": "https://executeandship.com/"
        },
        "drm": {}
    }
];

let player;
let ui;

async function initPlayer() {
    shaka.polyfill.installAll();

    if (!shaka.Player.isBrowserSupported()) {
        showError('Browser does not support Shaka Player.');
        return;
    }

    const video = document.getElementById('video');
    const container = document.getElementById('container');
    
    ui = new shaka.ui.Overlay(new shaka.Player(video), container, video);
    player = ui.getControls().getPlayer();

    // Register Networking Filter for Custom Headers
    player.getNetworkingEngine().registerRequestFilter((type, request) => {
        const channel = CHANNELS[getChannelIndexFromHash()];
        if (channel && channel.headers) {
            for (const [key, value] of Object.entries(channel.headers)) {
                request.headers[key] = value;
            }
        }
    });

    player.addEventListener('error', (event) => {
        console.error('Shaka Error Code:', event.detail.code, event.detail);
        showError(`Playback Error (Code: ${event.detail.code})`);
    });

    await loadChannelFromHash();
    window.addEventListener('hashchange', loadChannelFromHash);
}

function getChannelIndexFromHash() {
    const hash = window.location.hash.replace('#', '');
    const index = parseInt(hash, 10);
    if (!isNaN(index) && index > 0 && index <= CHANNELS.length) {
        return index - 1;
    }
    return 0; // Default to channel 1
}

function showError(msg) {
    const errBanner = document.getElementById('error-banner');
    errBanner.innerText = msg;
    errBanner.style.display = 'block';
}

function hideError() {
    const errBanner = document.getElementById('error-banner');
    errBanner.style.display = 'none';
}

async function loadChannelFromHash() {
    hideError();
    const index = getChannelIndexFromHash();
    const channel = CHANNELS[index];

    if (!channel) {
        showError('Channel not found');
        return;
    }

    const infoBox = document.getElementById('channel-info');
    infoBox.innerText = `[#${index + 1}] ${channel.name}`;
    infoBox.style.display = 'block';

    try {
        await player.unload();
    } catch (e) {}

    // Configure ClearKey DRM if keys exist
    const drmConfig = { clearKeys: {} };
    if (channel.drm && Object.keys(channel.drm).length > 0) {
        drmConfig.clearKeys = channel.drm;
    }

    player.configure({ drm: drmConfig });

    try {
        await player.load(channel.url);
        const video = document.getElementById('video');
        await video.play();
    } catch (error) {
        if (error.name !== 'AbortError') {
            console.error(`Failed to load ${channel.name}:`, error);
        }
    }
}

document.addEventListener('DOMContentLoaded', initPlayer);
</script>

</body>
</html>
