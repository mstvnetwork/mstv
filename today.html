<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed MP4 Player No Scrollbar</title>
    <style>
        /* 1. Prevent the web page itself from showing scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Removes browser scrollbars */
            background-color: #000; /* Optional: Black background */
        }

        /* 2. Container that perfectly sizes the video area */
        .video-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }

        /* 3. The video player styling */
        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Change to 'contain' if you don't want the video cropped */
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- 
          To completely remove the video timeline scrollbar:
          DO NOT include the 'controls' attribute inside this video tag.
        -->
        <video autoplay loop muted playsinline>
            <source src="https://ia600100.us.archive.org/16/items/cooking_202606/nagin.mp4?cnt=0" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

</body>
</html>
