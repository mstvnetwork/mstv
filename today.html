<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Global Linear TV</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        .player-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        video {
            width: 100%;
            display: block;
        }
        /* Completely blocks mouse clicks/taps on the video timeline scrubber */
        .video-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: transparent;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            background: #e50914;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #b81d24; }
        .schedule-box {
            margin-top: 25px;
            background: #222;
            padding: 15px;
            border-radius: 6px;
        }
        .schedule-title {
            font-size: 18px;
            margin-top: 0;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
        }
        .program-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }
        .program-item.active {
            color: #2ecc71;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align: center;">🎬 My Synchronized TV Channel</h1>
    
    <div class="player-wrapper">
        <div class="video-shield" id="shield"></div>
        <video id="tvPlayer" playsinline>
            Your browser does not support HTML5 video.
        </video>
    </div>

    <div class="controls">
        <button id="playBtn">📺 TUNE IN LIVE</button>
        <button id="muteBtn" style="background: #555;">🔊 MUTE / UNMUTE</button>
    </div>

    <div class="schedule-box">
        <h3 class="schedule-title">📅 TV Guide / Schedule</h3>
        <div id="scheduleList"></div>
    </div>
</div>

<script>
// ============================================================================
// 1. CHANNELS PLAYLIST CONFIGURATION
// ============================================================================
// - Add as many movies as you want here.
// - timeSlot: Use 24-hour time format ("HH:MM").
// - duration: Match the exact length of the video file in seconds.
const PLAYLIST = [
    { 
        name: "Movie Slot 1",   
        timeSlot: "00:00", 
        duration: 7200, // 2 Hours long
        url: "https://github.com/mstvnetwork/mstv/releases/download/v1.0.0/nagin.mp4" 
    },
    { 
        name: "Movie Slot 2 (GitHub Hosted)",   
        timeSlot: "02:00", 
        duration: 5400, // 1.5 Hours long
        url: "https://github.com/mstvnetwork/mstv/releases/download/v1.0.0/nagin.mp4" 
    },
    { 
        name: "Movie Slot 3",   
        timeSlot: "03:30", 
        duration: 3600, // 1 Hour long
        url: "https://github.com/mstvnetwork/mstv/releases/download/v1.0.0/nagin.mp4" 
    }
    // You can paste 20+ movies down here following this identical layout pattern
];

const player = document.getElementById('tvPlayer');
const playBtn = document.getElementById('playBtn');
const muteBtn = document.getElementById('muteBtn');
const scheduleList = document.getElementById('scheduleList');

let currentActiveIndex = -1;

// ============================================================================
// 2. TIMING & ENGINE ENGINE
// ============================================================================
function getSecondsSinceMidnight() {
    const now = new Date();
    return (now.getHours() * 3600) + (now.getMinutes() * 60) + now.getSeconds();
}

function timeToSeconds(timeStr) {
    const [hours, minutes] = timeStr.split(':').map(Number);
    return (hours * 3600) + (minutes * 60);
}

function syncBroadcast() {
    const nowInSeconds = getSecondsSinceMidnight();
    let activeVideo = null;
    let activeIndex = -1;

    // Detect which item matches the user's active device clock time
    for (let i = 0; i < PLAYLIST.length; i++) {
        const slotStart = timeToSeconds(PLAYLIST[i].timeSlot);
        const slotEnd = slotStart + PLAYLIST[i].duration;

        if (nowInSeconds >= slotStart && nowInSeconds < slotEnd) {
            activeVideo = PLAYLIST[i];
            activeIndex = i;
            break;
        }
    }

    // Loop fallback: default to item 0 if timeline parameters exceed schedule configurations
    if (!activeVideo && PLAYLIST.length > 0) {
        activeVideo = PLAYLIST[0];
        activeIndex = 0;
    }

    if (activeVideo) {
        const slotStartSeconds = timeToSeconds(activeVideo.timeSlot);
        const targetTime = nowInSeconds - slotStartSeconds;

        // Change video track source only when hitting a new schedule time block
        if (player.src !== activeVideo.url) {
            player.src = activeVideo.url;
            player.currentTime = targetTime;
            player.play().catch(() => { console.log("Autoplay paused. Manual user interface input required."); });
        } else {
            // ANTI-CHEAT LOCK: Reverts timeline manipulation instantaneously back to live stream frame
            if (Math.abs(player.currentTime - targetTime) > 1.5) {
                player.currentTime = targetTime;
            }
        }
        
        if (activeIndex !== currentActiveIndex) {
            currentActiveIndex = activeIndex;
            renderSchedule(activeIndex);
        }
    }
}

// ============================================================================
// 3. SECURITY & INTERACTION INTERCEPTORS
// ============================================================================
// Scans video sync state tightly every 250 milliseconds
setInterval(syncBroadcast, 250);

player.addEventListener('seeking', () => syncBroadcast());
player.addEventListener('play', () => syncBroadcast());

// Blocks standard browser right-click diagnostic panels from revealing video URLs
document.getElementById('shield').addEventListener('contextmenu', e => e.preventDefault());

// ============================================================================
// 4. USER INTERFACE EVENTS
// ============================================================================
playBtn.addEventListener('click', () => {
    syncBroadcast();
    player.play();
    playBtn.innerText = "📺 LIVE AND SYNCED";
});

muteBtn.addEventListener('click', () => {
    player.muted = !player.muted;
});

function renderSchedule(activeIndex) {
    scheduleList.innerHTML = "";
    PLAYLIST.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = `program-item ${idx === activeIndex ? 'active' : ''}`;
        div.innerHTML = `
            <span>${idx === activeIndex ? '▶ ' : ''}${item.name}</span>
            <span>${item.timeSlot}</span>
        `;
        scheduleList.appendChild(div);
    });
}

// Initialise the TV Guide UI layout list
renderSchedule(-1);
</script>

</body>
</html>
