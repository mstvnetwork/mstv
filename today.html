<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TV Broadcast Network</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden; font-family: sans-serif;
        }
        .broadcast-container { position: relative; width: 100%; height: 100%; }
        video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 0.4s ease-in-out;
            pointer-events: none; object-fit: cover;
        }
        video.active { opacity: 1; }
        #interactionOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #fff; z-index: 9999; cursor: pointer;
        }
        .play-button {
            padding: 15px 35px; font-size: 1.2rem; font-weight: bold;
            background: #ff3b30; border: none; border-radius: 30px; color: white;
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.4);
        }
    </style>
</head>
<body>

<div id="interactionOverlay">
    <button class="play-button">TUNE IN TO LIVE BROADCAST</button>
    <p style="margin-top: 15px; font-size: 0.9rem; color: #aaa;">Compliance: Click to synchronize linear audio stream</p>
</div>

<div class="broadcast-container">
    <video id="playerA" class="active" autoplay playsinline></video>
    <video id="playerB" autoplay playsinline muted></video>
</div>

<script>
class GlobalTvBroadcast {
    constructor(playerIdA, playerIdB) {
        this.playerA = document.getElementById(playerIdA);
        this.playerB = document.getElementById(playerIdB);
        this.activePlayer = this.playerA;
        this.bufferPlayer = this.playerB;

        this.hlsA = null;
        this.hlsB = null;
        this.activeHls = null;
        this.bufferHls = null;

        this.playlist = [];
        this.totalPlaylistDuration = 0;
        
        this.currentVideoIndex = -1;
        this.targetPlaybackPosition = 0;
        this.isSwapping = false; 

        this.init();
    }

    async init() {
        await this.fetchPlaylistUpdates();
        
        // Listen to tracking events directly
        this.setupPlayerListeners(this.playerA);
        this.setupPlayerListeners(this.playerB);

        // Fetch playlist updates every 30 seconds
        setInterval(() => this.fetchPlaylistUpdates(), 30000);

        // Perform a soft-drift check every 5 seconds (not 1 second, giving plenty of breathing room)
        setInterval(() => this.performSoftDriftCheck(), 5000);
    }

    async fetchPlaylistUpdates() {
        try {
            const response = await fetch(`./playlist500.json?cb=${Date.now()}`);
            const data = await response.json();
            this.playlist = data.playlist;
            this.totalPlaylistDuration = this.playlist.reduce((acc, item) => acc + item.duration, 0);
            console.log("Playlist Sync. Total cycle duration:", this.totalPlaylistDuration);
        } catch (err) {
            console.error("Error updating playlist manifest:", err);
        }
    }

    calculateGlobalTimeline() {
        if (this.totalPlaylistDuration === 0) return null;
        const currentGlobalSeconds = Math.floor(Date.now() / 1000);
        let remainderTime = currentGlobalSeconds % this.totalPlaylistDuration;

        let accumulatedTime = 0;
        for (let i = 0; i < this.playlist.length; i++) {
            const video = this.playlist[i];
            if (remainderTime >= accumulatedTime && remainderTime < (accumulatedTime + video.duration)) {
                return { index: i, seekTo: remainderTime - accumulatedTime, url: video.url };
            }
            accumulatedTime += video.duration;
        }
        return null;
    }

    // Fired manually when user clicks "Tune In" to sync them up perfectly with the global timeline
    syncToGlobalTimeline() {
        const state = this.calculateGlobalTimeline();
        if (!state) return;

        this.currentVideoIndex = state.index;
        this.targetPlaybackPosition = state.seekTo;

        console.log(`Initial Tune-in Event -> Index: ${state.index} at ${state.seekTo}s`);
        
        if (this.activeHls) this.activeHls.destroy();
        this.activePlayer.muted = false;
        
        this.activeHls = this.loadHlsStream(this.activePlayer, state.url);
        
        const syncOnLoad = () => {
            this.activePlayer.currentTime = state.seekTo;
            this.activePlayer.play().catch(() => {});
            this.activePlayer.removeEventListener('loadedmetadata', syncOnLoad);
            
            // Immediately start loading the next video safely in the background
            this.preloadUpcomingSequencedItem();
        };
        this.activePlayer.addEventListener('loadedmetadata', syncOnLoad);
    }

    setupPlayerListeners(player) {
        // Natural end of track triggers the transition
        player.addEventListener('ended', () => {
            if (player !== this.activePlayer || this.isSwapping) return;
            this.handleTrackEnded();
        });

        // Anti-Scrubbing Protocol
        player.addEventListener('seeking', () => {
            if (player !== this.activePlayer || this.isSwapping) return;
            
            const state = this.calculateGlobalTimeline();
            if (!state) return;

            const variance = Math.abs(player.currentTime - state.seekTo);
            // If the user tries to scrub or skip out of sync by more than 3 seconds, snap them back
            if (variance > 3) {
                console.warn("Anti-scrub triggered. Snapping back to broadcast time.");
                player.currentTime = state.seekTo;
            }
        });
    }

    handleTrackEnded() {
        this.isSwapping = true;
        
        const oldActive = this.activePlayer;
        const newActive = this.bufferPlayer;

        console.log("Track finished naturally. Transitioning to pre-buffered stream...");

        // Unmute the preloaded player
        if (document.getElementById('interactionOverlay').style.display === 'none') {
            newActive.muted = false;
        }

        newActive.play().then(() => {
            // Visual swap
            newActive.classList.add('active');
            oldActive.classList.remove('active');
            oldActive.pause();

            // Swap player identities
            this.activePlayer = newActive;
            this.bufferPlayer = oldActive;

            const tempHls = this.activeHls;
            this.activeHls = this.bufferHls;
            this.bufferHls = tempHls;

            // Increment index
            this.currentVideoIndex = (this.currentVideoIndex + 1) % this.playlist.length;
            this.isSwapping = false;

            // Buffer the next track in line
            this.preloadUpcomingSequencedItem();
        }).catch(err => {
            console.error("Seamless swap transition failed, falling back to clean resync:", err);
            this.isSwapping = false;
            this.syncToGlobalTimeline();
        });
    }

    preloadUpcomingSequencedItem() {
        if (this.playlist.length <= 1) return;

        const nextIndex = (this.currentVideoIndex + 1) % this.playlist.length;
        const nextVideo = this.playlist[nextIndex];
        
        if (this.bufferHls) this.bufferHls.destroy();
        
        this.bufferPlayer.muted = true;
        this.bufferHls = this.loadHlsStream(this.bufferPlayer, nextVideo.url);
        this.bufferPlayer.load();
        
        console.log(`Background buffering sequence established for Index: ${nextIndex}`);
    }

    performSoftDriftCheck() {
        // Only run drift checks if the player is healthy, actively playing, and not transitioning
        if (this.isSwapping || this.activePlayer.paused || this.activePlayer.readyState < 2) return;

        const state = this.calculateGlobalTimeline();
        if (!state || state.index !== this.currentVideoIndex) return;

        const drift = Math.abs(this.activePlayer.currentTime - state.seekTo);
        // Generous 8-second window. Only intervenes if the stream hits an extreme network stall.
        if (drift > 8) {
            console.warn(`Severe stream drift detected (${drift.toFixed(2)}s). Resynced.`);
            this.activePlayer.currentTime = state.seekTo;
        }
    }

    loadHlsStream(player, url) {
        if (player.canPlayType('application/vnd.apple.mpegurl')) {
            player.src = url;
            return null;
        } else if (Hls.isSupported()) {
            const hls = new Hls({ maxBufferLength: 15 });
            hls.attachMedia(player);
            hls.on(Hls.Events.MEDIA_ATTACHED, () => hls.loadSource(url));
            return hls;
        }
        return null;
    }
}

const broadcastManager = new GlobalTvBroadcast('playerA', 'playerB');

document.getElementById('interactionOverlay').addEventListener('click', function() {
    this.style.display = 'none';
    broadcastManager.syncToGlobalTimeline();
});
</script>
</body>
</html>
