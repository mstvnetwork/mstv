<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Looping IST TV Station</title>
    
    <!-- FIX: Swapped to a highly reliable Cloudflare CDN for HLS.js -->
    <script src="https://cloudflare.com"></script>
    
    <style>
        body { margin: 0; background-color: #000; color: #fff; font-family: Arial, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
        .video-container { position: relative; width: 80%; max-width: 800px; aspect-ratio: 16 / 9; background: #111; }
        video { width: 100%; height: 100%; }
        .status-overlay { position: absolute; top: 20px; left: 20px; background: rgba(0, 0, 0, 0.7); padding: 10px 15px; border-radius: 5px; font-size: 14px; pointer-events: none; }
        .live-indicator { display: inline-block; width: 10px; height: 10px; background-color: #ff0000; border-radius: 50%; margin-right: 5px; }
    </style>
</head>
<body>

<div class="video-container">
    <video id="live-player" playsinline muted></video>
    <div class="status-overlay">
        <span class="live-indicator"></span> LIVE LOOP (IST): <span id="stream-info">Loading...</span>
    </div>
</div>

<script>
    // Corrected schedule matching current India Time (approx 21:32 IST)
    const schedule = [
        {
            title: "Midnight Madness Show",
            url: "https://amg01550-indiatv-indiatv-aapkiadalat-mi-xiaomi-n5tuk.amagi.tv/playlist/amg01550-indiatv-indiatv-aapkiadalat-mi-xiaomi/playlist.m3u8",
            start: "21:00:00", 
            end: "22:50:00"
        },
        {
            title: "Late Night Backup Stream",
            url: "https://mux.dev",
            start: "22:50:00",
            end: "23:59:59"
        }
    ];

    const video = document.getElementById('live-player');
    const streamInfo = document.getElementById('stream-info');
    let currentStreamUrl = "";
    let targetPlaybackPosition = 0;
    let hls = null;

    function timeStringToSeconds(timeStr) {
        const parts = timeStr.split(':');
        return (parseInt(parts[0], 10) * 3600) + (parseInt(parts[1], 10) * 60) + parseInt(parts[2], 10);
    }

    function syncPlayerToSchedule() {
        // Double-check if library failed to load entirely
        if (typeof Hls === 'undefined') {
            streamInfo.innerText = "Error: HLS Engine Failed to Load";
            return;
        }

        const now = new Date();
        const istString = now.toLocaleString("en-US", { timeZone: "Asia/Kolkata", hour12: false });
        const timeParts = istString.split(', ');
        if(!timeParts[1]) return;
        
        const currentSecondsInDay = timeStringToSeconds(timeParts[1]);
        let activeVideo = null;

        for (let item of schedule) {
            const startSec = timeStringToSeconds(item.start);
            const endSec = timeStringToSeconds(item.end);

            if (currentSecondsInDay >= startSec && currentSecondsInDay < endSec) {
                activeVideo = item;
                targetPlaybackPosition = currentSecondsInDay - startSec;
                break;
            }
        }

        if (!activeVideo) {
            streamInfo.innerText = "Intermission";
            video.pause();
            return;
        }

        streamInfo.innerText = activeVideo.title;

        if (currentStreamUrl !== activeVideo.url) {
            currentStreamUrl = activeVideo.url;
            loadStream(currentStreamUrl);
        } else {
            if (Math.abs(video.currentTime - targetPlaybackPosition) > 2) {
                video.currentTime = targetPlaybackPosition;
            }
        }
    }

    function loadStream(url) {
        if (Hls.isSupported()) {
            if (hls) hls.destroy();
            
            hls = new Hls({ maxMaxBufferLength: 10 });
            hls.loadSource(url);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.currentTime = targetPlaybackPosition;
                video.play().catch(err => console.log("Click the screen to unmute audio."));
            });
            
            // Log networking errors to console to verify geo-blocks
            hls.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                    console.log("HLS Error Encountered:", data.type);
                }
            });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.addEventListener('loadedmetadata', function() {
                video.currentTime = targetPlaybackPosition;
                video.play().catch(err => console.log("Click the screen to unmute audio."));
            });
        }
    }

    video.addEventListener('seeking', () => {
        if (Math.abs(video.currentTime - targetPlaybackPosition) > 1.5) {
            video.currentTime = targetPlaybackPosition;
        }
    });

    document.body.addEventListener('click', () => {
        if (video.muted) video.muted = false;
    });

    setInterval(syncPlayerToSchedule, 1000);
    syncPlayerToSchedule();
</script>

</body>
</html>
