<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TV Broadcast Network</title>
    <!-- Include hls.js Engine via official jsDelivr CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* Force true television screen formatting */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: sans-serif;
        }
        .broadcast-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        /* No pointer events means users cannot right-click or tap to show native controls */
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
            pointer-events: none; 
            object-fit: cover;
        }
        video.active {
            opacity: 1;
        }
        /* Click-to-unmute screen overlay for browser security compliance */
        #interactionOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 9999;
            cursor: pointer;
        }
        .play-button {
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            background: #ff3b30;
            border: none;
            border-radius: 30px;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.4);
        }
    </style>
</head>
<body>

<div id="interactionOverlay">
    <button class="play-button">TUNE IN TO LIVE BROADCAST</button>
    <p style="margin-top: 15px; font-size: 0.9rem; color: #aaa;">Compliance: Click to synchronize linear audio stream</p>
</div>

<div class="broadcast-container">
    <!-- Notice 'controls' attribute is strictly omitted -->
    <video id="playerA" class="active" autoplay playsinline></video>
    <video id="playerB" autoplay playsinline muted></video>
</div>

<script>
class GlobalTvBroadcast {
    constructor(playerIdA, playerIdB) {
        this.playerA = document.getElementById(playerIdA);
        this.playerB = document.getElementById(playerIdB);
        this.activePlayer = this.playerA;
        this.bufferPlayer = this.playerB;

        this.hlsA = null;
        this.hlsB = null;
        this.activeHls = null;
        this.bufferHls = null;

        this.playlist = [];
        this.totalPlaylistDuration = 0;
        
        this.currentVideoIndex = -1;
        this.targetPlaybackPosition = 0;
        this.isLocked = false;

        this.init();
    }

    async init() {
        await this.fetchPlaylistUpdates();
        this.setupEnforcementListeners(this.playerA);
        this.setupEnforcementListeners(this.playerB);

        // Start long-polling interval to check for json manifest alterations every 30 seconds
        setInterval(() => this.fetchPlaylistUpdates(), 30000);

        // Continuous sync loop running on an animation frame loop
        this.startGlobalSyncLoop();
    }

    async fetchPlaylistUpdates() {
        try {
            // Append a timestamp cache-buster to prevent GitHub CDN from serving stale JSON files
            const response = await fetch(`./playlist500.json?cb=${Date.now()}`);
            const data = await response.json();
            
            this.playlist = data.playlist;
            this.totalPlaylistDuration = this.playlist.reduce((acc, item) => acc + item.duration, 0);
            console.log("Synchronized fresh playlist manifest. Total cycle duration:", this.totalPlaylistDuration);
        } catch (err) {
            console.error("Failed downloading playlist structure updates:", err);
        }
    }

    calculateGlobalTimeline() {
        if (this.totalPlaylistDuration === 0) return null;

        // Determine current Unix global epoch time in seconds
        const currentGlobalSeconds = Math.floor(Date.now() / 1000);
        
        // Find exactly where we are inside the infinite repeating loop window
        let remainderTime = currentGlobalSeconds % this.totalPlaylistDuration;

        let accumulatedTime = 0;
        for (let i = 0; i < this.playlist.length; i++) {
            const video = this.playlist[i];
            if (remainderTime >= accumulatedTime && remainderTime < (accumulatedTime + video.duration)) {
                return {
                    index: i,
                    seekTo: remainderTime - accumulatedTime,
                    url: video.url
                };
            }
            accumulatedTime += video.duration;
        }
        return null;
    }

    startGlobalSyncLoop() {
        const tick = () => {
            const state = this.calculateGlobalTimeline();
            if (!state) {
                requestAnimationFrame(tick);
                return;
            }

            // Scenario 1: Initial load or playlist item incremented globally
            if (this.currentVideoIndex !== state.index) {
                this.currentVideoIndex = state.index;
                this.targetPlaybackPosition = state.seekTo;
                this.transitionToGlobalTrack(state);
            } else {
                // Keep keeping track of where the timestamp expects us to be
                this.targetPlaybackPosition = state.seekTo;
            }
            requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
    }

    transitionToGlobalTrack(state) {
        this.isLocked = true;
        console.log(`Global Channel Change -> Track Index: ${state.index}. Sync position: ${state.seekTo}s`);

        // Destroy whatever pipeline was previously occupying our background playback engine
        if (this.bufferHls) this.bufferHls.destroy();

        // Bind next stream state directly into the background player
        this.bufferPlayer.muted = true;
        this.bufferHls = this.loadHlsStream(this.bufferPlayer, state.url);

        // Wait exactly until media parsing completes, jump to global time, and execute swap
        const onMetadata = () => {
            this.bufferPlayer.currentTime = state.seekTo;
            
            this.bufferPlayer.play().then(() => {
                this.executeSeamlessSwap();
                this.bufferPlayer.removeEventListener('loadedmetadata', onMetadata);
            }).catch(e => {
                // If browser blocks, force swap anyway (likely requires audio context interaction click)
                this.executeSeamlessSwap();
                this.bufferPlayer.removeEventListener('loadedmetadata', onMetadata);
            });
        };

        this.bufferPlayer.addEventListener('loadedmetadata', onMetadata);
    }

    executeSeamlessSwap() {
        const oldActive = this.activePlayer;
        const newActive = this.bufferPlayer;

        // Synchronize volumes smoothly
        if (document.getElementById('interactionOverlay').style.display === 'none') {
            newActive.muted = false;
        }

        newActive.classList.add('active');
        oldActive.classList.remove('active');
        oldActive.pause();

        this.activePlayer = newActive;
        this.bufferPlayer = oldActive;

        const tempHls = this.activeHls;
        this.activeHls = this.bufferHls;
        this.bufferHls = tempHls;

        this.isLocked = false;
        
        // Quietly start caching the upcoming chronological item 
        this.preloadUpcomingSequencedItem();
    }

    preloadUpcomingSequencedItem() {
        const nextIndex = (this.currentVideoIndex + 1) % this.playlist.length;
        const nextVideo = this.playlist[nextIndex];
        
        if (this.bufferHls) this.bufferHls.destroy();
        this.bufferHls = this.loadHlsStream(this.bufferPlayer, nextVideo.url);
        this.bufferPlayer.muted = true;
        this.bufferPlayer.load();
        console.log(`Background pipeline preloading upcoming block: Index ${nextIndex}`);
    }

    loadHlsStream(player, url) {
        if (player.canPlayType('application/vnd.apple.mpegurl')) {
            player.src = url;
            return null;
        } else if (Hls.isSupported()) {
            const hls = new Hls({ maxBufferLength: 20 });
            hls.attachMedia(player);
            hls.on(Hls.Events.MEDIA_ATTACHED, () => hls.loadSource(url));
            return hls;
        }
        return null;
    }

    setupEnforcementListeners(player) {
        // ANTI-SCRUBBING PROTOCOL: 
        // Checks if user attempts manual timeline hijacking (via keyboard shortcuts or hardware commands)
        player.addEventListener('seeking', () => {
            if (this.isLocked) return;
            
            // Allow small 2-second variances due to frame rendering discrepancies
            if (Math.abs(player.currentTime - this.targetPlaybackPosition) > 2) {
                console.warn("Timeline disruption detected! Reverting to absolute global broadcast feed time...");
                player.currentTime = this.targetPlaybackPosition;
            }
        });
    }

    unmuteBroadcast() {
        this.activePlayer.muted = false;
        this.bufferPlayer.muted = true;
        // Make double sure video execution is firing
        this.activePlayer.play().catch(() => {});
    }
}

// Instantiate engine setup
const broadcastManager = new GlobalTvBroadcast('playerA', 'playerB');

// Handle the user interaction requirement
document.getElementById('interactionOverlay').addEventListener('click', function() {
    this.style.display = 'none';
// Unmute the synchronized audio track
    broadcastManager.unmuteBroadcast();
});
</script>
</body>
</html>
