<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Global Linear TV</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        
        /* Modern Video Player Wrapper */
        .player-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        video {
            width: 100%;
            display: block;
        }
        
        /* Professional Text Channel Logo Overlay */
        .channel-logo {
            position: absolute;
            top: 20px;
            right: 25px;
            z-index: 8;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.75);
            text-transform: uppercase;
            font-family: 'Impact', 'Arial Black', sans-serif;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8), 
                         -1px -1px 0 rgba(0, 0, 0, 0.4), 
                         1px -1px 0 rgba(0, 0, 0, 0.4), 
                         -1px 1px 0 rgba(0, 0, 0, 0.4), 
                         1px 1px 0 rgba(0, 0, 0, 0.4);
            pointer-events: none; /* Prevents users from clicking on or dragging the logo text */
            user-select: none;
            animation: watermarkPulse 4s ease-in-out infinite;
        }

        /* Gentle pulse to mimic real television broadcast watermarks */
        @keyframes watermarkPulse {
            0% { opacity: 0.7; }
            50% { opacity: 0.85; }
            100% { opacity: 0.7; }
        }
        
        /* Invisible shield blocks mouse scrubbing on the video canvas area */
        .video-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 50px);
            z-index: 5;
            background: transparent;
        }

        /* Premium Modern Control Bar Layout (No Scrollbar) */
        .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.4));
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            box-sizing: border-box;
            z-index: 10;
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        
        /* Left and Right grouping blocks */
        .control-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Custom Interactive Buttons */
        .control-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease, transform 0.1s ease;
        }
        .control-btn:hover { color: #e50914; }
        .control-btn:active { transform: scale(0.9); }
        .control-btn svg { width: 22px; height: 22px; fill: currentColor; }

        /* Custom Range Slider for Volume Control */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 70px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.3);
            outline: none;
            cursor: pointer;
            transition: width 0.2s ease;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .volume-slider::-webkit-slider-thumb:hover { background: #e50914; }
        
        /* Sleek Live Indicator Badge */
        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            background: rgba(255,255,255,0.1);
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .live-dot {
            width: 6px;
            height: 6px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 8px #2ecc71;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* Schedule / TV Guide Blocks */
        .schedule-box {
            margin-top: 25px;
            background: #222;
            padding: 15px;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
        }
        .schedule-title {
            font-size: 18px;
            margin-top: 0;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
        }
        .program-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }
        .program-item.active {
            color: #2ecc71;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align: center;">🎬 MS TV Network</h1>
    
    <div class="player-wrapper" id="videoContainer">
        <!-- Text Channel Logo Watermark (Top Right Corner) -->
        <div class="channel-logo">Apna Tv</div>

        <!-- Invisible safety screen shield blocks clicks to the actual video track -->
        <div class="video-shield" id="shield"></div>
        
        <!-- HTML5 Player Backbone Element with Instant Initialisation Setup -->
        <video id="tvPlayer" autoplay muted playsinline>
            Your browser does not support HTML5 video.
        </video>

        <!-- Custom Graphical Interface Engine Bar Layout -->
        <div class="custom-controls" id="controlsBar">
            <!-- Left Side Control Block -->
            <div class="control-group">
                <!-- Play/Pause Toggle Switch Trigger -->
                <button class="control-btn" id="playPauseBtn" title="Play/Pause">
                    <svg id="playPauseIcon" viewBox="0 0 24 24">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>

                <!-- Interactive Volume Component Structure -->
                <div class="volume-container">
                    <button class="control-btn" id="muteBtn" title="Mute/Unmute">
                        <svg id="volumeIcon" viewBox="0 0 24 24">
                            <path id="volIconPath" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                        </svg>
                    </button>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0">
                </div>

                <!-- Live Indicator Tracking Elements -->
                <div class="live-badge">
                    <div class="live-dot"></div>
                    <span>Live</span>
                </div>
            </div>

            <!-- Right Side Control Block -->
            <div class="control-group">
                <!-- True Screen Canvas Scaling Action Button -->
                <button class="control-btn" id="fullscreenBtn" title="Fullscreen">
                    <svg viewBox="0 0 24 24">
                        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div class="schedule-box">
        <h3 class="schedule-title">📅 Live TV Schedule</h3>
        <div id="scheduleList"></div>
    </div>
</div>

<script>
// ============================================================================
// 1. PLAYLIST TRACK SCHEDULING INTERFACES
// ============================================================================
const PLAYLIST = [
    { 
        name: "Movie Slot 1",   
        timeSlot: "03:00", 
        duration: 7200, // 2 Hours long
        url: "https://github.com/mstvnetwork/mstv/releases/download/v1.0.0/nagin.mp4" 
    },
    { 
        name: "Movie Slot 2 (GitHub Hosted)",   
        timeSlot: "05:00", 
        duration: 5400, // 1.5 Hours long
        url: "https://github.com/mstvnetwork/mstv/releases/download/v1.0.0/nagin.mp4" 
    },
    { 
        name: "Movie Slot 3",   
        timeSlot: "06:30", 
        duration: 3600, // 1 Hour long
        url: "https://github.com/mstvnetwork/mstv/releases/download/v1.0.0/nagin.mp4" 
    }
    // You can paste 20+ movies down here following this identical layout pattern
];

const player = document.getElementById('tvPlayer');
const videoContainer = document.getElementById('videoContainer');
const playPauseBtn = document.getElementById('playPauseBtn');
const playPauseIcon = document.getElementById('playPauseIcon');
const muteBtn = document.getElementById('muteBtn');
const volIconPath = document.getElementById('volIconPath');
const volumeSlider = document.getElementById('volumeSlider');
const fullscreenBtn = document.getElementById('fullscreenBtn');

let currentActiveIndex = -1;

const SVG_PAUSE = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";
const SVG_PLAY = "M8 5v14l11-7z";

const SVG_MUTED = "M4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71z";
const SVG_UNMUTED = "M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z";
// ============================================================================
// 2. SYNCHRONIZATION ALIGNMENT LOGIC
// ============================================================================
function getSecondsSinceMidnight() {
const now = new Date();
return (now.getHours() * 3600) + (now.getMinutes() * 60) + now.getSeconds();
}
function timeToSeconds(timeStr) {
const [hours, minutes] = timeStr.split(':').map(Number);
return (hours * 3600) + (minutes * 60);
}
function syncBroadcast() {
if (player.paused) return;
const nowInSeconds = getSecondsSinceMidnight();
let activeVideo = null;
let activeIndex = -1;
for (let i = 0; i < PLAYLIST.length; i++) {
const slotStart = timeToSeconds(PLAYLIST[i].timeSlot);
const slotEnd = slotStart + PLAYLIST[i].duration;
if (nowInSeconds >= slotStart && nowInSeconds < slotEnd) {
activeVideo = PLAYLIST[i];
activeIndex = i;
break;
}
}
if (!activeVideo && PLAYLIST.length > 0) {
activeVideo = PLAYLIST;
activeIndex = 0;
}
if (activeVideo) {
const slotStartSeconds = timeToSeconds(activeVideo.timeSlot);
const targetTime = nowInSeconds - slotStartSeconds;
if (player.src !== activeVideo.url) {
player.src = activeVideo.url;
player.currentTime = targetTime;
player.play().catch(e => console.log("Background block handled."));
} else {
if (Math.abs(player.currentTime - targetTime) > 1.5) {
player.currentTime = targetTime;
}
}
if (activeIndex !== currentActiveIndex) {
currentActiveIndex = activeIndex;
renderSchedule(activeIndex);
}
}
}
// ============================================================================
// 3. LIFECYCLE MANAGEMENT INTERACTION CODES
// ============================================================================
window.addEventListener('DOMContentLoaded', () => {
syncBroadcast();
setInterval(syncBroadcast, 250);
});
player.addEventListener('seeking', () => syncBroadcast());
player.addEventListener('play', () => {
playPauseIcon.innerHTML = <path d="${SVG_PAUSE}"/>';
syncBroadcast();
});
player.addEventListener('pause', () => {
playPauseIcon.innerHTML = <path d="${SVG_PLAY}"/>';
});
playPauseBtn.addEventListener('click', () => {
if (player.paused) {
player.play();
} else {
player.pause();
}
});
volumeSlider.addEventListener('input', (e) => {
const val = e.target.value;
player.volume = val;
if (val == 0) {
player.muted = true;
volIconPath.setAttribute('d', SVG_MUTED);
} else {
player.muted = false;
volIconPath.setAttribute('d', SVG_UNMUTED);
}
}); [1] 
muteBtn.addEventListener('click', () => {
player.muted = !player.muted;
if (player.muted) {
volIconPath.setAttribute('d', SVG_MUTED);
volumeSlider.value = 0;
} else {
volIconPath.setAttribute('d', SVG_UNMUTED);
volumeSlider.value = player.volume || 1;
}
});
fullscreenBtn.addEventListener('click', () => {
if (!document.fullscreenElement) {
videoContainer.requestFullscreen().catch(err => {
console.log(Fullscreen error: ${err.message});
});
} else {
document.exitFullscreen();
}
});
document.getElementById('shield').addEventListener('contextmenu', e => e.preventDefault());
function renderSchedule(activeIndex) {
const scheduleList = document.getElementById('scheduleList');
scheduleList.innerHTML = "";
PLAYLIST.forEach((item, idx) => {
const div = document.createElement('div');
div.className = program-item ${idx === activeIndex ? 'active' : ''};
div.innerHTML = <span>${idx === activeIndex ? '▶ ' : ''}${item.name}</span> <span>${item.timeSlot}</span>;
scheduleList.appendChild(div);
});
}
</script>

</body>
</html>
