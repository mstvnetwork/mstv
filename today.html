<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Live TV Station (IST Switcher)</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.4/dist/hls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.6.12/dist/plyr.min.js"></script>
    <style>
        body { margin: 0; background-color: #000; color: #fff; font-family: Arial, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
        .video-container { position: relative; width: 80%; max-width: 800px; aspect-ratio: 16 / 9; background: #111; }
        video { width: 100%; height: 100%; }
        .status-overlay { position: absolute; top: 20px; left: 20px; background: rgba(0, 0, 0, 0.7); padding: 10px 15px; border-radius: 5px; font-size: 14px; pointer-events: none; }
        .live-indicator { display: inline-block; width: 10px; height: 10px; background-color: #ff0000; border-radius: 50%; margin-right: 5px; }
    </style>
</head>
<body>

<div class="video-container">
    <!-- No default controls ensures users cannot seek or skip -->
    <video id="live-player" playsinline autoplay muted></video>
    <div class="status-overlay">
        <span class="live-indicator"></span> LIVE (IST): <span id="stream-info">Connecting...</span>
    </div>
</div>

<script>
    // AUTOMATIC IST TIME TEST
    // Setting this slot to match the current time window right now
    const schedule = [
        {
            title: "IndiaTV Aapki Adalat Live",
            url: "https://amg01550-indiatv-indiatv-aapkiadalat-mi-xiaomi-n5tuk.amagi.tv/playlist/amg01550-indiatv-indiatv-aapkiadalat-mi-xiaomi/playlist.m3u8",
            start: "21:00:00", 
            end: "23:59:59"
        }
    ];

    const video = document.getElementById('live-player');
    const streamInfo = document.getElementById('stream-info');
    let currentStreamUrl = "";
    let hls = null;

    function timeStringToSeconds(timeStr) {
        const parts = timeStr.split(':');
        return (parseInt(parts[0], 10) * 3600) + (parseInt(parts[1], 10) * 60) + parseInt(parts[2], 10);
    }

    function syncPlayerToSchedule() {
        if (typeof Hls === 'undefined') {
            streamInfo.innerText = "Error: Player engine missing.";
            return;
        }

        const now = new Date();
        const istString = now.toLocaleString("en-US", { timeZone: "Asia/Kolkata", hour12: false });
        
        // Handle various browser format differences safely
        const timeMatch = istString.match(/\d{2}:\d{2}:\d{2}/);
        if (!timeMatch) return;
        
        const currentSecondsInDay = timeStringToSeconds(timeMatch[0]);
        let activeVideo = null;

        for (let item of schedule) {
            const startSec = timeStringToSeconds(item.start);
            const endSec = timeStringToSeconds(item.end);

            if (currentSecondsInDay >= startSec && currentSecondsInDay < endSec) {
                activeVideo = item;
                break;
            }
        }

        if (!activeVideo) {
            streamInfo.innerText = "Station Offline";
            video.pause();
            return;
        }

        streamInfo.innerText = activeVideo.title;

        // Only switch the channel source if the scheduled slot changes
        if (currentStreamUrl !== activeVideo.url) {
            currentStreamUrl = activeVideo.url;
            loadLiveStream(currentStreamUrl);
        }
    }

    function loadLiveStream(url) {
        if (Hls.isSupported()) {
            if (hls) hls.destroy();
            
            hls = new Hls({
                liveDurationInfinity: true, // Forces player to treat this as an endless live stream
                manifestLoadingMaxRetry: 5
            });
            hls.loadSource(url);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(() => {
                    console.log("Autoplay muted. Awaiting click.");
                });
            });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play().catch(() => {});
        }
    }

    // Unmute player cleanly on the first viewer tap
    document.body.addEventListener('click', () => {
        if (video.muted) {
            video.muted = false;
        }
    });

    // Check schedule match every 2 seconds
    setInterval(syncPlayerToSchedule, 2000);
    syncPlayerToSchedule();
</script>

</body>
</html>
