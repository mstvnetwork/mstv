<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Continuous TV Broadcast</title>
    <!-- Include hls.js Engine via jsDelivr CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden; font-family: sans-serif;
        }
        .broadcast-container { position: relative; width: 100%; height: 100%; }
        video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 0.4s ease-in-out;
            pointer-events: none; object-fit: cover;
        }
        video.active { opacity: 1; pointer-events: auto; }
        #interactionOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #fff; z-index: 9999; cursor: pointer;
        }
        .play-button {
            padding: 15px 35px; font-size: 1.2rem; font-weight: bold;
            background: #ff3b30; border: none; border-radius: 30px; color: white;
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.4);
        }
    </style>
</head>
<body>

<div id="interactionOverlay">
    <button class="play-button">TUNE IN TO LIVE BROADCAST</button>
    <p style="margin-top: 15px; font-size: 0.9rem; color: #aaa;">Click to synchronise linear stream audio</p>
</div>

<div class="broadcast-container">
    <video id="playerA" class="active" autoplay playsinline controls></video>
    <video id="playerB" autoplay playsinline muted controls></video>
</div>

<script>
class UninterruptedBroadcast {
    constructor(playerIdA, playerIdB) {
        this.playerA = document.getElementById(playerIdA);
        this.playerB = document.getElementById(playerIdB);
        this.activePlayer = this.playerA;
        this.bufferPlayer = this.playerB;

        this.hlsA = null;
        this.hlsB = null;
        this.activeHls = null;
        this.bufferHls = null;

        this.playlist = [];
        this.anchorTime = 0;
        this.totalDuration = 0;
        
        this.currentVideoIndex = -1;
        this.currentUrl = "";
        this.isSwapping = false; 
        this.hasTunedIn = false;

        this.init();
    }

    async init() {
        await this.fetchPlaylistUpdates();
        
        this.setupPlayerListeners(this.playerA);
        this.setupPlayerListeners(this.playerB);

        // Silent background polling every 15 seconds to catch new URLs
        setInterval(() => this.fetchPlaylistUpdates(), 15000);

        // Soft drift synchronisation runner checking every 4 seconds
        setInterval(() => this.checkDriftSafety(), 4000);
    }

    async fetchPlaylistUpdates() {
        try {
            const response = await fetch(`./playlist500.json?cb=${Date.now()}`);
            const data = await response.json();
            
            this.playlist = data.playlist;
            this.anchorTime = data.anchorTime;
            this.totalDuration = this.playlist.reduce((acc, item) => acc + item.duration, 0);
            
            console.log(`[Manifest Sync] Loop length updated to ${this.totalDuration}s. Items: ${this.playlist.length}`);
            
            // If already watching, update the background buffer to prepare for the newly modified layout
            if (this.hasTunedIn && !this.isSwapping) {
                this.preloadUpcomingSequencedItem();
            }
        } catch (err) {
            console.error("[Manifest Error] Live playlist fetch failure:", err);
        }
    }

    // Maps absolute clock time against historical channel anchor to find what should be live
    calculateBroadcastState() {
        if (this.totalDuration === 0 || this.anchorTime === 0) return null;

        const now = Math.floor(Date.now() / 1000);
        let elapsedSeconds = now - this.anchorTime;
        if (elapsedSeconds < 0) elapsedSeconds = 0; 

        // Find standard cycle position inside the full structural timing loop
        let currentCyclePosition = elapsedSeconds % this.totalDuration;

        let accumulatedTime = 0;
        for (let i = 0; i < this.playlist.length; i++) {
            const video = this.playlist[i];
            if (currentCyclePosition >= accumulatedTime && currentCyclePosition < (accumulatedTime + video.duration)) {
                return {
                    index: i,
                    seekTo: currentCyclePosition - accumulatedTime,
                    video: video
                };
            }
            accumulatedTime += video.duration;
        }
        return { index: 0, seekTo: 0, video: this.playlist[0] };
    }

    // Fires strictly once when loading, tuning in, or executing a browser hard refresh
    syncToGlobalTimeline() {
        this.hasTunedIn = true;
        const state = this.calculateBroadcastState();
        if (!state) return;

        this.currentVideoIndex = state.index;
        this.currentUrl = state.video.url;
        
        console.log(`[Tune In] Absolute Global Target established. Index [${state.index}] at ${state.seekTo}s`);

        if (this.activeHls) this.activeHls.destroy();
        this.activePlayer.muted = false;
        
        this.activeHls = this.loadHlsStream(this.activePlayer, state.video.url);
        
        const onInitialLoad = () => {
            this.activePlayer.currentTime = state.seekTo;
            this.activePlayer.play().catch(() => {});
            this.activePlayer.removeEventListener('loadedmetadata', onInitialLoad);
            
            // Immediately start loading next scheduled block in background
            this.preloadUpcomingSequencedItem();
        };
        this.activePlayer.addEventListener('loadedmetadata', onInitialLoad);
    }

    setupPlayerListeners(player) {
        // Natural track completion fires the dual-player handoff instantly
        player.addEventListener('ended', () => {
            if (player !== this.activePlayer || this.isSwapping) return;
            this.handleTrackEnded();
        });

        // Anti-Scrubbing Enforcement Protocol
        player.addEventListener('seeking', () => {
            if (player !== this.activePlayer || this.isSwapping) return;
            
            const state = this.calculateBroadcastState();
            // If the playlist updated mid-track, don't scrub them back to absolute math time.
            // Only enforce scrubbing protection if their active item matches the global schedule block url.
            if (!state || state.video.url !== this.currentUrl) return;

            const variance = Math.abs(player.currentTime - state.seekTo);
            if (variance > 4) {
                console.warn("[Anti-Scrub] Timeline manipulation blocked. Restoring linear sync position.");
                player.currentTime = state.seekTo;
            }
        });
    }

    handleTrackEnded() {
        this.isSwapping = true;
        const oldActive = this.activePlayer;
        const newActive = this.bufferPlayer;

        console.log("[Handoff] Active content finished. Executing instant seamless transition...");

        if (document.getElementById('interactionOverlay').style.display === 'none') {
            newActive.muted = false;
        }

        newActive.play().then(() => {
            newActive.classList.add('active');
            oldActive.classList.remove('active');
            oldActive.pause();

            this.activePlayer = newActive;
            this.bufferPlayer = oldActive;

            const tempHls = this.activeHls;
            this.activeHls = this.bufferHls;
            this.bufferHls = tempHls;

            // Recalculate index relative to the live list environment
            const state = this.calculateBroadcastState();
            
            // Fallback: If playlist array shifts index layout, dynamically resolve active url pointer
            if (state && state.video.url === newActive.src) {
                this.currentVideoIndex = state.index;
            } else {
                this.currentVideoIndex = (this.currentVideoIndex + 1) % this.playlist.length;
            }
            
            // Extract the true underlying media src URL string safely
            const currentSrc = newActive.currentSrc || (newActive.querySelector('source') ? newActive.querySelector('source').src : newActive.src);
            this.currentUrl = this.playlist[this.currentVideoIndex] ? this.playlist[this.currentVideoIndex].url : currentSrc;

            this.isSwapping = false;
            
            // Queue up the *next* block into the background player
            this.preloadUpcomingSequencedItem();
        }).catch(err => {
            console.error("[Transition Failure] Swapping error, forcing hard timeline recovery:", err);
            this.isSwapping = false;
            this.syncToGlobalTimeline();
        });
    }

    preloadUpcomingSequencedItem() {
        if (this.playlist.length <= 1) return;

        // Target the next logical index relative to current state placement
        const nextIndex = (this.currentVideoIndex + 1) % this.playlist.length;
        const nextVideo = this.playlist[nextIndex];
        
        if (this.bufferHls) this.bufferHls.destroy();
        
        this.bufferPlayer.muted = true;
        this.bufferHls = this.loadHlsStream(this.bufferPlayer, nextVideo.url);
        this.bufferPlayer.load();
        
        console.log(`[Buffer Ready] Background player caching next block -> Index [${nextIndex}]: ${nextVideo.url}`);
    }

        checkDriftSafety() {
        if (!this.hasTunedIn || this.isSwapping || this.activePlayer.paused || this.activePlayer.readyState < 2) return;

        const state = this.calculateBroadcastState();
        
        // CRITICAL PROTECTION LOGIC:
        // If a new URL was added to the JSON, the mathematical state index will shift.
        // We deliberately bypass the resync calculation here so active viewers experience zero jumps.
        // The script allows their video to complete naturally before aligning back to the next block.
        if (!state || state.video.url !== this.currentUrl) {
            console.log("[Broadcast Safe Mode] Active video doesn't match mathematical time position due to mid-stream playlist modification. Allowing clean finish without jumping.");
            return;
        }

        const drift = Math.abs(this.activePlayer.currentTime - state.seekTo);
        if (drift > 6) {
            console.warn(`[Sync Adjust] Correcting minor video drift (${drift.toFixed(2)}s).`);
            this.activePlayer.currentTime = state.seekTo;
        }
    }

    loadHlsStream(player, url) {
        if (player.canPlayType('application/vnd.apple.mpegurl')) {
            player.src = url;
            return null;
        } else if (Hls.isSupported()) {
            const hls = new Hls({ maxBufferLength: 12 });
            hls.attachMedia(player);
            hls.on(Hls.Events.MEDIA_ATTACHED, () => hls.loadSource(url));
            return hls;
        }
        return null;
    }
}

// Instantiate engine setup
const broadcastManager = new UninterruptedBroadcast('playerA', 'playerB');

// Handle the user interaction requirement
document.getElementById('interactionOverlay').addEventListener('click', function() {
    this.style.display = 'none';
    broadcastManager.syncToGlobalTimeline();
});
</script>
</body>
</html>
