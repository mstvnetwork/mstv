<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Global Linear TV</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        .player-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        video {
            width: 100%;
            display: block;
        }
        /* Completely blocks manual timeline scrubbing while letting clicks hit our buttons */
        .video-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            background: transparent;
        }
        /* Animated Volume Control Interface Layer */
        .volume-overlay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
        }
        .volume-btn {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .volume-btn:hover {
            transform: scale(1.1);
            background: rgba(229, 9, 20, 0.9);
            border-color: #e50914;
        }
        /* Icon animation parameters */
        .volume-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
            transition: transform 0.2s ease;
        }
        .volume-btn:active svg {
            transform: scale(0.85);
        }
        .schedule-box {
            margin-top: 25px;
            background: #222;
            padding: 15px;
            border-radius: 6px;
        }
        .schedule-title {
            font-size: 18px;
            margin-top: 0;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
        }
        .program-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }
        .program-item.active {
            color: #2ecc71;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align: center;">🎬 MS TV Network</h1>
    
    <div class="player-wrapper">
        <div class="video-shield" id="shield"></div>
        
        <!-- Native 'autoplay' and 'muted' parameters enforce instant background streaming -->
        <video id="tvPlayer" autoplay muted playsinline>
            Your browser does not support HTML5 video.
        </video>

        <!-- Floating audio status overlay container -->
        <div class="volume-overlay">
            <button class="volume-btn" id="volumeToggle" title="Toggle Sound">
                <!-- Inline SVG lets us dynamically replace paths smoothly -->
                <svg id="volumeIcon" viewBox="0 0 24 24">
                    <!-- Default state: Muted icon (speaker with an X) -->
                    <path id="iconPath" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="schedule-box">
        <h3 class="schedule-title">📅 Live TV Schedule</h3>
        <div id="scheduleList"></div>
    </div>
</div>

<script>
// ============================================================================
// 1. PLAYLIST DEFINITIONS
// ============================================================================
const PLAYLIST = [
    { 
        name: "Movie Slot 1",   
        timeSlot: "03:00", 
        duration: 7200, // 2 Hours long
        url: "https://github.com/mstvnetwork/mstv/releases/download/v1.0.0/nagin.mp4" 
    },
    { 
        name: "Movie Slot 2 (GitHub Hosted)",   
        timeSlot: "05:00", 
        duration: 5400, // 1.5 Hours long
        url: "https://github.com/mstvnetwork/mstv/releases/download/v1.0.0/nagin.mp4" 
    },
    { 
        name: "Movie Slot 3",   
        timeSlot: "06:30", 
        duration: 3600, // 1 Hour long
        url: "https://github.com/mstvnetwork/mstv/releases/download/v1.0.0/nagin.mp4" 
    }
    // You can paste 20+ movies down here following this identical layout pattern
];

const player = document.getElementById('tvPlayer');
const volumeToggle = document.getElementById('volumeToggle');
const iconPath = document.getElementById('iconPath');
let currentActiveIndex = -1;

// Path descriptions for seamless SVG asset toggles
const MUTED_SVG_PATH = "M4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71z";
const UNMUTED_SVG_PATH = "M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z";

// ============================================================================
// 2. LINEAR CODES SYNCHRONIZER
// ============================================================================
function getSecondsSinceMidnight() {
    const now = new Date();
    return (now.getHours() * 3600) + (now.getMinutes() * 60) + now.getSeconds();
}

function timeToSeconds(timeStr) {
    const [hours, minutes] = timeStr.split(':').map(Number);
    return (hours * 3600) + (minutes * 60);
}

function syncBroadcast() {
    const nowInSeconds = getSecondsSinceMidnight();
    let activeVideo = null;
    let activeIndex = -1;

    for (let i = 0; i < PLAYLIST.length; i++) {
        const slotStart = timeToSeconds(PLAYLIST[i].timeSlot);
        const slotEnd = slotStart + PLAYLIST[i].duration;

        if (nowInSeconds >= slotStart && nowInSeconds < slotEnd) {
            activeVideo = PLAYLIST[i];
            activeIndex = i;
            break;
        }
    }

    if (!activeVideo && PLAYLIST.length > 0) {
        activeVideo = PLAYLIST[0];
        activeIndex = 0;
    }

    if (activeVideo) {
        const slotStartSeconds = timeToSeconds(activeVideo.timeSlot);
        const targetTime = nowInSeconds - slotStartSeconds;

        if (player.src !== activeVideo.url) {
            player.src = activeVideo.url;
            player.currentTime = targetTime;
            
            // Re-attempt background execution handling
            player.play().catch(e => console.log("Autoplay background constraint handled."));
        } else {
            // Strict frame alignment evaluation loop
            if (Math.abs(player.currentTime - targetTime) > 1.5) {
                player.currentTime = targetTime;
            }
        }
        
        if (activeIndex !== currentActiveIndex) {
            currentActiveIndex = activeIndex;
            renderSchedule(activeIndex);
        }
    }
}

// ============================================================================
// 3. LIFECYCLE MANAGEMENT & CONTROLS
// ============================================================================
// Run synchronization immediately when the page layout resources stand ready
window.addEventListener('DOMContentLoaded', () => {
    syncBroadcast();
    // Fire background execution loop
    setInterval(syncBroadcast, 250);
});

player.addEventListener('seeking', () => syncBroadcast());
player.addEventListener('play', () => syncBroadcast());

// Intercept window background suspension issues
document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
        syncBroadcast();
    }
});

// Interactive Volume Toggle Event Listener
volumeToggle.addEventListener('click', () => {
    player.muted = !player.muted;
    
    // Change internal path variables to animate speaker graphic states
    if (player.muted) {
        iconPath.setAttribute('d', MUTED_SVG_PATH);
        volumeToggle.style.borderColor = "rgba(255, 255, 255, 0.2)";
    } else {
        iconPath.setAttribute('d', UNMUTED_SVG_PATH);
        volumeToggle.style.borderColor = "#2ecc71"; // Give an aesthetic green flare when live sound activates
    }
});

// Structural block tracking browser panel utilities from intercepting elements
document.getElementById('shield').addEventListener('contextmenu', e => e.preventDefault());

function renderSchedule(activeIndex) {
    const scheduleList = document.getElementById('scheduleList');
    scheduleList.innerHTML = "";
    PLAYLIST.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = `program-item ${idx === activeIndex ? 'active' : ''}`;
        div.innerHTML = `
            <span>${idx === activeIndex ? '▶ ' : ''}${item.name}</span>
            <span>${item.timeSlot}</span>
        `;
        scheduleList.appendChild(div);
    });
}
</script>

</body>
</html>
