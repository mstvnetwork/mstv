<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSTV Live Stream</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; overflow: hidden; }
        
        .video-container { width: 100vw; height: 100vh; max-width: 100%; position: relative; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; pointer-events: none; } /* Blocks click-to-pause/seek */

        /* Autoplay Unmute Overlay Box */
        #unmute-overlay {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(0, 0, 0, 0.85); color: #fff; padding: 14px 24px;
            border-radius: 30px; cursor: pointer; display: flex; align-items: center;
            font-weight: bold; font-size: 14px; border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: transform 0.1s;
            user-select: none;
        }
        #unmute-overlay:active { transform: scale(0.97); }
        #unmute-overlay svg { margin-right: 10px; fill: white; width: 18px; height: 18px; }
    </style>
</head>
<body>

<div class="video-container">
    <!-- Unmute Button Overlay -->
    <div id="unmute-overlay">
        <svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM12 4l-5 5H3v6h4l5 5V4z"/></svg>
        Click to Unmute MSTV Live
    </div>

    <!-- Raw HTML5 Video Element (No controls attribute = NO seekbar or buttons) -->
    <video id="video" autoplay muted playsinline></video>
</div>

<!-- LIGHTWEIGHT ENGINE LINK -->
<script src="index.m3u8";></script>


<script>
    // Wait until the HTML layout is 100% loaded before running script
    document.addEventListener("DOMContentLoaded", function() {
        
        // =========================================================================
        // CONFIGURATION (Configured for MSTV)
        // =========================================================================
        const VIDEO_DURATION = 2546; // Your exact video length in seconds
        const CHANNEL_START_UNIX = 1700000000; // Fixed anchor timestamp
        const HLS_MANIFEST_URL = "https://cdn.jsdelivr.net/gh/mstvnetwork/mstv@main/index.m3u8"; 
        // =========================================================================

        const video = document.getElementById('video');
        const unmuteBtn = document.getElementById('unmute-overlay');

        // Calculates the mathematical live point relative to the global clock
        function getGlobalLivePosition() {
            const currentUnixTimeSeconds = Date.now() / 1000;
            const totalSecondsElapsed = currentUnixTimeSeconds - CHANNEL_START_UNIX;
            
            // Endless loops across your 2546-second timeline
            return totalSecondsElapsed % VIDEO_DURATION;
        }

        // Initialize HLS Engine
        if (typeof Hls !== 'undefined' && Hls.isSupported()) {
            const hls = new Hls({
                enableWorker: true,
                lowLatencyMode: false
            });
            
            hls.loadSource(HLS_MANIFEST_URL);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.currentTime = getGlobalLivePosition();
                video.play().catch(err => console.log("Autoplay waiting for click."));
            });

        } else if (video && video.canPlayType('application/vnd.apple.mpegurl')) {
            // Fallback for native Safari / iOS browsers which don't need hls.js
            video.src = HLS_MANIFEST_URL;
            video.addEventListener('loadedmetadata', function() {
                video.currentTime = getGlobalLivePosition();
                video.play().catch(err => console.log("Autoplay waiting for click."));
            });
        }

        // STRICT ANTI-TAMPER / ANTI-DRIFT GUARD
        if (video) {
            video.addEventListener('timeupdate', function() {
                const targetTime = getGlobalLivePosition();
                const drift = Math.abs(video.currentTime - targetTime);
                
                // If user drifts out of sync by more than 2 seconds, snap back instantly
                if (drift > 2) {
                    video.currentTime = targetTime;
                }
            });
        }

        // Handle Overlay Interaction
        if (unmuteBtn && video) {
            unmuteBtn.addEventListener('click', function() {
                video.muted = false;
                unmuteBtn.style.display = 'none'; // Erase overlay button
                video.currentTime = getGlobalLivePosition(); // Instant micro-sync on click
            });
        }

        // Strict Keyboard Lockouts (Disables Spacebar, Left Arrow, Right Arrow)
        window.addEventListener('keydown', function(e) {
            if ([32, 37, 39].indexOf(e.keyCode) > -1) {
                e.preventDefault();
            }
        }, false);

    });
</script>

</body>
</html>
