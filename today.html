<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Virtual Linear TV Station (IST)</title>
    <!-- Stable HLS.js Library Engine -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.4/dist/hls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.6.12/dist/plyr.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background-color: #000; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
        }
        .video-container { 
            position: relative; 
            width: 80%; 
            max-width: 800px; 
            aspect-ratio: 16 / 9; 
            background: #111; 
        }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
        }
        .status-overlay { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            background: rgba(0, 0, 0, 0.7); 
            padding: 10px 15px; 
            border-radius: 5px; 
            font-size: 14px; 
            pointer-events: none; 
            z-index: 10;
        }
        .live-indicator { 
            display: inline-block; 
            width: 10px; 
            height: 10px; 
            background-color: #ff0000; 
            border-radius: 50%; 
            margin-right: 5px; 
        }
    </style>
</head>
<body>

<div class="video-container">
    <!-- Clean element with no control panel to block timeline manipulation -->
    <video id="live-player" playsinline autoplay muted></video>
    <div class="status-overlay">
        <span class="live-indicator"></span> VIRTUAL LIVE (IST): <span id="stream-info">Initializing...</span>
    </div>
</div>

<script>
    // 1. HARDCODED DAILY 24-HOUR SCHEDULE (IST)
    // Supports static .m3u8 playlists and raw .mp4 files transparently.
    // Ensure schedule windows accurately span across the full 24-hour block.
    const schedule = [
        {
            title: "Early Morning Block",
            url: "https://cdn30092.keymi417exx.com/stream2/i-cdn-0/32b181d14d122a5dc3eb1a1dfa82b34c/MJTMsp1RshGTygnMNRUR2N2MSlnWXZEdMNDZzQWe5MDZzMmdZJTO1R2RWVHZDljekhkSsl1VwYnWtx2cihVT2lFVjNjTykUeZdlVqp1VS1mWUFVeOdUW10UbRBTTEJlaZpXQz0EVNdnWE1UP:1781140403:101.119.126.94:57cc73b00304fc3c2939d407638bd0814bf5647ba8438e2f72604e167fc2c9c1:=0EVBhHTqVEePNFN41kaZV3TUFVP/360/index.m3u8", // Example M3U8
            start: "00:00:00", 
            end: "09:58:00"
        },
        {
            title: "Afternoon Cinema",
            url: "https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8", // Example MP4
            start: "09:58:00",
            end: "02:00:00"
        }
        
    ];

    const video = document.getElementById('live-player');
    const streamInfo = document.getElementById('stream-info');
    let currentStreamUrl = "";
    let targetPlaybackPosition = 0;
    let hls = null;

    // Converted string parsing utility
    function timeStringToSeconds(timeStr) {
        const parts = timeStr.split(':');
        return (parseInt(parts[0], 10) * 3600) + (parseInt(parts[1], 10) * 60) + parseInt(parts[2], 10);
    }

    // 2. ABSOLUTE SYNCHRONIZATION RUNTIME
    function syncPlayerToSchedule() {
        const now = new Date();
        // Force evaluation via Indian Standard Time string mapping
        const istString = now.toLocaleString("en-US", { timeZone: "Asia/Kolkata", hour12: false });
        
        const timeMatch = istString.match(/\d{2}:\d{2}:\d{2}/);
        if (!timeMatch) return;
        
        const currentSecondsInDay = timeStringToSeconds(timeMatch[0]);
        let activeVideo = null;

        for (let item of schedule) {
            const startSec = timeStringToSeconds(item.start);
            const endSec = timeStringToSeconds(item.end);

            if (currentSecondsInDay >= startSec && currentSecondsInDay < endSec) {
                activeVideo = item;
                // Calculations establish exactly where the timeline ought to stand
                targetPlaybackPosition = currentSecondsInDay - startSec;
                break;
            }
        }

        if (!activeVideo) {
            streamInfo.innerText = "Intermission";
            video.pause();
            return;
        }

        streamInfo.innerText = activeVideo.title;

        // Channel state switcher logic
        if (currentStreamUrl !== activeVideo.url) {
            currentStreamUrl = activeVideo.url;
            loadMediaSource(currentStreamUrl);
        } else {
            // Strict alignment defense loop
            // If local timeline drifts out of sync by more than 2 seconds, force snap back
            if (Math.abs(video.currentTime - targetPlaybackPosition) > 2) {
                // Prevent infinite loop if the video file length is shorter than the schedule block
                if (video.duration && targetPlaybackPosition < video.duration) {
                    video.currentTime = targetPlaybackPosition;
                } else if (video.duration) {
                    // Loop fallback if content is shorter than the slot duration
                    video.currentTime = targetPlaybackPosition % video.duration;
                }
            }
        }
    }

    // 3. HYBRID SOURCE LOADER ENGINE
    function loadMediaSource(url) {
        const isHls = url.includes('.m3u8');

        // Handle M3U8 files on platforms supporting HLS.js
        if (isHls && Hls.isSupported()) {
            if (hls) hls.destroy();
            
            hls = new Hls({ maxMaxBufferLength: 10 });
            hls.loadSource(url);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                applyInitialSyncPosition();
            });
        } 
        // Handle MP4 files or native Apple Safari M3U8 playback
        else {
            if (hls) { hls.destroy(); hls = null; }
            video.src = url;
            video.load();
            
            video.onloadedmetadata = function() {
                applyInitialSyncPosition();
            };
        }
    }

    function applyInitialSyncPosition() {
        let seekPos = targetPlaybackPosition;
        if (video.duration && targetPlaybackPosition > video.duration) {
            seekPos = targetPlaybackPosition % video.duration;
        }
        video.currentTime = seekPos;
        video.play().catch(() => console.log("Awaiting viewer click interaction to unmute audio."));
    }

    // 4. INTERACTION LOCKDOWN OVERRIDES
    video.addEventListener('seeking', () => {
        let correctPos = targetPlaybackPosition;
        if (video.duration && targetPlaybackPosition > video.duration) {
            correctPos = targetPlaybackPosition % video.duration;
        }
        if (Math.abs(video.currentTime - correctPos) > 1.5) {
            video.currentTime = correctPos;
        }
    });

    video.addEventListener('pause', () => {
        // Blocks external pausing commands immediately
        video.play().catch(() => {});
    });

    // Unmute upon click handler engagement
    document.body.addEventListener('click', () => {
        if (video.muted) {
            video.muted = false;
        }
    });

    // Continuously check synchronization parameters every 1 second
    setInterval(syncPlayerToSchedule, 500);
    syncPlayerToSchedule();
</script>

</body>
</html>
