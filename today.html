<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSTV Live Stream</title>
    <!-- Video.js Framework Styles -->
    <link href="https://zencdn.net" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; overflow: hidden; }
        
        .video-container { width: 100vw; height: 100vh; max-width: 100%; position: relative; background: #000; }
        .video-js { width: 100% !important; height: 100% !important; }

        /* STRICTLY REMOVE CONTROLS: Completely hides seek bars, timelines, and buttons */
        .vjs-control-bar, .vjs-big-play-button, .vjs-loading-spinner { display: none !important; }
        video { pointer-events: none; } /* Blocks mouse clicks from pausing or scrubbing */

        /* Autoplay Unmute Overlay Box */
        #unmute-overlay {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(0, 0, 0, 0.85); color: #fff; padding: 14px 24px;
            border-radius: 30px; cursor: pointer; display: flex; align-items: center;
            font-weight: bold; font-size: 14px; border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: transform 0.1s;
            user-select: none;
        }
        #unmute-overlay:active { transform: scale(0.97); }
        #unmute-overlay svg { margin-right: 10px; fill: white; width: 18px; height: 18px; }
    </style>
</head>
<body>

<div class="video-container">
    <!-- Unmute Button Overlay -->
    <div id="unmute-overlay">
        <svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM12 4l-5 5H3v6h4l5 5V4z"/></svg>
        Click to Unmute MSTV Live
    </div>

    <!-- Live Player Instance -->
    <video id="live-player" class="video-js vjs-default-skin" autoplay muted playsinline preload="auto"></video>
</div>

<!-- Video.js Engine -->
<script src="https://zencdn.net"></script>

<script>
    // =========================================================================
    // CONFIGURATION (Configured for MSTV)
    // =========================================================================
    const VIDEO_DURATION = 2546; // Your exact video length in seconds
    const CHANNEL_START_UNIX = 1700000000; // Fixed anchor timestamp
    const HLS_MANIFEST_URL = "https://cdn.jsdelivr.net/gh/mstvnetwork/mstv@main/index.m3u8"; 
    // =========================================================================

    const player = videojs('live-player');

    // Mount the streaming source
    player.src({
        src: HLS_MANIFEST_URL,
        type: 'application/x-mpegURL'
    });

    // Calculates mathematical live point relative to the global clock
    function getGlobalLivePosition() {
        const currentUnixTimeSeconds = Date.now() / 1000;
        const totalSecondsElapsed = currentUnixTimeSeconds - CHANNEL_START_UNIX;
        
        // Endless continuous loops across your 2546-second timeline
        return totalSecondsElapsed % VIDEO_DURATION;
    }

    // Force player to snap to live position as soon as video metadata loads
    player.on('loadedmetadata', function() {
        player.currentTime(getGlobalLivePosition());
        player.play().catch(err => console.log("Autoplay waiting for click."));
    });

    // Strict Anti-Tamper/Anti-Drift Logic
    player.on('timeupdate', function() {
        const targetTime = getGlobalLivePosition();
        const drift = Math.abs(player.currentTime() - targetTime);
        
        // Reset player timeline instantly if it gets desynced by more than 2 seconds
        if (drift > 2) {
            player.currentTime(targetTime);
        }
    });

    // Handle Overlay Activation
    const unmuteBtn = document.getElementById('unmute-overlay');
    unmuteBtn.addEventListener('click', function() {
        player.muted(false);
        unmuteBtn.style.display = 'none'; // Clear overlay button
        player.currentTime(getGlobalLivePosition()); // Final micro-sync adjustment
    });

    // Keyboard lockouts (Disables Space, Left Arrow, Right Arrow)
    window.addEventListener('keydown', function(e) {
        if ([32, 37, 39].indexOf(e.keyCode) > -1) {
            e.preventDefault();
        }
    }, false);
</script>

</body>
</html>
