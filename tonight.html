<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="MSTV Network offers 24/7 live TV streams, music, and movies.">
    <meta name="robots" content="index, follow">

    <title>MSTV Network - Live Player</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <!-- Analytics -->
    <script data-goatcounter="https://mstv.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>

    <style>
      :root {
        --bg-main: #0a0c10;
        --card-bg: rgba(22, 27, 34, 0.85);
        --accent-gold: #ffd700;
        --accent-red: #ff3b30;
        --accent-blue: #007aff;
        --text-primary: #ffffff;
        --text-muted: #8b949e;
        --border-color: rgba(255, 255, 255, 0.12);
        --app-height: 100vh; 
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        height: 100%;
        height: var(--app-height);
        overflow: hidden;
        background-color: var(--bg-main);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      .app-layout {
        display: flex;
        flex-direction: column;
        height: 100%;
        height: var(--app-height);
        width: 100%;
        max-width: 1280px;
        margin: 0 auto;
        padding: calc(0.4rem + env(safe-area-inset-top)) calc(0.4rem + env(safe-area-inset-right)) calc(0.4rem + env(safe-area-inset-bottom)) calc(0.4rem + env(safe-area-inset-left));
        gap: 0.4rem;
        position: relative;
      }

      /* Compact Header */
      header.app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.35rem 0.8rem;
        flex-shrink: 0;
      }

      .brand-box {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .brand-title {
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: 0.5px;
        background: linear-gradient(135deg, #ffffff 0%, var(--accent-gold) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .live-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: rgba(255, 59, 48, 0.15);
        color: var(--accent-red);
        border: 1px solid rgba(255, 59, 48, 0.3);
        padding: 2px 6px;
        border-radius: 12px;
        font-size: 0.65rem;
        font-weight: 700;
      }

      .live-dot {
        width: 6px;
        height: 6px;
        background-color: var(--accent-red);
        border-radius: 50%;
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1); }
      }

      /* Reduced Player Section Height */
      .player-section {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 0;
        max-height: 55vh; /* Reduced height constraint */
        width: 100%;
        position: relative;
        margin: auto 0;
      }

      .video-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
        max-width: calc(55vh * (16 / 9));
        aspect-ratio: 16 / 9;
        background-color: #000;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid var(--border-color);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      }

      #videoContainer {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }

      #videoContainer video, 
      #videoContainer iframe {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border: none;
      }

      /* Transparent Shield Overlay to prevent clicking YouTube Logo/Links */
      .yt-shield-full {
        position: absolute;
        inset: 0;
        z-index: 15;
        background: transparent;
        pointer-events: auto;
      }

      .player-placeholder {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle, #1a202c 0%, #0a0c10 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        z-index: 20;
        text-align: center;
        padding: 0.8rem;
      }

      .placeholder-icon {
        font-size: 2rem;
        color: var(--accent-gold);
        opacity: 0.8;
      }

      .placeholder-text {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-primary);
      }

      .placeholder-subtext {
        font-size: 0.72rem;
        color: var(--text-muted);
      }

      .player-controls-overlay {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        gap: 6px;
        z-index: 25;
      }

      .control-btn {
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(4px);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.15);
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 0.8rem;
        transition: all 0.2s ease;
      }

      .control-btn:hover {
        background: rgba(255, 255, 255, 0.25);
        transform: scale(1.05);
      }

      .loading-spinner-overlay {
        position: absolute;
        inset: 0;
        background: rgba(10, 12, 16, 0.85);
        backdrop-filter: blur(4px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        z-index: 22;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }

      .loading-spinner-overlay.active {
        opacity: 1;
        pointer-events: auto;
      }

      .spinner {
        width: 30px;
        height: 30px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: var(--accent-gold);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .spinner-text {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      /* EPG Ticker */
      .epg-ticker-bar {
        display: flex;
        align-items: center;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        height: 28px;
        overflow: hidden;
        flex-shrink: 0;
      }

      .epg-label {
        background: var(--accent-gold);
        color: #000;
        font-weight: 700;
        font-size: 0.65rem;
        padding: 0 8px;
        height: 100%;
        display: flex;
        align-items: center;
        flex-shrink: 0;
      }

      .ticker-wrapper {
        flex: 1;
        overflow: hidden;
        position: relative;
        white-space: nowrap;
      }

      .ticker-content {
        display: inline-block;
        padding-left: 100%;
        animation: ticker-scroll 20s linear infinite;
        font-size: 0.75rem;
        color: var(--text-primary);
      }

      @keyframes ticker-scroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100%); }
      }

      /* Category Switcher Container */
      .category-wrapper {
        position: relative;
        flex-shrink: 0;
        width: 100%;
        z-index: 40;
      }

      .category-container {
        display: flex;
        justify-content: center;
        gap: 6px;
        width: 100%;
      }

      .category-btn {
        flex: 1;
        padding: 6px 8px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        border-radius: 6px;
        font-weight: 600;
        font-size: 0.78rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        transition: all 0.2s ease;
      }

      .category-btn.active {
        background: linear-gradient(135deg, rgba(255, 215, 0, 0.2) 0%, rgba(255, 215, 0, 0.05) 100%);
        border-color: var(--accent-gold);
        color: var(--accent-gold);
      }

      .category-btn.active.youtube {
        background: linear-gradient(135deg, rgba(255, 59, 48, 0.2) 0%, rgba(255, 59, 48, 0.05) 100%);
        border-color: var(--accent-red);
        color: var(--accent-red);
      }

      .category-btn.active.livetv {
        background: linear-gradient(135deg, rgba(0, 122, 255, 0.25) 0%, rgba(0, 122, 255, 0.05) 100%);
        border-color: var(--accent-blue);
        color: var(--accent-blue);
      }

      /* Transparent Collapsible Subcategories Overlay */
      .subcategories-menu {
        display: none;
        position: absolute;
        bottom: 100%;
        left: 0;
        right: 0;
        margin-bottom: 6px;
        background: rgba(10, 12, 16, 0.95);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 8px;
        box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.8);
        max-height: 200px;
        overflow-y: auto;
      }

      .subcategories-menu.active {
        display: block;
      }

      .subcategories-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
        gap: 6px;
      }

      .subcat-btn {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--text-primary);
        padding: 6px;
        border-radius: 6px;
        font-size: 0.72rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: all 0.2s ease;
      }

      .subcat-btn:hover, .subcat-btn.active {
        background: rgba(0, 122, 255, 0.2);
        border-color: var(--accent-blue);
        color: #fff;
      }

      /* Collapsible Channel List */
      .channels-list {
        display: none;
        grid-column: 1 / -1;
        background: rgba(0, 0, 0, 0.4);
        border-radius: 6px;
        padding: 6px;
        gap: 4px;
        margin-top: 4px;
        max-height: 110px;
        overflow-y: auto;
      }

      .channels-list.active {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      }

      .channel-item {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        padding: 5px 8px;
        border-radius: 4px;
        font-size: 0.7rem;
        cursor: pointer;
        text-overflow: ellipsis;
        white-space: nowrap;
        overflow: hidden;
        text-align: left;
      }

      .channel-item:hover {
        background: var(--accent-gold);
        color: #000;
        font-weight: 700;
      }

      /* Modern Professional Footer */
      footer.app-footer {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.6rem 0.8rem;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .footer-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        padding-bottom: 0.4rem;
      }

      .footer-brand-info {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-weight: 700;
        font-size: 0.75rem;
        color: var(--text-primary);
      }

      .footer-social-links {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .social-icon {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--text-muted);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0.68rem;
        text-decoration: none;
        transition: all 0.2s ease;
      }

      .social-icon:hover {
        color: var(--accent-gold);
        background: rgba(255, 215, 0, 0.15);
        border-color: var(--accent-gold);
        transform: translateY(-1px);
      }

      .footer-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.65rem;
        color: var(--text-muted);
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .footer-nav {
        display: flex;
        gap: 0.8rem;
      }

      .footer-nav a {
        color: var(--text-muted);
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .footer-nav a:hover {
        color: var(--accent-gold);
      }

      @media (max-height: 520px) {
        .player-section { max-height: 45vh; }
        .app-header { padding: 0.2rem 0.5rem; }
        .brand-title { font-size: 0.85rem; }
        .placeholder-icon { font-size: 1.4rem; }
        .placeholder-text { font-size: 0.78rem; }
        .category-btn { padding: 4px 6px; font-size: 0.72rem; }
        footer.app-footer { padding: 0.4rem 0.6rem; }
      }
    </style>
</head>
<body>

  <div class="app-layout">
    
    <!-- Header -->
    <header class="app-header">
      <div class="brand-box">
        <i class="fa-solid fa-satellite-dish" style="color: var(--accent-gold);"></i>
        <span class="brand-title">MSTV NETWORK</span>
      </div>
      <div class="header-right">
        <div class="live-badge">
          <span class="live-dot"></span> LIVE
        </div>
        <span id="currentTime">00:00</span>
      </div>
    </header>

    <!-- Compact Media Player Container -->
    <main class="player-section">
      <div class="video-wrapper" id="playerWrapper">
        <div id="videoContainer"></div>

        <div class="player-placeholder" id="playerPlaceholder">
          <i class="fa-solid fa-circle-play placeholder-icon"></i>
          <div class="placeholder-text">MSTV Live Streaming Hub</div>
          <div class="placeholder-subtext">Select a network category below to begin watching</div>
        </div>

        <div class="player-controls-overlay">
          <button class="control-btn" id="muteToggle" title="Toggle Mute">
            <i class="fa-solid fa-volume-xmark"></i>
          </button>
          <button class="control-btn" id="fullscreenToggle" title="Toggle Fullscreen">
            <i class="fa-solid fa-expand"></i>
          </button>
        </div>

        <div class="loading-spinner-overlay" id="loadingSpinner">
          <div class="spinner"></div>
          <span class="spinner-text">Loading Stream...</span>
        </div>
      </div>
    </main>

    <!-- EPG Ticker -->
    <div class="epg-ticker-bar">
      <div class="epg-label"><i class="fa-solid fa-tv" style="margin-right: 4px;"></i> EPG</div>
      <div class="ticker-wrapper">
        <div class="ticker-content" id="epgTickerText">
          Please select a playlist category to view current broadcast schedule.
        </div>
      </div>
    </div>

    <!-- Category Tabs & Subcategories Wrapper -->
    <div class="category-wrapper">
      
      <!-- Transparent Collapsible Subcategories Menu -->
      <div class="subcategories-menu" id="subcategoriesMenu">
        <div class="subcategories-grid" id="subcategoriesGrid"></div>
      </div>

      <!-- Main Category Tabs -->
      <nav class="category-container">
        <button class="category-btn" id="btnApnaTv" onclick="switchCategory('apna_tv')">
          <i class="fa-solid fa-play"></i> Apna TV
        </button>
        <button class="category-btn" id="btnYouTube" onclick="switchCategory('youtube')">
          <i class="fa-brands fa-youtube"></i> YouTube
        </button>
        <button class="category-btn" id="btnLiveTv" onclick="toggleLiveTvMenu()">
          <i class="fa-solid fa-tv"></i> Live TV
        </button>
      </nav>
    </div>

    <!-- Professional Footer -->
    <footer class="app-footer">
      <div class="footer-top">
        <div class="footer-brand-info">
          <i class="fa-solid fa-shield-halved" style="color: var(--accent-gold);"></i>
          <span>MSTV BROADCAST INDIA</span>
        </div>
        <div class="footer-social-links">
          <a href="#" class="social-icon" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
          <a href="#" class="social-icon" title="Telegram"><i class="fa-brands fa-telegram"></i></a>
          <a href="#" class="social-icon" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
        </div>
      </div>
      <div class="footer-bottom">
        <div>© 2026 MSTV India. Non-stop Live Digital Network.</div>
        <div class="footer-nav">
          <a href="#" onclick="alert('MSTV Network aggregates publicly hosted video streams and does not host content on its servers.')">Disclaimer</a>
          <a href="#" onclick="alert('MSTV Network respects user privacy and stores no personal data.')">Privacy</a>
          <a href="mailto:contact@mstvindia.com">Support</a>
        </div>
      </div>
    </footer>

  </div>

  <!-- HLS Library -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.js"></script>

  <script>
    function setAppHeight() {
      const doc = document.documentElement;
      doc.style.setProperty('--app-height', `${window.innerHeight}px`);
    }
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', setAppHeight);
    setAppHeight();

    // DOM Elements
    const container = document.getElementById('videoContainer');
    const playerWrapper = document.getElementById('playerWrapper');
    const playerPlaceholder = document.getElementById('playerPlaceholder');
    const muteToggle = document.getElementById('muteToggle');
    const fullscreenToggle = document.getElementById('fullscreenToggle');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const epgTickerText = document.getElementById('epgTickerText');
    const btnApnaTv = document.getElementById('btnApnaTv');
    const btnYouTube = document.getElementById('btnYouTube');
    const btnLiveTv = document.getElementById('btnLiveTv');
    const subcategoriesMenu = document.getElementById('subcategoriesMenu');
    const subcategoriesGrid = document.getElementById('subcategoriesGrid');
    const currentTimeEl = document.getElementById('currentTime');

    // Live TV Subcategory Definitions
    const liveTvCategories = [
      { key: 'sports', label: 'Sports', icon: 'fa-basketball' },
      { key: 'music', label: 'Music', icon: 'fa-music' },
      { key: 'news', label: 'News', icon: 'fa-newspaper' },
      { key: 'devotional', label: 'Devotional', icon: 'fa-om' },
      { key: 'android_pc', label: 'Android/PC', icon: 'fa-mobile-screen-button' },
      { key: 'entertainment', label: 'Entertainment', icon: 'fa-film' }
    ];

    // State Variables
    let rawPlaylists = {};
    let liveTvData = {};
    let activeCategory = null;
    let currentPlaylist = [];
    let videoDurations = [];
    let totalDuration = 0;
    
    let hls = null;
    let currentIndex = -1;
    let isMuted = true;
    let syncTimer = null;
    let activeSubcatKey = null;

    // State tracking variables for forward-skip prevention & buffering sync lock
    let ytPlayer = null;
    let maxWatchedTime = 0;
    let ytCheckInterval = null;
    let isInitialLoading = false; 

    // Load YouTube API script dynamically
    if (!window.YT) {
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      const firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    }

    function updateClock() {
      const now = new Date();
      currentTimeEl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function updateMuteButtonUI() {
      muteToggle.innerHTML = isMuted 
        ? '<i class="fa-solid fa-volume-xmark"></i>' 
        : '<i class="fa-solid fa-volume-high"></i>';
    }

    function showSpinner() { loadingSpinner.classList.add('active'); }
    function hideSpinner() { loadingSpinner.classList.remove('active'); }

    muteToggle.addEventListener('click', () => {
      isMuted = !isMuted;
      updateMuteButtonUI();
      const activeVideo = container.querySelector('video');
      if (activeVideo) activeVideo.muted = isMuted;
      if (ytPlayer && typeof ytPlayer.mute === 'function') {
        if (isMuted) ytPlayer.mute(); else ytPlayer.unMute();
      }
    });

    fullscreenToggle.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        playerWrapper.requestFullscreen().catch(err => console.error(err));
      } else {
        document.exitFullscreen();
      }
    });

    // Fetch JSON Data
    async function loadData() {
      try {
        const response = await fetch('test.json');
        const data = await response.json();
        rawPlaylists = data.playlists || {};
        liveTvData = data.live_tv || {};
        renderLiveTvSubcategories();
      } catch (error) {
        console.error('Failed to load test.json:', error);
        epgTickerText.textContent = 'Error loading timetable data.';
      }
    }

    // Toggle Live TV Collapsible Subcategories Menu
    function toggleLiveTvMenu() {
      const isOpen = subcategoriesMenu.classList.contains('active');
      if (isOpen) {
        closeSubcategoryMenu();
      } else {
        subcategoriesMenu.classList.add('active');
        btnLiveTv.className = 'category-btn active livetv';
      }
    }

    function closeSubcategoryMenu() {
      subcategoriesMenu.classList.remove('active');
      activeSubcatKey = null;
      renderLiveTvSubcategories();
      if (activeCategory !== 'live_tv') {
        btnLiveTv.className = 'category-btn';
      }
    }

    // Render Subcategory Buttons & Embedded Collapsible Channels List
    function renderLiveTvSubcategories() {
      subcategoriesGrid.innerHTML = '';

      liveTvCategories.forEach(cat => {
        const channels = liveTvData[cat.key] || [];

        const subcatBtn = document.createElement('button');
        subcatBtn.className = `subcat-btn ${activeSubcatKey === cat.key ? 'active' : ''}`;
        subcatBtn.innerHTML = `<span><i class="fa-solid ${cat.icon}" style="margin-right:4px;"></i>${cat.label}</span> <i class="fa-solid ${activeSubcatKey === cat.key ? 'fa-chevron-up' : 'fa-chevron-down'}"></i>`;
        
        subcatBtn.onclick = (e) => {
          e.stopPropagation();
          activeSubcatKey = (activeSubcatKey === cat.key) ? null : cat.key;
          renderLiveTvSubcategories();
        };

        subcategoriesGrid.appendChild(subcatBtn);

        if (activeSubcatKey === cat.key) {
          const channelList = document.createElement('div');
          channelList.className = 'channels-list active';

          if (channels.length === 0) {
            channelList.innerHTML = '<div style="color:var(--text-muted); font-size:0.7rem; grid-column:1/-1;">No channels found</div>';
          } else {
            channels.forEach((ch, idx) => {
              const chBtn = document.createElement('button');
              chBtn.className = 'channel-item';
              chBtn.textContent = ch.title || `Channel ${idx + 1}`;
              chBtn.onclick = (e) => {
                e.stopPropagation();
                playLiveTvChannel(channels, idx, cat.label);
              };
              channelList.appendChild(chBtn);
            });
          }
          subcategoriesGrid.appendChild(channelList);
        }
      });
    }

    // Play Selected Channel from Live TV Subcategory
    function playLiveTvChannel(channelList, index, subcatLabel) {
      if (playerPlaceholder) playerPlaceholder.style.display = 'none';

      activeCategory = 'live_tv';
      btnApnaTv.className = 'category-btn';
      btnYouTube.className = 'category-btn';
      btnLiveTv.className = 'category-btn active livetv';

      currentPlaylist = channelList;
      currentIndex = index;
      isMuted = false;
      updateMuteButtonUI();

      if (syncTimer) clearInterval(syncTimer);

      loadMedia(currentPlaylist[index], 0);
      epgTickerText.textContent = `LIVE TV (${subcatLabel.toUpperCase()}): ${currentPlaylist[index].title}`;

      closeSubcategoryMenu();
    }

    // Standard Category Switcher
    function switchCategory(categoryKey) {
      if (!rawPlaylists[categoryKey]) return;

      closeSubcategoryMenu();

      if (playerPlaceholder) playerPlaceholder.style.display = 'none';

      activeCategory = categoryKey;
      currentIndex = -1;

      isMuted = (categoryKey !== 'youtube');
      updateMuteButtonUI();

      if (categoryKey === 'apna_tv') {
        btnApnaTv.className = 'category-btn active';
        btnYouTube.className = 'category-btn';
        btnLiveTv.className = 'category-btn';
      } else if (categoryKey === 'youtube') {
        btnApnaTv.className = 'category-btn';
        btnYouTube.className = 'category-btn youtube';
        btnLiveTv.className = 'category-btn';
      }

      currentPlaylist = rawPlaylists[categoryKey];
      videoDurations = currentPlaylist.map(item => item.duration_seconds || 60);
      totalDuration = videoDurations.reduce((a, b) => a + b, 0);

      if (syncTimer) clearInterval(syncTimer);
      syncPlayback();
      syncTimer = setInterval(syncPlayback, 1000);
    }

    function getPlaybackPosition() {
      if (totalDuration === 0) return { index: 0, time: 0 };
      const now = Math.floor(Date.now() / 1000) % totalDuration;
      let offset = 0;
      for (let i = 0; i < videoDurations.length; i++) {
        if (now < offset + videoDurations[i]) {
          return { index: i, time: now - offset };
        }
        offset += videoDurations[i];
      }
      return { index: 0, time: 0 };
    }

    function loadMedia(item, startTime) {
      showSpinner();
      isInitialLoading = true; // Lock playback sync while buffering

      maxWatchedTime = startTime || 0;
      if (ytCheckInterval) clearInterval(ytCheckInterval);

      if (hls) {
        hls.stopLoad();
        hls.detachMedia();
        hls.destroy();
        hls = null;
      }

      if (ytPlayer && typeof ytPlayer.destroy === 'function') {
        ytPlayer.destroy();
        ytPlayer = null;
      }

      container.innerHTML = '';

      if (item.type === 'iframe') {
        const videoIdMatch = item.stream_url.match(/(?:embed\/|v=)([^&?]+)/);
        const videoId = videoIdMatch ? videoIdMatch[1] : null;

        if (videoId) {
          const playerDiv = document.createElement('div');
          playerDiv.id = 'ytApiPlayer';
          container.appendChild(playerDiv);

          // Transparent click shield over the YouTube frame to stop external redirects
          const shield = document.createElement('div');
          shield.className = 'yt-shield-full';
          shield.onclick = (e) => {
            e.stopPropagation();
            if (ytPlayer && typeof ytPlayer.getPlayerState === 'function') {
              const state = ytPlayer.getPlayerState();
              if (state === YT.PlayerState.PLAYING) {
                ytPlayer.pauseVideo();
              } else {
                ytPlayer.playVideo();
              }
            }
          };
          container.appendChild(shield);

          ytPlayer = new YT.Player('ytApiPlayer', {
            height: '100%',
            width: '100%',
            videoId: videoId,
            playerVars: {
              autoplay: 1,
              controls: 0,        
              modestbranding: 1,  
              rel: 0,             
              enablejsapi: 1,
              mute: isMuted ? 1 : 0,
              start: Math.floor(startTime)
            },
            events: {
              onReady: (event) => {
                hideSpinner();
                event.target.playVideo();
                startSkipPreventionMonitor();
                setTimeout(() => { isInitialLoading = false; }, 3000);
              },
              onStateChange: (event) => {
                if (event.data === YT.PlayerState.PLAYING) {
                  hideSpinner();
                  isInitialLoading = false;
                }
              }
            }
          });
        } else {
          const iframe = document.createElement('iframe');
          iframe.src = item.stream_url;
          iframe.allow = "autoplay; encrypted-media; picture-in-picture";
          iframe.onload = () => {
            hideSpinner();
            isInitialLoading = false;
          };
          container.appendChild(iframe);
        }

      } else {
        // Standard HTML5 / HLS Video Logic
        const video = document.createElement('video');
        video.autoplay = true;
        video.muted = isMuted;
        video.playsInline = true;
        video.preload = 'auto';

        video.addEventListener('playing', () => {
          hideSpinner();
          setTimeout(() => { isInitialLoading = false; }, 1000);
        });

        container.appendChild(video);

        video.addEventListener('timeupdate', () => {
          if (video.currentTime > maxWatchedTime + 2.5) {
            video.currentTime = maxWatchedTime;
          } else {
            maxWatchedTime = Math.max(maxWatchedTime, video.currentTime);
          }
        });

        if (item.stream_url.includes('.m3u8')) {
          if (Hls.isSupported()) {
            hls = new Hls({ enableWorker: true, lowLatencyMode: false });
            hls.loadSource(item.stream_url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
              if (startTime > 0) video.currentTime = startTime;
              video.play().catch(() => {});
            });
          } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = item.stream_url;
            video.addEventListener('loadedmetadata', () => {
              if (startTime > 0) video.currentTime = startTime;
              video.play().catch(() => {});
            }, { once: true });
          }
        } else {
          video.src = item.stream_url;
          video.addEventListener('loadedmetadata', () => {
            if (startTime > 0) video.currentTime = startTime;
            video.play().catch(() => {});
          }, { once: true });
        }
      }
    }

    function startSkipPreventionMonitor() {
      ytCheckInterval = setInterval(() => {
        if (ytPlayer && typeof ytPlayer.getCurrentTime === 'function') {
          const currentTime = ytPlayer.getCurrentTime();

          if (currentTime > maxWatchedTime + 2.5) {
            ytPlayer.seekTo(maxWatchedTime, true);
          } else {
            maxWatchedTime = Math.max(maxWatchedTime, currentTime);
          }
        }
      }, 250);
    }

    function updateEpgTicker(index) {
      if (!currentPlaylist[index]) return;
      const nowPlaying = currentPlaylist[index].title;
      const nextIndex = (index + 1) % currentPlaylist.length;
      const comingNext = currentPlaylist[nextIndex].title;
      
      epgTickerText.textContent = `NOW PLAYING: ${nowPlaying} — COMING NEXT: ${comingNext}`;
    }

    function syncPlayback() {
      if (activeCategory === 'live_tv' || totalDuration === 0 || currentPlaylist.length === 0 || isInitialLoading) return;
      
      const { index, time } = getPlaybackPosition();

      if (index !== currentIndex) {
        currentIndex = index;
        loadMedia(currentPlaylist[index], time);
        updateEpgTicker(index);
        return;
      }

      const activeVideo = container.querySelector('video');
      if (
        activeVideo && 
        !activeVideo.seeking && 
        !activeVideo.paused && 
        activeVideo.readyState >= 3 && 
        Math.abs(activeVideo.currentTime - time) > 6
      ) {
        activeVideo.currentTime = time;
      }
    }

    loadData();
  </script>
</body>
