<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-Hosting Pseudo-Live Player</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0a0a0a;
            margin: 0;
            user-select: none;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            width: 90%;
            max-width: 854px; 
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            overflow: hidden;
        }

        /* The Guard shield blocks mouse clicks, drags, and right-clicks on the video */
        .touch-guard-shield {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 6;
            background: transparent;
            cursor: default;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .gate-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 15, 15, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
        }

        .tune-btn {
            background: #ff0000;
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,0,0,0.4);
        }

        .custom-controls {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 8;
        }

        .video-container:hover .custom-controls {
            opacity: 1;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .action-btn {
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #ff0000;
            border-radius: 50%;
        }

        .ticker-text {
            color: #ccc;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="video-container" id="playerWrapper">
    <!-- Click to watch overlay -->
    <div id="gateOverlay" class="gate-overlay">
        <button class="tune-btn">🔊 Tune In Live Stream</button>
    </div>

    <!-- The physical click block overlay -->
    <div class="touch-guard-shield"></div>

    <!-- 
       Using the Archive's dedicated embedding player endpoints.
       'autoplay=1' initializes video buffering directly inside their architecture.
    -->
    <iframe 
        id="archiveFrame"
        src="https://ia600100.us.archive.org/16/items/cooking_202606/nagin.mp4?cnt=0" 
        allow="autoplay; fullscreen" 
        allowfullscreen>
    </iframe >

    <!-- Custom Control Skin Interface -->
    <div class="custom-controls">
        <div class="control-group">
            <span class="live-indicator"><span class="dot"></span>Live</span>
            <span class="ticker-text">Now Airing: Cooking Segment (Nagin)</span>
        </div>
        <div class="control-group">
            <button id="fsBtn" class="action-btn">⛶ Fullscreen</button>
        </div>
    </div>
</div>

<script>
    const FIXED_DURATION = 201; 
    const frame = document.getElementById('archiveFrame');
    const gate = document.getElementById('gateOverlay');
    const wrapper = document.getElementById('playerWrapper');
    const fsBtn = document.getElementById('fsBtn');

    function getBroadcastSeekTime() {
        return (Math.floor(Date.now() / 1000)) % FIXED_DURATION;
    }

    // Capture the initial user gesture layout confirmation
    gate.addEventListener('click', () => {
        gate.style.opacity = '0';
        setTimeout(() => gate.style.display = 'none', 400);

        const targetStartTime = getBroadcastSeekTime();
        
        // Appending the start time parameter natively inside the Archive player endpoint mapping
        frame.src = `https://archive.org&start=${targetStartTime}`;
    });

    fsBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            wrapper.requestFullscreen().catch(() => {});
            fsBtn.innerText = "⛶ Exit Fullscreen";
        } else {
            document.exitFullscreen();
            fsBtn.innerText = "⛶ Fullscreen";
        }
    });

    // Re-sync if the user leaves the tab and comes back
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && gate.style.display === 'none') {
            frame.src = `https://archive.org&start=${getBroadcastSeekTime()}`;
        }
    });
</script>
</body>
</html>
