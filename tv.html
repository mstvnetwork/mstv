<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduled Live TV Player</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0a0a0a;
            margin: 0;
            user-select: none;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            width: 90%;
            max-width: 854px; 
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .gate-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 15, 15, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
        }

        .tune-btn {
            background: #ff0000;
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,0,0,0.4);
        }

        .custom-controls {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 5;
        }

        .video-container:hover .custom-controls {
            opacity: 1;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .action-btn {
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #ff0000;
            border-radius: 50%;
        }

        .ticker-text {
            color: #ccc;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="video-container" id="playerWrapper">
    <div id="gateOverlay" class="gate-overlay">
        <button class="tune-btn">🔊 Tune In Live Stream</button>
    </div>

    <!-- Re-added autoplay/muted attributes to assist high-latency VPN buffering -->
    <video id="tvPlayer" playsinline autoplay muted preload="auto">
        <source src="https://archive.org/16/items/cooking_202606/nagin.mp4?cnt=0" type="video/mp4">
    </video>

    <div class="custom-controls">
        <div class="control-group">
            <span class="live-indicator"><span class="dot"></span>Live</span>
            <span id="nowPlaying" class="ticker-text">Syncing Schedule...</span>
        </div>
        <div class="control-group">
            <button id="muteBtn" class="action-btn">🔊 Unmute</button>
            <button id="fsBtn" class="action-btn">⛶ Fullscreen</button>
        </div>
    </div>
</div>

<script>
    // HARDCODED VALUE: 201 seconds is the precise length of your file. 
    // Hand-declaring this prevents NaN errors if metadata streams load slowly.
    const FIXED_DURATION = 201; 
    const VIDEO_TITLE = "Cooking Segment (Nagin)";

    const player = document.getElementById('tvPlayer');
    const wrapper = document.getElementById('playerWrapper');
    const gate = document.getElementById('gateOverlay');
    const muteBtn = document.getElementById('muteBtn');
    const fsBtn = document.getElementById('fsBtn');
    const ticker = document.getElementById('nowPlaying');

    let initialized = false;

    function getBroadcastSeekTime() {
        const globalUnixSeconds = Math.floor(Date.now() / 1000);
        return globalUnixSeconds % FIXED_DURATION;
    }

    function syncToSchedule() {
        if (!initialized || player.paused) return;

        const targetSeekTime = getBroadcastSeekTime();
        
        // Soft drift alignment: Keeps network connection open over laggy VPN lines
        if (Math.abs(player.currentTime - targetSeekTime) > 3.0) {
            player.currentTime = targetSeekTime;
        }
    }

    // INTERCEPT 1: Force immediate play call to establish active cache line
    window.addEventListener('DOMContentLoaded', () => {
        player.play().catch(() => {
            console.log("Autoplay caught by browser policy. Awaiting user click overlay.");
        });
    });

    // INTERCEPT 2: Handle user interaction overlay safely
    gate.addEventListener('click', () => {
        gate.style.opacity = '0';
        setTimeout(() => gate.style.display = 'none', 400);

        player.muted = false;
        muteBtn.innerText = "🔇 Mute";
        initialized = true;
        ticker.innerText = `Now Airing: ${VIDEO_TITLE}`;

        // Verify the browser has data ready before forcing a timeline change
        if (player.readyState >= 2) {
            executeLiveJump();
        } else {
            player.addEventListener('canplay', executeLiveJump, { once: true });
        }
    });

    function executeLiveJump() {
        player.currentTime = getBroadcastSeekTime();
        player.play().catch(e => console.log("Playback start failed:", e));
    }

    muteBtn.addEventListener('click', () => {
        if (player.muted) {
            player.muted = false;
            muteBtn.innerText = "🔇 Mute";
        } else {
            player.muted = true;
            muteBtn.innerText = "🔊 Unmute";
        }
    });

    fsBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            wrapper.requestFullscreen().catch(err => alert(err.message));
            fsBtn.innerText = "⛶ Exit Fullscreen";
        } else {
            document.exitFullscreen();
            fsBtn.innerText = "⛶ Fullscreen";
        }
    });

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && initialized) {
            if (player.readyState >= 2) { executeLiveJump(); }
        }
    });

    // Run active alignment check loops every 5 seconds
    setInterval(syncToSchedule, 5000);
</script>
</body>
</html>
