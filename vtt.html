<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Playback & Subtitles Test</title>
    
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 90%;
            max-width: 800px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        .video-js {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Video Playback Test</h1>
        
        <video
            id="my-video"
            class="video-js vjs-default-skin vjs-big-play-centered"
            controls
            preload="auto"
            poster="https://via.placeholder.com/800x450/000000/FFFFFF?text=Video+Player"
            data-setup="{}"
        >
            <!-- Replace the src URL with your actual MP4 / HLS / M3U8 video stream URL -->
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4" />

            <!-- Your VTT Subtitle File -->
            <track 
                kind="subtitles" 
                src="https://s1.itcnbd.live/PTV-Sports/tracks-v1a1/mono.m3u8" 
                srclang="en" 
                label="English" 
                default 
            />

            <p class="vjs-no-js">
                To view this video please enable JavaScript, and consider upgrading to a web browser that
                <a href="https://videojs.com/html5-video-support/" target="_blank">supports HTML5 video</a>.
            </p>
        </video>
    </div>

    <!-- Video.js Core Script -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    
    <!-- Optional: Add HLS.js support if playing .m3u8 streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

</body>
</html>
